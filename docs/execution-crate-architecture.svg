      <text x="110" y="26">base-flashblocks</text>
      <text class="small" x="110" y="47">pending state/RPC</text>
    </g>
    <g class="node service" transform="translate(350 600)">
      <rect width="210" height="64" rx="9"/>
      <text x="105" y="26">base-execution-rpc</text>
