    <path class="edge core" d="M 1145 404 C 990 390 650 370 515 340"/>
    <path class="edge core" d="M 1145 404 C 850 450 390 485 190 600"/>
    <path class="edge core" d="M 1145 404 C 1270 455 1430 515 1550 600"/>
    <path class="edge core" d="M 1145 404 C 1060 610 985 855 925 1070"/>

    <!-- Execution service layer -->
    <path class="edge foundation" d="M 190 664 C 270 635 365 625 455 600"/>
    <path class="edge foundation" d="M 190 664 C 570 635 1140 630 1550 600"/>

    <path class="edge foundation" d="M 455 664 C 505 635 640 625 740 600"/>
    <path class="edge foundation" d="M 455 664 C 615 625 900 615 1045 600"/>
    <path class="edge foundation" d="M 455 664 C 760 620 1265 610 1550 600"/>
    <path class="edge foundation" d="M 455 664 C 410 720 390 785 385 860"/>

    <path class="edge foundation" d="M 740 664 C 805 635 970 625 1045 600"/>
    <path class="edge foundation" d="M 740 664 C 950 620 1320 610 1550 600"/>

    <path class="edge foundation" d="M 1045 664 C 1185 625 1405 610 1550 600"/>
    <path class="edge foundation" d="M 1305 664 C 990 705 585 755 385 860"/>
    <path class="edge foundation" d="M 1550 664 C 1410 710 1245 770 1135 860"/>
    <path class="edge foundation" d="M 1550 664 C 1330 780 1065 930 925 1070"/>

    <!-- Foundation layer -->
    <path class="edge foundation" d="M 1135 924 C 1060 970 1000 1010 925 1070"/>
  </g>

  <g id="nodes">
    <g class="node extension" transform="translate(60 130)">
      <rect width="220" height="58" rx="9"/>
      <text x="110" y="23">base-flashblocks-node</text>
      <text class="small" x="110" y="43">node extension</text>
    </g>
    <g class="node extension" transform="translate(310 130)">
      <rect width="210" height="58" rx="9"/>
      <text x="105" y="23">base-proofs-extension</text>
      <text class="small" x="105" y="43">proof RPC/exex</text>
    </g>
    <g class="node extension" transform="translate(550 130)">
      <rect width="180" height="58" rx="9"/>
      <text x="90" y="23">base-metering</text>
      <text class="small" x="90" y="43">gas metering RPC</text>
    </g>
    <g class="node extension" transform="translate(760 130)">
      <rect width="210" height="58" rx="9"/>
      <text x="105" y="23">base-bundle-extension</text>
      <text class="small" x="105" y="43">bundle support</text>
    </g>
    <g class="node extension" transform="translate(1000 130)">
