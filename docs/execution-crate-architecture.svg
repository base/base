    <path class="edge ext" d="M 1535 188 C 1265 280 395 420 190 600"/>

    <path class="edge ext" d="M 155 298 C 220 335 360 330 515 340"/>
    <path class="edge ext" d="M 155 298 C 185 520 225 725 385 860"/>
    <path class="edge ext" d="M 155 298 C 470 440 830 650 1135 860"/>
    <path class="edge ext" d="M 155 298 C 620 395 1265 465 1550 600"/>
    <path class="edge ext" d="M 155 298 C 365 595 580 930 925 1070"/>

    <!-- Node assembly layer -->
    <path class="edge core" d="M 515 404 C 500 465 470 535 455 600"/>
    <path class="edge core" d="M 515 404 C 610 460 690 520 740 600"/>
    <path class="edge core" d="M 515 404 C 690 470 880 520 1045 600"/>
    <path class="edge core" d="M 515 404 C 775 455 1120 515 1305 600"/>
    <path class="edge core" d="M 515 404 C 870 440 1295 500 1550 600"/>
    <path class="edge core" d="M 515 404 C 455 565 400 710 385 860"/>
    <path class="edge core" d="M 515 404 C 720 555 955 685 1135 860"/>
    <path class="edge core" d="M 515 404 C 620 635 745 910 925 1070"/>

    <path class="edge core" d="M 835 340 C 755 335 610 335 515 340"/>
