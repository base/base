    <path class="edge core" d="M 835 404 C 760 475 600 530 455 600"/>
    <path class="edge core" d="M 835 404 C 820 455 775 530 740 600"/>
    <path class="edge core" d="M 835 404 C 905 470 990 530 1045 600"/>
