<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">crates/execution crate dependency architecture</title>
  <desc id="desc">Architecture diagram for normal dependencies among crates under crates/execution. Arrows point from a crate to the execution crate it depends on.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#596272"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1f2933" flood-opacity="0.13"/>
    </filter>
    <style>
      .canvas { fill: #fbfcfe; }
      .title { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596272; }
      .section { font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6a7280; letter-spacing: 1.4px; text-transform: uppercase; }
      .node rect { stroke-width: 1.4; filter: url(#shadow); }
      .node text { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2733; text-anchor: middle; dominant-baseline: middle; }
      .node .small { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #607080; }
      .extension rect { fill: #f4ecfb; stroke: #b589d6; }
      .tool rect { fill: #f3f5f7; stroke: #aab3bf; }
      .assembly rect { fill: #e8f6ef; stroke: #65aa81; }
      .service rect { fill: #fff4d8; stroke: #d69d2d; }
      .foundation rect { fill: #e8f2fb; stroke: #6fa4cf; }
      .edge { fill: none; stroke: #596272; stroke-width: 1.4; stroke-linecap: round; marker-end: url(#arrow); opacity: 0.34; }
      .edge.core { stroke: #247c8f; stroke-width: 2.2; opacity: 0.62; }
      .edge.ext { stroke: #8956a8; stroke-width: 1.7; opacity: 0.46; }
      .edge.foundation { stroke: #3f7ea5; stroke-width: 1.8; opacity: 0.55; }
      .legend text { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #495363; }
      .note { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #687586; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1800" height="1260"/>

  <text class="title" x="70" y="54">crates/execution architecture</text>
  <text class="subtitle" x="70" y="82">Normal intra-execution Cargo dependencies. Arrow direction: source crate depends on target crate.</text>

  <g class="legend" transform="translate(1235 38)">
    <rect x="0" y="0" width="500" height="56" rx="10" fill="#ffffff" stroke="#d9dee7"/>
    <circle cx="22" cy="28" r="7" fill="#f4ecfb" stroke="#b589d6"/>
    <text x="40" y="29">extension/tooling</text>
    <circle cx="170" cy="28" r="7" fill="#e8f6ef" stroke="#65aa81"/>
    <text x="188" y="29">node assembly</text>
    <circle cx="326" cy="28" r="7" fill="#fff4d8" stroke="#d69d2d"/>
    <text x="344" y="29">execution service</text>
  </g>

  <text class="section" x="70" y="122">Node-facing extensions and tooling</text>
  <text class="section" x="70" y="315">Node assembly</text>
  <text class="section" x="70" y="565">Execution services</text>
  <text class="section" x="70" y="825">Foundation crates</text>
  <text class="note" x="1548" y="306">No normal intra-execution deps</text>

  <g id="edges">
    <!-- Extension/tooling layer -->
    <path class="edge ext" d="M 170 188 C 170 245 420 260 515 340"/>
    <path class="edge ext" d="M 170 188 C 250 255 720 245 835 340"/>
    <path class="edge ext" d="M 170 188 C 260 260 930 255 1145 340"/>
