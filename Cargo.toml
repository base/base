[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
homepage = "https://github.com/base/base"
repository = "https://github.com/base/base"
exclude = [".github/"]

[workspace]
resolver = "2"
exclude = ["actions/fixtures", "crates/proof/zk/programs"]
members = [
  "actions/*",
  "bin/[a-o]*",
  "bin/[q-z]*",
  "bin/proposer",
  "bin/prover-*",
  "bin/prover/*",
  "crates/batcher/*",
  "crates/builder/*",
  "crates/common/*",
  "crates/consensus/*",
  "crates/execution/*",
  "crates/infra/*",
  "crates/proof/[a-r]*",
  "crates/proof/sub*",
  "crates/proof/[u-y]*",
  "crates/proof/prover-service/[a-r]*",
  "crates/proof/tee/*",
  "crates/proof/zk/backend/elfs",
  "crates/proof/zk/backend/scripts",
  "crates/proof/zk/*",
  "crates/utilities/*",
  "etc/tools/*",
  "etc/systems",
]
default-members = [
  "bin/[a-o]*",
  "bin/[q-z]*",
  "bin/proposer",
  "bin/prover-*",
  "bin/prover/*",
]

[workspace.metadata.cargo-udeps.ignore]
normal = ["rustls-platform-verifier"]

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"
unnameable-types = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
# Baseline - enable all default clippy lints
all = { level = "warn", priority = -1 }

# === Performance & Cloning ===
missing-const-for-fn = "warn"
redundant-clone = "warn"
clone-on-ref-ptr = "warn"
unnecessary-to-owned = "warn"
cloned-instead-of-copied = "warn"
flat-map-option = "warn"
implicit-clone = "warn"
or-fun-call = "warn"

# === Code Style ===
wildcard-imports = "warn"
use-self = "warn"
option-if-let-else = "warn"
uninlined-format-args = "warn"
manual-string-new = "warn"
single-char-pattern = "warn"
redundant-else = "warn"
match-same-arms = "warn"

# === Safety & Documentation ===
undocumented-unsafe-blocks = "warn"
doc-markdown = "warn"

# === Debugging Artifacts ===
dbg-macro = "warn"

# === Code Quality ===
branches-sharing-code = "warn"
derive-partial-eq-without-eq = "warn"
explicit-into-iter-loop = "warn"
explicit-iter-loop = "warn"
iter-with-drain = "warn"
needless-pass-by-ref-mut = "warn"
string-lit-as-bytes = "warn"

[profile.dev]
debug = "line-tables-only"

# Dependencies are rarely stepped into, so strip their debug info. This applies
# to all dependencies (`*`) but NOT workspace crates, which keep the
# line-tables-only debug info above. It also disables debug info in C/C++ build
# scripts (rocksdb, mdbx, jemalloc, ...), which is the single largest consumer
# of `target` disk.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

# `release` and `maxperf` both set `strip = "symbols"` (see above), which makes
# every CPU profiler produce address-only output. This profile keeps production
# codegen identical (opt-level=3, lto="fat", codegen-units=1, panic="unwind")
# while restoring symbols. Debug info is not loaded at runtime, so it costs
# nothing but binary size.
[profile.maxperf-symbols]
inherits = "maxperf"
debug = "line-tables-only"
strip = "none"

# `release` sets `strip = "symbols"` (see above). This profile keeps `release` codegen identical
# (opt-level=3, lto="thin", codegen-units=16, panic="unwind") while restoring
# symbols. Debug info is not loaded at runtime, so it costs nothing but binary
# size.
[profile.release-symbols]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# `cargo bench` inherits `release`, which strips symbols. iai-callgrind drives Callgrind,
# which needs the symbol table and debug info to locate the benchmark function it toggles
# collection on — without them every counter reads zero. Keep optimizations, restore
# symbols. Debug info is not loaded at runtime, so wall-clock (Criterion) benches are
# unaffected.
[profile.bench]
inherits = "release"
debug = true
strip = false

# TODO: add `rustflags = ["-Cforce-frame-pointers=yes"]` here once
# `profile-rustflags` is stabilized (tracking: rust-lang/cargo#10271)
[profile.profiling]
inherits = "release"
lto = false
debug = "line-tables-only"
strip = "none"

# CI profile: optimized for fast GHA builds and minimal disk usage
[profile.ci]
inherits = "dev"
debug = false
incremental = false

