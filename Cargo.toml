async-trait = "0.1.83"

# grpc
tonic = "0.14"

# rpc
jsonrpsee = "0.26.0"
jsonrpsee-core = "0.26.0"
jsonrpsee-types = "0.26.0"

# cli
clap = "4.6.5"
arboard = "3.6.1"
ratatui = "0.30.0"
crossterm = "0.29"
indicatif = "0.18"
human_bytes = "0.4.3"
clap_builder = "4.6.5"
tracing-indicatif = "0.3"

# tracing
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.22"
tracing = { version = "0.1.43", default-features = false }

# OpenTelemetry
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false }
opentelemetry-http = { version = "0.32", default-features = false }
opentelemetry-otlp = { version = "0.32", default-features = false }

# metrics
cadence = "1.5"
ordered-float = "5"
metrics = { version = "0.24.3", default-features = false }
metrics-util = { version = "0.20.1", default-features = false }
metrics-process = { version = "2.4.3", default-features = false }
metrics-exporter-prometheus = { version = "0.18.1", default-features = false }

# aws
aws-nitro-enclaves-nsm-api = "0.4"
aws-config = { version = "1.1.7", default-features = false }
aws-sdk-s3 = { version = "1.106.0", default-features = false }
aws-sdk-ec2 = { version = "1.217.0", default-features = false }
aws-credential-types = { version = "1.1.7", default-features = false }
aws-sdk-elasticloadbalancingv2 = { version = "1.109.0", default-features = false }

# SP1 v6.4.0 (Hypercube) — used by crates/proof/zk
sp1-prover-types = "=6.4.0"
sp1-sdk = { version = "=6.4.0" }
sp1-cluster-utils = { git = "https://github.com/succinctlabs/sp1-cluster", tag = "v2.7.2" }
sp1-cluster-common = { git = "https://github.com/succinctlabs/sp1-cluster", tag = "v2.7.2" }
sp1-cluster-artifact = { git = "https://github.com/succinctlabs/sp1-cluster", tag = "v2.7.2" }

# crypto
sha3 = "0.10"
k256 = "0.13"
p256 = "0.13"
p384 = "0.13"
blake3 = "1.8"
getrandom = "0.4"
rustls = "0.23.43"
secp256k1 = "0.30"
hex-literal = "1.1"
x509-parser = "0.17"
sha2 = { version = "0.10", default-features = false }
c-kzg = { version = "2.1.5", default-features = false }
kzg-rs = { version = "0.2.8", default-features = false }
ark-ff = { version = "0.6.0", default-features = false }
ark-bls12-381 = { version = "0.6.0", default-features = false }

# http
url = "2.5"
http = "1.4"
hyper = "1.8"
tower = "0.5"
http-body = "1.0"
hyper-util = "0.1.11"
http-body-util = "0.1.3"
axum = { version = "0.8.9", default-features = false }
tower-http = { version = "0.6", features = ["limit", "timeout"] }

# p2p
ipnet = "2.11"
discv5 = "0.10"
libp2p = "0.56.0"
multihash = "0.19"
libp2p-identity = "0.2.12"
libp2p-stream = "0.4.0-alpha"
unsigned-varint = { version = "0.8", default-features = false }

# serde
rkyv = "0.8"
bincode = "2"
ciborium = "0.2"
serde_repr = "0.1"
serde_bytes = "0.11"
serde_with = "3.8.1"
serde_cbor = "0.11.2"
ethereum_ssz = "0.10"
serde_yaml = "0.9.34"
ethereum_ssz_derive = "0.10"
toml = { version = "1.0", default-features = false }
serde = { version = "1.0.228", default-features = false }
serde_json = { version = "1.0.151", default-features = false }

# testing
arbtest = "0.3"
test-case = "3"
mockall = "0.14"
tempfile = "3.27"
rstest = "0.26.1"
criterion = "0.8"
serial_test = "3"
httpmock = "0.8.2"
proptest = "1.10.0"
similar-asserts = "1"
iai-callgrind = "0.16.1"
arbitrary = { version = "1", default-features = false }
wiremock = { version = "0.6.2", default-features = false }
testcontainers = { version = "0.25", default-features = false }
testcontainers-modules = { version = "0.13", default-features = false }

# docker
bollard = "0.19.4"

# compression
snap = "1"
zstd = "0.13"
tar = "0.4.44"
miniz_oxide = "0.9.0"
brotli = { version = "8.0.2", default-features = false }

# database
redb = "2"
sqlx = { version = "0.8", default-features = false }
rocksdb = { version = "0.24", default-features = false }

# errors
eyre = "0.6"
anyhow = "1.0"
backtrace = "0.3"
thiserror = { version = "2.0", default-features = false }

# collections and concurrency
lru = "0.16"
moka = "0.12"
imbl = "7.0.0"
rayon = "1.11"
dashmap = "6.1"
arc-swap = "1.7.1"
parking_lot = "0.12.3"
either = { version = "1.15.0", default-features = false }

# configuration
dirs = "6.0.0"
dirs-next = "2.0.0"
dotenvy = { version = "0.15.7", default-features = false }
figment = { version = "0.10.19", default-features = false }

# encoding
hex = "0.4"
base64 = "0.22"
bytes = "1.12.1"

# identifiers and randomness
rand = "0.9"
uuid = "1.24"
nanoid = "0.4"
rand_08 = { package = "rand", version = "0.8" }

# time
time = "0.3.55"
chrono = "0.4.42"
humantime = "2.3"

# retry
backon = "1.6"
backoff = "0.4.0"

# macros and code generation
quote = "1"
ctor = "0.6"
proc-macro2 = "1"
auto_impl = "1.2.0"
ambassador = "0.4.2"
modular-bitfield = "0.13.1"
static_assertions = { version = "1.1.0" }
strum = { version = "0.27", default-features = false }
syn = { version = "2", features = ["full", "extra-traits"] }
derive_more = { version = "2.1.0", default-features = false }

# no_std
spin = "0.10"
cfg-if = "1.0"
alloc-no-stdlib = "2.0"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }

# system
libc = "0.2"
rlimit = "0.11"
hostname = "0.4.0"
tokio-vsock = "0.7"
tikv-jemallocator = "0.6"

# tooling
notify = "8.2"
cargo_metadata = "0.18.1"

# rate limiting
governor = "0.7"
