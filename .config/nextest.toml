[test-groups.system-test-serial]
max-threads = 1

[test-groups.e2e-tests]
max-threads = 1

[test-groups.builder-integration]
max-threads = 1

[test-groups.system-tests]
max-threads = 6

[profile.ci]
junit = { path = "test-results.xml" }
retries = 1

# Action tests use a full EVM stack; the slowest tests can take 30-45 s.
# Flag anything that runs longer than 90 s as slow and kill it after 2 periods.
[[profile.ci.overrides]]
filter = 'package(base-action-harness)'
slow-timeout = { period = "90s", terminate-after = 2 }

# Asserts which 200 ms block a transaction lands in, so it must not share the host with other
# tests. First matching override wins per setting, so the group and timeouts below still apply.
[[profile.ci.overrides]]
filter = 'binary(early_broadcast)'
threads-required = 'num-test-threads'

# Nextest profiles do not inherit default-profile overrides. Without this, CI
# starts every Docker-backed system test at once and the runner gets OOM-killed.
[[profile.ci.overrides]]
filter = 'package(base-system-tests)'
test-group = 'system-tests'
retries = 1
slow-timeout = { period = "120s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(system_test_)'
test-group = 'system-test-serial'
retries = 2

[[profile.default.overrides]]
filter = 'binary(e2e_testsuite)'
test-group = 'e2e-tests'

[[profile.default.overrides]]
filter = 'package(base-builder-core) & (binary(data_availability) | binary(flashblocks) | binary(txpool))'
test-group = 'builder-integration'
retries = 1

# First matching override wins per setting. Must sit above
# package(base-system-tests) or that 6-minute kill still applies.
# The test waits up to 15 minutes for local SP1 execute, plus stack setup.
# Debug-profile SP1 execute does not finish in that window; run with --release.
[[profile.default.overrides]]
filter = 'binary(eip8130)'
retries = 0
slow-timeout = { period = "5m", terminate-after = 5 }

# See the `ci` profile: wall-clock inclusion assertions need the host to themselves.
[[profile.default.overrides]]
filter = 'binary(early_broadcast)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(base-system-tests)'
test-group = 'system-tests'
retries = 1
slow-timeout = { period = "120s", terminate-after = 3 }
