[package]
name = "base-system-tests"
description = "Docker-backed system tests for Base node infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-devnet"
path = "src/bin/base_devnet.rs"

[[bin]]
name = "base-bench"
path = "src/bin/base_bench.rs"

[lints]
workspace = true

[dependencies]
tower = { workspace = true }
libp2p = { workspace = true }
nanoid = { workspace = true }
async-trait = { workspace = true }
alloy-signer = { workspace = true }
base-node-config = { workspace = true }
alloy-hardforks = { workspace = true }
base-load-tests = { workspace = true }
alloy-primitives = { workspace = true }
base-common-client-rollup = {workspace = true}
base-common-runtime-tasks = {workspace = true}
base-batcher-service-driver = { workspace = true }
base-common-l1-transactions = { workspace = true }
hex = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["default"] }
base-consensus-network-service = {workspace = true}
eyre = { workspace = true, features = ["default"] }
k256 = { workspace = true, features = ["default"] }
rand = { workspace = true, features = ["default"] }
base-batcher-encoding-channel = { workspace = true }
base-consensus-source-providers = {workspace = true}
alloy-eips = { workspace = true, features = ["std"] }
base-execution-evm-precompiles = { workspace = true }
chrono = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
alloy-genesis = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["default"] }
alloy-sol-types = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["http1", "tokio"] }
serde = { workspace = true, features = ["derive", "std"] }
base-testing-support = { workspace = true, optional = true }
alloy-rpc-client = { workspace = true, features = ["default"] }
base-execution-cli = { workspace = true, features = ["default"] }
base-common-types-chain = { workspace = true, features = ["std"] }
base-proof-service-server = {workspace = true, features = ["default"]}
base-common-types-payload = { workspace = true, features = ["std"] }
base-execution-txpool-pool = {features = ["default"], workspace = true}
clap = { workspace = true, features = ["default", "derive", "env"] }
prometheus-scraper = { version = "0.2.0", default-features = false }
jsonrpsee = { workspace = true, features = ["http-client", "server"] }
testcontainers-modules = { workspace = true, features = ["postgres"] }
base-common-types-rpc = {workspace = true, features = ["default", "std"]}
base-consensus-driver-service = {features = ["default"], workspace = true}
base-common-chain-activation = { workspace = true, features = ["default"] }
base-node-core = { workspace = true, features = ["default", "test-utils"] }
base-common-chain-config = {features = ["default", "std"], workspace = true}
base-execution-state-database = { workspace = true, features = ["default"] }
base-builder-core = { workspace = true, features = ["default", "test-utils"] }
base-consensus-batch-types = { workspace = true, features = ["serde", "std"] }
testcontainers = { workspace = true, features = ["blocking", "host-port-exposure"] }
base-execution-state-indexer = { workspace = true, features = ["default", "service"] }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "fmt"] }
base-proof-service-protocol = { workspace = true, features = ["default", "rpc-server"] }
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread", "macros"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "migrate", "macros", "tls-native-tls"] }
base-common-client-ethereum = {workspace = true, features = ["default", "mnemonic", "reqwest", "jwt-client"]}

[dev-dependencies]
alloy-json-rpc = { workspace = true }
reth-primitives-traits = { workspace = true }
base-common-types-chain = { workspace = true }
base-common-client-rollup = { workspace = true }
base-common-types-payload = { workspace = true }
base-execution-rpc-handlers = { workspace = true }
base-execution-state-indexer = { workspace = true }
anyhow = { workspace = true, features = ["default"] }
base-consensus-derive-pipeline = { workspace = true }
futures = { workspace = true, features = ["default"] }
tokio-tungstenite = { workspace = true, features = ["default"] }
base-node-runner = { workspace = true, features = ["test-utils"] }
base-consensus-driver-service = { workspace = true, features = ["test-utils"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros", "tls-native-tls"] }

[features]
default = ["upgrade-signal"]
# The upgrade-signal stack deploys a mock ProtocolVersions contract via base-testing-support, whose
# contract bindings embed Foundry `out/` artifacts through `sol!(..., concat!(...))` at compile
# time. Those artifacts are gitignored, so base-testing-support cannot compile when pulled over a git
# dependency. External consumers that only need the core L1+L2 stack disable this feature
# (`default-features = false`); it stays on by default for in-tree use where the artifacts exist.
upgrade-signal = ["base-testing-support/contracts", "dep:base-testing-support"]
