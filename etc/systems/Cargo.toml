[package]
name = "base-system-tests"
description = "Docker-backed system tests for Base node infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-devnet"
path = "src/bin/base_devnet.rs"

[[bin]]
name = "base-bench"
path = "src/bin/base_bench.rs"

[lints]
workspace = true

[dependencies]
tower = { workspace = true }
libp2p = { workspace = true }
nanoid = { workspace = true }
reth-tasks = { workspace = true }
async-trait = { workspace = true }
alloy-signer = { workspace = true }
base-runtime = { workspace = true }
reth-node-core = { workspace = true }
reth-rpc-layer = { workspace = true }
alloy-hardforks = { workspace = true }
base-load-tests = { workspace = true }
base-tx-manager = { workspace = true }
alloy-primitives = { workspace = true }
base-consensus-disc = { workspace = true }
base-consensus-node = { workspace = true }
base-batcher-encoder = { workspace = true }
base-batcher-service = { workspace = true }
base-consensus-peers = { workspace = true }
base-consensus-engine = { workspace = true }
base-consensus-gossip = { workspace = true }
base-consensus-sources = { workspace = true }
base-prover-service-db = { workspace = true }
base-common-precompiles = { workspace = true }
base-consensus-providers = { workspace = true }
hex = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
k256 = { workspace = true, features = ["default"] }
rand = { workspace = true, features = ["default"] }
alloy-eips = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["default"] }
reth-db = { workspace = true, features = ["default"] }
base-test-utils = { workspace = true, optional = true }
tempfile = { workspace = true, features = ["default"] }
alloy-genesis = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["default"] }
alloy-sol-types = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["http1", "tokio"] }
serde = { workspace = true, features = ["derive", "std"] }
alloy-rpc-client = { workspace = true, features = ["default"] }
base-execution-cli = { workspace = true, features = ["default"] }
base-protocol = { workspace = true, features = ["serde", "std"] }
base-tx-forwarding = { workspace = true, features = ["default"] }
base-common-types-chain = { workspace = true, features = ["std"] }
base-prover-service = { workspace = true, features = ["default"] }
base-shadow-indexer = { workspace = true, features = ["default"] }
base-upgrade-signal = { workspace = true, features = ["default"] }
base-common-network = { workspace = true, features = ["mnemonic"] }
base-common-types-payload = { workspace = true, features = ["std"] }
base-execution-txpool = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
prometheus-scraper = { version = "0.2.0", default-features = false }
base-common-chain-config = {workspace = true, features = ["default"]}
jsonrpsee = { workspace = true, features = ["http-client", "server"] }
testcontainers-modules = { workspace = true, features = ["postgres"] }
base-execution-chainspec = { workspace = true, features = ["default"] }
alloy-provider = { workspace = true, features = ["default", "reqwest"] }
base-common-types-rpc = {workspace = true, features = ["default", "std"]}
base-consensus-rpc = { workspace = true, features = ["default", "client"] }
base-node-core = { workspace = true, features = ["default", "test-utils"] }
base-builder-core = { workspace = true, features = ["default", "test-utils"] }
testcontainers = { workspace = true, features = ["blocking", "host-port-exposure"] }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "fmt"] }
base-prover-service-protocol = { workspace = true, features = ["default", "rpc-server"] }
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread", "macros"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "migrate", "macros", "tls-native-tls"] }

[dev-dependencies]
alloy-json-rpc = { workspace = true }
base-txpool-rpc = { workspace = true }
base-optimism-rpc = { workspace = true }
base-consensus-derive = { workspace = true }
base-shadow-indexer-db = { workspace = true }
reth-primitives-traits = { workspace = true }
base-common-types-chain = { workspace = true }
base-common-types-payload = { workspace = true }
anyhow = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
tokio-tungstenite = { workspace = true, features = ["default"] }
base-node-runner = { workspace = true, features = ["test-utils"] }
base-consensus-engine = { workspace = true, features = ["test-utils"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros", "tls-native-tls"] }

[features]
default = [ "upgrade-signal" ]
# The upgrade-signal stack deploys a mock ProtocolVersions contract via base-test-utils, whose
# contract bindings embed Foundry `out/` artifacts through `sol!(..., concat!(...))` at compile
# time. Those artifacts are gitignored, so base-test-utils cannot compile when pulled over a git
# dependency. External consumers that only need the core L1+L2 stack disable this feature
# (`default-features = false`); it stays on by default for in-tree use where the artifacts exist.
upgrade-signal = [ "base-test-utils/contracts", "dep:base-test-utils" ]
