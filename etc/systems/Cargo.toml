[package]
name = "base-system-tests"
description = "Docker-backed system tests for Base node infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# workspace
base-runtime.workspace = true
base-test-utils = { workspace = true, optional = true }
base-txpool-rpc.workspace = true
base-tx-manager.workspace = true
base-flashblocks.workspace = true
base-tx-forwarding.workspace = true
base-execution-cli.workspace = true
base-txpool-tracing.workspace = true
base-upgrade-signal.workspace = true
base-batcher-encoder.workspace = true
base-batcher-service.workspace = true
base-bundle-extension.workspace = true
base-flashblocks-node.workspace = true
base-consensus-rpc = { workspace = true, features = ["client"] }
base-protocol = { workspace = true, features = ["serde", "std"] }
base-node-runner = { workspace = true, features = ["test-utils"] }
base-builder-core = { workspace = true, features = ["test-utils"] }

# telemetry
base-trusted-proxy.workspace = true
base-telemetry-types.workspace = true
base-telemetry-client.workspace = true
base-telemetry-service.workspace = true

# consensus
base-consensus-disc.workspace = true
base-consensus-node.workspace = true
base-consensus-peers.workspace = true
base-consensus-gossip.workspace = true
base-consensus-sources.workspace = true
base-consensus-providers.workspace = true
base-common-genesis.workspace = true

# reth
reth-db.workspace = true
reth-tasks.workspace = true
reth-provider.workspace = true
reth-node-core.workspace = true
base-node-core.workspace = true
base-execution-rpc.workspace = true
base-execution-txpool.workspace = true
base-execution-chainspec.workspace = true
reth-node-builder = { workspace = true, features = ["test-utils"] }

# alloy
alloy-signer.workspace = true
alloy-network.workspace = true
alloy-rpc-client.workspace = true
alloy-primitives.workspace = true
alloy-eips = { workspace = true, features = ["std"] }
alloy-genesis = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-provider = { workspace = true, features = ["reqwest"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }
alloy-rpc-types-engine = { workspace = true, features = ["std"] }
alloy-signer-local = { workspace = true, features = ["mnemonic"] }

# base-alloy
base-common-precompiles.workspace = true
base-common-rpc-types.workspace = true
base-common-network.workspace = true

# tokio
tokio-util.workspace = true
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }

# rpc
axum = { workspace = true, features = ["http1", "tokio"] }
jsonrpsee = { workspace = true, features = ["http-client"] }
reth-rpc-layer.workspace = true
tower.workspace = true

# p2p
k256.workspace = true
libp2p.workspace = true

# misc
hex.workspace = true
url.workspace = true
rand.workspace = true
eyre.workspace = true
nanoid.workspace = true
reqwest.workspace = true
tempfile.workspace = true
async-trait.workspace = true
tracing = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
testcontainers = { workspace = true, features = ["blocking", "host-port-exposure"] }

[features]
default = [ "upgrade-signal" ]
# The upgrade-signal stack deploys a mock ProtocolVersions contract via base-test-utils, whose
# contract bindings embed Foundry `out/` artifacts through `sol!(..., concat!(...))` at compile
# time. Those artifacts are gitignored, so base-test-utils cannot compile when pulled over a git
# dependency. External consumers that only need the core L1+L2 stack disable this feature
# (`default-features = false`); it stays on by default for in-tree use where the artifacts exist.
upgrade-signal = [ "base-test-utils/contracts", "dep:base-test-utils" ]

[dev-dependencies]
# cli
clap = { workspace = true, features = ["derive"] }

# load testing
base-load-tests.workspace = true

# consensus
base-consensus-derive.workspace = true
base-consensus-engine = { workspace = true, features = ["test-utils"] }

# alloy
alloy-json-rpc.workspace = true

# base-alloy
base-common-consensus.workspace = true
base-common-rpc-types-engine.workspace = true

# proof
base-optimism-rpc.workspace = true
base-prover-service-client.workspace = true
base-prover-service-protocol.workspace = true

# execution
base-shadow-indexer.workspace = true
base-shadow-metrics.workspace = true
base-shadow-indexer-db.workspace = true

# reth
reth-primitives-traits.workspace = true

# database
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros", "tls-native-tls"] }

# misc
chrono.workspace = true
anyhow.workspace = true
indicatif.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }

[[bench]]
name = "b20_zk_proving"
harness = false
