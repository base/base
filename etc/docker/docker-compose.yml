x-rust-service-build: &rust-service-build
  context: ../..
  dockerfile: etc/docker/Dockerfile.rust-services
  args:
    PROFILE: "${CARGO_PROFILE:-dev}"
    BASE_SUCCINCT_ELF_REQUIRE: "${BASE_SUCCINCT_ELF_REQUIRE:-0}"

x-zk-host-build: &zk-host-build
  context: ../..
  dockerfile: etc/docker/Dockerfile.rust-services
  args:
    PROFILE: "${ZK_HOST_PROFILE:-release}"
    BASE_SUCCINCT_ELF_REQUIRE: "${BASE_SUCCINCT_ELF_REQUIRE:-1}"

x-node-healthcheck: &node-healthcheck
  test: ["CMD-SHELL", "curl -sf -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' \"http://localhost:$${NODE_HEALTHCHECK_HTTP_PORT}/\" >/dev/null && curl -sf \"http://localhost:$${NODE_HEALTHCHECK_CL_RPC_PORT}/healthz\" >/dev/null"]
  interval: 250ms
  timeout: 1s
  retries: 240
  start_period: 250ms

services:
  setup-l1:
    image: devnet-setup:local
    build:
      context: ../..
      dockerfile: etc/docker/Dockerfile.devnet
    container_name: setup-l1
    env_file: devnet-env
    volumes:
      - ../../.devnet/l1/configs:/output
      - ../../.devnet/l1/reth:/data/l1-reth
      - ../../.devnet/l1/lighthouse:/data/l1-lighthouse
    environment:
      # L1_MODE selects the parent chain: "eth" (reth + lighthouse, default) generates a full
      # Ethereum L1 genesis; "base" (base-anvil L1, for the L3 devnet) generates only the JWT
      # and L1 chain-config that the L2 services need.
      - L1_MODE=${L1_MODE:-eth}
      - CHAIN_ID=${L1_CHAIN_ID}
      - SLOT_DURATION=4
      - OUTPUT_DIR=/output
      - SHARED_DIR=/output
      - L1_DATA_DIR=/data
    entrypoint: ["/usr/local/bin/setup-l1.sh"]

  # --- L1 parent chain (select one via profile) -----------------------------------------
  # eth-l1 profile: Ethereum L1 = reth (l1-el) + lighthouse (l1-cl/l1-vc).  [default]
  # base-l1 profile: Base L1 = base-anvil (l1-anvil, aliased to l1-el).     [L3 devnet]
  # Both expose the same `l1-el` network name so L2 services are L1-agnostic.

  l1-el:
    image: ghcr.io/paradigmxyz/reth:v1.11.4
    container_name: l1-el
    profiles: ["eth-l1"]
    depends_on:
      setup-l1:
        condition: service_completed_successfully
    ports:
      - "${L1_HTTP_PORT}:${L1_HTTP_PORT}"   # HTTP RPC
      - "${L1_WS_PORT}:${L1_WS_PORT}"       # WebSocket
      - "${L1_AUTH_PORT}:${L1_AUTH_PORT}"   # Auth RPC (Engine API)
      - "${L1_P2P_PORT}:${L1_P2P_PORT}"     # P2P
    volumes:
      - ../../.devnet/l1/reth:/data
      - ../../.devnet/l1/configs:/genesis:ro
    entrypoint: /usr/local/bin/reth
    command:
      - node
      - --chain=/genesis/el/genesis.json
      - --datadir=/data
      - --color=never
      - --http
      - --http.addr=0.0.0.0
      - --http.port=${L1_HTTP_PORT}
      - --http.api=admin,eth,web3,net,rpc,debug,txpool
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=${L1_WS_PORT}
      - --ws.api=eth,web3,net,txpool,debug
      - --ws.origins=*
      - --authrpc.port=${L1_AUTH_PORT}
      - --authrpc.addr=0.0.0.0
      - --authrpc.jwtsecret=/genesis/jwt.hex
      - --port=${L1_P2P_PORT}
      - --disable-discovery
      - -vvv
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/${L1_HTTP_PORT}"]
      interval: 250ms
      timeout: 1s
      retries: 240
      start_period: 250ms
    restart: unless-stopped

  l1-cl:
    image: sigp/lighthouse:v8.0.1
    container_name: l1-cl
    profiles: ["eth-l1"]
    depends_on:
      setup-l1:
        condition: service_completed_successfully
    ports:
      - "${L1_CL_HTTP_PORT}:${L1_CL_HTTP_PORT}"     # Beacon API
      - "${L1_CL_P2P_PORT}:${L1_CL_P2P_PORT}"       # P2P TCP
      - "${L1_CL_P2P_PORT}:${L1_CL_P2P_PORT}/udp"   # P2P UDP
    volumes:
      - ../../.devnet/l1/lighthouse:/data
      - ../../.devnet/l1/configs:/genesis:ro
    command:
      - lighthouse
      - bn
      - --testnet-dir=/genesis/cl
      - --datadir=/data/beacon
      - --enable-private-discovery
      - --disable-peer-scoring
      - --staking
      - --enr-address=127.0.0.1
      - --enr-udp-port=${L1_CL_P2P_PORT}
      - --enr-tcp-port=${L1_CL_P2P_PORT}
      - --port=${L1_CL_P2P_PORT}
      - --http
      - --http-address=0.0.0.0
      - --http-port=${L1_CL_HTTP_PORT}
      - --http-allow-origin=*
      - --disable-packet-filter
      - --target-peers=0
      - --supernode
      - --execution-endpoint=http://l1-el:${L1_AUTH_PORT}
      - --execution-jwt=/genesis/jwt.hex
      - --always-prepare-payload
      - --prepare-payload-lookahead=8000
      - --suggested-fee-recipient=${FEE_RECIPIENT}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/${L1_CL_HTTP_PORT}"]
      interval: 250ms
      timeout: 1s
      retries: 240
      start_period: 250ms
    restart: unless-stopped

  l1-vc:
    image: sigp/lighthouse:v8.0.1
    container_name: l1-vc
    profiles: ["eth-l1"]
    depends_on:
      l1-cl:
        condition: service_healthy
    volumes:
      - ../../.devnet/l1/configs:/genesis
    command:
      - lighthouse
      - vc
      - --testnet-dir=/genesis/cl
      - --datadir=/genesis/cl/validator_data
      - --beacon-nodes=http://l1-cl:${L1_CL_HTTP_PORT}
      - --init-slashing-protection
      - --suggested-fee-recipient=${FEE_RECIPIENT}
    restart: unless-stopped

  # Base L1 (L3 devnet): Base's patched anvil, aliased to `l1-el` so L2 services are unchanged.
  # No beacon/blob DA here - the L2 batcher posts calldata. Selected by the base-l1 profile.
  l1-anvil:
    image: ghcr.io/base/base-anvil:main
    container_name: l1-anvil
    profiles: ["base-l1"]
    depends_on:
      setup-l1:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - l1-el
    ports:
      - "${L1_HTTP_PORT}:${L1_HTTP_PORT}"   # HTTP RPC (also serves WS)
    entrypoint: ["anvil"]
    command:
      - --host=0.0.0.0
      - --port=${L1_HTTP_PORT}
      - --chain-id=${L1_CHAIN_ID}
      - --block-time=2                      # Base's 2s block cadence
      # anvil's default mnemonic ("test test ... junk") prefunds the devnet accounts
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/${L1_HTTP_PORT}"]
      interval: 250ms
      timeout: 1s
      retries: 240
      start_period: 250ms

  setup-l2:
    image: devnet-setup:local
    build:
      context: ../..
      dockerfile: etc/docker/Dockerfile.devnet
    container_name: setup-l2
    env_file: devnet-env
    # Depend on whichever L1 is active (reth l1-el in eth-l1, anvil l1-anvil in base-l1).
    # required:false lets the inactive one be absent without erroring.
    depends_on:
      l1-el:
        condition: service_healthy
        required: false
      l1-anvil:
        condition: service_healthy
        required: false
    volumes:
      - ../../.devnet:/devnet
      - ../../.devnet/l2/builder:/data/l2-builder
      - ../../.devnet/l2/builder-cl:/data/l2-builder-cl
      - ../../.devnet/l2/client:/data/l2-client
      - ../../.devnet/l2/client-cl:/data/l2-client-cl
    environment:
      - L1_RPC_URL=http://l1-el:${L1_HTTP_PORT}
      - L1_CHAIN_ID=${L1_CHAIN_ID}
      - L2_CHAIN_ID=${L2_CHAIN_ID}
      - L2_BASE_AZUL_BLOCK=${L2_BASE_AZUL_BLOCK-}
      - L2_BASE_BERYL_BLOCK=${L2_BASE_BERYL_BLOCK-}
      - L2_BASE_COBALT_BLOCK=${L2_BASE_COBALT_BLOCK-}
      - OUTPUT_DIR=/devnet/l2/configs
      - L2_DATA_DIR=/data
      - DEPLOYER_ADDR=${DEPLOYER_ADDR}
      - DEPLOYER_KEY=${DEPLOYER_KEY}
      - SEQUENCER_ADDR=${SEQUENCER_ADDR}
      - BATCHER_ADDR=${BATCHER_ADDR}
      - PROPOSER_ADDR=${PROPOSER_ADDR}
      - CHALLENGER_ADDR=${CHALLENGER_ADDR}
      - MULTIPROOF_CONFIG_HASH=${MULTIPROOF_CONFIG_HASH-}
      - MULTIPROOF_DEFER_REGISTRATION=${MULTIPROOF_DEFER_REGISTRATION-}
      - DEV_TEE_SIGNER=${DEV_TEE_SIGNER-}
      - TEE_IMAGE_HASH=${TEE_IMAGE_HASH-}
      - BUILDER_P2P_KEY=${BUILDER_P2P_KEY}
      - BUILDER_ENODE_ID=${BUILDER_ENODE_ID}
      - L2_EL_BOOTNODE_P2P_KEY=${L2_EL_BOOTNODE_P2P_KEY}
      - L2_EL_BOOTNODE_ENODE_ID=${L2_EL_BOOTNODE_ENODE_ID}
      - L2_EL_BOOTNODE_ENODE=${L2_EL_BOOTNODE_ENODE}
      - L2_CL_BOOTNODE_P2P_KEY=${L2_CL_BOOTNODE_P2P_KEY}
      - L2_CL_BOOTNODE_ENR_PATH=${L2_CL_BOOTNODE_ENR_PATH}
    entrypoint: ["/usr/local/bin/setup-l2.sh"]


  patch-genesis-hash:
    image: devnet-setup:local
    container_name: patch-genesis-hash
    depends_on:
      base-builder:
        condition: service_healthy
    volumes:
      - ../../.devnet/l2/configs:/configs
    environment:
      - L2_RPC_URL=http://base-builder:${L2_BUILDER_HTTP_PORT}
      - CONFIG_DIR=/configs
    entrypoint: ["/usr/local/bin/patch-genesis-hash.sh"]

  # Post-genesis dev-multiproof registration — two ordered one-shots.
  # AggregateVerifier.CONFIG_HASH is immutable and depends on the L2 rollup config, which only
  # exists after genesis, so SystemDeploy defers the verifier (MULTIPROOF_DEFER_REGISTRATION).
  # 1) compute-config-hash: read the real hash from the running op-node.
  # 2) register-aggregate-verifier: deploy + register the verifier with that hash.
  # base-l1 profile only: this flow is specific to the L3 / dev-multiproof devnet. In eth-l1 mode
  # multiproof is disabled and the deploy is not deferred, so these services are not created.
  compute-config-hash:
    image: nitro-host-local:local
    build:
      context: ../..
      dockerfile: etc/docker/Dockerfile.nitro-host-local
    container_name: compute-config-hash
    profiles: ["base-l1"]
    depends_on:
      base-builder:
        condition: service_healthy
      patch-genesis-hash:
        condition: service_completed_successfully
    volumes:
      - ../../.devnet/l2/configs:/configs
      - ../../etc/scripts/devnet/compute-config-hash.sh:/compute-config-hash.sh:ro
    user: root
    environment:
      - L2_CL_URL=http://base-builder:${L2_BUILDER_CL_RPC_PORT}
      - OUTPUT_DIR=/configs
    entrypoint: ["/bin/bash", "/compute-config-hash.sh"]
    restart: on-failure

  register-aggregate-verifier:
    image: devnet-setup:local
    container_name: register-aggregate-verifier
    profiles: ["base-l1"]
    env_file: devnet-env
    depends_on:
      compute-config-hash:
        condition: service_completed_successfully
    volumes:
      - ../../.devnet/l2/configs:/devnet/l2/configs
    environment:
      - L1_RPC_URL=http://l1-el:${L1_HTTP_PORT}
      - L1_CHAIN_ID=${L1_CHAIN_ID}
      - L2_CHAIN_ID=${L2_CHAIN_ID}
      - OUTPUT_DIR=/devnet/l2/configs
      - HASH_FILE=/devnet/l2/configs/multiproof-config-hash
      - DEPLOYER_ADDR=${DEPLOYER_ADDR}
      - DEPLOYER_KEY=${DEPLOYER_KEY}
      - SEQUENCER_ADDR=${SEQUENCER_ADDR}
      - BATCHER_ADDR=${BATCHER_ADDR}
      - PROPOSER_ADDR=${PROPOSER_ADDR}
      - CHALLENGER_ADDR=${CHALLENGER_ADDR}
      - MULTIPROOF_CONFIG_HASH=${MULTIPROOF_CONFIG_HASH-}
      - DEV_TEE_SIGNER=${DEV_TEE_SIGNER-}
      - TEE_IMAGE_HASH=${TEE_IMAGE_HASH-}
    entrypoint: ["/usr/local/bin/register-aggregate-verifier.sh"]
    restart: on-failure

  base-bootnode:
    image: base:local
    build:
      <<: *rust-service-build
      target: base
    container_name: base-bootnode
    depends_on:
      setup-l2:
        condition: service_completed_successfully
    ports:
      - "${L2_EL_BOOTNODE_P2P_PORT}:${L2_EL_BOOTNODE_P2P_PORT}/udp" # Discovery
      - "${L2_CL_BOOTNODE_P2P_PORT}:${L2_CL_BOOTNODE_P2P_PORT}"     # Consensus P2P TCP metadata
      - "${L2_CL_BOOTNODE_P2P_PORT}:${L2_CL_BOOTNODE_P2P_PORT}/udp" # Consensus discovery
    volumes:
      - ../../.devnet/l2/el-bootnode:/data
      - ../../.devnet/l2/cl-bootnode-enr:/bootnodes
      - ../../.devnet/l2/configs:/genesis/l2:ro
    environment:
      - BASE_CHAIN_NAME=dev
      - BASE_CHAIN_L1_CHAIN_ID=${L1_CHAIN_ID}
      - BASE_CHAIN_L2_CHAIN_ID=${L2_CHAIN_ID}
    entrypoint: /app/base
    command:
      - bootnode
      - --chain
      - dev
      - --l2-config-file
      - /genesis/l2/rollup.json
      - --v4-addr=0.0.0.0:${L2_EL_BOOTNODE_P2P_PORT}
      - --nat=extip:${L2_EL_BOOTNODE_ADVERTISE_IP}
      - --p2p-secret-key=/genesis/l2/el-bootnode-p2p-key.txt
      - --p2p.listen.tcp
      - "${L2_CL_BOOTNODE_P2P_PORT}"
      - --p2p.listen.udp
      - "${L2_CL_BOOTNODE_P2P_PORT}"
      - --p2p.advertise.ip
      - "${L2_EL_BOOTNODE_ADVERTISE_IP}"
      - --p2p.priv.path
      - /genesis/l2/cl-bootnode-p2p-key.txt
      - --p2p.bootstore
      - /data/bootstore.json
      - --p2p.enr-output
      - "${L2_CL_BOOTNODE_ENR_PATH}"
      - -vvv
    networks:
      default:
        ipv4_address: ${L2_EL_BOOTNODE_ADVERTISE_IP}
    healthcheck:
      test: ["CMD", "test", "-s", "${L2_CL_BOOTNODE_ENR_PATH}"]
      interval: 250ms
      timeout: 1s
      retries: 240
      start_period: 250ms
    restart: unless-stopped

  base-builder:
    image: base:local
    build:
      <<: *rust-service-build
      target: base
    container_name: base-builder
    depends_on:
      setup-l2:
        condition: service_completed_successfully
      base-bootnode:
        condition: service_healthy
    ports:
      - "${L2_BUILDER_HTTP_PORT}:${L2_BUILDER_HTTP_PORT}"           # HTTP RPC
      - "${L2_BUILDER_WS_PORT}:${L2_BUILDER_WS_PORT}"               # WebSocket
      - "${L2_BUILDER_AUTH_PORT}:${L2_BUILDER_AUTH_PORT}"           # Auth RPC (Engine API)
      - "${L2_BUILDER_P2P_PORT}:${L2_BUILDER_P2P_PORT}"             # P2P
      - "${L2_BUILDER_P2P_PORT}:${L2_BUILDER_P2P_PORT}/udp"         # Discovery
      - "${L2_BUILDER_FLASHBLOCKS_PORT}:${L2_BUILDER_FLASHBLOCKS_PORT}"  # Flashblocks
      - "${L2_BUILDER_METRICS_PORT}:${L2_BUILDER_METRICS_PORT}"     # Metrics
      - "${L2_BUILDER_CL_RPC_PORT}:${L2_BUILDER_CL_RPC_PORT}"       # Consensus RPC
      - "${L2_BUILDER_CL_P2P_PORT}:${L2_BUILDER_CL_P2P_PORT}"       # Consensus P2P TCP
      - "${L2_BUILDER_CL_P2P_PORT}:${L2_BUILDER_CL_P2P_PORT}/udp"   # Consensus P2P UDP
    volumes:
      - ../../.devnet/l2/builder:/data
      - ../../.devnet/l2/cl-bootnode-enr:/bootnodes:ro
      - ../../.devnet/l1/configs:/genesis:ro
      - ../../.devnet/l2/configs:/genesis/l2:ro
    environment:
      - BASE_CHAIN_NAME=dev
      - BASE_CHAIN_L1_CHAIN_ID=${L1_CHAIN_ID}
      - BASE_CHAIN_L2_CHAIN_ID=${L2_CHAIN_ID}
      - NODE_HEALTHCHECK_HTTP_PORT=${L2_BUILDER_HTTP_PORT}
      - NODE_HEALTHCHECK_CL_RPC_PORT=${L2_BUILDER_CL_RPC_PORT}
      - OTEL_SERVICE_NAME=base-builder
      # L1 beacon + slot duration are mode-driven (set in the eth/l3 env file). In base-l1
      # mode BASE_NODE_L1_BEACON is unset, so the node runs beaconless (calldata-only).
      - BASE_NODE_L1_BEACON
      - BASE_NODE_L1_CALLDATA_ONLY
      - BASE_NODE_L1_SLOT_DURATION_OVERRIDE
      - BASE_NODE_L1_TX_FORMAT
    entrypoint: /app/base
    command:
      - sequencer
      - --chain
      - dev
      - --execution-chain=/genesis/l2/genesis.json
      - --datadir=/data
      - --telemetry.sampling-ratio=1
      - --http
      - --http.addr=0.0.0.0
      - --http.port=${L2_BUILDER_HTTP_PORT}
      - --http.api=admin,eth,web3,net,rpc,debug,txpool,miner
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=${L2_BUILDER_WS_PORT}
      - --ws.api=eth,web3,net,txpool,debug
      - --ws.origins=*
      - --authrpc.port=${L2_BUILDER_AUTH_PORT}
      - --authrpc.addr=0.0.0.0
      - --authrpc.jwtsecret=/genesis/jwt.hex
      - --auth-ipc.path=/tmp/base-builder-engine.ipc
      - --port=${L2_BUILDER_P2P_PORT}
      - --discovery.port=${L2_BUILDER_P2P_PORT}
      - --nat=extip:${L2_BUILDER_ADVERTISE_IP}
      - --p2p-secret-key-hex=${BUILDER_P2P_KEY}
      - --bootnodes=${L2_EL_BOOTNODE_ENODE}
      - --rollup.discovery.v4
      - --flashblocks.addr=0.0.0.0
      - --flashblocks.port=${L2_BUILDER_FLASHBLOCKS_PORT}
      - --flashblocks.block-time=200
      - --rollup.chain-block-time=2000
      - --metrics=0.0.0.0:${L2_BUILDER_METRICS_PORT}
      - --builder.enable-resource-metering
      - --builder.max-rejected-txs-per-block=${BUILDER_MAX_REJECTED_TXS_PER_BLOCK}
      - --txpool.nolocals
      - --rollup.txpool-max-inflight-delegated-slots=32768
      - --txpool.pending-max-count=200000
      - --txpool.pending-max-size=512
      - --txpool.basefee-max-count=200000
      - --txpool.basefee-max-size=512
      - --txpool.queued-max-count=200000
      - --txpool.queued-max-size=512
      - --txpool.max-account-slots=256
      - --txpool.max-batch-size=1024
      - --rpc.txfeecap=0
      - --rpc.gascap=600000000
      - --l1-eth-rpc
      - http://l1-el:${L1_HTTP_PORT}
      - --l2-config-file
      - /genesis/l2/rollup.json
      - --l1-config-file
      - /genesis/el/chain-config.json
      - --rpc.port
      - "${L2_BUILDER_CL_RPC_PORT}"
      - --rpc.enable-admin
      - --p2p.listen.tcp
      - "${L2_BUILDER_CL_P2P_PORT}"
      - --p2p.listen.udp
      - "${L2_BUILDER_CL_P2P_PORT}"
      - --p2p.advertise.ip
      - base-builder
      - --p2p.priv.path
      - /genesis/l2/builder-p2p-key.txt
      - --p2p.bootnodes-file
      - "${L2_CL_BOOTNODE_ENR_PATH}"
      - --sequencer.l1-confs
      - "0"
      - --p2p.sequencer.key
      - ${SEQUENCER_KEY}
      - --p2p.scoring
      - Off
      - -vvv
    healthcheck:
      <<: *node-healthcheck
    networks:
      default:
        ipv4_address: ${L2_BUILDER_ADVERTISE_IP}
    restart: unless-stopped

  base-batcher:
    image: base-batcher:local
    build:
      <<: *rust-service-build
      target: batcher
    container_name: base-batcher
    depends_on:
      base-builder:
        condition: service_healthy
    ports:
      - "${BATCHER_METRICS_PORT}:${BATCHER_METRICS_PORT}"   # Metrics
    environment:
      # DA type is mode-driven: unset => blobs (eth-l1 default); base-l1 env sets calldata +
      # disables the throttle-driven blob fallback so it stays calldata-only.
      - BATCHER_DATA_AVAILABILITY_TYPE
      - BATCHER_NO_FORCE_BLOBS_WHEN_THROTTLING
      # Channel/pending-tx throughput is mode-driven: defaults (2 / 1) suit blob DA in eth-l1
      # mode; base-l1 env raises them so low-throughput calldata DA keeps the safe head close
      # to the unsafe head (each submission packs more L2 blocks, several txs in flight at once).
      - BATCHER_MAX_CHANNEL_DURATION
      - BATCHER_MAX_PENDING_TRANSACTIONS
    command:
      - --l1-rpc-url
      - http://l1-el:${L1_HTTP_PORT}
      - --l2-rpc-url
      - http://base-builder:${L2_BUILDER_HTTP_PORT}
      - --rollup-rpc-url
      - http://base-builder:${L2_BUILDER_CL_RPC_PORT}
      - --private-key
      - ${BATCHER_KEY}
      - --poll-interval
      - "1"
      - --sub-safety-margin
      - "0"
      - --num-confirmations
      - "1"
      - --metrics.enabled
      - --metrics.addr
      - "0.0.0.0"
      - --metrics.port
      - "${BATCHER_METRICS_PORT}"
    restart: unless-stopped

  base-client:
    image: base:local
    build:
      <<: *rust-service-build
      target: base
    container_name: base-client
    depends_on:
      setup-l2:
        condition: service_completed_successfully
      base-bootnode:
        condition: service_healthy
      patch-genesis-hash:
        condition: service_completed_successfully
    ports:
      - "${L2_CLIENT_HTTP_PORT}:${L2_CLIENT_HTTP_PORT}"     # HTTP RPC
      - "${L2_CLIENT_WS_PORT}:${L2_CLIENT_WS_PORT}"         # WebSocket
      - "${L2_CLIENT_AUTH_PORT}:${L2_CLIENT_AUTH_PORT}"     # Auth RPC (Engine API)
      - "${L2_CLIENT_P2P_PORT}:${L2_CLIENT_P2P_PORT}"       # P2P
      - "${L2_CLIENT_P2P_PORT}:${L2_CLIENT_P2P_PORT}/udp"   # Discovery
      - "${L2_CLIENT_METRICS_PORT}:${L2_CLIENT_METRICS_PORT}"  # Metrics
      - "${L2_CLIENT_CL_RPC_PORT}:${L2_CLIENT_CL_RPC_PORT}"     # Consensus RPC
      - "${L2_CLIENT_CL_P2P_PORT}:${L2_CLIENT_CL_P2P_PORT}"     # Consensus P2P TCP
      - "${L2_CLIENT_CL_P2P_PORT}:${L2_CLIENT_CL_P2P_PORT}/udp" # Consensus P2P UDP
    volumes:
      - ../../.devnet/l2/client:/data
      - ../../.devnet/l2/cl-bootnode-enr:/bootnodes:ro
      - ../../.devnet/l1/configs:/genesis:ro
      - ../../.devnet/l2/configs:/genesis/l2:ro
    environment:
      - BASE_CHAIN_NAME=dev
      - BASE_CHAIN_L1_CHAIN_ID=${L1_CHAIN_ID}
      - BASE_CHAIN_L2_CHAIN_ID=${L2_CHAIN_ID}
      - NODE_HEALTHCHECK_HTTP_PORT=${L2_CLIENT_HTTP_PORT}
      - NODE_HEALTHCHECK_CL_RPC_PORT=${L2_CLIENT_CL_RPC_PORT}
      - OTEL_SERVICE_NAME=base-client
      # L1 beacon + slot duration are mode-driven (set in the eth/l3 env file). In base-l1
      # mode BASE_NODE_L1_BEACON is unset, so the node runs beaconless (calldata-only).
      - BASE_NODE_L1_BEACON
      - BASE_NODE_L1_CALLDATA_ONLY
      - BASE_NODE_L1_SLOT_DURATION_OVERRIDE
      - BASE_NODE_L1_TX_FORMAT
    entrypoint: /app/base
    command:
      - rpc
      - --chain
      - dev
      - --execution-chain=/genesis/l2/genesis.json
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=${L2_CLIENT_HTTP_PORT}
      # Devnet keeps `miner` on HTTP so local services can read and update
      # the dynamic DA and gas-limit knobs end-to-end.
      - --http.api=admin,eth,web3,net,rpc,debug,txpool,miner
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=${L2_CLIENT_WS_PORT}
      - --ws.api=eth,web3,net,txpool,debug
      - --ws.origins=*
      - --authrpc.port=${L2_CLIENT_AUTH_PORT}
      - --authrpc.addr=0.0.0.0
      - --authrpc.jwtsecret=/genesis/jwt.hex
      - --auth-ipc.path=/tmp/base-client-engine.ipc
      - --port=${L2_CLIENT_P2P_PORT}
      - --discovery.port=${L2_CLIENT_P2P_PORT}
      - --nat=extip:${L2_CLIENT_ADVERTISE_IP}
      - --metrics=0.0.0.0:${L2_CLIENT_METRICS_PORT}
      - --txpool.nolocals
      - --rollup.txpool-max-inflight-delegated-slots=32768
      - --txpool.pending-max-count=200000
      - --txpool.pending-max-size=512
      - --txpool.basefee-max-count=200000
      - --txpool.basefee-max-size=512
      - --txpool.queued-max-count=200000
      - --txpool.queued-max-size=512
      - --txpool.max-account-slots=256
      - --txpool.max-batch-size=1024
      - --rpc.txfeecap=0
      - --rpc.gascap=600000000
      - --rpc.eth-proof-window=1209600
      - --flashblocks-url=ws://base-builder:${L2_BUILDER_FLASHBLOCKS_PORT}
      - --bootnodes=${L2_EL_BOOTNODE_ENODE}
      - --rollup.discovery.v4
      - --rpc.forwarding-endpoint=http://base-builder:${L2_BUILDER_HTTP_PORT}
      - --enable-transaction-event-journal
      - --enable-metering
      - --metering.gas-limit=${METERING_GAS_LIMIT}
      - --metering.da-bytes=${METERING_DA_BYTES}
      - --metering.target-flashblocks-per-block=${METERING_TARGET_FLASHBLOCKS_PER_BLOCK}
      - --l1-eth-rpc
      - http://l1-el:${L1_HTTP_PORT}
      - --l2-config-file
      - /genesis/l2/rollup.json
      - --l1-config-file
      - /genesis/el/chain-config.json
      - --rpc.port
      - "${L2_CLIENT_CL_RPC_PORT}"
      - --p2p.listen.tcp
      - "${L2_CLIENT_CL_P2P_PORT}"
      - --p2p.listen.udp
      - "${L2_CLIENT_CL_P2P_PORT}"
      - --p2p.advertise.ip
      - base-client
      - --p2p.bootnodes-file
      - "${L2_CL_BOOTNODE_ENR_PATH}"
      - --p2p.scoring
      - Off
      - --l1.verifier-confs
      - "${BASE_NODE_VERIFIER_L1_CONFS}"
      - -vvv
    healthcheck:
      <<: *node-healthcheck
    networks:
      default:
        ipv4_address: ${L2_CLIENT_ADVERTISE_IP}
    restart: unless-stopped

  base-rpc:
    image: base:local
    build:
      <<: *rust-service-build
      target: base
    container_name: base-rpc
    depends_on:
      setup-l2:
        condition: service_completed_successfully
      base-bootnode:
        condition: service_healthy
      base-builder:
        condition: service_healthy
      patch-genesis-hash:
        condition: service_completed_successfully
    ports:
      - "${L2_BASE_RPC_HTTP_PORT}:${L2_BASE_RPC_HTTP_PORT}"     # HTTP RPC
      - "${L2_BASE_RPC_WS_PORT}:${L2_BASE_RPC_WS_PORT}"         # WebSocket
      - "${L2_BASE_RPC_AUTH_PORT}:${L2_BASE_RPC_AUTH_PORT}"     # Auth RPC (Engine API)
      - "${L2_BASE_RPC_P2P_PORT}:${L2_BASE_RPC_P2P_PORT}"       # P2P
      - "${L2_BASE_RPC_P2P_PORT}:${L2_BASE_RPC_P2P_PORT}/udp"   # Discovery
      - "${L2_BASE_RPC_METRICS_PORT}:${L2_BASE_RPC_METRICS_PORT}"  # Metrics
      - "${L2_BASE_RPC_CL_RPC_PORT}:${L2_BASE_RPC_CL_RPC_PORT}"     # Consensus RPC
      - "${L2_BASE_RPC_CL_P2P_PORT}:${L2_BASE_RPC_CL_P2P_PORT}"     # Consensus P2P TCP
      - "${L2_BASE_RPC_CL_P2P_PORT}:${L2_BASE_RPC_CL_P2P_PORT}/udp" # Consensus P2P UDP
    volumes:
      - ../../.devnet/l2/base-rpc:/data
      - ../../.devnet/l2/cl-bootnode-enr:/bootnodes:ro
      - ../../.devnet/l1/configs:/genesis:ro
      - ../../.devnet/l2/configs:/genesis/l2:ro
    environment:
      - BASE_CHAIN_NAME=dev
      - BASE_CHAIN_L1_CHAIN_ID=${L1_CHAIN_ID}
      - BASE_CHAIN_L2_CHAIN_ID=${L2_CHAIN_ID}
      - NODE_HEALTHCHECK_HTTP_PORT=${L2_BASE_RPC_HTTP_PORT}
      - NODE_HEALTHCHECK_CL_RPC_PORT=${L2_BASE_RPC_CL_RPC_PORT}
      - OTEL_SERVICE_NAME=base-rpc
      # L1 beacon + slot duration are mode-driven (eth/l3 env file). Unset beacon in base-l1.
      - BASE_NODE_L1_BEACON
      - BASE_NODE_L1_CALLDATA_ONLY
      - BASE_NODE_L1_SLOT_DURATION_OVERRIDE
      - BASE_NODE_L1_TX_FORMAT
    entrypoint: /app/base
    command:
      - rpc
      - --chain
      - dev
      - --execution-chain=/genesis/l2/genesis.json
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=${L2_BASE_RPC_HTTP_PORT}
      # Devnet keeps `miner` on HTTP so local services can read and update
      # the dynamic DA and gas-limit knobs end-to-end.
      - --http.api=admin,eth,web3,net,rpc,debug,txpool,miner
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=${L2_BASE_RPC_WS_PORT}
      - --ws.api=eth,web3,net,txpool,debug
      - --ws.origins=*
      - --authrpc.port=${L2_BASE_RPC_AUTH_PORT}
      - --authrpc.addr=0.0.0.0
      - --authrpc.jwtsecret=/genesis/jwt.hex
      - --auth-ipc.path=/tmp/base-engine.ipc
      - --port=${L2_BASE_RPC_P2P_PORT}
      - --discovery.port=${L2_BASE_RPC_P2P_PORT}
      - --nat=extip:${L2_BASE_RPC_ADVERTISE_IP}
      - --metrics=0.0.0.0:${L2_BASE_RPC_METRICS_PORT}
      - --txpool.nolocals
      - --rpc.txfeecap=0
      - --rpc.gascap=600000000
      - --rpc.eth-proof-window=1209600
      - --bootnodes=${L2_EL_BOOTNODE_ENODE}
      - --rollup.discovery.v4
      - --l1-eth-rpc
      - http://l1-el:${L1_HTTP_PORT}
      - --l2-config-file
      - /genesis/l2/rollup.json
      - --l1-config-file
      - /genesis/el/chain-config.json
      - --rpc.port
      - "${L2_BASE_RPC_CL_RPC_PORT}"
      - --rpc.enable-admin
      - --p2p.listen.tcp
      - "${L2_BASE_RPC_CL_P2P_PORT}"
      - --p2p.listen.udp
      - "${L2_BASE_RPC_CL_P2P_PORT}"
      - --p2p.advertise.ip
      - base-rpc
      - --p2p.bootnodes-file
      - "${L2_CL_BOOTNODE_ENR_PATH}"
      - --p2p.scoring
      - Off
      - --l1.verifier-confs
      - "${BASE_NODE_VERIFIER_L1_CONFS}"
      - -vvv
    healthcheck:
      <<: *node-healthcheck
    networks:
      default:
        ipv4_address: ${L2_BASE_RPC_ADVERTISE_IP}
    restart: unless-stopped

  # nitro-local: in-process TEE prover (base-prover-nitro-host `local` subcommand) serving the
  # prover_prove JSON-RPC on :8000. L3 (base-l1) only. Runs the enclave in-process and signs with
  # BASE_ENCLAVE_SIGNER_KEY — which must equal DEV_TEE_SIGNER_KEY (the key behind DEV_TEE_SIGNER
  # registered on-chain during SystemDeploy); otherwise proofs are signed by a random key and fail
  # on-chain verification. FETCH_ROLLUP_CONFIG + L2_CL_URL make it derive the rollup config (and
  # thus the config hash) from the live op-node, so the ephemeral L2 chain id works without a
  # built-in config. L1_BEACON_URL is intentionally unset so the entrypoint selects calldata-only.
  nitro-local:
    image: nitro-host-local:local
    build:
      context: ../..
      dockerfile: etc/docker/Dockerfile.nitro-host-local
    container_name: nitro-local
    profiles: ["base-l1"]
    depends_on:
      base-rpc:
        condition: service_healthy
    environment:
      - LISTEN_ADDR=0.0.0.0:8000
      - L1_ETH_URL=http://l1-el:${L1_HTTP_PORT}
      - L2_ETH_URL=http://base-rpc:${L2_BASE_RPC_HTTP_PORT}
      - L2_CHAIN_ID=${L2_CHAIN_ID}
      - FETCH_ROLLUP_CONFIG=true
      - L2_CL_URL=http://base-rpc:${L2_BASE_RPC_CL_RPC_PORT}
      - BASE_ENCLAVE_SIGNER_KEY=${DEV_TEE_SIGNER_KEY}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # base-proposer: sole game creator for L3 dev multiproof. Talks directly to nitro-local over
  # JSON-RPC (--direct-prover-rpc), creates AggregateVerifier games (type 621), and submits the
  # TEE-signed output root. It does NOT resolve games — the challenger does. setup-dispute-service.sh
  # sources the DisputeGameFactory + AnchorStateRegistry addresses from l1-addresses.json (only
  # known post-deploy) and exports them before exec'ing the binary. L3 (base-l1) only.
  base-proposer:
    image: base-proposer:local
    build:
      <<: *rust-service-build
      target: proposer
    container_name: base-proposer
    profiles: ["base-l1"]
    depends_on:
      base-rpc:
        condition: service_healthy
      nitro-local:
        condition: service_healthy
      register-aggregate-verifier:
        condition: service_completed_successfully
    volumes:
      - ../../.devnet/l2/configs:/devnet/l2/configs:ro
      - ../../etc/scripts/devnet/setup-dispute-service.sh:/setup-dispute-service.sh:ro
    environment:
      - ADDRESSES_FILE=/devnet/l2/configs/l1-addresses.json
      - BASE_PROPOSER_L1_ETH_RPC=http://l1-el:${L1_HTTP_PORT}
      - BASE_PROPOSER_L2_ETH_RPC=http://base-rpc:${L2_BASE_RPC_HTTP_PORT}
      - BASE_PROPOSER_ROLLUP_RPC=http://base-rpc:${L2_BASE_RPC_CL_RPC_PORT}
      - BASE_PROPOSER_PROVER_RPC=http://nitro-local:8000
      - BASE_PROPOSER_DIRECT_PROVER_RPC=true
      - BASE_PROPOSER_GAME_TYPE=621
      - BASE_PROPOSER_TEE_IMAGE_HASH=${TEE_IMAGE_HASH}
      - BASE_PROPOSER_PRIVATE_KEY=${PROPOSER_KEY}
      - BASE_PROPOSER_ALLOW_NON_FINALIZED=true
      - BASE_PROPOSER_POLL_INTERVAL=6s
      - BASE_PROPOSER_NUM_CONFIRMATIONS=1
    entrypoint: ["/bin/bash", "/setup-dispute-service.sh", "proposer"]
    restart: unless-stopped

  # base-challenger: sole resolver, running in --no-dispute mode (no proving). It drives the
  # post-game bond/anchor lifecycle (resolve -> claimCredit -> setAnchorState) for games whose
  # bond recipient is the proposer (BOND_CLAIM_ADDRESSES). no-dispute validation forbids the
  # zk-/tee-rpc-url flags and requires bond-claim-addresses. setup-dispute-service.sh sources the
  # L1 dispute addresses like the proposer. L3 (base-l1) only.
  base-challenger:
    image: base-challenger:local
    build:
      <<: *rust-service-build
      target: challenger
    container_name: base-challenger
    profiles: ["base-l1"]
    depends_on:
      base-rpc:
        condition: service_healthy
      register-aggregate-verifier:
        condition: service_completed_successfully
      base-proposer:
        condition: service_started
    volumes:
      - ../../.devnet/l2/configs:/devnet/l2/configs:ro
      - ../../etc/scripts/devnet/setup-dispute-service.sh:/setup-dispute-service.sh:ro
    environment:
      - ADDRESSES_FILE=/devnet/l2/configs/l1-addresses.json
      - BASE_CHALLENGER_L1_ETH_RPC=http://l1-el:${L1_HTTP_PORT}
      - BASE_CHALLENGER_L2_ETH_RPC=http://base-rpc:${L2_BASE_RPC_HTTP_PORT}
      - BASE_CHALLENGER_NO_DISPUTE=true
      - BASE_CHALLENGER_BOND_CLAIM_ADDRESSES=${PROPOSER_ADDR}
      - BASE_CHALLENGER_PRIVATE_KEY=${CHALLENGER_KEY}
      - BASE_CHALLENGER_POLL_INTERVAL=6s
      - BASE_CHALLENGER_NUM_CONFIRMATIONS=1
    entrypoint: ["/bin/bash", "/setup-dispute-service.sh", "challenger"]
    restart: unless-stopped

  prover-service-postgres:
    image: postgres:17-alpine
    container_name: prover-service-postgres
    ports:
      - "${PROVER_SERVICE_POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=prover
      - POSTGRES_USER=prover
      - POSTGRES_PASSWORD=prover
    volumes:
      - ../../.devnet/prover-service/postgres:/var/lib/postgresql/data
      - ../../crates/proof/prover-service/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prover -d prover"]
      interval: 250ms
      timeout: 1s
      retries: 240
      start_period: 250ms
    restart: unless-stopped

  base-prover-service:
    image: base-prover-service:local
    build:
      <<: *rust-service-build
      target: prover-service
    container_name: base-prover-service
    depends_on:
      prover-service-postgres:
        condition: service_healthy
    ports:
      - "${PROVER_SERVICE_RPC_PORT}:9000"
    environment:
      - RPC_LISTEN_ADDR=0.0.0.0:9000
      - WORKER_RPC_LISTEN_ADDR=0.0.0.0:9001
      - RUST_LOG=${RUST_LOG:-}
      - POSTGRES_HOST=prover-service-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=prover
      - POSTGRES_USER=prover
      - POSTGRES_PASSWORD=prover
      - POSTGRES_SSLMODE=disable
      - OTEL_SERVICE_NAME=base-prover-service
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9000"]
      interval: 250ms
      timeout: 1s
      retries: 240
      start_period: 250ms
    restart: unless-stopped

  base-prover-zk-host:
    image: base-prover-zk-host:local
    build:
      <<: *zk-host-build
      target: zk-host
    container_name: base-prover-zk-host
    depends_on:
      l1-el:
        condition: service_healthy
        required: false
      l1-anvil:
        condition: service_healthy
        required: false
      l1-cl:
        condition: service_healthy
        required: false
      base-rpc:
        condition: service_healthy
      base-prover-service:
        condition: service_healthy
    volumes:
      - ../../.devnet/l1/configs/el/chain-config.json:/app/configs/L1/${L1_CHAIN_ID}.json:ro
    environment:
      - PROVER_SERVICE_ENDPOINT=http://base-prover-service:9001
      - PROVER_WORKER_ID=devnet-zk-host
      - SP1_CLUSTER_API_ENDPOINT=${SP1_CLUSTER_API_ENDPOINT:-}
      - SP1_CLUSTER_TIMEOUT_HOURS=${SP1_CLUSTER_TIMEOUT_HOURS:-24}
      - CLI_S3_BUCKET=${CLI_S3_BUCKET:-}
      - CLI_S3_REGION=${CLI_S3_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - RUST_LOG=${RUST_LOG:-}
      - BASE_CONSENSUS_ADDRESS=http://base-rpc:${L2_BASE_RPC_CL_RPC_PORT}
      - L1_NODE_ADDRESS=http://l1-el:${L1_HTTP_PORT}
      # Beacon address is mode-driven: eth-l1 => l1-cl; base-l1 leaves it unset and opts into
      # calldata-only proving explicitly via L1_CALLDATA_ONLY (set in the base-l1 env file).
      - L1_BEACON_ADDRESS
      - L1_CALLDATA_ONLY
      - L2_NODE_ADDRESS=http://base-rpc:${L2_BASE_RPC_HTTP_PORT}
      - DEFAULT_SEQUENCE_WINDOW=${DEFAULT_SEQUENCE_WINDOW:-50}
      - OTEL_SERVICE_NAME=base-prover-zk-host
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: jaeger
    ports:
      - "3001:16686"  # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - MEMORY_MAX_TRACES=1000
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:1.18.1
    container_name: pyroscope
    profiles: ["profiling"]
    ports:
      - "4040:4040"
    command:
      - "server"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.13.1
    container_name: alloy
    profiles: ["profiling"]
    privileged: true
    pid: host
    volumes:
      - ../scripts/devnet/alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - pyroscope
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../scripts/devnet/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_INSTALL_PLUGINS=grafana-pyroscope-app
    volumes:
      - ../scripts/devnet/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../scripts/devnet/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

networks:
  # Fixed bootnode ENRs depend on stable in-network IPs. Override
  # L2_BOOTNODE_DOCKER_SUBNET if this subnet conflicts with the host.
  default:
    ipam:
      config:
        - subnet: ${L2_BOOTNODE_DOCKER_SUBNET}
