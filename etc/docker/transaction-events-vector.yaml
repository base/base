data_dir: /vector-data

sources:
  transaction_event_files:
    type: file
    include:
      - /var/log/transaction-events/*/events.jsonl
    read_from: beginning

  vector_internal_metrics:
    type: internal_metrics

transforms:
  parse_transaction_events:
    type: remap
    inputs:
      - transaction_event_files
    drop_on_error: true
    reroute_dropped: true
    source: |-
      . = parse_json!(string!(.message))

sinks:
  audit_archiver:
    type: http
    inputs:
      - parse_transaction_events
    uri: http://audit-archiver:9101/v1/transaction-events/batch
    method: post
    request:
      headers:
        content-type: application/x-ndjson
      retry_attempts: 10
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 300
    healthcheck:
      enabled: false
    framing:
      method: newline_delimited
    encoding:
      codec: json
    batch:
      max_bytes: 1048576
      max_events: 1000
      timeout_secs: 5
    buffer:
      type: disk
      max_size: 1073741824
      when_full: block
  malformed_transaction_events:
    type: console
    inputs:
      - parse_transaction_events.dropped
    target: stderr
    encoding:
      codec: json

  vector_metrics:
    type: prometheus_exporter
    inputs:
      - vector_internal_metrics
    address: 0.0.0.0:8686
