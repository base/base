# Standalone project: never combine with the fresh-genesis devnet Compose files.
# Nodes publish no ports. The launcher reaches their execution RPC (8545) at each container's
# internal-network IP from the Docker host.
x-inspection: &inspection
  image: ${SNAPSHOT_BASE_IMAGE:?}
  user: ${SNAPSHOT_UID:?}:${SNAPSHOT_GID:?}
  environment:
    HOME: /state
  profiles: [inspect]
  entrypoint: [/app/base-reth-node]
  networks: [private]
  stop_grace_period: 2m
  command:
    - node
    - --chain=base
    - --datadir=/data
    - --disable-discovery
    - --no-persist-peers
    - --max-outbound-peers=0
    - --max-inbound-peers=0
    - --http
    - --http.addr=0.0.0.0
    - --http.api=eth

services:
  inspect-sequencer:
    <<: *inspection
    volumes:
      - ${SNAPSHOT_SEQUENCER_DATADIR:?}:/data
      - ${SNAPSHOT_DIR:?}/sequencer:/state

  inspect-validator:
    <<: *inspection
    volumes:
      - ${SNAPSHOT_VALIDATOR_DATADIR:?}:/data
      - ${SNAPSHOT_DIR:?}/validator:/state

networks:
  private:
    internal: true
