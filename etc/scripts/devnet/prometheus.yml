global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'l2_builder'
    static_configs:
      - targets: ['base-builder:7090']

  - job_name: 'l2_sequencer'
    static_configs:
      - targets: ['base-sequencer-1:10090', 'base-sequencer-2:11090']

  - job_name: 'l2_client'
    static_configs:
      - targets: ['base-client:8090']

  - job_name: 'l2_base_rpc'
    static_configs:
      - targets: ['base-rpc:8190']

  - job_name: 'l2_shadow_validator'
    static_configs:
      - targets: ['base-shadow-validator:8890']

  - job_name: 'conductor'
    static_configs:
      - targets: ['op-conductor-0:6090', 'op-conductor-1:6091', 'op-conductor-2:6092']

  - job_name: 'tips_ingress'
    scrape_timeout: 2s
    static_configs:
      - targets: ['ingress-rpc:9002']

  # Canonical Go op-batcher and the shadow Rust base-batcher both run by default.
  - job_name: 'batcher'
    static_configs:
      - targets: ['op-batcher:6060', 'base-batcher:6061']
