[package]
name = "base-diff-adapter"
description = "base/base reference adapter for the differential execution fuzz harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "base-diff-adapter"
path = "src/main.rs"

[dependencies]
# base
base-node-core.workspace = true
base-common-chains.workspace = true
base-execution-evm.workspace = true
base-common-genesis.workspace = true
base-diff-fuzz = { path = "../diff-fuzz" }
base-execution-consensus.workspace = true
base-execution-chainspec.workspace = true
base-proof-mpt = { workspace = true, features = ["std"] }
base-common-consensus = { workspace = true, features = ["std", "reth"] }
base-common-rpc-types-engine = { workspace = true, features = ["std", "reth"] }

# reth
reth-evm.workspace = true
reth-node-api.workspace = true
reth-consensus.workspace = true
reth-chainspec.workspace = true
reth-storage-api.workspace = true
reth-trie-common.workspace = true
reth-storage-errors.workspace = true
reth-execution-types.workspace = true
reth-primitives-traits.workspace = true
reth-revm = { workspace = true, features = ["std"] }

# alloy
alloy-rlp.workspace = true
alloy-trie = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std"] }

# revm
revm = { workspace = true, features = ["std", "tracer"] }

# misc
eyre.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde_json = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
alloy-signer.workspace = true
base-common-evm.workspace = true
alloy-signer-local.workspace = true

[features]
# Edge coverage of the EVM crates; build with `RUSTC_WRAPPER=sancov-rustc.sh` (see README).
edge-coverage = []
