[package]
name = "base-diff-trie-adapter"
description = "base/base (reth) adapter for the differential trie fuzz harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "base-diff-trie-adapter"
path = "src/main.rs"

[dependencies]
# base
base-diff-adapter = { path = "../diff-adapter" }
base-diff-fuzz = { path = "../diff-fuzz" }
base-execution-trie.workspace = true

# reth
reth-trie.workspace = true
reth-tasks.workspace = true
reth-db-api.workspace = true
reth-codecs.workspace = true
reth-trie-db.workspace = true
reth-chainspec.workspace = true
reth-trie-common.workspace = true
reth-trie-sparse.workspace = true
reth-storage-api.workspace = true
reth-trie-parallel.workspace = true
reth-primitives-traits.workspace = true
reth-db = { workspace = true, features = ["mdbx"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-stages-types = { workspace = true, features = ["reth-codec"] }

# alloy
alloy-rlp.workspace = true
alloy-eips.workspace = true
alloy-trie = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std"] }

# misc
eyre.workspace = true
tracing.workspace = true
serde_json = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[features]
# Edge coverage of the trie crates; build with `RUSTC_WRAPPER=sancov-rustc.sh` (see README).
edge-coverage = ["base-diff-adapter/edge-coverage"]
