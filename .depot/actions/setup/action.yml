name: Setup
description: Shared CI setup for Rust projects

inputs:
  toolchain:
    description: Rust toolchain channel (stable or nightly)
    default: "stable"
  components:
    description: Rust components to install (e.g. clippy, rustfmt)
    default: ""
  tools:
    description: Cargo tools to install via taiki-e/install-action
    default: ""
  foundry:
    description: Install Foundry
    default: "false"
  sp1:
    description: Install the SP1 toolchain (cargo-prove) for building ELFs
    default: "false"
  sp1-version:
    description: SP1 release tag used when sp1 is enabled (matches etc/just/succinct.just)
    default: "v6.10.0"
  native-deps:
    description: Install native build dependencies (clang, llvm, etc.)
    default: "false"
  just:
    description: Install just
    default: "true"

runs:
  using: composite
  steps:
    - name: Install native dependencies
      if: inputs.native-deps == 'true'
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          clang \
          libclang-dev \
          libprotobuf-dev \
          libsqlite3-dev \
          llvm \
          llvm-dev \
          pkg-config \
          protobuf-compiler

    - name: Install Rust (stable via rust-toolchain.toml)
      if: inputs.toolchain == 'stable'
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        rustup show active-toolchain
        if [ -n "$COMPONENTS" ]; then
          rustup component add $COMPONENTS
        fi

    - name: Install Rust (nightly)
      if: inputs.toolchain == 'nightly'
      uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      with:
        components: ${{ inputs.components }}

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: cargo-dependencies
        cache-bin: "false"
        cache-targets: "false"

    - name: Install just
      if: inputs.just == 'true'
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: "1.43.1"

    - name: Install cargo tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: ${{ inputs.tools }}

    - name: Install Foundry
      if: inputs.foundry == 'true'
      uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      with:
        # Pinned so a Foundry release cannot change CI behavior without a reviewed bump
        # (anvil 1.8.7 changed evm_revert mempool semantics and broke a test overnight).
        version: v1.8.7

    - name: Install SP1 toolchain
      if: inputs.sp1 == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # Commit for succinctlabs/sp1 v6.10.0; update alongside SP1_VERSION.
        SP1UP_REF: d83ed91f96701209613720708f36ffce0e98ed33
        SP1_VERSION: ${{ inputs.sp1-version }}
      run: |
        if [ -x "$HOME/.sp1/bin/cargo-prove" ]; then
          echo "cargo-prove already installed"
        else
          mkdir -p "$HOME/.sp1/bin"
          curl --fail --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Accept: application/vnd.github.raw" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "User-Agent: base-base-ci" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/succinctlabs/sp1/contents/sp1up/sp1up?ref=$SP1UP_REF" \
            -o "$HOME/.sp1/bin/sp1up"
          chmod +x "$HOME/.sp1/bin/sp1up"
          "$HOME/.sp1/bin/sp1up" --version "$SP1_VERSION"
        fi
        echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

    - name: Set LIBCLANG_PATH
      if: inputs.native-deps == 'true'
      shell: bash
      run: |
        LLVM_BIN=$(command -v llvm-config || ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)
        LLVM_VERSION=$($LLVM_BIN --version | cut -d. -f1)
        echo "LIBCLANG_PATH=/usr/lib/llvm-${LLVM_VERSION}/lib" >> $GITHUB_ENV
