# Depot CI Migration
# Source: .github/workflows/release-branch-ci.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Release Branch CI
on:
  pull_request:
    branches:
      - 'releases/v*'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  finalized-release:
    name: Finalized Release
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Check release is not finalized
        run: ./etc/scripts/release/check-finalized.sh "${{ github.base_ref }}"
