# Depot CI Migration
# Source: .github/workflows/verify-release.yml
#
# Changes made:
# - Removed unsupported trigger "release"
# - Changed GitHub runs-on labels to their Depot equivalents

name: Verify Release
# Removed unsupported trigger: release. Release events are not supported.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify. Leave blank to verify the latest release.'
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify-signatures:
    runs-on: depot-ubuntu-24.04 # was: ubuntu-24.04. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify release signatures
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--install "$RELEASE_TAG")
          fi

          bash baseup/baseup verify-release "${args[@]}"
