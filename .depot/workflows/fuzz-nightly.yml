# Depot CI Migration
# Source: .github/workflows/fuzz-nightly.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/

# Nightly fuzz: runs the acceptance sync-parity fuzz scenario with a fresh random
# seed each run (several shards in parallel) so every run explores a different
# transaction stream. The chosen seed is logged; a failing run can be replayed by
# dispatching this workflow with that seed.
name: Fuzz Nightly
on:
  schedule:
    # 07:00 UTC daily (after most merges have settled).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to replay (hex or decimal). Leave blank to generate a fresh random seed."
        required: false
        type: string
concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fuzz-sync-parity:
    name: Fuzz sync parity / shard ${{ matrix.shard }}
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Parallel shards. On scheduled runs each shard is its own job and generates
        # its own random seed, so the shards fan out for more coverage per night. On
        # a workflow_dispatch replay, every shard uses the supplied seed to reproduce
        # it (parallelism adds no coverage there, which is fine for replay).
        shard: [1, 2, 3, 4]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          just: "false"
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1
      - name: Build and load tested images
        env:
          PROFILE: dev
          BASE_SUCCINCT_ELF_REQUIRE: "0"
        run: |
          set -euo pipefail
          depot bake --project "${{ vars.DEPOT_PROJECT_ID }}" -f etc/docker/docker-bake.hcl \
            base op-batcher --set '*.platform=linux/amd64' --load
          depot build --project "${{ vars.DEPOT_PROJECT_ID }}" --load \
            --tag devnet-setup:local-v2 -f etc/docker/Dockerfile.devnet .
      - name: Pick fuzz seed
        # Replay a specific seed via the workflow_dispatch input; otherwise generate
        # a fresh random seed so each run fuzzes a different transaction stream. The
        # seed is logged (and echoed below) so a failing run can be replayed.
        # The dispatch input is passed via env (not interpolated into the script) to
        # avoid shell injection.
        env:
          SEED_INPUT: ${{ github.event.inputs.seed }}
        run: |
          if [ -n "$SEED_INPUT" ]; then
            SEED="$SEED_INPUT"
          else
            SEED="0x$(openssl rand -hex 8)"
          fi
          echo "FUZZ_SEED=$SEED" >> "$GITHUB_ENV"
          echo "::notice::Fuzzing with seed $SEED (replay via workflow_dispatch input seed=$SEED)"
      - name: Run fuzz sync-parity acceptance scenario
        # FUZZ_SEED is exported by the "Pick fuzz seed" step above.
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          cargo run --locked -p base-acceptance-cli -- run \
            acceptance/scenarios/system-transaction-fuzz-parity.toml \
            --output "target/acceptance/$RUN_KEY/system-transaction-fuzz-parity" --no-build \
            --run-id "$RUN_KEY" --tested-sha "$TESTED_SHA"
      - name: Preserve startup failure evidence
        if: always()
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
        run: |
          report="target/acceptance/$RUN_KEY/system-transaction-fuzz-parity/report"
          mkdir -p "$report"
          if [ ! -f "$report/result.json" ]; then
            echo 'No scenario result; inspect the job log for the infrastructure failure.' > "$report/runner-status.txt"
          fi
      - name: Upload sanitized scenario report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-result-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/acceptance/${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}/system-transaction-fuzz-parity/report
          if-no-files-found: warn
