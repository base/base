name: CI
on:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  ci:
    uses: ./.depot/workflows/ci-core.yml
    with:
      clippy_command: just check::clippy-ci
      run_sigsegv: false
      test_command: just test-ci
    secrets: inherit
