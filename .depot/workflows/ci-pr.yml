name: CI
on:
  # A reviewer can add ci:system, ci:perf, or ci:full to request an
  # integration/performance rerun without needing an otherwise-empty push.
  pull_request:
    types: [opened, reopened, synchronize, labeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # A label is an explicit request for an optional suite. Do not discard useful
  # build/test work already in flight merely to service that request.
  cancel-in-progress: ${{ github.event.action != 'labeled' }}
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  ci:
    uses: ./.depot/workflows/ci-core.yml
    with:
      allow_registry_login: ${{ github.event.pull_request.head.repo.fork != true }}
      # The tested PR merge commit stores its exact base as the first parent.
      diff_base: HEAD^1
      clippy_command: >-
        just check::clippy-affected-ci "${DIFF_BASE:?}"
      run_system_tests: true
      run_sigsegv: false
      test_command: >-
        just test-affected-ci "${DIFF_BASE:?}"
    secrets: inherit
