name: CI
on:
  # Expensive suites (system tests, Base Std, benchmarks) run after merge on
  # main; see system-tests.yml, base-std-fork-tests.yml and bench-*.yml.
  pull_request:
    types: [opened, reopened, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  ci:
    uses: ./.depot/workflows/ci-core.yml
    with:
      # The tested PR merge commit stores its exact base as the first parent.
      diff_base: HEAD^1
      clippy_command: >-
        just check::clippy-affected-ci "${DIFF_BASE:?}"
      run_sigsegv: false
      test_command: >-
        just test-affected-ci "${DIFF_BASE:?}"
    secrets: inherit
