# Depot CI Migration
# Source: .github/workflows/depot-test.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Depot Build Test
# Spike workflow: validates depot/bake-action against docker-bake.hcl before
# migrating production Docker workflows. Not a required check — dispatch-only.
on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to GHCR (default: false — build only)'
        required: false
        type: boolean
        default: false
env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/node-reth-dev
permissions:
  contents: read
jobs:
  depot-bake:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
      - name: Prepare image labels
        id: image-labels
        run: |
          echo "source=https://github.com/${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "revision=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Depot CLI
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1
      - name: Build multi-arch Docker image via Depot
        uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
        with:
          project: zfkh4dsmr3
          files: etc/docker/docker-bake.hcl
          targets: client
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          load: false
          set: |
            client.labels.org.opencontainers.image.source=${{ steps.image-labels.outputs.source }}
            client.labels.org.opencontainers.image.revision=${{ steps.image-labels.outputs.revision }}
            client.labels.org.opencontainers.image.created=${{ steps.image-labels.outputs.created }}
