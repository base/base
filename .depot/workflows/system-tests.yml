name: System Tests

# System tests run after merge, on every push to main. A failure there is
# picked up and fixed after the fact instead of blocking each PR and merge-queue
# run. A reviewer can add ci:system or ci:full to run them on a PR before merge.
# Labels are read on the next push or reopen, not when added, so that an
# unrelated label never posts a skipped check over a real result.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
concurrency:
  # Each main commit gets its own run so a failure points at one merge. PR runs
  # are replaced by newer pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
permissions:
  checks: write
  contents: read
jobs:
  system-tests:
    name: System Tests
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:system') ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
          sp1: "true"
          tools: cargo-nextest
      - name: Clear prior JUnit report
        run: rm -f target/nextest/ci/test-results.xml
      - name: Run system tests
        shell: bash
        run: |
          set -euo pipefail
          # Image pulls are network-bound; overlap them with the compile.
          just devnet pull-images &
          pull_pid=$!
          just build::contracts
          # Build the fixture with the ci profile (as tests-ci does) so the
          # devnet dependency tree is compiled once rather than again in dev.
          cargo build --locked --profile ci -p base-system-tests --bin base-devnet
          wait "$pull_pid"
          runtime_dir="$(mktemp -d)"
          runtime_file="$runtime_dir/shared-l1.json"
          network_name="base-system-tests-shared-l1-$GITHUB_RUN_ID"
          cargo run --locked --profile ci -p base-system-tests --bin base-devnet -- \
            shared-l1 --runtime-file "$runtime_file" --network-name "$network_name" &
          fixture_pid=$!
          cleanup() {
            kill -INT "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          until [ -f "$runtime_file" ]; do
            kill -0 "$fixture_pid"
            sleep 1
          done
          BASE_SYSTEM_TEST_SHARED_L1_RUNTIME="$runtime_file" just devnet tests-ci
      - name: Check for JUnit testcases
        if: always()
        id: junit-results
        shell: bash
        run: |
          if [ -f target/nextest/ci/test-results.xml ] && grep -q '<testcase[ >]' target/nextest/ci/test-results.xml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report test results
        if: ${{ always() && steps.junit-results.outputs.present == 'true' }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          check_name: System Test Results
          report_paths: target/nextest/ci/test-results.xml
