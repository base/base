# Depot CI Migration
# Source: .github/workflows/ci-main-cache.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

name: CI Main Cache
on:
  push:
    branches: [main]
    # The persistent sccache is keyed by compiler inputs. Warming it after a
    # documentation-only merge consumes two 8-vCPU runners without helping a
    # later Rust build.
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'Justfile'
      - 'crates/**'
      - 'bin/**'
      - 'etc/just/build.just'
      - 'etc/scripts/local/affected-crates.py'
      - 'crates/utilities/test-utils/contracts/**'
      - '.depot/actions/setup/**'
      - '.depot/workflows/ci-main-cache.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
permissions:
  contents: read
jobs:
  warm-stable-cache:
    name: Warm Stable Cache
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
          sp1: "true"
      - name: Build CI cache
        run: just build::ci
  warm-test-cache:
    name: Warm Test Cache
    needs: warm-stable-cache
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
          sp1: "true"
          tools: cargo-nextest
      - name: Build CI test cache
        run: |
          just build::contracts
          cargo nextest run -P ci --locked --workspace --all-features \
            --exclude base-system-tests --cargo-profile ci --no-run
