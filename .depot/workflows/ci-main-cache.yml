# Depot CI Migration
# Source: .github/workflows/ci-main-cache.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

name: CI Main Cache
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
permissions:
  contents: read
jobs:
  warm-stable-cache:
    name: Warm Stable Cache
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
          sp1: "true"
      - name: Build CI cache
        run: just build::ci
  warm-test-cache:
    name: Warm Test Cache
    needs: warm-stable-cache
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
          sp1: "true"
          tools: cargo-nextest
      - name: Build CI test cache
        run: |
          just build::contracts
          cargo nextest run -P ci --locked --workspace --all-features \
            --exclude base-system-tests --cargo-profile ci --no-run
