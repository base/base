name: Fresh devnet benchmarks (advisory)

on:
  pull_request:
    # `labeled` starts the opt-in suite and `unlabeled` cancels an in-progress
    # suite when its opt-in label is removed.
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  # Only `bench:tps` label changes belong to the PR's benchmark concurrency group. Other label
  # changes are skipped and receive a per-run group, so they cannot interrupt an active benchmark.
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      (
        (
          github.event.action != 'labeled' &&
          github.event.action != 'unlabeled'
        ) ||
        github.event.label.name == 'bench:tps'
      ) &&
      format('pr-{0}', github.event.pull_request.number) ||
      github.run_id
    }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  BENCHMARK_OUTPUT: ${{ runner.temp }}/fresh-devnet-benchmark
  BENCHMARK_VISUALIZER_REF: "582d987fd86a8ac5575d44bc53229297071a2db8"

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Fresh devnet workload suite
    # The suite is deliberately opt-in: it is expensive and starts services. Keep its write-capable
    # token away from untrusted fork code; contributors can run it from a trusted base/base branch
    # after applying the `bench:tps` label.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'bench:tps') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'bench:tps'))
    # Depot's largest x86 runner: 64 vCPUs, 256 GB memory, and a 32 GB RAM disk accelerator.
    runs-on: depot-ubuntu-24.04-64
    timeout-minutes: 90
    env:
      BENCHMARK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout benchmark target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Rust toolchain, cache, and dependencies
        uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"

      - name: Build system-test contracts
        run: just build::contracts

      - name: Pre-pull devnet images
        run: just devnet pull-images

      - name: Build base-bench
        run: cargo build --locked --release -p base-system-tests --bin base-bench

      - name: Run fresh-devnet workload suite
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target/release/base-bench local \
            --workload-config etc/benchmarks/fresh-devnet.yml \
            --output-dir "$BENCHMARK_OUTPUT" \
            --client-version "base/${BENCHMARK_SHA}"

      # This must run after a failed suite too: base-bench persists any completed workload's
      # sidecar and the suite manifest before returning a nonzero exit code.
      - name: Render benchmark results
        if: always()
        id: render
        shell: bash
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 etc/scripts/ci/render_fresh_devnet_bench.py \
            --results-dir "$BENCHMARK_OUTPUT" \
            --output "$RUNNER_TEMP/fresh-devnet-bench-comment.md" \
            --run-url "$WORKFLOW_RUN_URL" \
            --commit "$BENCHMARK_SHA"
          cat "$RUNNER_TEMP/fresh-devnet-bench-comment.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$BENCHMARK_OUTPUT/metadata.json" ]; then
            echo "has-results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout benchmark visualizer
        if: always() && steps.render.outputs.has-results == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: base/benchmark
          ref: ${{ env.BENCHMARK_VISUALIZER_REF }}
          path: benchmark-visualizer
          fetch-depth: 1

      - name: Setup Node.js for benchmark visualizer
        if: always() && steps.render.outputs.has-results == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build benchmark visualizer
        if: always() && steps.render.outputs.has-results == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf benchmark-visualizer/output
          ln -s "$BENCHMARK_OUTPUT" benchmark-visualizer/output
          corepack enable
          yarn --cwd benchmark-visualizer install --immutable
          yarn --cwd benchmark-visualizer build

      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-devnet-benchmark-results
          path: ${{ env.BENCHMARK_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload benchmark visualizer
        if: always() && steps.render.outputs.has-results == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-devnet-benchmark-visualizer
          path: benchmark-visualizer/dist
          if-no-files-found: warn
          retention-days: 14

      - name: Create or update benchmark results comment
        if: >
          always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMENT_PATH: ${{ runner.temp }}/fresh-devnet-bench-comment.md
        run: |
          set -euo pipefail
          marker='<!-- fresh-devnet-bench-results -->'
          existing_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            | head -1)

          if [ -n "$existing_id" ]; then
            gh api "repos/${REPO}/issues/comments/${existing_id}" \
              -X PATCH -F body=@"$COMMENT_PATH" > /dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -F body=@"$COMMENT_PATH" > /dev/null
          fi
