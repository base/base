name: CI Core
on:
  workflow_call:
    inputs:
      diff_base:
        description: Git revision used as the base for affected-crate comparisons
        required: false
        type: string
        default: ""
      test_command:
        required: true
        type: string
      clippy_command:
        required: true
        type: string
      run_sigsegv:
        required: false
        type: boolean
        default: false
      run_system_tests:
        required: false
        type: boolean
        default: false
      allow_registry_login:
        required: true
        type: boolean
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
permissions:
  checks: write
  contents: read
jobs:
  changes:
    name: Detect Expensive CI Changes
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      proof-mpt-bench: ${{ steps.filter.outputs.proof-mpt-bench }}
      system-tests: ${{ steps.system-tests.outputs.system-tests }}
      upgrade-signal: ${{ steps.filter.outputs.upgrade-signal }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # PRs are checked out at their test merge commit. The affected-crate
          # calculation below compares it to its first parent.
          fetch-depth: 2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            docker:
              - 'etc/docker/Dockerfile.*'
              - 'etc/docker/docker-bake.hcl'
              - 'etc/scripts/node/**'
              - 'docker-compose.yml'
              - '.env.mainnet'
              - '.env.sepolia'
              - '.dockerignore'
            # This benchmark only exercises the MPT implementation. Keep it in
            # merge-queue CI, but do not spend a runner on unrelated PRs.
            proof-mpt-bench:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'crates/proof/mpt/**'
              - 'crates/proof/primitives/**'
              - 'crates/execution/trie/**'
              - 'etc/scripts/ci/**'
              - '.depot/workflows/ci-core.yml'
            # The upgrade_signal system tests are the slowest binary (~800s of
            # ~2900s of test time). On PRs run them only when code they
            # exercise, or the shared test environment, changes. Merge-queue CI
            # and the ci:system / ci:full labels still run them.
            upgrade-signal:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'etc/systems/**'
              - 'etc/docker/**'
              - 'crates/utilities/upgrade-signal/**'
              - 'crates/utilities/test-utils/**'
              - 'crates/common/genesis/**'
              - 'crates/consensus/**'
              - 'crates/execution/cli/**'
              - 'crates/execution/node/**'
              - '.depot/workflows/ci-core.yml'
            # Non-crate inputs which can affect the system-test environment.
            # Crate changes are classified by the dependency-aware step below.
            system-test-inputs:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'Justfile'
              - 'etc/just/**'
              - 'etc/docker/**'
              - 'etc/systems/**'
              - 'docker-compose.yml'
              - '.env.mainnet'
              - '.env.sepolia'
              - '.depot/actions/setup/**'
              - '.depot/workflows/ci-core.yml'
      - name: Detect system-test dependency changes
        id: system-tests
        shell: bash
        env:
          SYSTEM_TEST_INPUTS: ${{ steps.filter.outputs.system-test-inputs }}
        run: |
          set -euo pipefail

          # Merge-queue CI is exhaustive. This job still runs there to select
          # Docker work, but no dependency classification is necessary.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "system-tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$SYSTEM_TEST_INPUTS" = true ] || \
             python3 etc/scripts/local/affected-crates.py HEAD^1 | grep -Fxq base-system-tests; then
            echo "system-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "system-tests=false" >> "$GITHUB_OUTPUT"
          fi
  metadata-checks:
    name: Metadata Checks
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: ./.depot/actions/setup
        with:
          tools: cargo-deny
      - name: Validate Cargo.lock is up to date
        run: cargo metadata --format-version 1 --no-deps --locked >/dev/null
      - name: Check cargo-deny
        run: cargo deny check bans --hide-inclusion-graph
      - name: Check crate dependencies
        run: ./etc/scripts/ci/check-crate-deps.sh
      - name: Validate operator compose
        run: docker compose config -q
  format:
    name: Format
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: ./.depot/actions/setup
        with:
          toolchain: nightly
          components: rustfmt
      - run: just check::format
  rust:
    name: Rust
    needs: changes
    # `changes` is only needed for the RUN_BENCH decision. Clippy and the tests
    # must not depend on change detection succeeding, so run even if `changes`
    # fails; the benchmark step then skips because its output is unavailable.
    if: ${{ !cancelled() }}
    # One sandbox so that Clippy, the tests and the benchmark share a single
    # `target/` and toolchain/tool setup instead of each compiling the workspace
    # from scratch. System tests are wall-clock bound by Docker rather than CPU,
    # so they run in a parallel job instead of extending this one.
    runs-on: depot-ubuntu-24.04-32
    timeout-minutes: 120
    env:
      DIFF_BASE: ${{ inputs.diff_base }}
      RUN_BENCH: >-
        ${{ github.event_name != 'pull_request' ||
        needs.changes.outputs.proof-mpt-bench == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'ci:perf') ||
        contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ inputs.diff_base != '' && 2 || 1 }}
      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
          sp1: "true"
          components: clippy
          tools: cargo-nextest
      # Later steps run even if an earlier one failed so that a lint failure does
      # not hide test failures (and vice versa), matching the previous
      # one-job-per-check reporting.
      - name: Run clippy
        run: ${{ inputs.clippy_command }}
      - name: Clear prior JUnit report
        if: ${{ !cancelled() }}
        run: rm -f target/nextest/ci/test-results.xml
      - name: Run tests
        if: ${{ !cancelled() }}
        run: ${{ inputs.test_command }}
      - name: Check for JUnit testcases
        if: ${{ !cancelled() }}
        id: junit-tests
        shell: bash
        run: |
          if [ -f target/nextest/ci/test-results.xml ] && grep -q '<testcase[ >]' target/nextest/ci/test-results.xml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report test results
        if: ${{ !cancelled() && steps.junit-tests.outputs.present == 'true' }}
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          check_name: Test Results
          report_paths: target/nextest/ci/test-results.xml
      - name: Run benchmarks
        if: ${{ !cancelled() && env.RUN_BENCH == 'true' }}
        run: cargo bench --locked -p base-proof-mpt --bench trie_node -- --test
  docker:
    name: Docker
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1
      - name: Login to GHCR
        if: inputs.allow_registry_login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build Docker image
        run: >-
          depot bake --project "${{ vars.DEPOT_PROJECT_ID }}"
          -f etc/docker/docker-bake.hcl base --load
  test-musl-sigsegv:
    name: Test SIGSEGV (musl)
    if: inputs.run_sigsegv
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: ./.depot/actions/setup
      - name: Install musl toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Run SIGSEGV tests under musl
        run: cargo test --locked -p base-cli-utils --test sigsegv_test --target x86_64-unknown-linux-musl
  system-tests:
    name: System Tests
    needs: changes
    if: >-
      inputs.run_system_tests && (
      github.event_name != 'pull_request' ||
      needs.changes.outputs.system-tests == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'ci:system') ||
      contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
          sp1: "true"
          tools: cargo-nextest
      - name: Clear prior JUnit report
        run: rm -f target/nextest/ci/test-results.xml
      - name: Run system tests
        shell: bash
        env:
          UPGRADE_SIGNAL_CHANGED: ${{ needs.changes.outputs.upgrade-signal }}
          CI_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # Skip the slow upgrade_signal binary on PRs that cannot affect it.
          test_filter=''
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && \
             [ "$UPGRADE_SIGNAL_CHANGED" != true ] && \
             ! grep -Eq '(^|,)ci:(system|full)(,|$)' <<<"$CI_LABELS"; then
            test_filter='not binary(upgrade_signal)'
            echo "Skipping upgrade_signal system tests (no relevant changes)."
          fi
          # Image pulls are network-bound; overlap them with the compile.
          just devnet pull-images &
          pull_pid=$!
          just build::contracts
          # Build the fixture with the ci profile (as tests-ci does) so the
          # devnet dependency tree is compiled once rather than again in dev.
          cargo build --locked --profile ci -p base-system-tests --bin base-devnet
          wait "$pull_pid"
          runtime_dir="$(mktemp -d)"
          runtime_file="$runtime_dir/shared-l1.json"
          network_name="base-system-tests-shared-l1-$GITHUB_RUN_ID"
          cargo run --locked --profile ci -p base-system-tests --bin base-devnet -- \
            shared-l1 --runtime-file "$runtime_file" --network-name "$network_name" &
          fixture_pid=$!
          cleanup() {
            kill -INT "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          until [ -f "$runtime_file" ]; do
            kill -0 "$fixture_pid"
            sleep 1
          done
          BASE_SYSTEM_TEST_SHARED_L1_RUNTIME="$runtime_file" just devnet tests-ci "$test_filter"
      - name: Check for JUnit testcases
        if: always()
        id: junit-results
        shell: bash
        run: |
          if [ -f target/nextest/ci/test-results.xml ] && grep -q '<testcase[ >]' target/nextest/ci/test-results.xml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report test results
        if: ${{ always() && steps.junit-results.outputs.present == 'true' }}
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          check_name: System Test Results
          report_paths: target/nextest/ci/test-results.xml
