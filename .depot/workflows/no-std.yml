name: no_std
on:
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
permissions:
  contents: read
jobs:
  check-no-std:
    name: no_std
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.depot/actions/setup
      - name: Add riscv target
        shell: bash
        run: rustup target add riscv32imac-unknown-none-elf
      - name: check
        run: ./etc/scripts/ci/check-no-std.sh
  check-no-std-proof:
    name: no_std (proof)
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.depot/actions/setup
        with:
          toolchain: "nightly"
          components: "rust-src"
      - name: Add riscv target
        shell: bash
        run: rustup target add riscv32imac-unknown-none-elf
      - name: check
        run: ./etc/scripts/ci/check-no-std-proof.sh
