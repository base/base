name: Benchmark
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
permissions:
  contents: read
jobs:
  benchmark:
    name: Benchmark integrated Base devnet
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Rust, Foundry, and just
        uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
      - name: Start integrated sequencer and RPC nodes
        run: just devnet up-single
      - name: Verify devnet
        run: just devnet checks
      - name: Run load test
        run: |
          set -o pipefail
          just load-test run 2>&1 | tee benchmark.log
      - name: Capture devnet logs
        if: always()
        run: docker compose --env-file etc/docker/devnet-env -f etc/docker/docker-compose.yml logs --no-color > devnet.log
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-output
          path: |
            benchmark.log
            devnet.log
          retention-days: 7
      - name: Stop devnet
        if: always()
        run: just devnet down
