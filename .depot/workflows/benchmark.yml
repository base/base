# Depot CI Migration
# Source: .github/workflows/benchmark.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

name: Benchmark
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  BENCHMARK_REPO: "base/benchmark"
  BENCHMARK_REF: "48f0e0405fc9df31bd8b3e59d686374695e06d64"
permissions:
  contents: read
jobs:
  # Build base-reth-node, base-builder, and base-load-test together, cached by source hash
  build-binaries:
    name: Build binaries
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # Cache based on Cargo files and crates source, not the whole repo
      # This allows iterating on benchmark workflow without rebuilding binaries
      - name: Cache binaries by source hash
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-binaries
        with:
          path: ~/bin
          key: ${{ runner.os }}-binaries-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'bin/**') }}
      - name: Setup Rust toolchain, cache, and dependencies
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
      - name: Build base-reth-node
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --bin base-reth-node --release
          mkdir -p ~/bin
          cp target/release/base-reth-node ~/bin/
      - name: Build base-builder
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --bin base-builder --release
          cp target/release/base-builder ~/bin/base-builder
      - name: Build base-load-test
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: |
          cargo build --locked -p base-load-tester-bin --bin base-load-tester --release
          cp target/release/base-load-tester ~/bin/base-load-test
      - name: Verify binaries exist
        run: |
          echo "Binaries in ~/bin:"
          ls -la ~/bin/
      - name: Upload binaries artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: ~/bin/
          retention-days: 1
  # Run the benchmark
  benchmark:
    name: Run Benchmark
    runs-on: depot-ubuntu-24.04-8
    needs: [build-binaries]
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: node-reth
          fetch-depth: 1
      - name: Checkout benchmark repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.BENCHMARK_REPO }}
          ref: ${{ env.BENCHMARK_REF }}
          path: benchmark
          submodules: true
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      - name: Install Go dependencies
        working-directory: benchmark
        run: go mod download
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin/
      - name: Make binaries executable
        run: |
          chmod +x ${{ runner.temp }}/bin/*
          echo "Downloaded binaries:"
          ls -la ${{ runner.temp }}/bin
      - name: Run Benchmark
        working-directory: benchmark
        run: |
          mkdir -p ${{ runner.temp }}/data-dir
          mkdir -p ${{ runner.temp }}/output

          go run benchmark/cmd/main.go \
            --log.level info \
            run \
            --config ../node-reth/.github/benchmark/load-test.yml \
            --root-dir ${{ runner.temp }}/data-dir \
            --output-dir ${{ runner.temp }}/output \
            --builder-bin ${{ runner.temp }}/bin/base-builder \
            --base-reth-node-bin ${{ runner.temp }}/bin/base-reth-node \
            --load-test-bin ${{ runner.temp }}/bin/base-load-test
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Build Report
        working-directory: benchmark
        run: |
          cp -r ${{ runner.temp }}/output/ ./output/
          pushd report
          npm install
          npm run build
          popd
      - name: Upload Output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-output
          path: ${{ runner.temp }}/output/
          retention-days: 7
      - name: Upload Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-report
          path: benchmark/report/dist/
          retention-days: 7
