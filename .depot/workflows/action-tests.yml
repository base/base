# Depot CI Migration
# Source: .github/workflows/action-tests.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/

name: Action Tests
on:
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
permissions:
  contents: read
jobs:
  action-tests:
    name: Action Tests
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          foundry: "true"
          components: clippy
          tools: cargo-nextest
      - name: Build test contracts
        run: just build::contracts
      - name: Lint action tests
        run: just actions::lint-ci
      - name: Run action tests
        run: just actions::test-ci
