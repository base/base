name: Benchmarks (iai · deterministic)

# Deterministic, instruction-count benchmarks for the compute-bound subset, run
# under Valgrind's Cachegrind simulator. Counts are identical run-to-run, so a
# base-vs-head delta reflects a code change, not machine noise — unlike the
# wall-clock advisory job, which cannot reliably read these per PR. It posts a
# single comment. Every bench is advisory except `build_loop/mainnet_block`
# (the builder's whole-block selection loop, Off and Enforce modes), whose
# instruction count fails the job if it rises 3% or more over the base commit,
# or if it stops producing a result. On PRs it runs only when a path that can
# move its numbers changed (see the prepare step). Its counts vary by about
# 0.04% run-to-run (randomly seeded hashing), far below the 3% gate. The bench
# also pins the block's selection counts, so a selection change fails it outright.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"

permissions:
  contents: read
  pull-requests: write

jobs:
  bench-iai:
    name: Benchmarks (iai · deterministic)
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    env:
      # For pull_request, github.sha is the merge commit and base.sha is the base
      # branch tip. For push/workflow_dispatch there is no base; the prepare step
      # below compares against the current tip of origin/main.
      HEAD_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # Post the in-progress state immediately so the PR shows the benchmarks are
      # running (and any stale result from a prior push is replaced) rather than
      # only appearing when the ~minutes-long run finishes. Skip forked PRs because
      # their pull_request workflows cannot write comments with GITHUB_TOKEN.
      # Best-effort: a comment API failure must not skip the benchmarks or the gate.
      - name: Post in-progress comment
        continue-on-error: true
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/running.md" <<EOF
          <!-- iai-bench-results -->

          ⏳ Running deterministic benchmarks under Valgrind… results will replace this comment when the run finishes. [View run]($RUN_URL)
          EOF
          bash etc/scripts/ci/post_pr_comment.sh "$RUNNER_TEMP/running.md"

      - uses: ./.depot/actions/setup
        with:
          native-deps: "true"
          just: "false"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Cachegrind is a Valgrind tool; this is also the runner's Valgrind check.
      - name: Install Valgrind
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          valgrind --version

      # The runner binary version must match the iai-callgrind library version.
      - uses: taiki-e/install-action@3575e532701a5fc614b0c842e4119af4cc5fd16d # v2.62.60
        with:
          tool: iai-callgrind-runner@0.16.1

      # Resolve the base commit and hoist the head copies of the run + compare
      # scripts out of the tree, so both passes run the same authoritative list
      # even while the tree is switched back to the base commit.
      - name: Prepare base commit and scripts
        shell: bash
        run: |
          set -euo pipefail
          # pull_request supplies the base tip directly. For push/workflow_dispatch
          # there is no base event, so compare against the current tip of main.
          if [ -z "$BASE_SHA" ]; then
            git fetch --no-tags --depth 1 origin main
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
          fi
          git fetch --no-tags --depth 1 origin "$BASE_SHA"
          # The build_loop perf gate doubles the job's build, so on PRs it runs only
          # when a path that can move its numbers changed. A failed diff runs it.
          RUN_GATE=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # base-builder-core's workspace dep closure (normal/build/optional/dev, via `cargo metadata`).
            gate_paths=(
              crates/builder/
              crates/common/bundles/
              crates/common/chains/
              crates/common/consensus/
              crates/common/eip8130/
              crates/common/evm/
              crates/common/flashblocks/
              crates/common/flz/
              crates/common/genesis/
              crates/common/l1-fees/
              crates/common/network/
              crates/common/observability-events/
              crates/common/precompile-macros/
              crates/common/precompile-storage/
              crates/common/precompiles/
              crates/common/rpc-types/
              crates/common/rpc-types-engine/
              crates/consensus/protocol/
              crates/execution/chainspec/
              crates/execution/consensus/
              crates/execution/eip8130/
              crates/execution/evm/
              crates/execution/exex/
              crates/execution/node/
              crates/execution/payload/
              crates/execution/rpc/
              crates/execution/runner/
              crates/execution/trie/
              crates/execution/txpool/
              crates/execution/txpool-rpc/
              crates/utilities/metrics/
              crates/utilities/retry/
              crates/utilities/ring-buffer/
              crates/utilities/test-utils/
              crates/utilities/upgrade-signal/
              Cargo.toml Cargo.lock rust-toolchain.toml .cargo/ .depot/actions/setup/
              .depot/workflows/bench-iai.yml etc/scripts/ci/iai_compare.py etc/scripts/ci/run_iai_subset.sh
            )
            # --no-renames reports a moved file under its old path too, not only the new one.
            if changed="$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA")"; then
              RUN_GATE=false
              while IFS= read -r file; do
                for path in "${gate_paths[@]}"; do
                  if [[ $file == "$path" || ( $path == */ && $file == "$path"* ) ]]; then
                    RUN_GATE=true
                  fi
                done
              done <<< "$changed"
            else
              echo "::warning title=Benchmark gate::changed-file detection failed; running the gate"
            fi
          fi
          echo "RUN_GATE=$RUN_GATE" >> "$GITHUB_ENV"
          cp etc/scripts/ci/run_iai_subset.sh "$RUNNER_TEMP/run_iai_subset.sh"
          cp etc/scripts/ci/iai_compare.py "$RUNNER_TEMP/iai_compare.py"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      # A bench missing on the base commit (e.g. the PR that introduces it) must
      # not fail the run; it is reported as "new". Tree switches are not
      # continue-on-error: benchmarking the wrong commit would invalidate the run.
      - name: Switch tree to base commit
        shell: bash
        run: git checkout --force --detach "$BASE_SHA"

      - name: Run subset (base)
        continue-on-error: true
        shell: bash
        run: bash "$RUNNER_TEMP/run_iai_subset.sh" > "$RUNNER_TEMP/base.txt" 2>&1

      - name: Switch tree to head commit
        shell: bash
        run: git checkout --force --detach "$HEAD_SHA"

      - name: Run subset (head)
        continue-on-error: true
        shell: bash
        run: bash "$RUNNER_TEMP/run_iai_subset.sh" > "$RUNNER_TEMP/head.txt" 2>&1

      - name: Render comparison
        id: render
        shell: bash
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The gate result is held until the comment is posted, so a failing gate
          # still shows its numbers on the PR.
          gate_failed=false
          gate_args=(--gate build_loop/mainnet_block/off --gate build_loop/mainnet_block/enforce)
          [ "$RUN_GATE" = true ] || gate_args=()
          python3 "$RUNNER_TEMP/iai_compare.py" \
            --base "$RUNNER_TEMP/base.txt" \
            --head "$RUNNER_TEMP/head.txt" \
            --output "$RUNNER_TEMP/comment.md" \
            --run-url "$WORKFLOW_RUN_URL" \
            --threshold-pct 2 \
            "${gate_args[@]}" \
            --fail-pct 3 || gate_failed=true
          if [ "$RUN_GATE" != true ]; then
            printf '\nperf gate skipped: no relevant paths changed\n' >> "$RUNNER_TEMP/comment.md"
          fi
          echo "gate_failed=$gate_failed" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/comment.md" | tee -a "$GITHUB_STEP_SUMMARY"

      # Replace the in-progress comment with the results. Skip forked PRs because
      # their pull_request workflows cannot write comments with GITHUB_TOKEN.
      # Best-effort, like the in-progress comment: the gate below does not depend on it.
      - name: Post or update results on PR
        continue-on-error: true
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bash etc/scripts/ci/post_pr_comment.sh "$RUNNER_TEMP/comment.md"

      - name: Enforce benchmark gate
        if: always() && steps.render.outputs.gate_failed == 'true'
        shell: bash
        run: |
          echo "::error title=Benchmark gate::build_loop/mainnet_block regressed or produced no result; see the comparison above."
          exit 1

      # If any earlier step failed the in-progress comment would otherwise hang on
      # "running" forever; replace it with a failure notice pointing at the logs.
      # A failed gate already tried to post its results, so keep that comment.
      - name: Report failure on PR
        if: >
          failure() &&
          steps.render.outputs.gate_failed != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/failed.md" <<EOF
          <!-- iai-bench-results -->

          ⚠️ Benchmark run failed before producing results — see the [run log]($RUN_URL).
          EOF
          bash etc/scripts/ci/post_pr_comment.sh "$RUNNER_TEMP/failed.md"
