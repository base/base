[package]
name = "base-proposer-bin"
description = "Base Proposer Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-proposer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base-cli-utils = { workspace = true }
eyre = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }
base-proposer = { workspace = true, features = ["metrics"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
