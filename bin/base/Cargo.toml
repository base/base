[package]
name = "base"
description = "Unified Base node binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
base-cli-utils = { workspace = true }
base-node-core = { workspace = true }
base-batcher-cli = { workspace = true }
base-builder-cli = { workspace = true }
reth-cli-commands = { workspace = true }
eyre = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive"] }
base-consensus-driver-service = { workspace = true }
tokio = { workspace = true, features = ["default"] }
base-common-cli-support = { workspace = true, optional = true }
base-consensus-source-providers = { workspace = true }
alloy-chains = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "env"] }
figment = { workspace = true, features = ["env", "toml"] }
base-builder-core = { workspace = true, features = ["default"] }
base-consensus-cli = { workspace = true, features = ["default"] }
base-execution-cli = { workspace = true, features = ["default"] }
base-common-chain-activation = { workspace = true, features = ["default"] }
base-common-chain-config = {features = ["default", "std"], workspace = true}
base-execution-evm-blocks = {features = ["default", "std"], workspace = true}

[dev-dependencies]
url = { workspace = true }
base-common-chain-config = { workspace = true }
figment = { workspace = true, features = ["test"] }

[features]
jemalloc-prof = [
    "base-builder-core/jemalloc-prof",
    "base-execution-cli/jemalloc-symbols",
    "dep:base-common-cli-support",
    "base-common-cli-support/jemalloc-prof",
]
