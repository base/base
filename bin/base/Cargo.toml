[package]
name = "base"
description = "Unified Base node binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
base-cli-utils = { workspace = true }
base-batcher-cli = { workspace = true }
base-builder-cli = { workspace = true }
base-node-runner = { workspace = true }
reth-cli-commands = { workspace = true }
base-consensus-engine = { workspace = true }
base-consensus-providers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
eyre = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default"] }
reth-cli-util = { workspace = true, optional = true }
alloy-chains = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["default"] }
figment = { workspace = true, features = ["env", "toml"] }
clap = { workspace = true, features = ["default", "env"] }
base-builder-core = { workspace = true, features = ["default"] }
base-common-chains = { workspace = true, features = ["default"] }
base-consensus-cli = { workspace = true, features = ["default"] }
base-execution-cli = { workspace = true, features = ["default"] }
base-execution-evm = { workspace = true, features = ["default"] }
base-upgrade-signal = { workspace = true, features = ["default"] }
base-execution-chainspec = { workspace = true, features = ["default"] }
base-execution-consensus = { workspace = true, features = ["default"] }
[dev-dependencies]
url = { workspace = true }
base-common-genesis = { workspace = true }
figment = { workspace = true, features = ["test"] }

[features]
jemalloc-prof = [
    "base-builder-core/jemalloc-prof",
    "base-execution-cli/jemalloc-symbols",
    "dep:reth-cli-util",
    "reth-cli-util/jemalloc-prof",
]
