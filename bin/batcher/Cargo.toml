[package]
name = "base-batcher-bin"
description = "Base Batcher Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-batcher"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
humantime = { workspace = true }
base-protocol = { workspace = true }
base-cli-utils = { workspace = true }
base-tx-manager = { workspace = true }
base-batcher-core = { workspace = true }
base-common-network = { workspace = true }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
base-runtime = { workspace = true, features = ["tokio"] }
serde = { workspace = true, features = ["derive", "std"] }
alloy-primitives = { workspace = true, features = ["std"] }
base-batcher-encoder = { workspace = true, features = ["clap"] }
base-batcher-service = { workspace = true, features = ["metrics"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
