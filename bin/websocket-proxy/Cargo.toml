[package]
name = "base-bin-websocket-proxy"
description = "WebSocket Proxy Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
[[bin]]
name = "websocket-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
dotenvy = { workspace = true }
base-common-cli = { workspace = true }
axum = { workspace = true, features = ["ws"] }
brotli = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
ipnet = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
hostname = { workspace = true, features = ["default"] }
tokio-util = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-infra-websocket-proxy = { workspace = true, features = ["default"] }
base-common-observability-metrics = { workspace = true, features = ["metrics"] }
metrics-exporter-prometheus = { workspace = true, features = ["http-listener"] }
