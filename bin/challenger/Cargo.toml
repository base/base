[package]
name = "base-challenger-bin"
description = "Base Challenger Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-challenger"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eyre.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
reth-node-core = { workspace = true, features = ["otlp"] }
base-cli-utils = { workspace = true, features = ["otlp"] }
base-challenger = { workspace = true, features = ["metrics"] }
