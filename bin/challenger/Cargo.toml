[package]
name = "base-challenger-bin"
description = "Base Challenger Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-challenger"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base-common-cli = { workspace = true }
eyre = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-proof-service-challenger = { workspace = true, features = ["metrics"] }
