[package]
name = "base-load-tester-bin"
description = "Base Load Tester Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-load-tester"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
base-load-tests = { workspace = true }
alloy-primitives = { workspace = true }
base-common-cli-support = { workspace = true }
url = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
indicatif = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-common-client-ethereum = {workspace = true, features = ["default"]}
base-common-types-rpc = { workspace = true, features = ["serde", "std"] }
tokio = { workspace = true, features = ["default", "macros", "rt", "signal", "time"] }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "fmt"] }
