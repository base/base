[package]
name = "base-load-tester-bin"
description = "Base Load Tester Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-load-tester"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
alloy-network = { workspace = true }
base-cli-utils = { workspace = true }
base-load-tests = { workspace = true }
alloy-primitives = { workspace = true }
alloy-signer-local = { workspace = true }
url = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
indicatif = { workspace = true, features = ["default"] }
alloy-provider = { workspace = true, features = ["default"] }
alloy-rpc-types = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "fmt"] }
tokio = { workspace = true, features = ["default", "macros", "rt", "signal", "time"] }
