[package]
name = "base-shadow-metrics-bin"
version.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[[bin]]
name = "shadow-metrics"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
dotenvy = { workspace = true }
base-infra-shadow-metrics-service = { workspace = true }
base-common-cli-support = { workspace = true }
tracing = { workspace = true, features = ["std"] }
anyhow = { workspace = true, features = ["default"] }
axum = { workspace = true, features = ["tokio", "http1"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread", "net", "time", "signal"] }
