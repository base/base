[package]
name = "base-roxy-bin"
description = "Roxy JSON-RPC reverse proxy binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "roxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dotenvy = { workspace = true }
base-roxy = { workspace = true }
base-cli-utils = { workspace = true }
tokio-util = { workspace = true, features = ["default"] }
anyhow = { workspace = true, features = ["default", "std"] }
clap = { workspace = true, features = ["default", "derive", "env", "std"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
