[package]
name = "ingress-rpc"
version.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[[bin]]
name = "ingress-rpc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
dotenvy = { workspace = true }
jsonrpsee = { workspace = true }
base-bundles = { workspace = true }
base-cli-utils = { workspace = true }
base-observability-events = { workspace = true }
tracing = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default"] }
anyhow = { workspace = true, features = ["default"] }
alloy-provider = { workspace = true, features = ["default"] }
ingress-rpc-lib = { workspace = true, features = ["default"] }
audit-archiver-lib = { workspace = true, features = ["default"] }
base-common-rpc-types = { workspace = true, features = ["network"]}
