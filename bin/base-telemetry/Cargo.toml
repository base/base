[package]
name = "base-telemetry-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-telemetry"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
dotenvy = { workspace = true }
base-infra-telemetry-service = { workspace = true }
base-common-cli-support = { workspace = true }
tokio-util = { workspace = true, features = ["default"] }
anyhow = { workspace = true, features = ["default", "std"] }
clap = { workspace = true, features = ["default", "derive", "env", "std"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
