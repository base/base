[package]
name = "base-suppression-provision-bin"
description = "Provision compile-pinned MEV rollback and T4e simulation state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-mev-suppression-provision"
path = "main.rs"
required-features = ["provision"]

[[bin]]
name = "base-mev-t4e-provision"
path = "t4e.rs"
required-features = ["provision"]

[lints]
workspace = true

[dependencies]
mev-trader-submit = { workspace = true, optional = true, features = ["arm-provisioning"] }

[features]
provision = ["dep:mev-trader-submit"]
