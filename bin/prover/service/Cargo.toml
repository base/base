[package]
name = "base-prover-service-bin"
description = "Prover service JSON-RPC binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-prover-service"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
base-prover-service-db = { workspace = true }
base-common-cli-support = { workspace = true }
eyre = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["server"] }
serde = { workspace = true, features = ["derive", "std"] }
tokio = { workspace = true, features = ["default", "full"] }
base-prover-service = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-prover-service-protocol = { workspace = true, features = ["default", "rpc-server"] }
