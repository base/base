[package]
name = "base-prover-nitro-host"
description = "TEE prover host worker (AWS Nitro Enclaves)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-prover-nitro-host"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
base-common-cli = { workspace = true }
alloy-primitives = { workspace = true }
base-proof-service-client = { workspace = true }
eyre = { workspace = true, features = ["default"] }
tokio-util = { workspace = true, features = ["default"] }
uuid = { workspace = true, features = ["default", "v4"] }
serde = { workspace = true, features = ["derive", "std"] }
tokio = { workspace = true, features = ["default", "full"] }
base-proof-host = { features = ["metrics"], workspace = true }
base-proof-tee-nitro-enclave = { workspace = true, optional = true }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-common-chain-config = { workspace = true, features = ["default"] }
base-proof-tee-nitro-host = { workspace = true, features = ["metrics"] }

[target.'cfg(target_os = "linux")'.dependencies]
base-proof-tee-nitro-enclave = { workspace = true }

[features]
local = ["dep:base-proof-tee-nitro-enclave"]
