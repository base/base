[package]
name = "base-proof-tee-registrar-bin"
description = "Automated TEE prover signer registration service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-proof-tee-registrar"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Internal
base-tx-manager.workspace = true
base-proof-tee-registrar.workspace = true
base-proof-tee-nitro-attestation-prover.workspace = true

# Alloy
alloy-primitives.workspace = true
alloy-signer-local.workspace = true
alloy-provider.workspace = true

# AWS
aws-config = { workspace = true, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ec2.workspace = true
aws-sdk-elasticloadbalancingv2.workspace = true

# CLI / runtime
hex.workspace = true
url.workspace = true
eyre.workspace = true
humantime.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "env"] }

[dev-dependencies]
rstest.workspace = true
