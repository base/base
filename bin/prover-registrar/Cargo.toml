[package]
name = "base-proof-tee-registrar-bin"
description = "Automated TEE prover signer registration service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-proof-tee-registrar"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
humantime = { workspace = true }
base-cli-utils = { workspace = true }
base-tx-manager = { workspace = true }
alloy-primitives = { workspace = true }
base-common-network = { workspace = true }
url = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-proof-tee-registrar = { workspace = true, features = ["metrics"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
