[package]
name = "base-reth-node"
description = "Base Reth Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-reth-node"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# workspace
base-cli-utils.workspace = true

# reth
base-reth-cli.workspace = true
reth-cli-util = { workspace = true, optional = true }
rustfs-mimalloc = { workspace = true, optional = true }
base-execution-cli = { workspace = true, features = ["otlp"] }

# cli
clap.workspace = true

[features]
default = [ "asm-keccak", "keccak-cache-global", "mimalloc" ]
asm-keccak = [ "base-execution-cli/asm-keccak" ]
keccak-cache-global = [ "base-execution-cli/keccak-cache-global" ]
mimalloc = [ "dep:rustfs-mimalloc" ]
jemalloc = [
	"base-execution-cli/jemalloc",
	"dep:reth-cli-util",
	"reth-cli-util/jemalloc",
]
jemalloc-prof = [
	"base-execution-cli/jemalloc-symbols",
	"jemalloc",
	"reth-cli-util/jemalloc-prof",
]
