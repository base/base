[package]
name = "base-reth-node"
description = "Base Reth Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-reth-node"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# workspace
base-cli-utils.workspace = true

# reth
base-reth-cli.workspace = true
reth-cli-util.workspace = true
base-execution-cli = { workspace = true, features = ["otlp"] }

# cli
clap.workspace = true

[features]
b5-dormant-presign = [ "base-execution-cli/b5-dormant-presign" ]
default = [ "jemalloc" ]
edge-measurement = [ "base-execution-cli/edge-measurement" ]
jemalloc = [ "base-execution-cli/jemalloc", "reth-cli-util/jemalloc" ]
t4a-shadow = [ "base-execution-cli/t4a-shadow" ]
t4b-shadow = [ "base-execution-cli/t4b-shadow" ]
t4d-shadow = [ "base-execution-cli/t4d-shadow" ]
