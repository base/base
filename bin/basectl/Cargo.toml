[package]
name = "base-bin-basectl"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "basectl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base-infra-basectl-service = { workspace = true }
anyhow = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive"] }
rustls = { workspace = true, features = ["default", "ring"] }
tokio = { workspace = true, features = ["default", "rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "fmt"] }
