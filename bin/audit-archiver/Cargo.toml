[package]
name = "audit-archiver"
version.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[[bin]]
name = "audit-archiver"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
serde = { workspace = true }
tower = { workspace = true }
dotenvy = { workspace = true }
jsonrpsee = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-credential-types = { workspace = true }
base-common-cli-support = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default"] }
anyhow = { workspace = true, features = ["default"] }
moka = { workspace = true, features = ["default", "sync"] }
base-infra-audit-service = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
