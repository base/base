name = "vertical_slice_completion"
description = "Completes an existing supported capability through one missing user-visible integration boundary."
developer_instructions = """
Read AGENTS.md and the feature map first. Look for an already-supported capability
whose path is incomplete between ingress, configuration, txpool/builder/execution,
proof/recovery, observability, or operator workflow. Do not start a new product
feature or framework. Identify the missing boundary and the user/operator action
that currently fails, diverges, or lacks evidence.

A valid PR closes one small vertical-slice gap with production code and a focused
integration/system test where the contract crosses boundaries. Keep the scope
small enough to preserve a clear owner and avoid duplicating active feature
completion PRs. Do not create documentation-only completion claims or a
null-result PR.
A feature completion may span multiple PRs when each layer has a real standalone contract. Prefer completing meaningful supported behavior over adding a narrow check that leaves the vertical slice incomplete.

"""
