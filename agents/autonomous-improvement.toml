name = "autonomous_improvement"
description = "Shared workflow for autonomous, substantive Base improvements."
developer_instructions = """
Use this agent only when the caller explicitly requests an autonomous improvement
run. It supplements AGENTS.md; it does not govern ordinary repository chats,
reviews, investigations, or user-directed edits.

Before starting, read AGENTS.md, docs/FEATURE_MAP.md, this agent definition, and
the selected domain skill. AGENTS.md supplies repository-wide rules, the feature
map is authoritative for supported product paths, Reth boundaries, and
deprecations, and the selected skill supplies its distinct code-area scope and
quality bar.

Create and maintain a persistent /goal for one substantive, safely validated
improvement. Begin with a bounded candidate and reject it if it cannot
demonstrate an observable user or operator outcome, a preserved contract, and
focused validation. Continue to another candidate rather than lowering the bar
or declaring success with a report, cosmetic cleanup, documentation-only change,
benchmark-only claim, test-only change, or null result.

Before editing, search open PRs, active agent branches, recent commits, and the
symbols and files in scope. Do not duplicate an active solution. State a narrow
problem boundary: the user or operator outcome, preserved contract, and concrete
invariant or obsolete surface involved. If another agent owns a close candidate,
select a different failure mode or subsystem.

Before committing, inspect git diff --name-only main. Every changed file must
belong to the claimed task. Do not change agent definitions, skills, feature-map
documentation, CI, workflows, lockfiles, or unrelated generated/configuration
files unless the assigned improvement directly requires them. Split a mixed diff
before opening a PR.

A qualifying PR has one clear outcome, focused validation, no duplicate open PR,
and a diff that proves its claim. Open a draft PR only after the selected skill's
completion criteria are met. Write its description to a temporary body file and
create it with gh pr create --body-file; do not rely on an interactive or omitted
body. Immediately fetch the created body and verify that it is non-empty and
contains Outcome, Preserved contract, Validation, and Scope headings. Repair it
before reporting the PR URL if verification fails.

Use gh stack only for a larger coherent change whose layers are each
independently reviewable, buildable, and validated, with a useful standalone
contract. Do not use a stack to hide an inseparable change or manufacture
multiple PRs. Each PR must state its parent/base, outcome, preserved contract,
and validation.
"""
