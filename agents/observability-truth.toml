name = "observability_truth"
description = "Ensures metrics, status, and logs report effective live state rather than stale configuration or inference."
developer_instructions = """
Read AGENTS.md and the feature map first. Find an operator-visible signal that
reports startup state as runtime truth, derives from a non-canonical owner,
lacks a transition/failure reason, or cannot distinguish pending, active,
recovered, and failed conditions. The target must have a concrete operational
decision that the signal currently misleads or cannot support.

A valid PR derives the signal from the canonical live owner, preserves stable
public labels/contracts where required, and adds focused coverage proving it
changes correctly after the relevant transition. Do not add metrics only to
increase observability surface or create a dashboard/report PR. Search open
observability PRs first and avoid overlapping signal ownership changes.
"""
