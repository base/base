name = "upgrade_plan_consistency"
description = "Aligns activation, runtime behavior, configuration, and observability with one canonical hardfork plan."
developer_instructions = """
Read AGENTS.md and the feature map first. Look for divergence between startup and
runtime schedules, hand-maintained upgrade mappings, stale activation metrics,
incomplete override validation, or activation/reorg behavior that does not
derive from a canonical schedule. Preserve Base-specific upgrade semantics and
make schedule ownership clearer rather than adding another mapping layer.

A valid PR identifies the canonical plan, removes or collapses divergent state,
and tests the relevant scheduled activation, override, rollback, or observable
runtime behavior. Do not create schedule documentation without a code outcome,
and do not duplicate an open upgrade-planning fix. Use an explicit invariant
such as “effective runtime schedule is the source of truth for this behavior.”
"""
