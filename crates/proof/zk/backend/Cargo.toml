[package]
name = "base-proof-zk-backend"
description = "ZK proving backends for prover-service workers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# base
base-l1-head.workspace = true
base-metrics.workspace = true
base-proof-host.workspace = true
base-proof-zk-host.workspace = true
base-proof-zk-utils.workspace = true
base-proof-zk-witness.workspace = true
base-proof-succinct-elfs.workspace = true
base-prover-service-protocol.workspace = true

# network
url.workspace = true
tonic.workspace = true
alloy-contract.workspace = true
alloy-consensus.workspace = true
alloy-sol-types.workspace = true
alloy-primitives.workspace = true

# sp1
sp1-prover-types.workspace = true
sp1-cluster-utils.workspace = true
sp1-cluster-common.workspace = true
sp1-cluster-artifact.workspace = true
sp1-sdk = { workspace = true, features = ["network", "blocking", "profiling"] }

# async
backoff.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# error handling
anyhow.workspace = true
thiserror.workspace = true

# serialization
rkyv.workspace = true
serde_json.workspace = true
serde_cbor.workspace = true
bincode = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive", "std"] }

# observability
tracing.workspace = true

[dev-dependencies]
base-proof-zk-utils = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = [ "metrics" ]
# Declared so `base_metrics::timed!`/`time!` enable real timers in this crate.
metrics = [ "base-metrics/metrics", "base-proof-host/metrics" ]
