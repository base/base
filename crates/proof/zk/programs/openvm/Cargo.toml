# Sub-workspace for the OpenVM zkVM guest program (range).
#
# Built separately via `just openvm build-elf` (which shells out to
# `cargo openvm build` with the `riscv32im-risc0-zkvm-elf` target).

[workspace]
resolver = "2"
members = [
  "range/ethereum",
  "range/utils",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
homepage = "https://github.com/base/base"
repository = "https://github.com/base/base"

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"
unnameable-types = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Internal members
base-proof-openvm-range-utils = { path = "range/utils" }
base-proof = { path = "../../../proof", default-features = false }
base-proof-zk-utils = { path = "../../utils" }

# OpenVM (must match the cargo-openvm tag)
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-ecc-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-keccak256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0", default-features = false }
openvm-pairing = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0", default-features = false }
# Blob and point-evaluation KZG on the BLS12-381 pairing extension.
openvm-kzg = { git = "https://github.com/mw2000/openvm-kzg.git", rev = "5f83ed6ea86610a18c8b5b6c367bedfdbc679953" }

# revm (must match root Cargo.toml versions)
revm-precompile = { version = "43.0.3", default-features = false }

# alloy (must match root Cargo.toml versions)
alloy-sol-types = { version = "1.6.1", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false }

# misc (must match root Cargo.toml versions)
rkyv = "0.8"
anyhow = "1.0"
tracing = { version = "0.1.43", default-features = false }
tracing-subscriber = "0.3.22"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[patch.crates-io]
# OpenVM forks that route curve arithmetic to the `ecc` extension, so tx sender
# recovery and the ecrecover / P256VERIFY precompiles run as intrinsics.
k256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
p256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
