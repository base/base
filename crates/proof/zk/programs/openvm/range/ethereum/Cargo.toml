[package]
name = "range"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
rkyv.workspace = true
# The default bump allocator never frees, and real blocks exhaust the 512 MiB
# guest address space.
openvm = { workspace = true, features = ["std", "heap-embedded-alloc"] }
# `openvm::init!` expands to moduli, complex, and curve setup from these crates.
openvm-ecc-guest.workspace = true
openvm-algebra-guest.workspace = true
# Declares the BN254 and BLS12-381 moduli that `openvm.toml` enables.
openvm-pairing = { workspace = true, features = ["bn254", "bls12_381"] }
# Provides the `native_keccak256` symbol that alloy's `native-keccak` links to.
openvm-keccak256.workspace = true
alloy-primitives = { workspace = true, features = ["native-keccak"] }

# base-consensus / base-proof
# EIP-8130 execution without Tokio (`base-proof/std` pulls Tokio).
base-proof = { workspace = true, features = ["evm-std"] }

# base zk guest helpers
base-proof-zk-utils.workspace = true
base-proof-openvm-range-utils.workspace = true

# `tracing-subscriber` feature dependencies
tracing-subscriber = { workspace = true, optional = true }

[features]
tracing-subscriber = [ "dep:tracing-subscriber" ]

[lints]
workspace = true
