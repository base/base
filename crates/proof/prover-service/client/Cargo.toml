[package]
name = "base-prover-service-client"
description = "Role-specific JSON-RPC clients for the Base prover service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
base-retry.workspace = true

base-prover-service-protocol = { workspace = true, features = ["rpc-client"] }

jsonrpsee = { workspace = true, features = ["http-client"] }

backon.workspace = true
async-trait.workspace = true

url.workspace = true

thiserror.workspace = true

tracing.workspace = true

[dev-dependencies]
base-prover-service-protocol = { workspace = true, features = ["rpc-server"] }

jsonrpsee = { workspace = true, features = ["server"] }

tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

chrono.workspace = true

rstest.workspace = true

[lints]
workspace = true
