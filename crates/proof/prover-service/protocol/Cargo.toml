[package]
name = "base-prover-service-protocol"
description = "Protocol types and JSON-RPC traits for the Base prover service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
jsonrpsee = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["default", "v5"] }
alloy-primitives = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["default", "serde"] }
base-proof-primitives = { workspace = true, features = ["serde"] }
[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
[lints]
workspace = true

[features]
default = []
rpc-client = [ "dep:jsonrpsee", "jsonrpsee/http-client", "jsonrpsee/macros" ]
rpc-server = [ "dep:jsonrpsee", "jsonrpsee/macros", "jsonrpsee/server" ]
