[package]
name = "base-proof-execution"
description = "Base fault-proof execution, derivation driver, and witness-oracle client"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["getrandom"]

[dependencies]
ark-ff = { workspace = true }
tracing = { workspace = true }
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-trie = { workspace = true }
async-trait = { workspace = true }
alloy-genesis = { workspace = true }
base-consensus-batch = { workspace = true }
base-consensus-derive = { workspace = true }
base-proof-witness-mpt = { workspace = true }
c-kzg = { workspace = true, optional = true }
base-execution-evm-runtime = { workspace = true }
base-proof-witness-preimage = { workspace = true }
lru = { workspace = true, features = ["default"] }
serde_json = { workspace = true, optional = false }
spin = { workspace = true, features = ["default"] }
alloy-transport = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["rlp"] }
getrandom_0_2_17 = { workspace = true, features = ["custom"] }
ark-bls12-381 = { workspace = true, features = ["scalar_field"] }
base-common-types-chain = { workspace = true, features = ["k256"] }
rand = { workspace = true, optional = true, features = ["default"] }
serde = { workspace = true, optional = false, features = ["derive"] }
rocksdb = { workspace = true, features = ["snappy"], optional = true }
tempfile = { workspace = true, optional = true, features = ["default"] }
tokio = { features = ["default", "full"], optional = true, workspace = true }
base-common-types-payload = { workspace = true, features = ["k256", "serde"] }
base-common-chain-config = { workspace = true, features = ["default", "serde"] }
alloy-rpc-client = { workspace = true, optional = true, features = ["default"] }
alloy-transport-http = { workspace = true, optional = true, features = ["default"] }
base-common-client-ethereum = { workspace = true, features = ["default", "reqwest"], optional = true }

[dev-dependencies]
rayon = { workspace = true }
c-kzg = { workspace = true, features = [] }
rand = { workspace = true, features = ["default"] }
rstest = { workspace = true, features = ["default"] }
alloy-eips = { workspace = true, features = ["kzg"] }
tokio = { workspace = true, features = ["default", "full"] }

[features]
std = [
    "base-common-types-chain/std",
    "alloy-eips/std",
    "base-execution-evm-runtime/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "base-common-types-payload/std",
    "alloy-trie/std",
    "base-common-chain-config/std",
    "base-proof-witness-mpt/std",
    "base-consensus-batch/std",
    "getrandom_0_2_17/std",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
    "tracing/std",
    "spin/std",
    "alloy-eips/kzg",
    "alloy-genesis/std",
    "ark-bls12-381/std",
    "ark-ff/std",
    "base-proof-witness-preimage/std",
    "c-kzg?/std",
    "dep:c-kzg",
    "dep:tokio",
]
test-utils = [
    "base-common-chain-config/test-utils",
    "base-consensus-batch/test-utils",
    "dep:base-common-client-ethereum",
    "dep:alloy-rpc-client",
    "dep:alloy-transport",
    "dep:alloy-transport-http",
    "dep:rand",
    "dep:rocksdb",
    "dep:tempfile",
    "dep:tokio",
    "std",
    "base-common-chain-config/serde",
]
evm-std = ["base-execution-evm-runtime/std"]
