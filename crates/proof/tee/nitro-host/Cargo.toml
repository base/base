[package]
name = "base-proof-tee-nitro-host"
description = "Host-side TEE proving backend for AWS Nitro Enclaves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tower = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
base-common-observability-health = { workspace = true }
alloy-signer = { workspace = true }
base-proof-host = { workspace = true }
alloy-primitives = { workspace = true }
base-proof-worker = { workspace = true }
base-proof-witness-preimage = { workspace = true }
base-proof-contracts = { workspace = true }
base-prover-service-client = { workspace = true }
url = { workspace = true, features = ["default"] }
base-proof-tee-nitro-enclave = { workspace = true }
eyre = { workspace = true, features = ["default"] }
chrono = { workspace = true, features = ["default"] }
tokio-util = { workspace = true, features = ["default"] }
k256 = { workspace = true, features = ["default", "ecdsa"] }
jsonrpsee = { workspace = true, features = ["server", "macros"] }
base-prover-service-protocol = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "rt", "time", "io-util", "net"] }
base-proof-primitives = { workspace = true, features = ["std", "serde", "rpc-server"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { workspace = true }
[dev-dependencies]
alloy-genesis = { workspace = true }
reqwest = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "macros", "rt"] }
base-common-chain-config = { workspace = true, features = ["serde", "std"] }

[features]
metrics = [ "base-proof-host/metrics" ]
