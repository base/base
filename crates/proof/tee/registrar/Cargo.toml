[package]
name = "base-proof-tee-registrar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Alloy
alloy-signer.workspace = true
alloy-provider = { workspace = true, optional = true }
alloy-sol-types.workspace = true
alloy-primitives.workspace = true

# AWS
aws-sdk-ec2 = { workspace = true, optional = true }
aws-sdk-elasticloadbalancingv2 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true, features = ["default-https-client", "rt-tokio"] }

# Crypto
sha2.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }
p384 = { workspace = true, features = ["ecdsa", "expose-field"] }

# X.509 / CRL
x509-parser.workspace = true

# CBOR (attestation document decode after strict COSE parse)
ciborium.workspace = true

# HTTP (CRL fetching)
reqwest.workspace = true

# Contracts
base-proof-contracts.workspace = true

# Attestation parsing and validation
base-proof-tee-nitro-verifier.workspace = true

# Transaction management
base-tx-manager.workspace = true

# RPC
jsonrpsee = { workspace = true, features = ["http-client", "server"] }
base-proof-primitives = { workspace = true, features = ["rpc-client"] }

# Async
futures.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "net", "time", "macros"] }

# Error
thiserror.workspace = true

# CLI
base-cli-utils = { workspace = true, optional = true }

# Metrics
base-metrics.workspace = true
base-balance-monitor = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }

# TLS
rustls = { workspace = true, optional = true, features = ["ring"] }

# Health
base-health = { workspace = true, optional = true, features = ["axum-server"] }

# Tracing
tracing.workspace = true

# Misc
url.workspace = true
hex.workspace = true

[dev-dependencies]
hex-literal.workspace = true
async-trait.workspace = true
alloy-consensus.workspace = true
alloy-rpc-types-eth.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[features]
default = [ "service" ]
# AWS target-group discovery and the registrar service runtime. Turn off to use
# only the attestation planner, hints, and parsing without the AWS SDKs.
service = [
	"dep:alloy-provider",
	"dep:aws-config",
	"dep:aws-sdk-ec2",
	"dep:aws-sdk-elasticloadbalancingv2",
	"dep:base-balance-monitor",
	"dep:base-cli-utils",
	"dep:base-health",
	"dep:rustls",
]
metrics = [ "base-metrics/metrics", "base-tx-manager/metrics", "dep:metrics" ]
