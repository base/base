[package]
name = "base-proof-tee-registrar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-signer.workspace = true
alloy-provider.workspace = true
alloy-sol-types.workspace = true
alloy-primitives.workspace = true

aws-sdk-ec2.workspace = true
aws-sdk-elasticloadbalancingv2.workspace = true
aws-config = { workspace = true, features = ["default-https-client", "rt-tokio"] }

sha2.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }
p384 = { workspace = true, features = ["ecdsa", "expose-field"] }

x509-parser.workspace = true

ciborium.workspace = true

reqwest.workspace = true

base-proof-contracts.workspace = true

base-proof-tee-nitro-verifier.workspace = true

base-tx-manager.workspace = true

jsonrpsee = { workspace = true, features = ["http-client", "server"] }
base-proof-primitives = { workspace = true, features = ["rpc-client"] }

futures.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "net", "time", "macros"] }

thiserror.workspace = true

base-cli-utils.workspace = true

base-metrics.workspace = true
base-balance-monitor.workspace = true
metrics = { workspace = true, optional = true }

rustls = { workspace = true, features = ["ring"] }

base-health = { workspace = true, features = ["axum-server"] }

tracing.workspace = true

url.workspace = true
hex.workspace = true

[dev-dependencies]
hex-literal.workspace = true
async-trait.workspace = true
alloy-consensus.workspace = true
alloy-transport.workspace = true
tracing-subscriber.workspace = true
alloy-rpc-types-eth.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[features]
metrics = [ "base-metrics/metrics", "base-tx-manager/metrics", "dep:metrics" ]
