[package]
name = "base-proof-tee-nitro-verifier"
description = "Pure verification logic for AWS Nitro Enclave attestation documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sha2 = { workspace = true }
thiserror = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-primitives = { workspace = true }
serde = { workspace = true, features = ["derive"] }
ciborium = { workspace = true, features = ["default"] }
serde_bytes = { workspace = true, features = ["default"] }
x509-parser = { workspace = true, features = ["default"] }
p384 = { workspace = true, features = ["default", "ecdsa"] }
[dev-dependencies]
hex = { workspace = true, features = ["default"] }
rstest = { workspace = true, features = ["default"] }
