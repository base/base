[package]
name = "base-proof"
description = "Base Proof SDK"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
base-protocol.workspace = true
base-proof-mpt.workspace = true
base-proof-driver.workspace = true
base-proof-executor.workspace = true
base-proof-preimage.workspace = true
base-common-chains.workspace = true
base-consensus-derive.workspace = true
base-common-genesis = { workspace = true, features = ["serde"] }

alloy-rlp.workspace = true
alloy-eips.workspace = true
alloy-trie.workspace = true
alloy-genesis.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true

base-common-consensus.workspace = true
base-common-rpc-types-engine.workspace = true

alloy-evm.workspace = true
base-common-evm.workspace = true

lru.workspace = true
spin.workspace = true
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde_json.workspace = true
async-trait.workspace = true

ark-ff.workspace = true
ark-bls12-381 = { workspace = true, features = ["scalar_field"] }

c-kzg = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }

[dev-dependencies]
rand.workspace = true
rayon.workspace = true
rstest.workspace = true
c-kzg = { workspace = true, features = [] }
tokio = { workspace = true, features = ["full"] }
alloy-eips = { workspace = true, features = ["kzg"] }

[features]
std = [
	"alloy-consensus/std",
	"alloy-eips/kzg",
	"alloy-eips/std",
	"alloy-evm/std",
	"alloy-genesis/std",
	"alloy-primitives/std",
	"alloy-rlp/std",
	"alloy-trie/std",
	"ark-bls12-381/std",
	"ark-ff/std",
	"base-common-chains/std",
	"base-common-consensus/std",
	"base-common-evm/std",
	"base-common-genesis/std",
	"base-common-rpc-types-engine/std",
	"base-proof-driver/std",
	"base-proof-executor/std",
	"base-proof-mpt/std",
	"base-proof-preimage/std",
	"base-protocol/std",
	"c-kzg?/std",
	"dep:c-kzg",
	"dep:tokio",
	"serde/std",
	"serde_json/std",
	"spin/std",
	"thiserror/std",
	"tracing/std",
]
# Base transactions without Tokio. Off in guests until Everest; do not pair with `metrics`.
evm-std = [ "base-common-evm/std" ]
