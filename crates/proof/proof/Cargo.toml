[package]
name = "base-proof"
description = "Base Proof SDK"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
ark-ff = { workspace = true }
tracing = { workspace = true }
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-trie = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
alloy-genesis = { workspace = true }
base-proof-mpt = { workspace = true }
alloy-primitives = { workspace = true }
base-proof-driver = { workspace = true }
base-proof-executor = { workspace = true }
base-proof-witness-preimage = { workspace = true }
c-kzg = { workspace = true, optional = true }
base-common-types-chain = { workspace = true }
base-execution-evm-runtime = {workspace = true}
base-common-types-payload = { workspace = true }
base-consensus-batch-types = { workspace = true }
base-execution-evm-machine = { workspace = true }
lru = { workspace = true, features = ["default"] }
spin = { workspace = true, features = ["default"] }
base-consensus-derive-pipeline = { workspace = true }
ark-bls12-381 = { workspace = true, features = ["scalar_field"] }
tokio = { workspace = true, features = ["default", "full"], optional = true }
base-common-chain-config = {workspace = true, features = ["default", "serde"]}

[dev-dependencies]
rayon = { workspace = true }
c-kzg = { workspace = true, features = [] }
rand = { workspace = true, features = ["default"] }
alloy-eips = { workspace = true, features = ["kzg"] }
rstest = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }

[features]
std = [
    "base-common-types-chain/std",
    "alloy-eips/kzg",
    "alloy-eips/std",
    "base-execution-evm-runtime/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "alloy-trie/std",
    "ark-bls12-381/std",
    "ark-ff/std",
    "base-common-chain-config/std",
    "base-common-types-payload/std",
    "base-proof-driver/std",
    "base-proof-executor/std",
    "base-proof-mpt/std",
    "base-proof-witness-preimage/std",
    "base-consensus-batch-types/std",
    "c-kzg?/std",
    "dep:c-kzg",
    "dep:tokio",
    "serde/std",
    "serde_json/std",
    "spin/std",
    "thiserror/std",
    "tracing/std",
]
# EIP-8130 execution in the EVM without Tokio (`std` pulls Tokio).
# Bare-metal FPVM builds (`check-no-std-proof`) leave this off.
evm-std = ["base-execution-evm-runtime/std"]
