[package]
name = "base-proof"
description = "Base Proof SDK"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
revm = {workspace = true}
serde = { workspace = true }
ark-ff = { workspace = true }
tracing = { workspace = true }
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-trie = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
base-protocol = { workspace = true }
alloy-genesis = { workspace = true }
base-proof-mpt = { workspace = true }
alloy-consensus = { workspace = true }
base-common-evm = { workspace = true }
base-evm-context = { workspace = true }
alloy-primitives = { workspace = true }
base-evm-handler = { workspace = true }
base-proof-driver = { workspace = true }
base-proof-executor = { workspace = true }
base-proof-preimage = { workspace = true }
base-consensus-derive = { workspace = true }
base-common-consensus = { workspace = true }
c-kzg = { workspace = true, optional = true }
lru = { workspace = true, features = ["default"] }
base-common-rpc-types-engine = { workspace = true }
spin = { workspace = true, features = ["default"] }
base-common-genesis = { workspace = true, features = ["serde"] }
ark-bls12-381 = { workspace = true, features = ["scalar_field"] }
base-common-chains = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"], optional = true }
[dev-dependencies]
rayon = { workspace = true }
c-kzg = { workspace = true, features = [] }
rand = { workspace = true, features = ["default"] }
alloy-eips = { workspace = true, features = ["kzg"] }
rstest = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }

[features]
std = [
    "alloy-consensus/std",
    "alloy-eips/kzg",
    "alloy-eips/std",
    "base-evm-handler/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "alloy-trie/std",
    "ark-bls12-381/std",
    "ark-ff/std",
    "base-common-chains/std",
    "base-common-consensus/std",
    "base-common-evm/std",
    "base-common-genesis/std",
    "base-common-rpc-types-engine/std",
    "base-proof-driver/std",
    "base-proof-executor/std",
    "base-proof-mpt/std",
    "base-proof-preimage/std",
    "base-protocol/std",
    "c-kzg?/std",
    "dep:c-kzg",
    "dep:tokio",
    "serde/std",
    "serde_json/std",
    "spin/std",
    "thiserror/std",
    "tracing/std",
]
# EIP-8130 execution in the EVM without Tokio (`std` pulls Tokio).
# Bare-metal FPVM builds (`check-no-std-proof`) leave this off.
evm-std = [ "base-common-evm/std" ]
