[package]
name = "base-proof-succinct-host-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
# sp1
sp1-sdk = { workspace = true, features = ["network", "blocking", "profiling"] }

# local
base-proof-zk-utils.workspace = true
base-proof-zk-witness.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-contract.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true

# general
anyhow.workspace = true
bincode = { workspace = true, features = ["serde"] }
metrics.workspace = true
metrics-exporter-prometheus = { workspace = true, features = ["http-listener"] }
metrics-process = { workspace = true, features = ["metrics-rs"] }
num-format.workspace = true
rkyv.workspace = true
serde.workspace = true
serde_cbor.workspace = true
strum.workspace = true
tracing.workspace = true
lazy_static.workspace = true

# cargo metadata
cargo_metadata.workspace = true

# logging and telemetry
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["logs", "trace"] }
opentelemetry-otlp = { workspace = true, features = ["logs", "grpc-tonic"] }
opentelemetry-appender-tracing.workspace = true

[lints]
workspace = true

[features]
default = [ "ansi" ]
ansi = []
