[package]
name = "base-proof-witness-preimage"
description = "Bindings and types for interacting with the PreimageOracle ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
alloy-primitives = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
async-channel = { workspace = true, optional = true, features = ["default"] }
[dev-dependencies]
tokio = { workspace = true, features = ["default", "full"] }

[features]
default = []
std = [
    "alloy-primitives/std",
    "dep:async-channel",
    "serde?/std",
    "thiserror/std",
    "tracing/std",
]
serde = ["alloy-primitives/serde", "dep:serde"]
