[package]
name = "base-proof-rpc"
description = "Shared RPC client abstractions for Base L1, L2, and rollup node interactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
serde_json = { workspace = true }
base-retry = { workspace = true }
async-trait = { workspace = true }
alloy-network = { workspace = true }
alloy-transport = { workspace = true }
alloy-primitives = { workspace = true }
base-optimism-rpc = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
url = { workspace = true, features = ["default"] }
backon = { workspace = true, features = ["default"] }
alloy-provider = { workspace = true, features = ["default"] }
moka = { workspace = true, features = ["default", "future"] }
alloy-rpc-client = { workspace = true, features = ["default"] }
base-common-genesis = { workspace = true, features = ["serde"] }
alloy-transport-http = { workspace = true, features = ["default"] }
base-common-rpc-types = { workspace = true, features = ["default", "network"] }
[dev-dependencies]
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread", "test-util"] }
