[package]
name = "base-proof-service-client"
description = "Role-specific JSON-RPC clients for the Base prover service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
base-common-runtime-tasks = { workspace = true }
url = { workspace = true, features = ["default"] }
backon = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["http-client"] }
base-proof-service-protocol = { workspace = true, features = ["default", "rpc-client"] }

[dev-dependencies]
chrono = { workspace = true, features = ["default"] }
rstest = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
base-proof-service-protocol = { workspace = true, features = ["default", "rpc-server"] }

[lints]
workspace = true
