[package]
name = "base-proof-client"
description = "Shared RPC client abstractions for Base L1, L2, and rollup node interactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
metrics = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
alloy-transport = { workspace = true }
alloy-primitives = { workspace = true }
base-common-runtime = { workspace = true }
base-common-client-rollup = { workspace = true }
url = { workspace = true, features = ["default"] }
backon = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["http-client"] }
moka = { workspace = true, features = ["default", "future"] }
alloy-rpc-client = { workspace = true, features = ["default"] }
alloy-transport-http = { workspace = true, features = ["default"] }
base-common-types-rpc = { workspace = true, features = ["default"] }
base-common-chain-config = { workspace = true, features = ["serde"] }
base-common-client-ethereum = { workspace = true, features = ["default"] }
base-proof-service-protocol = { workspace = true, features = ["default", "rpc-client"] }

[dev-dependencies]
chrono = { workspace = true, features = ["default"] }
rstest = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["server"] }
base-proof-service-protocol = { workspace = true, features = ["default", "rpc-server"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread", "test-util"] }
