[package]
name = "base-proof-client"
description = "Proof client types for the Base proof program"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
base-proof = { workspace = true }
alloy-primitives = { workspace = true }
base-proof-execution-client = {workspace = true}
base-proof-witness-preimage = { workspace = true }
base-common-types-chain = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-evm-runtime = {workspace = true}
base-consensus-batch-types = { workspace = true }
base-execution-evm-machine = { workspace = true }
spin = { workspace = true, features = ["default"] }
base-consensus-derive-pipeline = { workspace = true }

[dev-dependencies]
rstest = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }

[features]
std = ["base-common-types-chain/std", "base-execution-evm-runtime/std", "alloy-primitives/std", "base-common-chain-config/std", "base-proof-execution-client/std", "base-proof-witness-preimage/std", "base-proof/std", "base-consensus-batch-types/std", "spin/std", "thiserror/std", "tracing/std"]
