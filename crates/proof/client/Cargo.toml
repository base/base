[package]
name = "base-proof-client"
description = "Proof client types for the Base proof program"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
base-proof = { workspace = true }
base-protocol = { workspace = true }
base-common-evm = { workspace = true }
base-evm-handler = { workspace = true }
base-evm-context = { workspace = true }
alloy-primitives = { workspace = true }

base-proof-driver = { workspace = true }
base-proof-executor = { workspace = true }
base-proof-preimage = { workspace = true }
base-common-genesis = { workspace = true }
base-common-types-chain = { workspace = true }
base-consensus-derive = { workspace = true }
spin = { workspace = true, features = ["default"] }
[dev-dependencies]
rstest = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }

[features]
std = [
    "base-common-types-chain/std",
    "base-evm-handler/std",
    "alloy-primitives/std",
    "base-common-types-chain/std",
    "base-common-evm/std",
    "base-common-genesis/std",
    "base-proof-driver/std",
    "base-proof-executor/std",
    "base-proof-preimage/std",
    "base-proof/std",
    "base-protocol/std",
    "spin/std",
    "thiserror/std",
    "tracing/std",
]
