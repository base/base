[package]
name = "base-proof-submission"
description = "Shared proof submission helpers for Base dispute games"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives.workspace = true
alloy-rpc-types-eth.workspace = true

base-tx-manager.workspace = true

base-proof-contracts.workspace = true
base-proof-primitives = { workspace = true, optional = true }

bincode = { workspace = true, optional = true, features = ["serde"] }

thiserror.workspace = true

[dev-dependencies]
sp1-sdk.workspace = true
alloy-consensus.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[features]
snark-receipt = [ "dep:base-proof-primitives", "dep:bincode" ]
test-utils = [ "snark-receipt" ]
