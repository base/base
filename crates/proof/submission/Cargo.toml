[package]
name = "base-proof-submission"
description = "Shared proof submission helpers for Base dispute games"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Alloy
alloy-primitives.workspace = true
alloy-rpc-types-eth.workspace = true

# Tx Manager
base-tx-manager.workspace = true

# Proof
base-proof-contracts.workspace = true
base-proof-primitives = { workspace = true, optional = true }

# SP1 (test fixtures only: receipts are decoded without linking the SP1 SDK)
sp1-sdk = { workspace = true, optional = true }

# Encoding
bincode = { workspace = true, optional = true, features = ["serde"] }

# Error handling
thiserror.workspace = true

[dev-dependencies]
sp1-sdk.workspace = true
alloy-consensus.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[features]
snark-receipt = [ "dep:base-proof-primitives", "dep:bincode" ]
test-utils = [ "dep:sp1-sdk", "snark-receipt" ]
