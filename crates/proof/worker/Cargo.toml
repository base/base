[package]
name = "base-proof-worker"
description = "Shared proof worker loop for prover-service hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
base-common-runtime-tasks = { workspace = true }
base-proof-service-client = { workspace = true }
backon = { workspace = true, features = ["default"] }
chrono = { workspace = true, features = ["default"] }
tokio-util = { workspace = true, features = ["default"] }
base-proof-service-protocol = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["default", "test-util"] }
