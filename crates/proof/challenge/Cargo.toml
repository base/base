[package]
name = "base-challenger"
description = "Base Challenger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
tracing = { workspace = true }
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
humantime = { workspace = true }
alloy-eips = { workspace = true }
base-metrics = { workspace = true }
base-protocol = { workspace = true }
base-proof-rpc = { workspace = true }
base-cli-utils = { workspace = true }
base-tx-manager = { workspace = true }
alloy-primitives = { workspace = true }
base-common-network = { workspace = true }
base-balance-monitor = { workspace = true }
base-proof-contracts = { workspace = true }
base-proof-primitives = { workspace = true }
base-proof-submission = { workspace = true }
metrics = { workspace = true, optional = true }
base-prover-service-client = { workspace = true }
serde_json = { workspace = true, optional = true }
url = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, features = ["default"] }
alloy-trie = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["default"] }
base-runtime = { workspace = true, features = ["tokio"] }
tokio-util = { workspace = true, features = ["default"] }
base-common-consensus = { workspace = true, optional = false}
alloy-provider = { workspace = true, features = ["default"] }
rustls = { workspace = true, features = ["default", "ring"] }
base-common-rpc-types = { workspace = true, optional = true }
base-health = { workspace = true, features = ["axum-server"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-prover-service-protocol = { workspace = true, features = ["default"] }
[dev-dependencies]
rstest = { workspace = true, features = ["default"] }
metrics-util = { workspace = true, features = ["debugging"] }
tokio = { workspace = true, features = ["default", "test-util"] }
base-challenger = { workspace = true, features = ["test-utils"] }

[features]
metrics = [ "base-metrics/metrics", "base-tx-manager/metrics", "dep:metrics" ]
test-utils = [
    "base-common-rpc-types",
    "async-trait",
    "base-protocol/test-utils",
    "base-runtime/test-utils",
    "serde_json",
]
