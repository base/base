[package]
name = "base-challenger"
description = "Base Challenger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-rlp.workspace = true
alloy-eips.workspace = true
alloy-provider.workspace = true
alloy-primitives.workspace = true
alloy-signer-local.workspace = true
alloy-trie = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, optional = true }
alloy-rpc-types-eth = { workspace = true, optional = true }

base-tx-manager.workspace = true

base-balance-monitor.workspace = true

base-proof-rpc.workspace = true
base-proof-contracts.workspace = true
base-proof-primitives.workspace = true
base-proof-submission = { workspace = true, features = ["snark-receipt"] }
base-prover-service-client.workspace = true
base-prover-service-protocol.workspace = true

base-protocol.workspace = true
base-common-consensus.workspace = true

tokio.workspace = true
futures.workspace = true
async-trait = { workspace = true, optional = true }

tracing.workspace = true

serde.workspace = true

eyre.workspace = true
thiserror.workspace = true

base-cli-utils.workspace = true
clap = { workspace = true, features = ["derive", "env"] }

base-metrics.workspace = true
metrics = { workspace = true, optional = true }

rustls = { workspace = true, features = ["ring"] }

tokio-util.workspace = true
base-runtime = { workspace = true, features = ["tokio"] }

base-health = { workspace = true, features = ["axum-server"] }

url.workspace = true
humantime.workspace = true

serde_json = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
base-challenger = { path = ".", features = ["test-utils"] }
metrics-util = { workspace = true, features = ["debugging"] }
base-proof-submission = { workspace = true, features = ["test-utils"] }

[features]
metrics = [ "base-metrics/metrics", "base-tx-manager/metrics", "dep:metrics" ]
test-utils = [
	"alloy-consensus",
	"alloy-rpc-types-eth",
	"async-trait",
	"base-proof-submission/test-utils",
	"base-protocol/test-utils",
	"base-runtime/test-utils",
	"serde_json",
]
