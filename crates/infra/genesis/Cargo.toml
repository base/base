[package]
name = "base-genesis"
description = "Offline Base devnet genesis generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# workspace
base-execution-chainspec.workspace = true
base-common-genesis = { workspace = true, features = ["std", "serde"] }

# execution
alloy-eips.workspace = true
reth-chainspec.workspace = true
alloy-consensus.workspace = true
alloy-genesis = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["rand", "serde"] }

# consensus
tree_hash = "0.12"
ssz = { package = "ethereum_ssz", version = "0.10" }
lighthouse-bls = { package = "bls", git = "https://github.com/sigp/lighthouse", rev = "e423a66763bb1bd780492d635123f208d80c3538" }
lighthouse-types = { package = "types", git = "https://github.com/sigp/lighthouse", rev = "e423a66763bb1bd780492d635123f208d80c3538" }
lighthouse-wallet = { package = "eth2_wallet", git = "https://github.com/sigp/lighthouse", rev = "e423a66763bb1bd780492d635123f208d80c3538" }
lighthouse-keystore = { package = "eth2_keystore", git = "https://github.com/sigp/lighthouse", rev = "e423a66763bb1bd780492d635123f208d80c3538" }
lighthouse-state = { package = "state_processing", git = "https://github.com/sigp/lighthouse", rev = "e423a66763bb1bd780492d635123f208d80c3538" }

# misc
yaml_serde = "0.10"
sha2.workspace = true
eyre.workspace = true
tracing.workspace = true
tempfile.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive", "env"] }

[dev-dependencies]
reth-cli-util.workspace = true
