[package]
name = "ingress-rpc-lib"
version.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
alloy-eips = { workspace = true }
async-trait = { workspace = true }
base-bundles = { workspace = true }
base-common-evm = { workspace = true }
reth-rpc-eth-types = { workspace = true }
base-common-network = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
reth-rpc-server-types = { workspace = true }
metrics = { workspace = true, optional = true }
base-observability-events = { workspace = true }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["default", "v5"] }
serde = { workspace = true, features = ["derive", "std"] }
alloy-consensus = { workspace = true, features = ["std"] }
base-metrics = { workspace = true, features = ["metrics"] }
anyhow = { workspace = true, features = ["default", "std"] }
tokio = { workspace = true, features = ["default", "full"] }
moka = { workspace = true, features = ["default", "future"] }
base-common-chains = { workspace = true, features = ["default"] }
base-execution-evm = { workspace = true, features = ["default"] }
audit-archiver-lib = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["server", "macros"] }
axum = { workspace = true, features = ["tokio", "http1", "json"] }
base-common-rpc-types = { workspace = true, features = ["network"]}
alloy-provider = { workspace = true, features = ["default", "reqwest"] }
clap = { workspace = true, features = ["default", "std", "derive", "env"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "serde"] }
base-common-consensus = { workspace = true, features = ["std", "k256", "serde"] }
[dev-dependencies]
wiremock = { workspace = true }
base-common-network = { workspace = true }
base-bundles = { workspace = true, features = ["test-utils"] }

[features]
default = [ "metrics" ]
metrics = [
    "base-common-evm/metrics",
    "base-metrics/metrics",
    "base-observability-events/metrics",
    "dep:metrics",
]
