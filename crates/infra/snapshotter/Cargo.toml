[package]
name = "base-snapshotter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
alloy-eips = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
base-reth-cli = { workspace = true }
url = { workspace = true, features = ["default"] }
anyhow = { workspace = true, features = ["default"] }
bollard = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
human_bytes = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
alloy-provider = { workspace = true, features = ["default", "reqwest"] }
tokio = { workspace = true, features = ["default", "rt", "fs", "time"] }
aws-sdk-s3 = { workspace = true, features = ["rustls", "default-https-client", "rt-tokio"] }
[dev-dependencies]
serde_json = { workspace = true }
futures = { workspace = true, features = ["default"] }
bollard = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
serial_test = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }
testcontainers-modules = { workspace = true, features = ["minio"] }
aws-config = { workspace = true, features = ["default-https-client", "rt-tokio"] }
testcontainers = { workspace = true, features = ["blocking", "host-port-exposure"] }
