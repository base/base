[package]
name = "base-snapshotter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
url = { workspace = true }
anyhow = { workspace = true }
bollard = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
humantime = { workspace = true }
alloy-eips = { workspace = true }
async-trait = { workspace = true }
human_bytes = { workspace = true }
serde_json = { workspace = true }
base-reth-cli = { workspace = true }
alloy-provider = { workspace = true, features = ["reqwest"] }
tokio = { workspace = true, features = ["rt", "fs", "time"] }
clap = { workspace = true, features = ["derive", "env"] }
aws-sdk-s3 = { workspace = true, features = ["rustls", "default-https-client", "rt-tokio"] }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
bollard = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["full"] }
testcontainers = { workspace = true, features = ["blocking", "host-port-exposure"] }
aws-config = { workspace = true, features = ["default-https-client", "rt-tokio"] }
testcontainers-modules = { workspace = true, features = ["minio"] }
