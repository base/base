[package]
name = "base-infra-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
discv5 = { workspace = true }
async-trait = { workspace = true }
alloy-primitives = { workspace = true }
tracing = { workspace = true, features = ["std"] }
ipnet = { workspace = true, features = ["default"] }
thiserror = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["default"] }
governor = { workspace = true, features = ["default"] }
tokio-util = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive", "std"] }
anyhow = { workspace = true, features = ["default", "std"] }
libp2p-identity = { workspace = true, features = ["secp256k1"] }
secp256k1 = { workspace = true, features = ["default", "rand"] }
axum = { workspace = true, features = ["tokio", "http1", "json"] }
base-common-http = { workspace = true, features = ["axum-server"] }
clap = { workspace = true, features = ["default", "derive", "env", "std"] }
libp2p = { workspace = true, features = ["tokio", "tcp", "noise", "yamux", "identify"] }
base-execution-network-wire = { workspace = true, features = ["transport", "default", "secp256k1"] }
tokio = { workspace = true, features = ["default", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
mockall = { workspace = true }
reqwest = { workspace = true, features = ["default", "json"] }
