[package]
name = "base-roxy"
description = "JSON-RPC reverse proxy for Base infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["default"] }
axum = { workspace = true, features = ["tokio", "http1"] }
tokio = { workspace = true, features = ["default", "net"] }
anyhow = { workspace = true, features = ["default", "std"] }
base-health = { workspace = true, features = ["axum-server"] }
clap = { workspace = true, features = ["default", "derive", "env", "std"] }
[dev-dependencies]
reqwest = { workspace = true, features = ["default", "json"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
