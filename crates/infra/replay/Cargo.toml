[package]
name = "base-replay"
description = "Offline mainnet component fixtures and benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
eyre.workspace = true
serde_json.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive", "env"] }

alloy-rlp.workspace = true
alloy-eips.workspace = true
alloy-trie.workspace = true
alloy-consensus = { workspace = true, features = ["serde"] }
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-rpc-types-eth = { workspace = true, features = ["serde"] }

base-common-flz.workspace = true
base-proof-mpt = { workspace = true, features = ["std"] }
base-common-consensus = { workspace = true, features = ["serde", "k256"] }
base-common-rpc-types-engine = { workspace = true, features = ["serde", "k256"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
