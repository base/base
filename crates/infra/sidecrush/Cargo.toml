[package]
name = "base-sidecrush"
description = "Block-production health-check sidecar library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
cadence = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
alloy-pubsub = { workspace = true }
alloy-provider = { workspace = true, features = ["pubsub", "ws"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }
alloy-transport = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "test-util", "net"] }
