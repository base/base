[package]
name = "base-replay-store"
description = "Minute-keyed replay record storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
url.workspace = true
zstd.workspace = true
chrono.workspace = true
futures.workspace = true
tempfile.workspace = true
thiserror.workspace = true
serde_json.workspace = true
base-replay = { path = "../../utilities/replay" }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "time"] }
aws-config = { workspace = true, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { workspace = true, features = ["rustls", "default-https-client", "rt-tokio"] }

[dev-dependencies]
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
testcontainers = { workspace = true, features = ["ring"] }
testcontainers-modules = { workspace = true, features = ["minio"] }
