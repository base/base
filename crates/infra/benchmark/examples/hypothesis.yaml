# Hypothesis template for the AI agent optimization loop.
# Fill this in to describe a proposed change and what you expect to improve.

name: "short-descriptive-name"

description: |
  What was changed and why it should improve performance.
  Be specific: e.g. "Increased txpool pending-max-count from 10240 to 65536 to reduce
  transaction backpressure during high-throughput Uniswap swap benchmarks."

# Primary metric to optimize (one of: gas_per_second_sequencer, get_payload_ms, new_payload_ms)
optimize_metric: gas_per_second_sequencer

# Direction: maximize (for throughput) or minimize (for latency)
optimize_direction: maximize

# Extra node CLI args to pass to base-reth-node for this hypothesis.
# Leave empty if the change is in source code (requires recompile).
node_args: ""

# Tags applied to all benchmark runs for this hypothesis.
# Useful for filtering results.jsonl later.
tags:
  hypothesis: "short-descriptive-name"
  variant: "v1"
