[package]
name = "basectl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
dirs = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
ratatui = { workspace = true }
futures = { workspace = true }
crossterm = { workspace = true }
serde_yaml = { workspace = true }
alloy-contract = { workspace = true }
alloy-transport = { workspace = true }
base-tx-manager = { workspace = true }
alloy-rpc-client = { workspace = true }
alloy-signer-local = { workspace = true }
base-common-chains = { workspace = true, features = ["abi"] }
base-common-network = { workspace = true }
base-upgrade-signal = { workspace = true }
base-proof-contracts = { workspace = true }
alloy-transport-http = { workspace = true, features = ["reqwest", "traceparent"] }
reqwest = { workspace = true, features = ["charset", "http2", "json", "rustls-no-provider", "system-proxy"] }
rustls = { workspace = true, features = ["ring"] }
alloy-rpc-types-txpool = { workspace = true }
base-prover-service-client = { workspace = true }
base-prover-service-protocol = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
toml = { workspace = true, features = ["parse", "serde"] }
url = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "time"] }
alloy-eips = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
alloy-rlp = { workspace = true, features = ["std"] }
k256 = { workspace = true, features = ["ecdsa"] }
alloy-sol-types = { workspace = true, features = ["std"] }
jsonrpsee = { workspace = true, features = ["http-client"] }
alloy-primitives = { workspace = true, features = ["getrandom", "serde"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }
base-consensus-rpc = { workspace = true, features = ["client"] }
base-common-consensus = { workspace = true, features = ["k256"] }
base-protocol = { workspace = true, features = ["p2p-rpc", "serde", "std"] }
alloy-consensus = { workspace = true, features = ["std", "k256"] }
base-common-genesis = { workspace = true, features = ["serde", "std"] }
base-proof-submission = { workspace = true, features = ["snark-receipt"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
alloy-provider = { workspace = true, features = ["admin-api", "net-api", "pubsub", "reqwest", "txpool-api", "ws-ring"] }

[dev-dependencies]
rstest = { workspace = true }
mockall = { workspace = true }
tempfile = { workspace = true }
jsonrpsee = { workspace = true, features = ["server"] }
axum = { workspace = true, features = ["tokio", "http1", "json"] }
base-proof-submission = { workspace = true, features = ["test-utils"] }
base-prover-service-protocol = { workspace = true, features = ["rpc-server"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
