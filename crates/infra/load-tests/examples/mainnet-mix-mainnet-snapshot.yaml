# Base mainnet transaction mix, generated by etc/scripts/local/mainnet-mix.py (mapping and limits).
# Measurement window: blocks 52990042..53292441 (2026-10-23 15:30 to 2026-10-30 15:30 UTC / 2026-10-23 10:30 to 2026-10-30 10:30 EST), 10080 samples.
# Non-deposit mean per block: 38031411 gas, 211.4 txs, 282.6 ERC-20 Transfer events.
# Class: share by count / gas, gas/tx -> stand-ins (share of class txs), predicted gas/tx:
#   x402             2.28% /   1.73%,  136762 -> x402 100%, 85756
#   transfer         7.34% /   0.98%,   24081 -> transfer 100%, 21000
#   swap            18.25% /  34.61%,  341218 -> swap_2_pools 38% + swap_3_pools 48% + storage_heavy 8% + token_move_60 6%, 342929
#   liquidity        4.00% /  17.25%,  775827 -> liquidity_mint 25% + liquidity_multicall 30% + storage_heavy 45%, 784674
#   aa_bundle        3.64% /   7.96%,  392838 -> aa_bundle_6 58% + aa_bundle_16 42%, 392399
#   oracle           5.84% /   2.34%,   72036 -> storage_oracle 100%, 75616
#   token_transfer   4.61% /   1.53%,   59516 -> token_move_1 100%, 57430
#   approval         1.40% /   0.36%,   46529 -> erc20 100%, 45044
#   token_move       5.60% /   9.88%,  317646 -> token_move_10 66% + token_move_60 34%, 318937
#   reverted         6.70% /   5.69%,  152852 -> swap_1_pool 60% + swap_2_pools 40%, 153358
#   no_logs         27.64% /   9.00%,   58607 -> storage_no_logs 100%, 57262
#   other           12.70% /   8.66%,  122659 -> storage_other 100%, 125769
# Weights: class tx share x stand-in share, normalized to 1000. Predicted from stand-in fork receipts, vs this window:
#   gas_per_tx             1.797e+05 vs 1.799e+05 (-0.1%, tolerance 10%)
#   heavy_tx_share              0.09 vs 0.09896 (-9.1%, tolerance 10%)
#   heavy_gas_share           0.4064 vs 0.5114 (-20.5%, tolerance 10%)
#   calldata_bytes_per_tx      374.3 vs 479 (-21.9%, tolerance 25%)
#   logs_per_tx                4.372 vs 3.83 (+14.2%, tolerance 25%)
# State growth has no target (blocks carry no state diffs): stand-ins write 5.09 fresh slots per Mgas
# (storage and aa_bundle recipients; liquidity mints uncounted); production monitoring shows ~0.00077 bytes/gas.
# Reverts run as successful swaps of similar gas; ERC-4337 bundles run the aa_bundle stand-in.
# For `base-bench snapshot`: the launcher replaces the RPC URLs and prefunds an ephemeral funder.
# Includes USDC EIP-3009 as an x402 proxy (not all authorizations are x402).
# Changed mix: benchmark runs using this YAML are not comparable with earlier mixes.

