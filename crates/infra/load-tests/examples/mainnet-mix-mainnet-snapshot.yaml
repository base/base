# Uses native EIP-8430 EOA self-pay transfers for the 41/1000 transfer weight.
# Requires Everest activation and native transaction support; this is not a measured native tx share.
# Base mainnet transaction mix, generated by etc/scripts/local/mainnet-mix.py (mapping and limits).
# Window: blocks 52523904..52826303 (2026-10-12 20:32 to 2026-10-19 20:32 UTC), 10080 blocks sampled evenly.
# Non-deposit mean per block: 37754083 gas, 193.4 txs, 301.9 ERC-20 Transfer events.
# Class: share by count / gas, gas/tx -> load-test type:
#   transfer         4.13% /   0.50%,   23516 -> eip8430_transfer
#   swap            19.44% /  30.27%,  304140 -> swap
#   liquidity        8.50% /  25.84%,  593773 -> swap
#   aa_bundle        3.85% /   7.88%,  399371 -> swap+erc20
#   oracle           5.48% /   2.52%,   89601 -> b20
#   token_transfer   4.26% /   1.32%,   60341 -> erc20
#   approval         1.34% /   0.35%,   50712 -> erc20
#   token_move       6.75% /  12.56%,  363226 -> b20
#   reverted         6.32% /   4.08%,  126051 -> b20
#   no_logs         30.55% /   7.15%,   45687 -> b20
#   other            9.38% /   7.54%,  156908 -> b20
# Tx shares match mainnet. The stand-ins run other code paths (no liquidity mint/burn, multi-hop routes,
# EntryPoint validation or failing calls; reverts run as successful b20 calls). The original ordinary-transfer
# mix estimated 69331 gas/tx vs mainnet's 195212 (2.82x txs per block at equal gas); native-transfer
# gas/tx must be measured again rather than inferred from that estimate.
# For `base-bench snapshot`: the launcher replaces the RPC URLs and prefunds an ephemeral funder.

transaction_submission_rpcs: ["http://127.0.0.1:7545"]
query_rpc: "http://127.0.0.1:7545"
flashblocks_ws: "ws://127.0.0.1:7111"
chain_id: 8453
sender_count: 100
target_gps: 18877042
block_time: "2s"
duration: null
measurement_blocks: 500
skip_drain: true
funding_amount: "200000000000000000" # 0.2 ETH covers WETH setup plus swap gas

real_token_setup:
  enabled: true
  allow_chain_id_8453: true
  weth: "0x4200000000000000000000000000000000000006"
  weth_amount_per_sender: "50000000000000000" # 0.05 WETH
  pair_token:
    token: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" # USDC, public token address: gitleaks:allow
    amount_per_sender: "10000000" # 10 USDC
    acquisition: {type: uniswap_v3_exact_input, router: "0x2626664c2603336E57B271c5C0b26F421741e481",
      fee: 500, amount_in: "10000000000000000", min_amount_out: "0"}
# Swap amounts: WETH wei forward, USDC units in reverse.
transactions:
  - {weight: 41, type: eip8430_transfer}
  - {weight: 75, type: erc20, contract: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"}
  - {weight: 585, type: b20}
  - {weight: 150, type: uniswap_v3, router: "0x2626664c2603336E57B271c5C0b26F421741e481", fee: 500,
      token_in: "0x4200000000000000000000000000000000000006", token_out: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913", # gitleaks:allow
      min_amount: "10000000000000", max_amount: "100000000000000", reverse_min_amount: "10000", reverse_max_amount: "100000"}
  - {weight: 149, type: aerodrome_cl, router: "0xBE6D8f0d05cC4be24d5167a3eF062215bE6D18a5", tick_spacing: 100,
      token_in: "0x4200000000000000000000000000000000000006", token_out: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913", # gitleaks:allow
      min_amount: "10000000000000", max_amount: "100000000000000", reverse_min_amount: "10000", reverse_max_amount: "100000"}
