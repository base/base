# Load Test Configuration - Local Mainnet Snapshot Blake2f, 2s Blocks
#
# Saturates a snapshot-backed builder with fixed 50,000-round Blake2f calls.
# The 30-block measurement window is 60 seconds at the configured cadence.

transaction_submission_rpcs:
  - "http://127.0.0.1:7545"
query_rpc: "http://127.0.0.1:7545"
txpool_nodes: []
flashblocks_ws: "ws://127.0.0.1:7111"

chain_id: 8453
sender_count: 100
block_time: "2s"
in_flight_per_sender: 64
max_total_in_flight: 5000
batch_size: 20
duration: null
measurement_blocks: 30
target_gps: null
seed: 83452

funding_amount: "10000000000000000"
skip_drain: true

transactions:
  - weight: 100
    type: precompile
    target: blake2f
    rounds: 50000
