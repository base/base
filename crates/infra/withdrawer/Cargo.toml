[package]
name = "base-withdrawer"
description = "Withdrawal proving and finalization for OP Stack networks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
url.workspace = true
tower.workspace = true
humantime.workspace = true
thiserror.workspace = true
alloy-rlp.workspace = true
alloy-eips.workspace = true
serde_json.workspace = true
alloy-trie.workspace = true
coins-bip32.workspace = true
async-trait.workspace = true
alloy-signer.workspace = true
alloy-network.workspace = true
base-protocol.workspace = true
alloy-provider.workspace = true
alloy-json-rpc.workspace = true
alloy-transport.workspace = true
alloy-sol-types.workspace = true
alloy-rpc-client.workspace = true
alloy-signer-local.workspace = true
base-common-network.workspace = true
base-common-rpc-types.workspace = true
base-common-consensus.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
reqwest = { workspace = true, features = ["json"] }
clap = { workspace = true, features = ["derive", "env"] }
alloy-consensus = { workspace = true, features = ["std"] }
coins-bip39 = { workspace = true, features = ["english"] }
alloy-signer-ledger = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["std"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt"] }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[features]
default = []
ledger = [ "dep:alloy-signer-ledger" ]
