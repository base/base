[package]
name = "base-common-signer"
description = "Remote transaction signer for EthereumWallet integration via eth_signTransaction"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
alloy-signer = { workspace = true }
alloy-network = { workspace = true }
alloy-primitives = { workspace = true }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["default"] }
thiserror = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }
jsonrpsee = { workspace = true, features = ["http-client", "macros"] }
[dev-dependencies]
alloy-signer-local = { workspace = true }
alloy-node-bindings = { workspace = true }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
