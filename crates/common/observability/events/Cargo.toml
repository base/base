[package]
name = "base-common-observability-events"
description = "Shared observability event envelopes and JSONL writers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing-appender = { workspace = true }
metrics = { workspace = true, optional = true }
hex = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["std"] }
eyre = { workspace = true, features = ["default"] }
strum = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
base-common-observability-metrics = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
alloy-primitives = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["default", "serde"] }

[dev-dependencies]
tempfile = { workspace = true, features = ["default"] }

[features]
default = ["metrics"]
metrics = ["base-common-observability-metrics/metrics", "dep:metrics"]
test-utils = []
