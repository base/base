[package]
name = "base-common-observability-health"
description = "Shared health check RPC endpoint for JSON-RPC servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tower = { workspace = true }
http-body = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
http = { workspace = true, features = ["default"] }
bytes = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["server", "macros"] }
eyre = { workspace = true, optional = true, features = ["default"] }
tokio-util = { workspace = true, optional = true, features = ["default"] }
axum = { workspace = true, features = ["http1", "tokio"], optional = true }
tokio = { workspace = true, features = ["default", "net"], optional = true }
[dev-dependencies]
rstest = { workspace = true, features = ["default"] }
reqwest = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["http-client"] }
alloy-transport-http = { workspace = true, features = ["default", "reqwest"] }
tokio = { workspace = true, features = ["default", "rt-multi-thread", "macros"] }
[features]
axum-server = [
	"dep:axum",
	"dep:eyre",
	"dep:tokio",
	"dep:tokio-util",
	"dep:tracing",
]
