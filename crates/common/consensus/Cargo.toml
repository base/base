[package]
name = "base-common-consensus"
description = "Base alloy consensus types"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-consensus = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-serde = { workspace = true, optional = true }
modular-bitfield = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["rlp"] }
reth-zstd-compressors = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
bytes = { workspace = true, optional = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
reth-codecs = { workspace = true, features = ["alloy"], optional = true }
serde_with = { workspace = true, optional = true, features = ["default"] }
[dev-dependencies]
serde_json = { workspace = true }
alloy-signer = { workspace = true }
base-common-network = { workspace = true }
rand = { workspace = true, features = ["default"] }
rstest = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
bincode = { workspace = true, features = ["default", "serde"] }
alloy-primitives = { workspace = true, features = ["rand", "arbitrary"] }

[features]
default = ["std"]
std = [
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "alloy-serde?/std",
    "alloy-sol-types/std",
    "reth-codecs?/std",
    "reth-zstd-compressors?/std",
    "serde?/std",
    "thiserror/std",
]
k256 = ["alloy-consensus/k256", "alloy-primitives/k256"]
kzg = ["alloy-consensus/kzg", "alloy-eips/kzg", "std"]
arbitrary = [
    "alloy-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-primitives/rand",
    "alloy-serde?/arbitrary",
    "dep:arbitrary",
    "reth-codecs?/arbitrary",
    "std",
]
serde = [
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bytes?/serde",
    "dep:alloy-serde",
    "dep:serde",
    "reth-codecs?/serde",
]
serde-bincode-compat = ["alloy-consensus/serde-bincode-compat", "serde_with"]
reth = [
    "dep:bytes",
    "dep:modular-bitfield",
    "dep:reth-codecs",
    "dep:reth-zstd-compressors",
    "k256",
    "serde",
    "serde-bincode-compat",
    "std",
]
