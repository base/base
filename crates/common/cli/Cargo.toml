[package]
name = "base-common-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
url = { workspace = true }
metrics = { workspace = true }
dirs-next = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-genesis = { workspace = true }
base-common-io = { workspace = true }
tracing-appender = { workspace = true }
opentelemetry_sdk = { workspace = true }
base-common-runtime = { workspace = true }
eyre = { features = ["default"], workspace = true }
rand_08 = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
tokio-util = { workspace = true, features = ["default"] }
serde = { features = ["derive", "std"], workspace = true }
opentelemetry = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["std", "attributes"] }
metrics-process = { workspace = true, features = ["metrics-rs"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
clap = { features = ["default", "derive", "env", "string"], workspace = true }
base-common-observability-metrics = { workspace = true, features = ["metrics"] }
metrics-exporter-prometheus = { workspace = true, features = ["http-listener"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "rand"] }
base-common-observability-tracing = { features = ["default", "otlp", "std"], workspace = true }
tokio = { workspace = true, features = ["default", "full", "macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { workspace = true, features = ["default", "fmt", "env-filter", "json", "tracing-log"] }

[dev-dependencies]
rand = { workspace = true, features = ["default"] }
rstest = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = { features = ["default"], workspace = true }
backtrace = { workspace = true, features = ["default"] }
tikv-jemalloc-sys = { workspace = true, optional = true, features = ["default"] }
tikv-jemallocator = { workspace = true, optional = true, features = ["default"] }

[features]
jemalloc = [
    "dep:tikv-jemallocator",
    "dep:tikv-jemalloc-sys",
    "tikv-jemallocator?/override_allocator_on_supported_platforms",
]

# Enables jemalloc profiling features
jemalloc-prof = ["jemalloc", "tikv-jemallocator?/profiling"]

otlp = ["base-common-observability-tracing/otlp"]
otlp-logs = ["base-common-observability-tracing/otlp-logs"]
