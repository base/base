[package]
name = "base-common-evm"
description = "EVM implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
auto_impl = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
base-common-flz = { workspace = true }
alloy-primitives = { workspace = true }
base-evm-context = { workspace = true }
base-common-l1-fees = { workspace = true }
base-common-types-rpc = {workspace = true}
serde = { workspace = true, optional = true }
base-common-precompiles = { workspace = true }
metrics = { workspace = true, optional = true }
base-metrics = { workspace = true, optional = true }
base-evm-handler = { workspace = true, features = ["rpc"] }
base-common-types-chain = { workspace = true, features = [] }
base-execution-eip8130 = { workspace = true, optional = true }
base-precompile-storage = { workspace = true, optional = true }
base-common-chain-config = {workspace = true, features = ["default"]}

[dev-dependencies]
sha2 = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-primitives = { workspace = true }
base-common-types-rpc = { workspace = true }
rstest = { workspace = true, features = ["default"] }
k256 = { workspace = true, features = ["default", "ecdsa"] }
base-precompile-storage = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true, features = ["alloc", "preserve_order"] }

[features]
default = [ "blst", "c-kzg", "portable", "secp256k1", "std" ]
std = [
    "base-common-types-chain/std",
    "alloy-eips/std",
    "base-evm-handler/std",
    "alloy-primitives/std",
    "base-common-chain-config/std",
    "base-common-flz/std",
    "base-common-l1-fees/std",
    "base-common-precompiles/std",
    "base-metrics?/std",
    "base-precompile-storage/std",
    "dep:base-execution-eip8130",
    "serde?/std",
    "thiserror/std",
]
serde = [
    "base-common-types-chain/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "base-common-chain-config/serde",
    "dep:serde",
    "base-evm-handler/serde",
]
reth = [ "std" ]
metrics = [
	"base-metrics/metrics",
	"dep:base-metrics",
	"dep:metrics",
	"std",
]
bn = [ "base-common-precompiles/bn", "base-evm-handler/bn" ]
blst = [ "base-common-precompiles/blst", "base-evm-handler/blst" ]
c-kzg = [ "base-common-precompiles/c-kzg", "base-evm-handler/c-kzg" ]
portable = [ "base-common-precompiles/portable", "base-evm-handler/portable" ]
secp256k1 = [ "base-common-precompiles/secp256k1", "base-evm-handler/secp256k1" ]
memory_limit = [ "base-common-precompiles/memory_limit", "base-evm-handler/memory_limit" ]
optional_no_base_fee = [
	"base-common-precompiles/optional_no_base_fee",
	"base-evm-handler/optional_no_base_fee",
]
optional_eip3541 = [
	"base-common-precompiles/optional_eip3541",
	"base-evm-handler/optional_eip3541",
]
optional_eip3607 = [
	"base-common-precompiles/optional_eip3607",
	"base-evm-handler/optional_eip3607",
]
optional_fee_charge = [
	"base-common-precompiles/optional_fee_charge",
	"base-evm-handler/optional_fee_charge",
]
optional_balance_check = [
	"base-common-precompiles/optional_balance_check",
	"base-evm-handler/optional_balance_check",
]
optional_block_gas_limit = [
	"base-common-precompiles/optional_block_gas_limit",
	"base-evm-handler/optional_block_gas_limit",
]
