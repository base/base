[package]
name = "base-common-evm"
description = "EVM implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
revm = { workspace = true }
thiserror = { workspace = true }
auto_impl = { workspace = true }
alloy-eips = { workspace = true }
alloy-consensus = { workspace = true }
base-common-flz = { workspace = true }
base-evm-handler = { workspace = true }
base-evm-context = { workspace = true }
alloy-primitives = { workspace = true }
base-common-l1-fees = { workspace = true }
base-common-genesis = { workspace = true }
serde = { workspace = true, optional = true }
base-common-precompiles = { workspace = true }
metrics = { workspace = true, optional = true }
base-metrics = { workspace = true, optional = true }
base-execution-eip8130 = { workspace = true, optional = true }
base-precompile-storage = { workspace = true, optional = true }
base-common-consensus = { workspace = true, features = ["evm"] }
base-common-chains = { workspace = true, features = ["default"] }
[dev-dependencies]
sha2 = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-primitives = { workspace = true }
rstest = { workspace = true, features = ["default"] }
k256 = { workspace = true, features = ["default", "ecdsa"] }
base-precompile-storage = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true, features = ["alloc", "preserve_order"] }

[features]
default = [ "blst", "c-kzg", "portable", "secp256k1", "std" ]
std = [
    "alloy-consensus/std",
    "alloy-eips/std",
    "base-evm-handler/std",
    "alloy-primitives/std",
    "base-common-chains/std",
    "base-common-consensus/std",
    "base-common-flz/std",
    "base-common-genesis/std",
    "base-common-l1-fees/std",
    "base-common-precompiles/std",
    "base-metrics?/std",
    "base-precompile-storage/std",
    "dep:base-execution-eip8130",
    "revm/std",
    "serde?/std",
    "thiserror/std",
]
serde = [
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "base-common-chains/serde",
    "base-common-consensus/serde",
    "base-common-genesis/serde",
    "dep:serde",
    "revm/serde",
]
reth = [ "std" ]
metrics = [
	"base-metrics/metrics",
	"dep:base-metrics",
	"dep:metrics",
	"std",
]
bn = [ "base-common-precompiles/bn", "revm/bn" ]
blst = [ "base-common-precompiles/blst", "revm/blst" ]
c-kzg = [ "base-common-precompiles/c-kzg", "revm/c-kzg" ]
portable = [ "base-common-precompiles/portable", "revm/portable" ]
secp256k1 = [ "base-common-precompiles/secp256k1", "revm/secp256k1" ]
memory_limit = [ "base-common-precompiles/memory_limit", "revm/memory_limit" ]
optional_no_base_fee = [
	"base-common-precompiles/optional_no_base_fee",
	"revm/optional_no_base_fee",
]
optional_eip3541 = [
	"base-common-precompiles/optional_eip3541",
	"revm/optional_eip3541",
]
optional_eip3607 = [
	"base-common-precompiles/optional_eip3607",
	"revm/optional_eip3607",
]
optional_fee_charge = [
	"base-common-precompiles/optional_fee_charge",
	"revm/optional_fee_charge",
]
optional_balance_check = [
	"base-common-precompiles/optional_balance_check",
	"revm/optional_balance_check",
]
optional_block_gas_limit = [
	"base-common-precompiles/optional_block_gas_limit",
	"revm/optional_block_gas_limit",
]
