[package]
name = "base-bundles"
description = "Bundle types for transaction bundles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base-common-flz = { workspace = true }
alloy-consensus = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
alloy-signer-local = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["default", "v4", "serde"] }
alloy-provider = { workspace = true, features = ["default", "reqwest"] }
base-common-consensus = { workspace = true, features = ["std", "k256", "serde"] }
base-common-rpc-types = { workspace = true, features = ["default", "std"], optional = true }
[dev-dependencies]
alloy-signer-local = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
base-common-rpc-types = { workspace = true, features = ["default", "std"] }
[features]
test-utils = [ "dep:alloy-signer-local", "dep:base-common-rpc-types" ]
