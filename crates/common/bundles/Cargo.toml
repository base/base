[package]
name = "base-bundles"
description = "Bundle types for transaction bundles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-consensus = { workspace = true, features = ["std"] }
alloy-provider = { workspace = true, features = ["reqwest"] }
alloy-primitives = { workspace = true, features = ["serde"] }

base-common-flz.workspace = true
base-common-consensus = { workspace = true, features = ["std", "k256", "serde"] }

uuid = { workspace = true, features = ["v4", "serde"] }
serde = { workspace = true, features = ["std", "derive"] }

alloy-signer-local = { workspace = true, optional = true }
base-common-rpc-types = { workspace = true, features = ["std"], optional = true }

[dev-dependencies]
alloy-signer-local.workspace = true

base-common-rpc-types = { workspace = true, features = ["std"] }

serde_json = { workspace = true, features = ["std"] }

[features]
test-utils = [ "dep:alloy-signer-local", "dep:base-common-rpc-types" ]
