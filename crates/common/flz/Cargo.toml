[package]
name = "base-common-flz"
description = "FastLZ compression length estimation and Fjord transaction size utilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dev-dependencies]
hex-literal = { workspace = true }
rstest = { workspace = true, features = ["default"] }
criterion = { workspace = true, features = ["default"] }
iai-callgrind = { workspace = true, features = ["default"] }

[[bench]]
name = "flz"
harness = false

[[bench]]
name = "flz_iai"
harness = false

[features]
default = [ "std" ]
std = []
