[package]
name = "base-common-chain-activation"
description = "L1 upgrade signal reader utilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
alloy-json-rpc = { workspace = true }
alloy-transport = { workspace = true }
base-common-runtime = { workspace = true }
metrics = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"] }
url = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
thiserror = { workspace = true, features = ["std"] }
backon = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["default"] }
base-common-observability-metrics = { workspace = true }
alloy-sol-types = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
alloy-primitives = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["default", "json"] }
alloy-rpc-client = { workspace = true, features = ["default"] }
base-common-types-rpc = { workspace = true, features = ["std"] }
base-common-chain-config = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-common-client-ethereum = { workspace = true, features = ["default"] }

[dev-dependencies]
rstest = { workspace = true, features = ["default"] }
httpmock = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "macros", "rt", "time"] }

[features]
default = []
metrics = ["base-common-observability-metrics/metrics", "dep:metrics"]
