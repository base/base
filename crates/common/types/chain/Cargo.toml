[package]
name = "base-common-types-chain"
description = "Base and Ethereum L1 consensus types and compact storage encodings"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
either = { workspace = true }
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
auto_impl = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-tx-macros = { workspace = true }
reth-codecs-derive = { workspace = true }
visibility = { workspace = true, optional = true }
alloy-serde = { workspace = true, optional = true }
alloy-genesis = { workspace = true, optional = true }
modular-bitfield = { workspace = true, optional = false }
reth-zstd-compressors = { workspace = true, optional = true }
c-kzg = { workspace = true, features = ["serde"], optional = true }
borsh = { workspace = true, features = ["derive"], optional = true }
bytes = { workspace = true }
rand_08 = { workspace = true, optional = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, features = ["alloc"], optional = true }
alloy-primitives = { workspace = true, features = ["rlp", "map-foldhash"] }
alloy-trie = { workspace = true, optional = false, features = ["ethereum"]}
serde = { workspace = true, features = ["derive", "alloc"], optional = false }
serde_with = { workspace = true, optional = true, features = ["default", "macros"] }
alloy-eips = { workspace = true, features = ["serde", "kzg-sidecar"],optional = false}
parity-scale-codec = { workspace = true, features = ["default", "bytes"], optional = true }
once_cell = { workspace = true, features = [
    "critical-section",
    "race",
    "alloc",
] }
k256 = { workspace = true, features = [
    "ecdsa",
    "ecdsa",
], optional = true }
derive_more = { workspace = true, features = [
    "as_ref",
    "display",
    "from",
    "deref",
    "deref_mut",
    "into_iterator",
] }
secp256k1 = { workspace = true, features = [
    "recovery",
    "global-context",
    "std",
], optional = true }
[dev-dependencies]
test-fuzz = { workspace = true }
alloy-signer = { workspace = true }
assert_matches_1_5 = { workspace = true }
base-common-network = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
k256 = { workspace = true, features = ["ecdsa"] }
rand = { workspace = true, features = ["default"] }
rstest = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"]}
rand_08 = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
proptest = { workspace = true, features = ["default"] }
bincode = { workspace = true, features = ["default", "serde"] }
alloy-eips = { workspace = true, features = ["arbitrary", "serde", "kzg"] }
alloy-primitives = { workspace = true, features = ["rand", "arbitrary", "map-foldhash", "serde"] }
secp256k1 = { workspace = true, features = [
    "recovery",
    "global-context",
    "std",
    "rand",
] }

[features]
default = ["std", "alloy"]
std = [
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "alloy-serde/std",
    "alloy-sol-types/std",
    "reth-zstd-compressors?/std",
    "serde/std",
    "thiserror/std",
    "bytes/std",
    "alloy-genesis?/std",
    "alloy-trie/std",
    "dep:parity-scale-codec",
    "c-kzg?/std",
    "derive_more/std",
    "k256?/std",
    "serde_json?/std",
    "serde_with?/std",
    "either/std",
    "once_cell/std",
    "secp256k1?/std",
    "borsh?/std",
]
k256 = ["alloy-primitives/k256", "dep:k256", "alloy-eips/k256"]
kzg = ["alloy-eips/kzg", "std", "dep:c-kzg"]
arbitrary = [
    "k256",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-primitives/rand",
    "alloy-serde/arbitrary",
    "dep:arbitrary",
    "std",
    "alloy-trie/arbitrary",
    "dep:rand_08",
    "c-kzg?/arbitrary",
    "alloy-tx-macros/arbitrary",
]
serde = [
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bytes/serde",
    "dep:alloy-serde",
    "alloy-trie/serde",
    "dep:serde_json",
    "c-kzg?/serde",
    "either/serde",
    "k256?/serde",
    "rand_08?/serde",
    "secp256k1?/serde",
    "alloy-tx-macros/serde",
]
serde-bincode-compat = ["serde_with", "alloy-eips/serde-bincode-compat"]
reth = ["dep:reth-zstd-compressors", "k256", "serde", "serde-bincode-compat", "std", "alloy"]
alloy = ["dep:alloy-genesis", "dep:reth-zstd-compressors"]
test-utils = ["std", "alloy", "arbitrary", "dep:visibility", "dep:arbitrary"]
borsh = ["dep:borsh", "alloy-primitives/borsh", "alloy-eips/borsh"]
crypto-backend = []
secp256k1 = ["dep:secp256k1", "alloy-primitives/secp256k1"]
