[package]
name = "base-precompile-storage"
description = "EVM storage abstractions and runtime traits for Base native precompiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
# alloy
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
alloy-evm = { workspace = true, optional = true }

# revm
revm = { workspace = true, optional = true }

# evm2
evm2 = { workspace = true, optional = true }

# base
base-precompile-macros.workspace = true

# misc
thiserror.workspace = true
tracing.workspace = true
derive_more = { workspace = true, features = ["from", "try_into"] }

[dev-dependencies]
rstest.workspace = true
proptest.workspace = true
alloy-primitives = { workspace = true, features = ["rand"] }

[[test]]
name = "contract"
required-features = ["test-utils"]

[[test]]
name = "engine_parity"
required-features = ["revm", "evm2"]

[features]
default = [ "revm", "std" ]
std = [
	"alloy-evm?/std",
	"alloy-primitives/std",
	"alloy-sol-types/std",
	"derive_more/std",
	"evm2?/std",
	"revm?/std",
	"thiserror/std",
	"tracing/std",
]
revm = [ "dep:alloy-evm", "dep:revm" ]
evm2 = [ "dep:evm2" ]
test-utils = [ "std" ]
