[package]
name = "base-common-evm2"
description = "Base EVM2 execution type family (scaffold)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
# base
base-common-genesis.workspace = true
base-common-l1-fees.workspace = true
base-common-consensus.workspace = true

# evm2
evm2 = { workspace = true, features = ["std"] }

# alloy
alloy-eips.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true

[dev-dependencies]
# base — the revm execution path, for the differential parity harnesses. The other base, evm2,
# and alloy crates the tests use are already in [dependencies]; Cargo unifies features across both
# sections, so only the dev-only crates are listed here.
base-common-evm = { workspace = true, features = ["blst", "c-kzg", "portable", "secp256k1", "std"] }
# base — the revm precompile set, as the source of truth for the precompile-cap parity test.
base-common-precompiles.workspace = true
# base — the revm transition hooks + fork schedule, for the transition-parity harness.
base-common-chains.workspace = true

# alloy — ForkCondition, to build the revm-side fork schedule in the transition-parity harness.
alloy-hardforks.workspace = true

# revm
revm = { workspace = true, features = ["std"] }
