[package]
name = "base-common-l1"
description = "Transaction lifecycle management for Base onchain components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
alloy-transport = { workspace = true }
alloy-primitives = { workspace = true }
base-common-types-chain = { workspace = true }
metrics = { workspace = true, optional = true }
tracing = { features = ["std"], workspace = true }
url = { workspace = true, features = ["default"] }
backon = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
base-common-observability-metrics = { workspace = true }
tokio-util = { workspace = true, features = ["default"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std", "kzg"] }
base-common-types-rpc = { workspace = true, features = ["std"] }
base-common-runtime = { workspace = true, features = ["tokio"] }
tokio = { features = ["default", "sync", "time"], workspace = true }
base-common-client-ethereum = { workspace = true, features = ["default"] }

[dev-dependencies]
rayon = { workspace = true }
humantime = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
alloy-signer = { workspace = true }
alloy-json-rpc = { workspace = true }
base-common-process = { workspace = true }
rstest = { workspace = true, features = ["default"] }
proptest = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-common-runtime = { workspace = true, features = ["test-utils"] }
tokio = { features = ["default", "macros", "net", "rt", "rt-multi-thread"], workspace = true }

[features]
metrics = ["base-common-observability-metrics/metrics", "dep:metrics"]
