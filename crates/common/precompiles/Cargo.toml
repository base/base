[package]
name = "base-common-precompiles"
description = "Base precompile definitions and fork-specific precompile sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
alloy-sol-types = { workspace = true }
base-evm-handler = { workspace = true }
base-evm-context = { workspace = true }
alloy-primitives = { workspace = true }

base-common-genesis = { workspace = true }
base-precompile-macros = { workspace = true }
base-precompile-storage = { workspace = true }
[dev-dependencies]
rstest = { workspace = true, features = ["default"] }
criterion = { workspace = true, features = ["default"] }
k256 = { workspace = true, features = ["default", "ecdsa"] }
base-precompile-storage = { workspace = true, features = ["test-utils"] }
[[bench]]
name = "base_precompiles"
harness = false
required-features = ["test-utils"]

[[test]]
name = "b20_stablecoin_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_stablecoin_v2_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_asset_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_asset_v2_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_policy_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_factory_v1_golden"
required-features = ["test-utils"]

[features]
default = [ "blst", "c-kzg", "portable", "secp256k1", "std" ]
std = [
    "base-evm-handler/std",
    "alloy-primitives/std",
    "alloy-sol-types/std",
    "base-common-genesis/std",
    "base-precompile-storage/std",
    "base-evm-handler/std",
]
bn = [ "base-evm-handler/bn" ]
blst = [ "base-evm-handler/blst" ]
c-kzg = [ "base-evm-handler/c-kzg" ]
portable = [ "base-evm-handler/portable" ]
secp256k1 = [ "base-evm-handler/secp256k1" ]
memory_limit = [ "base-evm-handler/memory_limit" ]
optional_no_base_fee = [ "base-evm-handler/optional_no_base_fee" ]
optional_eip3541 = [ "base-evm-handler/optional_eip3541" ]
optional_eip3607 = [ "base-evm-handler/optional_eip3607" ]
optional_fee_charge = [ "base-evm-handler/optional_fee_charge" ]
optional_balance_check = [ "base-evm-handler/optional_balance_check" ]
optional_block_gas_limit = [ "base-evm-handler/optional_block_gas_limit" ]
test-utils = [
    "base-common-genesis/test-utils",
    "base-precompile-storage/test-utils",
]
