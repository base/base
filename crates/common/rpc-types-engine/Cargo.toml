[package]
name = "base-common-rpc-types-engine"
description = "Base RPC types for the `engine` namespace"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
sha2 = { workspace = true }
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true }
base-common-consensus = { workspace = true }
snap = { workspace = true, optional = true }
alloy-rpc-types-engine = { workspace = true }
serde = { workspace = true, optional = true }
alloy-serde = { workspace = true, optional = true }
ethereum_ssz = { workspace = true, optional = true }
ethereum_ssz_derive = { workspace = true, optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
[dev-dependencies]
arbtest = { workspace = true }
serde_json = { workspace = true }
arbitrary = { workspace = true, features = ["derive"] }
alloy-primitives = { workspace = true, features = ["arbitrary", "getrandom"] }

[features]
default = [ "serde", "std" ]
std = [
    "base-common-consensus/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "alloy-rpc-types-engine/ssz",
    "alloy-rpc-types-engine/std",
    "alloy-serde?/std",
    "base-common-consensus/std",
    "dep:ethereum_ssz",
    "dep:ethereum_ssz_derive",
    "dep:snap",
    "serde?/std",
    "sha2/std",
    "thiserror/std",
]
serde = [
    "base-common-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-rpc-types-engine/serde",
    "base-common-consensus/serde",
    "dep:alloy-serde",
    "dep:serde",
]
k256 = [ "base-common-consensus/k256" ]
arbitrary = [
    "base-common-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-primitives/rand",
    "alloy-rpc-types-engine/arbitrary",
    "alloy-serde?/arbitrary",
    "base-common-consensus/arbitrary",
    "dep:arbitrary",
    "std",
]
