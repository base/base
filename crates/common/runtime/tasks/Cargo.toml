[package]
name = "base-common-runtime-tasks"
description = "Async runtime abstraction for deterministic batcher and pipeline testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
backon = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["attributes"] }
tokio = {workspace = true,  features = ["default", "sync"]}
tokio-stream = {workspace = true,  features = ["default", "sync"]}
rand = { workspace = true, optional = true, features = ["default"] }
tokio-util = { workspace = true, optional = true, features = ["default"] }

[dev-dependencies]
tokio = {features = ["default", "full", "macros", "rt", "sync", "time"], workspace = true}

[features]
default = ["tokio"]
tokio = [
    "dep:tokio-util",
    "tokio/macros",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]
test-utils = ["dep:rand"]
time = ["tokio/time"]
