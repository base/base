[package]
name = "base-common-chains"
description = "Chain configuration and network upgrade bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
auto_impl = { workspace = true }
alloy-eips = { workspace = true }
alloy-chains = { workspace = true }
alloy-genesis = { workspace = true }
alloy-hardforks = { workspace = true }
base-common-genesis = { workspace = true }
spin = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map"] }
[dev-dependencies]
alloy-chains = { workspace = true }
[[test]]
name = "upgrade_consistency"
required-features = ["test-utils"]

[features]
default = []
std = [
	"alloy-chains/std",
	"alloy-eips/std",
	"alloy-genesis/std",
	"alloy-primitives/std",
	"base-common-genesis/std",
	"spin/std",
]
serde = [
	"alloy-chains/serde",
	"alloy-eips/serde",
	"alloy-hardforks/serde",
	"alloy-primitives/serde",
	"base-common-genesis/serde",
]
test-utils = [ "base-common-genesis/test-utils" ]
