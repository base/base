[package]
name = "base-common-chains"
description = "Chain configuration and network upgrade bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# alloy
alloy-eips.workspace = true
alloy-chains.workspace = true
alloy-genesis.workspace = true
alloy-hardforks.workspace = true
alloy-primitives = { workspace = true, features = ["map"] }
alloy-sol-types = { workspace = true, optional = true }

# base
base-common-genesis.workspace = true

# revm
revm-primitives.workspace = true

# misc
spin.workspace = true
auto_impl.workspace = true

[dev-dependencies]
rstest.workspace = true
alloy-chains.workspace = true

[[test]]
name = "upgrade_consistency"
required-features = ["test-utils"]

[features]
default = []
std = [
	"alloy-chains/std",
	"alloy-eips/std",
	"alloy-genesis/std",
	"alloy-primitives/std",
	"alloy-sol-types?/std",
	"base-common-genesis/std",
	"revm-primitives/std",
	"spin/std",
]
serde = [
	"alloy-chains/serde",
	"alloy-eips/serde",
	"alloy-hardforks/serde",
	"alloy-primitives/serde",
	"base-common-genesis/serde",
	"revm-primitives/serde",
]
test-utils = [ "base-common-genesis/test-utils" ]
abi = [ "dep:alloy-sol-types" ]
genesis-json = []
