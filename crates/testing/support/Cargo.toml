[package]
name = "base-testing-support"
description = "Shared test utilities: accounts, genesis config, and contract bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-eips = {workspace = true}
alloy-signer = { workspace = true }
base-execution-evm-runtime = { workspace = true }
base-common-client-ethereum = { workspace = true }
eyre = { workspace = true, features = ["default"] }
rand = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["std"] }
alloy-genesis = {features = ["std"], workspace = true}
rand_08 = { workspace = true, features = ["default"] }
base-common-client-contracts = { workspace = true, optional = true }
base-common-types-rpc = { workspace = true, features = ["default"] }
base-execution-state-types = {workspace = true, features = ["arbitrary"]}
base-execution-state-memory = {workspace = true, features = ["arbitrary"]}
alloy-sol-types = { workspace = true, features = ["std"], optional = true }
alloy-sol-macro = { workspace = true, features = ["json"], optional = true }
alloy-primitives = {features = ["map-foldhash", "rand", "serde"], workspace = true}
secp256k1 = { workspace = true, features = ["global-context", "recovery", "rand"] }
reth-primitives-traits = { workspace = true, features = ["secp256k1", "arbitrary"] }
base-common-types-chain = {features = ["arbitrary", "reth", "serde", "std"], workspace = true}

[features]
# The `contracts` module binds Solidity test fixtures with
# `sol!(..., concat!(env!("CARGO_MANIFEST_DIR"), "/contracts/out/<Name>.json"))`, embedding Foundry
# `out/` artifacts at compile time. Those artifacts are gitignored, so the module cannot compile
# when this crate is pulled over a git dependency. It is therefore off by default: consumers that
# only need the accounts/genesis helpers (e.g. base-testing-devnet's `test-utils`) build artifact-free,
# and consumers that use the contract bindings enable this feature (where the artifacts are built).
contracts = ["dep:base-common-client-contracts", "dep:alloy-sol-macro", "dep:alloy-sol-types"]

[dev-dependencies]
alloy-rlp = { workspace = true, features = ["core-net"] }
