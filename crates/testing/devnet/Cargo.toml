[[bench]]
name = "fcu_unsafe"
harness = false

[[test]]
name = "system_upgrade_signal"
path = "tests/system_upgrade_signal.rs"
required-features = ["upgrade-signal"]

[features]
test-utils = [
    "base-node-service/test-utils",
    "base-execution-state-database/test-utils",
    "base-common-types-chain/test-utils",
    "base-execution-state-provider/test-utils",
    "base-common-runtime/test-utils",
    "base-common-types-payload/test-utils",
    "base-common-chain-config/test-utils",
    "base-execution-rpc/client",
    "base-common-observability-events/test-utils",
    "ctor",
    "base-execution-payload/test-utils",
    "base-execution-txpool/test-utils",
    "rlimit",
]
default = ["test-utils"]
upgrade-signal = ["base-testing-support/contracts"]
