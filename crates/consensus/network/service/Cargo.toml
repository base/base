[package]
name = "base-consensus-network-service"
version.workspace = true
description = "Consensus peer discovery and payload gossip for Base"

edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.cargo-udeps.ignore]
development = ["arbtest"]

[dependencies]
dirs = { workspace = true }
sha2 = { workspace = true }
snap = { workspace = true }
libp2p-stream = { workspace = true }
metrics = {optional = true, workspace = true}
serde = {features = ["std"], workspace = true}
tracing = {features = ["std"], workspace = true}
base-consensus-batch-types = { workspace = true }
alloy-rlp = {features = ["std"], workspace = true}
discv5 = {features = ["libp2p"], workspace = true}
lru = { workspace = true, features = ["default"] }
thiserror = {features = ["std"], workspace = true}
tokio = {features = ["default"], workspace = true}
url = { workspace = true, features = ["default"] }
alloy-eips = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
base-common-observability-metrics = {workspace = true}
futures = { workspace = true, features = ["default"] }
secp256k1 = { workspace = true, features = ["default"] }
unsigned-varint = { workspace = true, features = ["std"] }
ipnet = { workspace = true, features = ["default", "serde"] }
base-common-types-rpc = {workspace = true, features = ["std"]}
libp2p-identity = {features = ["secp256k1"], workspace = true}
rand = { workspace = true, features = ["default", "thread_rng"] }
base-common-chain-config = {features = ["default"], workspace = true}
alloy-primitives = {features = ["getrandom", "k256"], workspace = true}
arbitrary = { workspace = true, features = ["derive"], optional = true }
base-common-types-chain = { workspace = true, features = ["k256", "std"] }
derive_more = {features = ["debug", "deref", "display"], workspace = true}
base-common-types-payload = {workspace = true, features = ["std", "serde"]}
backon = { workspace = true, features = ["default", "std", "tokio", "tokio-sleep"] }
libp2p = {features = ["dns", "gossipsub", "identify", "macros", "noise", "ping", "tcp", "tokio", "yamux"], workspace = true}

[dev-dependencies]
arbtest = { workspace = true }
serde_json = {features = ["std"], workspace = true}
alloy-rlp = { workspace = true, features = ["std"] }
arbitrary = {features = ["derive"], workspace = true}
rstest = { workspace = true, features = ["default"] }
tempfile = {features = ["default"], workspace = true}
multihash = {features = ["default"], workspace = true}
alloy-chains = { workspace = true, features = ["std"] }
alloy-primitives = {features = ["arbitrary"], workspace = true}
rand = { workspace = true, features = ["default", "thread_rng"] }
base-common-chain-config = { workspace = true, features = ["default"] }
base-common-observability-tracing = {workspace = true, features = ["std"]}
base-common-types-chain = { workspace = true, features = ["arbitrary", "k256", "std"] }

[features]
default = []
arbitrary = ["alloy-primitives/arbitrary", "dep:arbitrary"]
metrics = ["base-common-observability-metrics/metrics", "dep:metrics", "libp2p/metrics"]
