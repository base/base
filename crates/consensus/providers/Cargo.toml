[package]
name = "base-consensus-providers"
version.workspace = true
description = "Alloy Backed Providers"

edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base-metrics.workspace = true
base-protocol.workspace = true
base-consensus-derive.workspace = true
base-common-genesis.workspace = true

alloy-genesis.workspace = true
alloy-json-rpc.workspace = true
alloy-transport.workspace = true
alloy-rpc-client.workspace = true
alloy-rpc-types-beacon.workspace = true
alloy-serde = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["map"] }
alloy-eips = { workspace = true, features = ["kzg", "std"] }
alloy-rpc-types-engine = { workspace = true, features = ["jwt", "jwt-aws-lc-rs", "std"] }
alloy-provider = { workspace = true, features = ["ipc", "ws", "reqwest"] }
alloy-transport-http = { workspace = true, features = ["reqwest", "reqwest-rustls-tls"] }

base-common-network.workspace = true
base-common-consensus.workspace = true

lru.workspace = true
url.workspace = true
tower.workspace = true
reqwest.workspace = true
async-trait.workspace = true
http.workspace = true
serde = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["time"] }

c-kzg.workspace = true
tracing.workspace = true

metrics = { workspace = true, optional = true }

[features]
default = []
metrics = [
	"base-consensus-derive/metrics",
	"base-metrics/metrics",
	"dep:metrics",
]

[dev-dependencies]
alloy-rpc-types-eth.workspace = true
tokio = { workspace = true, features = ["macros", "test-util"] }
httpmock.workspace = true
serde_json = { workspace = true, features = ["std"] }
