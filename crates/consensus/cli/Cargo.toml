[package]
name = "base-consensus-cli"
description = "CLI argument types for Base consensus clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base-cli-utils.workspace = true
base-common-network.workspace = true
base-common-rpc-types-engine.workspace = true
base-jwt = { workspace = true, features = ["engine-validation"] }
base-upgrade-signal = { workspace = true, features = ["metrics"] }

base-protocol.workspace = true
base-consensus-rpc.workspace = true
base-consensus-peers.workspace = true
base-consensus-derive.workspace = true
base-consensus-gossip.workspace = true
base-consensus-engine.workspace = true
base-consensus-sources.workspace = true
base-common-chains.workspace = true
base-common-genesis.workspace = true
base-consensus-disc = { workspace = true, features = ["metrics"] }
base-consensus-node = { workspace = true, features = ["metrics"] }
base-consensus-providers = { workspace = true, features = ["metrics"] }
reth-node-core.workspace = true

backon.workspace = true
base-retry.workspace = true

alloy-signer.workspace = true
alloy-genesis.workspace = true
alloy-provider.workspace = true
alloy-primitives.workspace = true
alloy-signer-local.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-chains = { workspace = true, features = ["std"] }

reqwest.workspace = true
discv5 = { workspace = true, features = ["libp2p"] }
libp2p = { workspace = true, features = ["secp256k1", "macros", "tokio", "tcp", "noise", "gossipsub", "ping", "yamux", "identify"] }

url.workspace = true
clap = { workspace = true, features = ["derive", "env"] }

tokio.workspace = true
tokio-util.workspace = true

tracing = { workspace = true, features = ["std"] }

eyre.workspace = true
dirs.workspace = true
strum.workspace = true
metrics.workspace = true
serde.workspace = true

thiserror = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
rstest.workspace = true
httpmock.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
default = [ "otlp" ]
otlp = [ "base-cli-utils/otlp", "reth-node-core/otlp" ]
