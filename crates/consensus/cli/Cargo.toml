[package]
name = "base-consensus-cli"
description = "CLI argument types for Base consensus clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
dirs = { workspace = true }
strum = { workspace = true }
serde = { workspace = true }
metrics = { workspace = true }
base-retry = { workspace = true }
alloy-signer = { workspace = true }
base-protocol = { workspace = true }
alloy-genesis = { workspace = true }
base-cli-utils = { workspace = true }
reth-node-core = { workspace = true }
alloy-primitives = { workspace = true }
base-common-network = { workspace = true }
base-common-genesis = { workspace = true }
base-consensus-peers = { workspace = true }
base-consensus-derive = { workspace = true }
base-consensus-gossip = { workspace = true }
base-consensus-sources = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default"] }
discv5 = { workspace = true, features = ["libp2p"] }
serde_json = { workspace = true, features = ["std"] }
backon = { workspace = true, features = ["default"] }
reqwest = { workspace = true, features = ["default"] }
alloy-chains = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["default"] }
alloy-provider = { workspace = true, features = ["default"] }
base-consensus-rpc = { workspace = true, features = ["default"] }
base-common-chains = { workspace = true, features = ["default"] }
base-jwt = { workspace = true, features = ["engine-validation"] }
base-consensus-disc = { workspace = true, features = ["metrics"] }
base-consensus-node = { workspace = true, features = ["metrics"] }
base-common-rpc-types = { workspace = true, features = ["network"]}
clap = { workspace = true, features = ["default", "derive", "env"] }
base-consensus-providers = { workspace = true, features = ["metrics"] }
base-upgrade-signal = { workspace = true, features = ["default", "metrics"] }
libp2p = { workspace = true, features = ["secp256k1", "macros", "tokio", "tcp", "noise", "gossipsub", "ping", "yamux", "identify"] }
[dev-dependencies]
rstest = { workspace = true, features = ["default"] }
httpmock = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "test-util"] }

[features]
default = [ "otlp" ]
otlp = [ "base-cli-utils/otlp", "reth-node-core/otlp" ]
