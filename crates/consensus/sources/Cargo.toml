[package]
name = "base-consensus-sources"
version.workspace = true
description = "Data source types and utilities for the base-consensus-node"

edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
derive_more = { workspace = true }
alloy-signer = { workspace = true }
alloy-transport = { workspace = true }
alloy-primitives = { workspace = true }
base-common-network = { workspace = true }
serde = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["default"] }
thiserror = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
notify = { workspace = true, features = ["default"] }
rustls = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }
alloy-rpc-client = { workspace = true, features = ["default"] }
base-common-types-payload = { workspace = true, features = ["std", "serde"] }
alloy-transport-http = { workspace = true, features = ["default", "reqwest", "reqwest-rustls-tls", "hyper", "hyper-tls"] }
[dev-dependencies]
tokio = { workspace = true, features = ["default"] }

[features]
default = []
