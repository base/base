[package]
name = "base-consensus-l1"
description = "Minimal stateless L1 node embedded in the Base binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# consensus
base-protocol.workspace = true
base-consensus-peers.workspace = true
base-consensus-derive.workspace = true

# alloy
alloy-consensus = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std", "kzg"] }
alloy-primitives = { workspace = true, features = ["std", "serde"] }
alloy-rpc-types-eth = { workspace = true, features = ["std", "serde"] }

# reth
reth-tasks.workspace = true
reth-network.workspace = true
reth-cli-util.workspace = true
reth-chainspec.workspace = true
reth-storage-api.workspace = true
reth-network-api.workspace = true
reth-network-p2p.workspace = true
reth-eth-wire-types.workspace = true
reth-ethereum-forks.workspace = true
reth-ethereum-primitives.workspace = true

# networking
snap.workspace = true
discv5.workspace = true
futures.workspace = true
libp2p-stream.workspace = true
unsigned-varint.workspace = true
libp2p = { workspace = true, features = ["secp256k1", "macros", "tokio", "tcp", "noise", "yamux", "identify", "gossipsub"] }

# ssz
ethereum_ssz.workspace = true
ethereum_ssz_derive.workspace = true

# crypto
blst.workspace = true
sha2 = { workspace = true, features = ["std"] }

# rpc
jsonrpsee = { workspace = true, features = ["server"] }

# serde
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

# misc
url.workspace = true
lru.workspace = true
eyre.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
derive_more = { workspace = true, features = ["debug"] }
tokio = { workspace = true, features = ["net", "sync", "time", "macros", "rt-multi-thread"] }
