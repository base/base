[package]
name = "base-consensus-disc"
version.workspace = true
description = "Discovery service for Base"

edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
libp2p = { workspace = true }
derive_more = { workspace = true }
base-metrics = { workspace = true }
base-consensus-peers = { workspace = true }
metrics = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"] }
alloy-rlp = { workspace = true, features = ["std"] }
discv5 = { workspace = true, features = ["libp2p"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default"] }
rand = { workspace = true, features = ["default", "thread_rng"] }
backon = { workspace = true, features = ["default", "std", "tokio", "tokio-sleep"] }

[dev-dependencies]
base-cli-utils = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true, features = ["default"] }
base-common-chain-config = { workspace = true, features = ["default"] }

[features]
default = []
metrics = [ "base-metrics/metrics", "dep:metrics", "libp2p/metrics" ]
