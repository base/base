[package]
name = "base-consensus-rpc"
description = "RPC Types and Client for Base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
libp2p = { workspace = true }
async-trait = { workspace = true }
base-consensus-gossip = { workspace = true }
base-consensus-engine = { workspace = true }
base-consensus-safedb = { workspace = true }
serde = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
ipnet = { workspace = true, features = ["default"] }
backon = { workspace = true, features = ["default"] }
getrandom = { workspace = true, features = ["wasm_js"] }
tokio = { workspace = true, features = ["default", "time"] }
alloy-eips = { workspace = true, features = ["serde", "std"] }
base-protocol = { workspace = true, features = ["serde", "std"] }
jsonrpsee = { workspace = true, features = ["macros", "server"] }
base-upgrade-signal = { workspace = true, features = ["default"] }
base-common-genesis = { workspace = true, features = ["serde", "std"] }
base-common-rpc-types-engine = { workspace = true, features = ["serde", "std"] }
alloy-primitives = { workspace = true, features = ["map", "rlp", "serde", "std"] }
[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
rstest = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "macros", "rt", "sync"] }
[features]
default = []
reqwest = [ "client" ]
client = [
	"jsonrpsee/async-client",
	"jsonrpsee/client",
	"jsonrpsee/http-client",
]
metrics = [
	"base-consensus-engine/metrics",
	"base-consensus-gossip/metrics",
	"base-upgrade-signal/metrics",
	"libp2p/metrics",
]
