[package]
name = "base-consensus-safedb"
description = "Persistent safe head tracking for Base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
redb = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
base-protocol = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default", "rt"] }
alloy-primitives = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["serde", "std"] }
[dev-dependencies]
tempfile = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "rt", "macros"] }
