[package]
name = "base-consensus-gossip"
version.workspace = true
description = "Gossip protocol implementation for Base"

edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
sha2 = { workspace = true }
snap = { workspace = true }
serde_repr = { workspace = true }
base-metrics = { workspace = true }
base-protocol = { workspace = true }
libp2p-stream = { workspace = true }
base-consensus-disc = { workspace = true }
base-common-genesis = { workspace = true }
base-consensus-peers = { workspace = true }
metrics = { workspace = true, optional = true }
serde = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
lru = { workspace = true, features = ["default"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default"] }
discv5 = { workspace = true, features = ["libp2p"] }
alloy-eips = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["default"] }
ipnet = { workspace = true, features = ["default", "serde"] }
libp2p-identity = { workspace = true, features = ["secp256k1"] }
base-common-types-chain = { workspace = true, features = ["k256", "std"] }
alloy-primitives = { workspace = true, features = ["k256", "getrandom"] }
derive_more = { workspace = true, features = ["display", "deref", "debug"] }
base-common-rpc-types-engine = {workspace = true, features = ["std", "serde"]}
libp2p = { workspace = true, features = ["macros", "tokio", "tcp", "dns", "noise", "gossipsub", "ping", "yamux", "identify"] }
[dev-dependencies]
alloy-rlp = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
alloy-chains = { workspace = true, features = ["std"] }
arbitrary = { workspace = true, features = ["derive"] }
tempfile = { workspace = true, features = ["default"] }
multihash = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["arbitrary"] }
rand = { workspace = true, features = ["default", "thread_rng"] }
base-common-types-chain = { workspace = true, features = ["arbitrary", "k256", "std"] }

[features]
default = []
metrics = [
	"base-consensus-disc/metrics",
	"base-metrics/metrics",
	"dep:metrics",
	"libp2p/metrics",
]
