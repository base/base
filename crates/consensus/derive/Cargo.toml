[package]
name = "base-consensus-derive"
description = "A no_std derivation pipeline implementation for Base"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
async-trait = { workspace = true }
alloy-genesis = { workspace = true }
base-consensus-batch = { workspace = true }
serde = { workspace = true, optional = true }
base-common-chain-config = { workspace = true }
metrics = { workspace = true, optional = true }
base-common-types-payload = { workspace = true }
alloy-rlp = { workspace = true, features = ["derive"] }
base-common-observability-metrics = { workspace = true }
base-common-types-chain = { workspace = true, features = ["k256"] }
spin = { workspace = true, optional = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["rlp", "k256", "map"] }
tracing-subscriber = { workspace = true, features = ["default", "fmt"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
spin = { workspace = true, features = ["default"] }
proptest = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }
base-consensus-batch = { workspace = true, features = ["test-utils"] }
tracing-subscriber = { workspace = true, features = ["default", "fmt"] }
base-common-chain-config = { workspace = true, features = ["default", "test-utils"] }
alloy-primitives = { workspace = true, features = ["rlp", "k256", "map", "arbitrary"] }

[features]
default = []
metrics = ["base-common-observability-metrics/metrics", "dep:metrics"]
serde = [
    "base-common-types-chain/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "base-common-types-payload/serde",
    "base-common-chain-config/serde",
    "base-consensus-batch/serde",
    "dep:serde",
    "tracing-subscriber?/serde",
]
test-utils = [
    "base-common-chain-config/test-utils",
    "base-consensus-batch/test-utils",
    "dep:spin",
    "dep:tracing-subscriber",
]
