[package]
name = "base-consensus-derive"
description = "A no_std derivation pipeline implementation for Base"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
async-trait = { workspace = true }
base-metrics = { workspace = true }
base-protocol = { workspace = true }
alloy-genesis = { workspace = true }
base-common-genesis = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
serde = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
base-common-rpc-types-engine = { workspace = true }
alloy-rlp = { workspace = true, features = ["derive"] }
base-common-consensus = { workspace = true, features = ["k256"] }
spin = { workspace = true, optional = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["rlp", "k256", "map"] }
tracing-subscriber = { workspace = true, features = ["default", "fmt"], optional = true }
[dev-dependencies]
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
spin = { workspace = true, features = ["default"] }
proptest = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "full"] }
base-protocol = { workspace = true, features = ["test-utils"] }
base-common-chains = { workspace = true, features = ["default"] }
base-common-genesis = { workspace = true, features = ["test-utils"] }
tracing-subscriber = { workspace = true, features = ["default", "fmt"] }
alloy-primitives = { workspace = true, features = ["rlp", "k256", "map", "arbitrary"] }


[features]
default = []
metrics = [ "base-metrics/metrics", "dep:metrics" ]
serde = [
    "base-common-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-rpc-types-engine/serde",
    "base-common-consensus/serde",
    "base-common-genesis/serde",
    "base-common-rpc-types-engine/serde",
    "base-protocol/serde",
    "dep:serde",
    "tracing-subscriber?/serde",
]
test-utils = [
	"base-common-genesis/test-utils",
	"base-protocol/test-utils",
	"dep:spin",
	"dep:tracing-subscriber",
]
