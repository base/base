[package]
name = "base-builder-core"
description = "Block builder for Base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = [ "jemalloc", "metrics" ]
metrics = [
	"base-metrics/metrics",
	"dep:metrics",
	"reth-evm/metrics",
	"reth-trie/metrics",
]
jemalloc = []
jemalloc-prof = [ "jemalloc" ]
min-error-logs = [ "tracing/release_max_level_error" ]
min-warn-logs = [ "tracing/release_max_level_warn" ]
min-info-logs = [ "tracing/release_max_level_info" ]
min-debug-logs = [ "tracing/release_max_level_debug" ]
min-trace-logs = [ "tracing/release_max_level_trace" ]
test-utils = [
	"base-bundles/test-utils",
	"base-node-core/test-utils",
	"base-node-runner/test-utils",
	"dep:alloy-contract",
	"dep:alloy-network",
	"dep:alloy-provider",
	"dep:alloy-rpc-types-engine",
	"dep:alloy-signer-local",
	"dep:alloy-sol-types",
	"dep:base-alloy-network",
	"dep:base-alloy-rpc-types",
	"dep:base-alloy-rpc-types-engine",
	"dep:base-execution-rpc",
	"dep:chrono",
	"dep:ctor",
	"dep:dashmap",
	"dep:jsonrpsee",
	"dep:k256",
	"dep:nanoid",
	"dep:rand",
	"dep:reth-db",
	"dep:reth-ipc",
	"dep:reth-node-core",
	"dep:reth-rpc-layer",
	"dep:rlimit",
	"dep:testcontainers",
	"dep:tokio-tungstenite",
	"dep:tower",
	"dep:tracing-subscriber",
	"dep:url",
	"reth-chainspec/test-utils",
	"reth-db/test-utils",
	"reth-evm/test-utils",
	"reth-node-builder/test-utils",
	"reth-payload-builder/test-utils",
	"reth-primitives-traits/test-utils",
	"reth-primitives/test-utils",
	"reth-provider/test-utils",
	"reth-revm/test-utils",
	"reth-tasks/test-utils",
	"reth-transaction-pool/test-utils",
	"reth-trie/test-utils",
]

[dependencies]
# workspace
base-bundles.workspace = true
base-node-runner.workspace = true
base-access-lists.workspace = true
base-builder-publish.workspace = true
base-alloy-flashblocks.workspace = true

# reth
reth-evm.workspace = true
reth-trie.workspace = true
reth-revm.workspace = true
reth-tasks.workspace = true
base-txpool.workspace = true
reth-provider.workspace = true
reth-node-api.workspace = true
base-node-core.workspace = true
base-metrics.workspace = true
reth-chainspec.workspace = true
reth-primitives.workspace = true
reth-payload-util.workspace = true
reth-node-builder.workspace = true
base-execution-evm.workspace = true
reth-execution-types.workspace = true
reth-payload-builder.workspace = true
reth-primitives-traits.workspace = true
reth-transaction-pool.workspace = true
reth-payload-primitives.workspace = true
base-execution-chainspec.workspace = true
base-execution-consensus.workspace = true
base-execution-primitives.workspace = true
reth-basic-payload-builder.workspace = true
base-execution-payload-builder.workspace = true
reth-db = { workspace = true, optional = true }
reth-ipc = { workspace = true, optional = true }
reth-node-core = { workspace = true, features = ["otlp"], optional = true }

# revm
revm.workspace = true
base-revm.workspace = true

# alloy
alloy-evm.workspace = true
alloy-primitives.workspace = true
alloy-eips = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }
alloy-contract = { workspace = true, optional = true }
alloy-network = { workspace = true, optional = true }
alloy-provider = { workspace = true, default-features = true, features = ["txpool-api"], optional = true }
alloy-rpc-types-engine = { workspace = true, features = ["std"], optional = true }
alloy-signer-local = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, features = ["json", "std"], optional = true }

# base-alloy
base-alloy-flz.workspace = true
base-alloy-chains.workspace = true
base-alloy-consensus.workspace = true
base-alloy-evm = { workspace = true, features = ["std"] }
base-alloy-network = { workspace = true, optional = true }
base-alloy-rpc-types = { workspace = true, optional = true }
base-alloy-rpc-types-engine = { workspace = true, optional = true }

# tokio
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite = { workspace = true, optional = true }

# async
futures.workspace = true
async-trait.workspace = true

# rpc
jsonrpsee = { workspace = true, optional = true }
base-execution-rpc = { workspace = true, features = ["client"], optional = true }
reth-rpc-layer = { workspace = true, optional = true }

# cli
clap.workspace = true

# tracing
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"], optional = true }

# metrics
metrics = { workspace = true, optional = true }

# misc
either.workspace = true
eyre.workspace = true
rand = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
serde_with.workspace = true
parking_lot.workspace = true
derive_more.workspace = true
testcontainers = { workspace = true, optional = true }
ctor = { workspace = true, optional = true }
rlimit = { workspace = true, optional = true }
nanoid = { workspace = true, optional = true }
serde = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
url = { workspace = true, optional = true }

[dev-dependencies]
# workspace
base-builder-core = { path = ".", features = ["test-utils"] }

# reth
reth-node-builder = { workspace = true, features = ["test-utils"] }
reth-testing-utils.workspace = true
reth-ipc.workspace = true

# metrics
metrics-exporter-prometheus.workspace = true

# alloy
alloy-provider = { workspace = true, default-features = true, features = ["txpool-api"] }
alloy-rpc-client.workspace = true

# misc
tempfile.workspace = true
rand.workspace = true
rlimit.workspace = true
nanoid.workspace = true
ctor.workspace = true
