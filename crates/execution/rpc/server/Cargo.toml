[package]
name = "base-execution-rpc-server"
description = "Helpers for configuring RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
metrics = { workspace = true }
dyn-clone = { workspace = true }
pin-project = {workspace = true}
thiserror = { workspace = true }
reth-node-core = { workspace = true }
base-execution-txpool = {workspace = true}
reth-engine-primitives = { workspace = true }
reth-primitives-traits = { workspace = true }
base-execution-evm-blocks = {workspace = true}
base-common-chain-config = { workspace = true }
tower = {workspace = true, features = ["full"]}
base-execution-rpc-handlers = {workspace = true}
http = {workspace = true, features = ["default"]}
serde = {workspace = true, features = ["derive"]}
strum = { workspace = true, features = ["derive"] }
base-execution-state-provider = { workspace = true }
base-execution-network-service = { workspace = true }
jsonrpsee = { workspace = true, features = ["server"] }
tracing = { workspace = true, features = ["attributes"] }
tower-http = {workspace = true, features = ["default", "full"]}
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["default", "codec"] }
base-common-runtime-tasks = {workspace = true, features = ["rayon"]}
jsonrpsee-http-client = { workspace = true, features = ["default"] }
base-common-types-payload = { workspace = true, features = ["jwt-aws-lc-rs", "serde"] }
base-common-observability-metrics = { workspace = true, features = ["common", "metrics"] }
base-common-client-ethereum = {workspace = true, features = ["debug-api", "reqwest", "ws"]}

[dependencies.base-common-types-rpc]
workspace = true

[dev-dependencies]
alloy-eips = { workspace = true }
base-common-types-rpc = {workspace = true}
base-common-types-payload = { workspace = true }
base-execution-network-types = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
jsonrpsee = { workspace = true, features = ["server"] }
serde_json = { workspace = true, features = ["alloc"] }
clap = { workspace = true, features = ["default", "derive"] }
http-body-util = { workspace = true, features = ["default"] }
reqwest = {workspace = true, features = ["rustls", "stream"]}
base-common-types-chain = { workspace = true, features = ["serde"]}
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-execution-txpool = { workspace = true, features = ["test-utils"] }
reth-engine-primitives = { workspace = true, features = ["test-utils"] }
base-common-runtime-tasks = { workspace = true, features = ["test-utils"] }
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
base-execution-payload-builder = { workspace = true, features = ["test-utils"] }
base-execution-rpc-handlers = { workspace = true, features = ["test-utils", "client"] }

[dev-dependencies.tracing]
workspace = true
features = ["attributes"]
