base-node-runner = { workspace = true, features = ["test-utils"] }
base-execution-state-api = { workspace = true, features = ["std"] }
base-execution-txpool = {workspace = true, features = ["test-utils"]}
base-execution-evm-runtime = {workspace = true, features = ["default"]}
base-common-client-ethereum = {workspace = true, features = ["default"]}
reth-engine-primitives = { workspace = true, features = ["test-utils"] }
base-common-types-chain = {workspace = true, features = ["reth", "serde"]}
base-consensus-batch-types = {features = ["test-utils"], workspace = true}
base-common-runtime-tasks = { workspace = true, features = ["test-utils"] }
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }
base-execution-state-provider = {workspace = true, features = ["test-utils"]}
tokio = {workspace = true, features = ["default", "macros", "rt-multi-thread"]}
base-execution-payload-builder = { workspace = true, features = ["test-utils"] }
base-common-observability-events = { workspace = true, features = ["test-utils"] }

[features]
default = ["metrics"]
client = ["base-execution-state-provider/serde", "jsonrpsee/async-client", "jsonrpsee/client"]
metrics = [
    "base-execution-payload-builder/metrics",
    "base-execution-state-tasks/metrics",
    "base-common-observability-metrics/metrics",
    "base-common-observability-events/metrics",
    "base-execution-evm-blocks/metrics",
]
test-utils = [
    "base-execution-evm-blocks/test-utils",
    "base-execution-state-provider/test-utils",
    "reth-network/test-utils",
    "dep:base-execution-state-maintenance",
]
js-tracer = ["base-execution-evm-inspectors/js-tracer"]
