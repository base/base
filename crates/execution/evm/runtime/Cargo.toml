[package]
name = "base-execution-evm-runtime"
description = "EVM implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
either = { workspace = true }
auto_impl = {workspace = true}
thiserror = {workspace = true}
tracing = { workspace = true }
alloy-eips = {workspace = true}
alloy-primitives = {workspace = true}
alloy-hardforks = { workspace = true }
base-common-types-rpc = { workspace = true}
base-execution-evm-fees = {workspace = true}
base-execution-evm-machine = {workspace = true}
base-execution-state-types = {workspace = true}
metrics = { workspace = true, optional = true }
base-execution-evm-crypto = { workspace = true }
base-execution-state-memory = {workspace = true}
base-execution-evm-primitives = {workspace = true}
base-execution-evm-precompiles = {workspace = true }
derive_more = { workspace = true, features = ["full"] }
base-common-types-chain = {features = ["k256"], workspace = true}
base-common-chain-config = {workspace = true, features = ["default"]}
serde = {features = ["derive", "rc"], optional = true, workspace = true}
base-common-observability-metrics = { workspace = true, optional = true }
serde_json = { workspace = true, features = [
    "alloc",
    "preserve_order",
], optional = true }

[dev-dependencies]
sha2 = { workspace = true }
alloy-signer = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-sol-types = { workspace = true }
base-common-types-rpc = { workspace = true }
base-common-client-ethereum = { workspace = true }
rstest = { workspace = true, features = ["default"] }
alloy-primitives = {features = ["serde"], workspace = true}
k256 = { workspace = true, features = ["default", "ecdsa"] }
base-execution-state-memory = { workspace = true, features = ["serde"]}
base-execution-evm-precompiles = { workspace = true, features = ["test-utils"] }
serde_json = {features = ["alloc", "default", "preserve_order"], workspace = true}

[features]
default = [
    "blst",
    "c-kzg",
    "portable",
    "secp256k1",
    "std",
]
std = [
    "alloy-eips/std",
    "alloy-primitives/std",
    "base-common-chain-config/std",
    "base-execution-evm-fees/std",
    "base-execution-evm-precompiles/std",
    "base-common-types-chain/std",
    "base-common-types-rpc/std",
    "base-execution-evm-machine/std",
    "base-common-observability-metrics?/std",
    "base-execution-state-memory/std",
    "derive_more/std",
    "either/std",
    "base-execution-evm-primitives/std",
    "base-execution-evm-crypto/std",
    "serde?/std",
    "serde_json?/preserve_order",
    "serde_json?/std",
    "thiserror/std",
    "tracing/std",
    "base-execution-state-types/std",
]
serde = [
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "base-common-chain-config/serde",
    "base-common-types-chain/serde",
    "base-execution-evm-machine/serde",
    "base-execution-state-memory/serde",
    "dep:serde",
    "either/serde",
    "base-execution-evm-primitives/serde",
]
metrics = [
    "base-common-observability-metrics/metrics",
    "dep:base-common-observability-metrics",
    "dep:metrics",
    "std",
]
bn = ["base-execution-evm-precompiles/bn", "base-execution-evm-crypto/bn"]
blst = ["base-execution-evm-precompiles/blst", "base-execution-evm-crypto/blst"]
c-kzg = ["base-execution-evm-precompiles/c-kzg", "base-execution-evm-crypto/c-kzg"]
portable = ["base-execution-evm-precompiles/portable", "base-execution-evm-crypto/portable"]
secp256k1 = ["base-execution-evm-precompiles/secp256k1", "base-execution-evm-crypto/secp256k1"]
memory_limit = ["base-execution-evm-precompiles/memory_limit", "base-execution-evm-machine/memory_limit"]
optional_no_base_fee = ["base-execution-evm-precompiles/optional_no_base_fee", "base-execution-evm-machine/optional_no_base_fee"]
optional_eip3541 = ["base-execution-evm-precompiles/optional_eip3541", "base-execution-evm-machine/optional_eip3541"]
optional_eip3607 = ["base-execution-evm-precompiles/optional_eip3607", "base-execution-evm-machine/optional_eip3607"]
optional_fee_charge = ["base-execution-evm-precompiles/optional_fee_charge", "base-execution-evm-machine/optional_fee_charge"]
optional_balance_check = ["base-execution-evm-precompiles/optional_balance_check", "base-execution-evm-machine/optional_balance_check"]
optional_block_gas_limit = ["base-execution-evm-precompiles/optional_block_gas_limit", "base-execution-evm-machine/optional_block_gas_limit"]
serde-json = ["serde", "tracer"]
tracer = [
    "dep:serde",
    "dep:serde_json",
    "serde",
    "std",
]
asm-keccak = ["alloy-primitives/asm-keccak", "base-execution-evm-primitives/asm-keccak"]
call-util = ["overrides"]
gmp = ["base-execution-evm-crypto/gmp"]
overrides = []
arbitrary = ["base-execution-evm-primitives/arbitrary"]
dev = [
    "memory_limit",
    "optional_balance_check",
    "optional_block_gas_limit",
    "optional_eip3541",
    "optional_eip3607",
    "optional_eip7623",
    "optional_no_base_fee",
]
hashbrown = ["base-execution-evm-machine/hashbrown", "base-execution-evm-crypto/hashbrown"]
map-foldhash = ["base-execution-evm-primitives/map-foldhash"]
optional_eip7623 = ["base-execution-evm-machine/optional_eip7623"]
optional_priority_fee_check = ["base-execution-evm-machine/optional_priority_fee_check"]
p256-aws-lc-rs = ["base-execution-evm-crypto/p256-aws-lc-rs"]
parse = ["base-execution-evm-primitives/parse"]
sha3-keccak = ["base-execution-evm-primitives/sha3-keccak"]
