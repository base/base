    "alloy-eips/std",
    "alloy-primitives/std",
    "base-common-chain-config/std",
    "base-common-types-chain/std",
    "base-common-observability-metrics?/std",
    "derive_more/std",
    "either/std",
    "serde?/std",
    "thiserror/std",
    "tracing/std",
    "once_cell/std",
    "bitvec/std",
    "alloy-genesis/std",
    "alloy-trie/std",
    "bitflags/std",
    "alloy-eip7928/std",
    "nonmax/std",
    "alloy-eip7702/std",
    "alloy-eip2930/std",
    "k256/std",
    "c-kzg?/std",
    "secp256k1_0_31_1?/std",
    "ark-bn254_0_6_0/std",
    "ark-bls12-381/std",
    "aurora-engine-modexp/std",
    "ark-ec/std",
    "ark-ff/std",
    "ark-serialize/std",
    "ark-std/std",
    "p256/std",
    "alloy-sol-types/std",
