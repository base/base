[package]
name = "base-execution-evm-runtime"
description = "EVM implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
either = { workspace = true }
nonmax = { workspace = true }
cfg-if = { workspace = true }
ark-ec = { workspace = true }
ripemd = { workspace = true }
tracing = { workspace = true }
bitflags = { workspace = true }
arrayref = { workspace = true }
auto_impl = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-trie = { workspace = true }
sha2_0_11_0 = { workspace = true }
derive-where = { workspace = true }
alloy-eip7928 = { workspace = true }
alloy-genesis = { workspace = true }
alloy-eip2930 = { workspace = true }
ark-serialize = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-hardforks = { workspace = true }
aurora-engine-modexp = { workspace = true }
sha2 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
base-execution-evm-macros = { workspace = true }
ark-ff = { workspace = true, features = ["asm"] }
k256 = { workspace = true, features = ["ecdsa"] }
p256 = { workspace = true, features = ["ecdsa"] }
bitvec = { workspace = true, features = ["alloc"] }
modular-bitfield = { workspace = true, optional = true }
alloy-eip7702 = { workspace = true, features = ["k256"] }
ark-bls12-381 = { workspace = true, features = ["curve"] }
ark-bn254_0_6_0 = { workspace = true, features = ["curve"] }
once_cell = { workspace = true, features = ["alloc", "race"] }
base-common-types-chain = { features = ["k256"], workspace = true }
blst = { workspace = true, optional = true, features = ["default"] }
base64 = { workspace = true, features = ["default"], optional = true }
base-common-chain-config = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, optional = true, features = ["derive"] }
base-common-observability-metrics = { workspace = true, optional = true }
serde = { features = ["derive", "rc"], optional = true, workspace = true }
aws-lc-rs = { workspace = true, features = ["aws-lc-sys"], optional = true }
alloy-primitives = { workspace = true, features = ["map-indexmap", "rlp", "map"] }
c-kzg = { workspace = true, features = ["ethereum_kzg_settings"], optional = true }
derive_more = { workspace = true, features = ["full", "deref", "debug", "from", "try_into"] }
secp256k1_0_31_1 = { workspace = true, features = ["alloc", "recovery", "rand", "global-context"], optional = true }

[dev-dependencies]
sha2 = { workspace = true }
mockall = { workspace = true }
ark-std = { workspace = true }
alloy-signer = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-sol-types = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
base-common-client-ethereum = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rstest = { workspace = true, features = ["default"] }
anyhow = { workspace = true, features = ["default"] }
proptest = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
criterion = { workspace = true, features = ["default"] }
k256 = { workspace = true, features = ["default", "ecdsa"] }
rand_0_10_2 = { workspace = true, features = ["default", "std"] }
codspeed-criterion-compat_5_0 = { workspace = true, features = ["default"] }
alloy-primitives = { features = ["serde", "arbitrary", "rand"], workspace = true }
serde_json = { features = ["alloc", "default", "preserve_order"], workspace = true }
base-execution-evm-runtime = { workspace = true, features = ["serde", "test-utils"] }

[[test]]
name = "core_machine_miri_read_slice_oob"
path = "tests/core_machine/miri_read_slice_oob.rs"

[[test]]
name = "core_precompiles_b20_stablecoin_v1_golden"
required-features = ["test-utils"]
path = "tests/core_precompiles/b20_stablecoin_v1_golden.rs"

[[test]]
name = "core_precompiles_b20_stablecoin_v2_golden"
required-features = ["test-utils"]
path = "tests/core_precompiles/b20_stablecoin_v2_golden.rs"

[[test]]
name = "core_precompiles_b20_asset_v1_golden"
required-features = ["test-utils"]
path = "tests/core_precompiles/b20_asset_v1_golden.rs"

[[test]]
name = "core_precompiles_b20_asset_v2_golden"
required-features = ["test-utils"]
path = "tests/core_precompiles/b20_asset_v2_golden.rs"

[[test]]
name = "core_precompiles_b20_policy_v1_golden"
required-features = ["test-utils"]
path = "tests/core_precompiles/b20_policy_v1_golden.rs"

[[test]]
name = "core_precompiles_b20_factory_v1_golden"
required-features = ["test-utils"]
path = "tests/core_precompiles/b20_factory_v1_golden.rs"

[[test]]
name = "core_precompiles_contract"
required-features = ["test-utils"]
path = "tests/core_precompiles/contract.rs"

[[test]]
name = "core_precompiles_b20_policy_v2_golden"
required-features = ["test-utils"]
path = "tests/core_precompiles/b20_policy_v2_golden.rs"

[[bench]]
name = "core_precompiles_base_precompiles"
harness = false
required-features = ["test-utils"]
path = "benches/core_precompiles/base_precompiles.rs"

[features]
default = ["blst", "c-kzg", "portable", "secp256k1", "std"]
