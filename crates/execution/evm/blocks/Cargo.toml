[package]
name = "base-execution-evm-blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = {workspace = true}
tracing = { workspace = true }
alloy-eips = {workspace = true}
alloy-trie = { workspace = true }
futures-util = { workspace = true }
base-protocol = { workspace = true }
base-evm-handler = {workspace = true}
alloy-hardforks = { workspace = true }
base-evm-context = { workspace = true }
reth-storage-errors = {workspace = true}
reth-primitives-traits = {workspace = true}
rayon = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
reth-trie = { workspace = true, optional = true }
base-execution-payload-types = { workspace = true }
reth-metrics = { workspace = true, optional = true }
alloy-eip7928 = {features = ["rlp"], workspace = true}
derive_more = { workspace = true, features = ["full"] }
fixed-cache = { workspace = true, features = ["alloc"] }
alloy-rpc-types-debug = { workspace = true, optional = true }
reth-storage-api = {features = ["default"], workspace = true}
reth-trie-common = {features = ["default"], workspace = true}
base-common-types-chain = {features = ["reth"], workspace = true}
reth-execution-types = {features = ["default"], workspace = true}
alloy-primitives = {features = ["map-foldhash"], workspace = true}
base-common-evm = { workspace = true, features = ["std", "reth"] }
base-common-types-payload = { workspace = true, features = ["serde"] }
alloy-rlp = { workspace = true, features = ["core-net"], optional = true }
base-common-chain-config = {features = ["default", "std"], workspace = true}

[dev-dependencies]
reth-trie = {workspace = true}
alloy-eips = { workspace = true }
alloy-chains = { workspace = true }
alloy-genesis = { workspace = true }
alloy-hardforks = {workspace = true}
base-protocol = { workspace = true }
reth-db-common = { workspace = true }
rand = { workspace = true, features = ["default"] }
reth-provider = { workspace = true, features = ["test-utils"] }
base-common-chain-config = {features = ["std"], workspace = true}
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
base-common-types-chain = {features = ["arbitrary", "reth", "serde"], workspace = true}

[[test]]
name = "block_execution"
required-features = ["test-utils"]

[features]
default = ["metrics", "std"]
metrics = [
    "base-common-evm/metrics",
    "std",
    "dep:metrics",
    "dep:reth-metrics",
]
std = [
    "alloy-chains/std",
    "alloy-eip7928/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rlp?/std",
    "alloy-trie/std",
    "base-common-chain-config/std",
    "base-common-evm/std",
    "base-common-types-chain/std",
    "base-evm-handler/std",
    "base-execution-payload-types/std",
    "base-protocol/std",
    "dep:rayon",
    "derive_more/std",
    "fixed-cache/std",
    "futures-util/std",
    "reth-execution-types/std",
    "reth-primitives-traits/std",
    "reth-storage-api/std",
    "reth-storage-errors/std",
    "reth-trie-common/std",
    "thiserror/std",
    "tracing/std",
]
portable = ["base-common-evm/portable", "base-evm-handler/portable"]
rpc = ["base-evm-handler/rpc"]
test-utils = [
    "dep:reth-trie",
    "reth-primitives-traits/test-utils",
    "reth-trie-common/test-utils",
    "reth-trie?/test-utils",
    "std",
]
witness = ["dep:reth-trie", "dep:alloy-rlp", "dep:alloy-rpc-types-debug"]
serde = [
    "base-evm-handler/serde",
    "alloy-primitives/serde",
    "base-common-types-chain/serde",
    "reth-trie?/serde",
    "reth-primitives-traits/serde",
    "reth-storage-api/serde",
]
gmp = ["base-evm-handler/gmp"]
optional-balance-check = ["base-evm-handler/optional_balance_check"]
optional-block-gas-limit = ["base-evm-handler/optional_block_gas_limit"]
optional-eip3541 = ["base-evm-handler/optional_eip3541"]
optional-eip3607 = ["base-evm-handler/optional_eip3607"]
optional-no-base-fee = ["base-evm-handler/optional_no_base_fee"]
optional-checks = [
    "optional-balance-check",
    "optional-block-gas-limit",
    "optional-eip3541",
    "optional-eip3607",
    "optional-no-base-fee",
]
memory_limit = ["base-evm-handler/memory_limit"]
