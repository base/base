[package]
name = "base-execution-evm-blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = {workspace = true}
tracing = { workspace = true }
alloy-eips = {workspace = true}
alloy-trie = { workspace = true }
futures-util = { workspace = true }
alloy-hardforks = { workspace = true }
reth-primitives-traits = {workspace = true}
rayon = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
base-execution-state-memory = {workspace = true}
base-consensus-batch-types = { workspace = true }
base-execution-evm-machine = { workspace = true }
base-execution-payload-types = { workspace = true }
alloy-eip7928 = {features = ["rlp"], workspace = true}
derive_more = { workspace = true, features = ["full"] }
fixed-cache = { workspace = true, features = ["alloc"] }
alloy-rpc-types-debug = { workspace = true, optional = true }
base-common-types-chain = {features = ["reth"], workspace = true}
base-execution-state-trie = { workspace = true, optional = true }
alloy-primitives = {features = ["map-foldhash"], workspace = true}
base-execution-evm-runtime = {features = ["std"], workspace = true}
base-execution-state-api = {features = ["default"], workspace = true}
base-common-types-payload = { workspace = true, features = ["serde"] }
base-execution-state-types = {features = ["default"], workspace = true}
alloy-rlp = { workspace = true, features = ["core-net"], optional = true }
base-common-chain-config = {features = ["default", "std"], workspace = true}
base-common-observability-metrics = { workspace = true, optional = true, features = ["metrics"]}

[dev-dependencies]
alloy-eips = { workspace = true }
alloy-chains = { workspace = true }
alloy-genesis = { workspace = true }
alloy-hardforks = {workspace = true}
base-execution-state-maintenance = { workspace = true }
base-execution-state-trie = {workspace = true}
base-consensus-batch-types = { workspace = true }
rand = { workspace = true, features = ["default"] }
base-common-chain-config = {features = ["std"], workspace = true}
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }
base-common-types-chain = {features = ["arbitrary", "reth", "serde"], workspace = true}

[[test]]
name = "block_execution"
required-features = ["test-utils"]

[features]
default = ["metrics", "std"]
metrics = [
    "base-execution-evm-runtime/metrics",
    "std",
    "dep:metrics",
    "dep:base-common-observability-metrics",
]
std = [
    "alloy-chains/std",
    "alloy-eip7928/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rlp?/std",
    "alloy-trie/std",
    "base-common-chain-config/std",
    "base-execution-evm-runtime/std",
    "base-common-types-chain/std",
    "base-execution-payload-types/std",
    "base-consensus-batch-types/std",
    "dep:rayon",
    "derive_more/std",
    "fixed-cache/std",
    "futures-util/std",
    "base-execution-state-types/std",
    "reth-primitives-traits/std",
    "base-execution-state-api/std",
    "thiserror/std",
    "tracing/std",
    "base-execution-state-memory/std",
]
portable = ["base-execution-evm-runtime/portable"]
test-utils = [
    "dep:base-execution-state-trie",
    "reth-primitives-traits/test-utils",
    "base-execution-state-types/test-utils",
    "base-execution-state-trie?/test-utils",
    "std",
    "base-execution-state-memory/test-utils",
]
witness = ["dep:base-execution-state-trie", "dep:alloy-rlp", "dep:alloy-rpc-types-debug"]
serde = [
    "base-execution-evm-runtime/serde",
    "alloy-primitives/serde",
    "base-common-types-chain/serde",
    "base-execution-state-trie?/serde",
    "reth-primitives-traits/serde",
    "base-execution-state-api/serde",
    "base-execution-state-memory/serde",
]
gmp = ["base-execution-evm-runtime/gmp"]
optional-balance-check = ["base-execution-evm-runtime/optional_balance_check"]
optional-block-gas-limit = ["base-execution-evm-runtime/optional_block_gas_limit"]
optional-eip3541 = ["base-execution-evm-runtime/optional_eip3541"]
optional-eip3607 = ["base-execution-evm-runtime/optional_eip3607"]
optional-no-base-fee = ["base-execution-evm-runtime/optional_no_base_fee"]
optional-checks = [
    "optional-balance-check",
    "optional-block-gas-limit",
    "optional-eip3541",
    "optional-eip3607",
    "optional-no-base-fee",
]
memory_limit = ["base-execution-evm-runtime/memory_limit"]
