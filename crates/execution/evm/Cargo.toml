[package]
name = "base-execution-evm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Reth
reth-evm.workspace = true
reth-chainspec.workspace = true
reth-evm-ethereum.workspace = true
reth-storage-errors.workspace = true
reth-execution-types.workspace = true
reth-primitives-traits.workspace = true

reth-errors = { workspace = true, optional = true }
reth-rpc-eth-api = { workspace = true, optional = true }
reth-rpc-eth-types = { workspace = true, optional = true }

# evm2
evm2 = { workspace = true, features = ["std"] }

# ethereum
alloy-eips.workspace = true
alloy-eip7928.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true
base-common-chains.workspace = true
base-common-l1-fees.workspace = true
alloy-rpc-types-eth = { workspace = true, optional = true }
base-common-evm2 = { workspace = true, features = ["reth"] }
base-common-consensus = { workspace = true, features = ["reth"] }
base-common-rpc-types-engine = { workspace = true, features = ["reth"] }

base-execution-chainspec.workspace = true
base-execution-consensus.workspace = true

# misc
thiserror.workspace = true

[dev-dependencies]
alloy-genesis.workspace = true
base-protocol.workspace = true
reth-storage-api.workspace = true
base-common-genesis.workspace = true
reth-evm = { workspace = true, features = ["test-utils"] }

[features]
default = [ "metrics", "std" ]
metrics = [ "reth-evm/metrics" ]
std = [
	"alloy-consensus/std",
	"alloy-eip7928/std",
	"alloy-eips/std",
	"alloy-genesis/std",
	"alloy-primitives/std",
	"alloy-rpc-types-eth?/std",
	"base-common-chains/std",
	"base-common-consensus/std",
	"base-common-rpc-types-engine/std",
	"base-execution-chainspec/std",
	"base-execution-consensus/std",
	"reth-chainspec/std",
	"reth-evm/std",
	"reth-evm-ethereum/std",
	"reth-execution-types/std",
	"reth-primitives-traits/std",
	"reth-storage-errors/std",
	"thiserror/std",
]
portable = [ "evm2/portable", "reth-evm/portable" ]
rpc = [
	"alloy-rpc-types-eth",
	"reth-errors",
	"reth-rpc-eth-api",
	"reth-rpc-eth-types",
]
