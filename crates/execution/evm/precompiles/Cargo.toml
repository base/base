[package]
name = "base-execution-evm-precompiles"
description = "Base precompile definitions and fork-specific precompile sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
auto_impl = {workspace = true}
thiserror = {workspace = true}
tracing = { workspace = true }
alloy-sol-types = {workspace = true}
base-execution-evm-crypto = {workspace = true}
alloy-primitives = {workspace = true}
sha2 = { workspace = true, optional = true}
base-common-types-chain = {workspace = true}
base-execution-evm-macros = {workspace = true}
base-common-chain-config = { workspace = true }
base-execution-evm-machine = {workspace = true}
base-execution-state-memory = {workspace = true}
base-execution-evm-primitives = {workspace = true}
derive_more = { workspace = true, features = ["from", "try_into"] }
base64 = { workspace = true, features = ["default"], optional = true}
k256 = { workspace = true, features = ["default", "ecdsa"], optional = true}
p256 = { workspace = true, features = ["default", "ecdsa"], optional = true}

[dev-dependencies]
base-execution-evm-machine = { workspace = true }
rstest = {features = ["default"], workspace = true}
proptest = { workspace = true, features = ["default"] }
criterion = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["rand"] }
k256 = { workspace = true, features = ["default", "ecdsa"] }

[[bench]]
name = "base_precompiles"
harness = false
required-features = ["test-utils"]

[[test]]
name = "b20_stablecoin_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_stablecoin_v2_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_asset_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_asset_v2_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_policy_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_factory_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "contract"
required-features = ["test-utils"]

[[test]]
name = "b20_policy_v2_golden"
required-features = ["test-utils"]

[features]
default = [
    "blst",
    "c-kzg",
    "portable",
    "secp256k1",
    "std",
]
std = [
    "alloy-primitives/std",
    "alloy-sol-types/std",
    "base-common-chain-config/std",
    "base-execution-evm-machine/std",
    "base-execution-state-memory/std",
    "base-execution-evm-crypto/std",
    "base-execution-evm-primitives/std",
    "base-common-types-chain/std",
    "derive_more/std",
    "thiserror/std",
    "tracing/std",
    "dep:sha2",
    "dep:base64",
    "dep:k256",
    "dep:p256",
    "base-common-types-chain/k256",
]
bn = ["base-execution-evm-crypto/bn"]
blst = ["base-execution-evm-crypto/blst"]
c-kzg = ["base-execution-evm-crypto/c-kzg"]
portable = ["base-execution-evm-crypto/portable"]
secp256k1 = ["base-execution-evm-crypto/secp256k1"]
memory_limit = ["base-execution-evm-machine/memory_limit"]
optional_no_base_fee = ["base-execution-evm-machine/optional_no_base_fee"]
optional_eip3541 = ["base-execution-evm-machine/optional_eip3541"]
optional_eip3607 = ["base-execution-evm-machine/optional_eip3607"]
optional_fee_charge = ["base-execution-evm-machine/optional_fee_charge"]
optional_balance_check = ["base-execution-evm-machine/optional_balance_check"]
optional_block_gas_limit = ["base-execution-evm-machine/optional_block_gas_limit"]
test-utils = ["base-common-chain-config/test-utils", "std"]
