[package]
name = "base-execution-payload-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "A payload builder for base-reth that builds Base payloads."

[lints]
workspace = true

[dependencies]
# reth
reth-evm.workspace = true
reth-chainspec.workspace = true
reth-storage-api.workspace = true
reth-payload-util.workspace = true
reth-trie-parallel.workspace = true
reth-execution-types.workspace = true
reth-execution-cache.workspace = true
reth-payload-builder.workspace = true
reth-transaction-pool.workspace = true
reth-primitives-traits.workspace = true
reth-payload-validator.workspace = true
reth-payload-primitives.workspace = true
reth-basic-payload-builder.workspace = true
reth-payload-builder-primitives.workspace = true
reth-revm = { workspace = true, features = ["witness"] }
reth-trie-common.workspace = true

# op-reth
base-bundles.workspace = true
base-metrics.workspace = true
base-common-evm.workspace = true
base-execution-evm.workspace = true
base-execution-txpool.workspace = true
base-execution-eip8130.workspace = true

# ethereum
revm.workspace = true
alloy-rlp.workspace = true
alloy-evm.workspace = true
alloy-eips.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true
base-common-chains.workspace = true
alloy-rpc-types-debug.workspace = true
alloy-rpc-types-engine.workspace = true
base-common-consensus = { workspace = true, features = ["reth"] }
base-common-rpc-types-engine = { workspace = true, features = ["serde", "reth"] }

# misc
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true
derive_more.workspace = true
serde_json.workspace = true
moka = { workspace = true, features = ["sync"] }
metrics = { workspace = true, optional = true }

[dev-dependencies]
reth-provider.workspace = true
reth-ethereum-forks.workspace = true
base-execution-chainspec.workspace = true
reth-revm = { workspace = true, features = ["test-utils"] }

[features]
default = [ "metrics" ]
metrics = [ "base-metrics/metrics", "dep:metrics" ]
