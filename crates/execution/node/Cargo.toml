[package]
name = "base-node-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
alloy-rlp = { workspace = true }
humantime = { workspace = true }
reth-tasks = { workspace = true }
reth-discv5 = { workspace = true }
reth-db-api = { workspace = true }
reth-network = { workspace = true }
reth-rpc-api = { workspace = true }
base-protocol = { workspace = true }
reth-provider = { workspace = true }
reth-node-api = { workspace = true }
reth-node-core = { workspace = true }
base-common-evm = { workspace = true }
alloy-consensus = { workspace = true }
reth-rpc-eth-api = { workspace = true }
alloy-primitives = { workspace = true }
reth-chain-state = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
reth-rpc-engine-api = { workspace = true }
reth-payload-builder = { workspace = true }
reth-transaction-pool = { workspace = true }
reth-rpc-server-types = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
reth-basic-payload-builder = { workspace = true }
serde_json = { workspace = true, optional = true }
clap = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default"] }
alloy-genesis = { workspace = true, optional = true }
reth-db = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
reth-evm = { workspace = true, features = ["default"] }
reth-tracing = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default"] }
reth-e2e-test-utils = { workspace = true, optional = true }
reth-consensus = { workspace = true, features = ["default"] }
reth-chainspec = { workspace = true, features = ["default"] }
reth-trie-common = { workspace = true, features = ["default"] }
reth-node-builder = { workspace = true, features = ["default"] }
base-common-consensus = { workspace = true, features = ["reth"] }
reth-network-peers = { workspace = true, features = ["default"] }
base-execution-rpc = { workspace = true, features = ["default"] }
base-common-chains = { workspace = true, features = ["default"] }
base-upgrade-signal = { workspace = true, features = ["default"] }
base-execution-exex = { workspace = true, features = ["metrics"] }
base-execution-trie = { workspace = true, features = ["metrics"] }
base-execution-txpool = { workspace = true, features = ["default"] }
reth-payload-primitives = { workspace = true, features = ["default"] }
base-execution-chainspec = { workspace = true, features = ["default"] }
reth-storage-api = { workspace = true, features = ["default", "db-api"] }
base-execution-payload-builder = { workspace = true, features = ["default"] }
base-execution-consensus = { workspace = true, features = ["default", "std"] }
base-execution-evm = { workspace = true, features = ["default", "std", "rpc"] }
base-common-rpc-types-engine = { workspace = true, features = ["serde", "std"] }
reth-primitives-traits = { workspace = true, features = ["secp256k1", "rayon"] }
revm = { workspace = true, features = ["secp256k1", "blst", "c-kzg", "memory_limit", "p256-aws-lc-rs"] }
[dev-dependencies]
reth-rpc = { workspace = true }
reth-trie = { workspace = true }
alloy-eips = { workspace = true }
reth-trie-db = { workspace = true }
alloy-network = { workspace = true }
reth-db-common = { workspace = true }
base-common-evm = { workspace = true }
reth-prune-types = { workspace = true }
reth-stages-types = { workspace = true }
reth-payload-util = { workspace = true }
reth-rpc-eth-types = { workspace = true }
reth-ethereum-forks = { workspace = true }
base-common-rpc-types = { workspace = true }
rstest = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["client"] }
reth-revm = { workspace = true, features = ["default", "std"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-db = { workspace = true, features = ["default", "test-utils"] }
reth-codecs = { workspace = true, features = ["alloy", "test-utils"] }
reth-ethereum-primitives = { workspace = true, features = ["default"] }
criterion = { workspace = true, features = ["default", "html_reports"] }
base-node-core = { workspace = true, features = ["default", "test-utils"] }
reth-node-builder = { workspace = true, features = ["default", "test-utils"] }
[[bench]]
name = "provider"
harness = false

[[test]]
name = "e2e_testsuite"
path = "tests/e2e-testsuite/main.rs"

[[test]]
name = "engine_tree"
path = "tests/engine-tree/main.rs"
required-features = ["test-utils"]

[[test]]
name = "rocksdb"
path = "tests/rocksdb/main.rs"
required-features = ["test-utils"]

[[test]]
name = "testsuite_framework"
path = "tests/testsuite-framework/main.rs"
required-features = ["test-utils"]

[features]
default = [ "reth-codec" ]
asm-keccak = [
	"alloy-primitives/asm-keccak",
	"base-node-core/asm-keccak",
	"reth-node-core/asm-keccak",
	"revm/asm-keccak",
]
keccak-cache-global = [
	"alloy-primitives/keccak-cache-global",
	"base-node-core/keccak-cache-global",
	"reth-node-core/keccak-cache-global",
]
js-tracer = [
	"base-node-core/js-tracer",
	"reth-node-builder/js-tracer",
	"reth-rpc-eth-types/js-tracer",
	"reth-rpc/js-tracer",
]
test-utils = [
	"alloy-genesis",
	"base-common-chains/test-utils",
	"base-common-consensus/arbitrary",
	"base-execution-exex/test-utils",
	"base-node-core/test-utils",
	"base-protocol/test-utils",
	"reth-chain-state/test-utils",
	"reth-chainspec/test-utils",
	"reth-codec",
	"reth-consensus/test-utils",
	"reth-db-api/test-utils",
	"reth-db/test-utils",
	"reth-e2e-test-utils",
	"reth-evm/test-utils",
	"reth-network/test-utils",
	"reth-node-builder/test-utils",
	"reth-payload-builder/test-utils",
	"reth-primitives-traits/test-utils",
	"reth-provider/test-utils",
	"reth-revm/test-utils",
	"reth-stages-types/test-utils",
	"reth-tasks/test-utils",
	"reth-transaction-pool/test-utils",
	"reth-trie-common/test-utils",
	"reth-trie-db/test-utils",
	"serde_json",
]
reth-codec = []
