[package]
name = "base-mev-emitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Base MEV node emitter — wire-contract types mirroring base-mev node-protocol"

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

# node integration (C-1+): the ExEx + extension that wires the emitter into
# base-reth-node. Optional so the default crate stays wire-only (light deps,
# fast conformance tests) and only the node binary pulls the reth graph.
reth-exex = { workspace = true, optional = true }
base-node-runner = { workspace = true, optional = true }
base-execution-evm = { workspace = true, optional = true }
alloy-evm = { workspace = true, optional = true }
reth-chainspec = { workspace = true, optional = true }
reth-evm = { workspace = true, optional = true }
reth-provider = { workspace = true, optional = true }
reth-revm = { workspace = true, optional = true }
revm = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
eyre = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# C-4 outbound transport: plaintext loopback WebSocket server streaming encoded
# events to the TS ProviderNodeStream consumer (one event per TEXT frame).
tokio = { workspace = true, optional = true, features = ["net", "rt", "sync", "macros"] }
tokio-tungstenite = { workspace = true, optional = true }

# C-3 flashblock attribution: websocket subscriber + flashblock types + tx
# decode (BaseTxEnvelope::decode_2718_exact / tx_hash via alloy-eips Decodable2718).
base-common-flashblocks = { workspace = true, optional = true }
base-flashblocks = { workspace = true, optional = true }
base-common-consensus = { workspace = true, optional = true, default-features = false, features = ["std"] }
alloy-eips = { workspace = true, optional = true }
# Issue #45: TransactionResponse::tx_hash for the flashblocks RPC Transaction
# (preconf pool-slot emission path).
alloy-network-primitives = { workspace = true, optional = true }

[features]
# Pulls the reth/node dependency graph and enables the `exex` + `revm_bridge` modules.
node = [
    "dep:reth-exex",
    "dep:base-node-runner",
    "dep:base-execution-evm",
    "dep:alloy-evm",
    "dep:reth-chainspec",
    "dep:reth-evm",
    "dep:reth-provider",
    "dep:reth-revm",
    "dep:revm",
    "dep:futures",
    "dep:eyre",
    "dep:tracing",
    "dep:base-common-flashblocks",
    "dep:base-flashblocks",
    "dep:base-common-consensus",
    "dep:alloy-eips",
    "dep:alloy-network-primitives",
    "dep:tokio",
    "dep:tokio-tungstenite",
]
