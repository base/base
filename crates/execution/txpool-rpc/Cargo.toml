[package]
name = "base-txpool-rpc"
description = "Transaction pool RPC APIs for Base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
tracing = { workspace = true }
jsonrpsee = { workspace = true }
async-trait = { workspace = true }
base-metrics = { workspace = true }
alloy-primitives = { workspace = true }
reth-rpc-eth-types = { workspace = true }
base-common-types-chain = { workspace = true }
metrics = { workspace = true, optional = true }
base-observability-events = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
reth-storage-api = { workspace = true, features = ["default"] }
base-execution-txpool = { workspace = true, features = ["default"] }
base-common-chain-config = {features = ["default"], workspace = true}

[dev-dependencies]
alloy-eips = { workspace = true }
serde_json = { workspace = true }
alloy-signer = { workspace = true }
base-common-network = { workspace = true }
base-testing-support = { workspace = true }
eyre = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default"] }
httpmock = { workspace = true, features = ["default"] }
reth-provider = { workspace = true, features = ["test-utils"] }
base-common-chain-config = { workspace = true, features = ["std"] }
base-common-types-chain = { workspace = true, features = ["reth"] }
base-execution-txpool = { workspace = true, features = ["test-utils"] }
base-observability-events = { workspace = true, features = ["test-utils"] }

[features]
metrics = ["base-metrics/metrics", "dep:metrics"]
