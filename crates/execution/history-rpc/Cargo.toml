[package]
name = "base-history-rpc"
description = "Node RPC wiring for the shared chain history store: archive_ export and archive-backed eth_ reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# workspace
base-execution-rpc.workspace = true
base-execution-evm.workspace = true
base-node-runner.workspace = true
base-history-store.workspace = true
base-execution-chainspec.workspace = true
base-execution-eip8130-rpc.workspace = true
base-common-rpc-types = { workspace = true, features = ["reth"] }
base-common-consensus = { workspace = true, features = ["reth"] }

# reth
reth-chainspec.workspace = true
reth-rpc-eth-api.workspace = true
reth-prune-types.workspace = true
reth-storage-api.workspace = true
reth-rpc-eth-types.workspace = true
reth-primitives-traits.workspace = true

# alloy
alloy-eips = { workspace = true, features = ["std"] }
alloy-primitives.workspace = true
alloy-serde.workspace = true
alloy-consensus = { workspace = true, features = ["std"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }

# rpc
jsonrpsee = { workspace = true, features = ["server", "macros"] }

# storage
object_store.workspace = true

# misc
eyre.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
base-protocol.workspace = true
base-test-utils.workspace = true
base-common-precompiles.workspace = true
base-execution-eip8130-rpc-node.workspace = true
base-node-runner = { workspace = true, features = ["test-utils"] }
base-history-store = { workspace = true, features = ["test-utils"] }
reth-node-core.workspace = true
alloy-genesis.workspace = true
alloy-rpc-client.workspace = true
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
