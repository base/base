[package]
name = "base-execution-engine-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rayon = { workspace = true }
serde = { workspace = true }
metrics = { workspace = true }
itertools = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
pin-project = { workspace = true }
futures-util = { workspace = true }
base-common-io-files = { workspace = true }
base-execution-txpool-pool = { workspace = true }
base-execution-state-api = {workspace = true}
base-common-chain-config = {workspace = true }
base-execution-evm-runtime = {workspace = true}
base-execution-state-memory = {workspace = true}
base-execution-evm-machine = { workspace = true }
eyre = {workspace = true, features = ["default"]}
base-execution-sync-pipeline = {workspace = true }
base-execution-payload-builder = {workspace = true}
base-execution-state-database = { workspace = true }
futures = {workspace = true, features = ["default"]}
base-execution-state-maintenance = { workspace = true}
serde_json = { features = ["alloc"], workspace = true}
alloy-rlp = {workspace = true, features = ["core-net"]}
