[package]
name = "base-execution-engine-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rayon = { workspace = true }
serde = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
pin-project = { workspace = true }
futures-util = { workspace = true }
base-common-io = { workspace = true }
base-execution-sync = { workspace = true }
base-execution-txpool = { workspace = true }
base-execution-payload = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-evm-runtime = { workspace = true }
eyre = { workspace = true, features = ["default"] }
base-execution-state-database = { workspace = true }
futures = { workspace = true, features = ["default"] }
serde_json = { features = ["alloc"], workspace = true }
derive_more = { workspace = true, features = ["full"] }
indexmap = { workspace = true, features = ["default"] }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
schnellru = { workspace = true, features = ["default"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
tracing = { workspace = true, features = ["attributes"] }
parking_lot = { workspace = true, features = ["default"] }
moka = { workspace = true, features = ["default", "sync"] }
tokio-stream = { workspace = true, features = ["default"] }
crossbeam-channel = { workspace = true, features = ["default"] }
base-common-runtime = { workspace = true, features = ["rayon"] }
tokio-util = { workspace = true, features = ["default", "codec"] }
base-execution-state-types = { features = ["rayon"], workspace = true }
base-execution-state-trie = { features = ["metrics"], workspace = true }
base-execution-state-provider = { workspace = true, features = ["rayon"] }
base-execution-network-wire = { workspace = true, features = ["requests"] }
base-execution-network-service = { workspace = true, features = ["default"] }
base-execution-state-operations = { features = ["default"], workspace = true }
base-execution-engine-observers = { workspace = true, features = ["witness"] }
alloy-primitives = { workspace = true, features = ["getrandom", "map-foldhash"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
base-common-types-payload = { workspace = true, features = ["serde", "default", "std"] }
base-common-observability-metrics = { workspace = true, features = ["common", "metrics"] }
base-common-types-chain = { features = ["dashmap", "k256", "rayon", "reth"], workspace = true }
base-common-observability-tracing = { workspace = true, optional = true, features = ["default"] }
base-execution-evm-blocks = { workspace = true, features = ["metrics", "optional-balance-check", "optional-no-base-fee"] }

[dev-dependencies]
assert_matches = { workspace = true }
base-testing-support = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-state-types = { workspace = true }
eyre = { workspace = true, features = ["default"] }
rand = { workspace = true, features = ["default"] }
rand_08 = { workspace = true, features = ["default"] }
base-execution-state-operations = { workspace = true }
proptest = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
metrics-util = { workspace = true, features = ["debugging"] }
base-execution-sync = { workspace = true, features = ["test-utils"] }
base-execution-evm-blocks = { features = ["test-utils"], workspace = true }
base-common-types-payload = { workspace = true, features = ["test-utils"] }
base-execution-evm-runtime = { workspace = true, features = ["test-utils"] }
base-execution-state-database = { workspace = true, features = ["test-utils"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
base-execution-network-service = { workspace = true, features = ["default", "test-utils"] }

[features]
test-utils = [
    "base-execution-state-provider/test-utils",
    "base-execution-evm-blocks/test-utils",
    "base-execution-state-database/test-utils",
    "base-execution-network-service/test-utils",
    "base-execution-payload/test-utils",
    "base-common-types-chain/test-utils",
    "base-execution-state-types/test-utils",
    "base-execution-sync/test-utils",
    "base-common-observability-tracing",
    "base-execution-state-trie/test-utils",
    "base-execution-state-operations/test-utils",
    "base-common-runtime/test-utils",
    "base-execution-evm-runtime/test-utils",
]
trie-debug = [
    "base-execution-state-trie/trie-debug",
    "base-execution-state-operations/trie-debug",
    "base-common-types-payload/trie-debug",
]
