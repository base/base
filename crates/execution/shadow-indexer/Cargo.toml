[package]
name = "base-shadow-indexer"
description = "Shadow indexer ExEx for capturing executed blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
reth-exex = { workspace = true }
alloy-eips = { workspace = true }
async-trait = { workspace = true }
reth-network-api = { workspace = true }
base-node-context = { workspace = true }
base-shadow-indexer-db = { workspace = true }
reth-primitives-traits = { workspace = true }
metrics = { workspace = true, optional = true }
base-common-runtime-tasks = { workspace = true }
base-execution-evm-blocks = { workspace = true }
tracing = { workspace = true, features = ["std"] }
eyre = { workspace = true, features = ["default"] }
base-execution-state-database = { workspace = true }
tokio = { workspace = true, features = ["default"] }
anyhow = { workspace = true, features = ["default"] }
chrono = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
base-common-observability-metrics = { workspace = true }
base-common-types-chain = { workspace = true, features = ["reth"] }
base-execution-state-types = { workspace = true, features = ["default"] }

[dev-dependencies]
mockall = { workspace = true }
reth-db-common = { workspace = true }
alloy-primitives = { workspace = true }
reth-chain-state = { workspace = true }
tempfile = { workspace = true, features = ["default"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-primitives-traits = { workspace = true, features = ["test-utils"] }
base-common-types-chain = { workspace = true, features = ["serde", "std"]}
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }

[features]
default = ["metrics"]
metrics = ["base-common-observability-metrics/metrics", "dep:metrics"]
