jsonrpsee = {features = ["http-client", "macros", "server"], workspace = true}
base-common-observability-tracing = { workspace = true, features = ["default"] }
base-common-types-chain = {features = ["k256", "kzg", "reth", "serde"], workspace = true}

[dev-dependencies]
paste = { workspace = true }
alloy-signer = {workspace = true}
assert_matches = { workspace = true }
alloy-sol-types = { workspace = true }
base-testing-support = {workspace = true}
base-common-runtime-tasks = { workspace = true }
eyre = {features = ["default"], workspace = true}
proptest-arbitrary-interop = { workspace = true }
base-execution-rpc-handlers = { workspace = true }
base-execution-state-memory = { workspace = true }
rand = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive"] }
alloy-eips = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["server"] }
proptest = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
metrics-util = { workspace = true, features = ["debugging"] }
