base-testing-devnet = { workspace = true, features = ["test-utils"] }
base-common-types-payload = { workspace = true, features = ["std"] }
base-common-types-rpc = { workspace = true, features = ["default"] }
base-common-client-ethereum = {features = ["default"], workspace = true}
base-common-types-chain = {features = ["reth", "std"], workspace = true}
codspeed-criterion-compat = { workspace = true, features = ["default"] }
base-execution-txpool-pool = {workspace = true, features = ["test-utils"]}
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
alloy-primitives = {workspace = true, features = ["getrandom", "map-foldhash", "rand"]}
tokio = {features = ["default", "macros", "rt-multi-thread", "time"], workspace = true}

[[bench]]
name = "saturated_pool"
harness = false
required-features = ["test-utils"]

[features]
default = ["metrics"]
metrics = ["base-execution-evm-runtime/metrics", "base-common-observability-metrics/metrics", "base-common-observability-events/metrics"]
serde = ["base-execution-state-types/serde", "base-execution-network-wire/serde", "base-common-types-chain/serde", "alloy-eips/serde", "alloy-primitives/serde", "bitflags/serde", "imbl/serde", "parking_lot/serde", "rand?/serde", "smallvec/serde", "base-common-types-chain/serde", "base-execution-state-api/serde", "base-execution-evm-runtime/serde", "base-execution-state-memory/serde"]
test-utils = ["rand", "paste", "serde", "base-execution-state-types/test-utils", "base-execution-state-provider/test-utils", "base-common-types-chain/test-utils", "alloy-primitives/rand", "base-execution-evm-blocks/test-utils", "base-common-runtime-tasks/test-utils", "base-execution-state-memory/test-utils"]
arbitrary = ["proptest", "proptest-arbitrary-interop", "imbl/arbitrary", "base-execution-network-wire/arbitrary", "base-common-types-chain/arbitrary", "alloy-eips/arbitrary", "alloy-primitives/arbitrary", "bitflags/arbitrary", "base-common-types-chain/arbitrary", "smallvec/arbitrary", "base-execution-evm-runtime/arbitrary", "base-execution-state-memory/arbitrary"]
