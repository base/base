bitflags = { workspace = true }
smallvec = { workspace = true }
auto_impl = { workspace = true }
rustc-hash = { workspace = true }
async-trait = { workspace = true }
pin-project = { workspace = true }
futures-util = { workspace = true }
alloy-hardforks = { workspace = true }
base-common-io-files = { workspace = true }
paste = { workspace = true, optional = true }
base-common-runtime-tasks = {workspace = true}
base-execution-evm-fees = { workspace = true }
metrics = {optional = false, workspace = true}
base-execution-evm-runtime = {workspace = true}
base-execution-state-memory = {workspace = true}
lru = {features = ["default"], workspace = true}
base-execution-evm-machine = { workspace = true }
base-execution-state-provider = {workspace = true}
url = { workspace = true, features = ["default"] }
