[package]
name = "base-execution-txpool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Base Transaction Pool"

[lints]
workspace = true

[dependencies]
imbl = { workspace = true }
bitflags = { workspace = true }
metrics = { workspace = true  }
smallvec = { workspace = true }
auto_impl = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
async-trait = { workspace = true }
pin-project = { workspace = true }
futures-util = { workspace = true }
reth-fs-util = { workspace = true }
reth-provider = { workspace = true }
alloy-hardforks = { workspace = true }
reth-chain-state = { workspace = true }
paste = { workspace = true, optional = true }
reth-primitives-traits = { workspace = true }
base-execution-evm-fees = { workspace = true }
base-execution-evm-runtime = {workspace = true}
base-common-runtime-tasks = { workspace = true }
base-execution-evm-machine = { workspace = true }
lru = { workspace = true, features = ["default"] }
alloy-eips = { workspace = true, features = ["kzg"]}
futures = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"]}
base-common-observability-events = { workspace = true }
schnellru = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive", "rc"]}
tracing = { workspace = true, features = ["attributes"]}
alloy-rlp = { workspace = true, features = ["core-net"] }
parking_lot = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default"] }
reth-storage-api = { workspace = true, features = ["default"] }
proptest-arbitrary-interop = { workspace = true, optional = true }
reth-eth-wire-types = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
rand = { workspace = true, optional = true, features = ["default"] }
base-common-chain-config = {features = ["default"], workspace = true}
base-execution-evm-precompiles = {workspace = true, features = ["std"]}
base-execution-evm-blocks = { workspace = true, features = ["default"] }
proptest = { workspace = true, optional = true, features = ["default"] }
base-execution-state-types = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "sync", "rt", "time"] }
base-common-observability-metrics = {features = ["metrics"], workspace = true}
jsonrpsee = { workspace = true, features = ["http-client", "server", "macros"] }
base-common-types-chain = { workspace = true, features = ["reth", "kzg", "serde"] }

[dev-dependencies]
paste = { workspace = true }
alloy-signer = { workspace = true }
assert_matches = { workspace = true }
alloy-sol-types = { workspace = true }
base-common-network = { workspace = true }
base-testing-support = { workspace = true }
base-common-runtime-tasks = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
rand = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
proptest = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
metrics-util = { workspace = true, features = ["debugging"] }
reth-provider = { workspace = true, features = ["test-utils"] }
base-common-chain-config = { workspace = true, features = ["std"] }
base-execution-txpool = {workspace = true, features = ["test-utils"]}
codspeed-criterion-compat = { workspace = true, features = ["default"] }
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "time", "rt-multi-thread", "macros"] }

[[bench]]
name = "saturated_pool"
harness = false
required-features = ["test-utils"]

[features]
default = ["metrics"]
metrics = ["base-execution-evm-runtime/metrics", "base-common-observability-metrics/metrics", "base-common-observability-events/metrics"]
serde = [
    "base-execution-state-types/serde",
    "reth-eth-wire-types/serde",
    "base-common-types-chain/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bitflags/serde",
    "imbl/serde",
    "parking_lot/serde",
    "rand?/serde",
    "smallvec/serde",
    "reth-primitives-traits/serde",
    "reth-chain-state/serde",
    "reth-storage-api/serde",
    "base-execution-evm-runtime/serde",
]
test-utils = [
    "rand",
    "paste",
    "serde",
    "reth-chain-state/test-utils",
    "reth-provider/test-utils",
    "reth-primitives-traits/test-utils",
    "alloy-primitives/rand",
    "base-execution-evm-blocks/test-utils",
    "base-common-runtime-tasks/test-utils",
]
arbitrary = [
    "proptest",
    "proptest-arbitrary-interop",
    "imbl/arbitrary",
    "reth-eth-wire-types/arbitrary",
    "base-common-types-chain/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "bitflags/arbitrary",
    "reth-primitives-traits/arbitrary",
    "smallvec/arbitrary",
    "base-execution-evm-runtime/arbitrary",
]
