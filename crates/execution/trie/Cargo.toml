[package]
name = "base-execution-trie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Trie node storage for serving proofs in FP window fast"

[lints]
workspace = true

[dependencies]
revm = {workspace = true}
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
auto_impl = { workspace = true }
alloy-eips = { workspace = true }
reth-tasks = { workspace = true }
derive_more = { workspace = true }
base-metrics = { workspace = true }
reth-trie-db = { workspace = true }
reth-provider = { workspace = true }
base-evm-handler = {workspace = true}
reth-storage-api = { workspace = true }
alloy-primitives = { workspace = true }
static_assertions = { workspace = true }
reth-storage-errors = {workspace = true}
reth-primitives-traits = { workspace = true }
metrics = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"] }
bytes = { workspace = true, features = ["default"] }
reth-trie = { workspace = true, features = ["serde"] }
reth-codecs = { workspace = true, features = ["alloy"] }
rocksdb = { workspace = true, features = ["lz4", "zstd"] }
parking_lot = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "sync"] }
reth-db = { workspace = true, features = ["default", "mdbx"] }
bincode = { workspace = true, features = ["default", "serde"] }
eyre = { workspace = true, optional = true, features = ["default"] }
reth-trie-common = { workspace = true, features = ["default", "serde"] }
base-execution-evm = { workspace = true, features = ["default", "witness"] }
[dev-dependencies]
mockall = { workspace = true }
test-case = { workspace = true }
alloy-genesis = { workspace = true }
reth-node-api = { workspace = true }
reth-db-common = { workspace = true }
alloy-hardforks = { workspace = true }
reth-storage-errors = { workspace = true }
alloy-rpc-types-debug = { workspace = true }
base-execution-chainspec = { workspace = true }
eyre = { workspace = true, features = ["default"] }
rand_08 = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
serial_test = { workspace = true, features = ["default"] }
reth-trie = { workspace = true, features = ["test-utils"] }
reth-db-api = { workspace = true, features = ["test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
base-common-consensus = { workspace = true, features = ["reth"] }
alloy-consensus = { workspace = true, features = ["serde", "std"]}
reth-db = { workspace = true, features = ["default", "test-utils"] }
base-execution-evm = { workspace = true, features = ["test-utils"] }
reth-codecs = { workspace = true, features = ["alloy", "test-utils"] }
secp256k1 = { workspace = true, features = ["default", "rand", "std"] }
criterion = { workspace = true, features = ["default", "html_reports"] }
tokio = { workspace = true, features = ["default", "test-util", "rt-multi-thread", "macros"] }
[[bench]]
name = "witness_reads"
harness = false

[[bench]]
name = "deep_history_reads"
harness = false

[features]
serde-bincode-compat = [
    "alloy-consensus/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
    "reth-trie-common/serde-bincode-compat",
    "reth-trie/serde-bincode-compat",
]
metrics = [
    "base-metrics/metrics",
    "dep:eyre",
    "dep:metrics",
    "base-execution-evm/metrics",
    "reth-trie-db/metrics",
    "reth-trie/metrics",
]
