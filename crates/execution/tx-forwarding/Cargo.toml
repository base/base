[package]
name = "base-tx-forwarding"
description = "Transaction forwarding extension for Base node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
serde_json = { workspace = true }
alloy-primitives = { workspace = true }
metrics = { workspace = true, optional = true }
base-common-runtime-tasks = { workspace = true }
base-common-observability-events = { workspace = true }
url = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
base-common-observability-metrics = { workspace = true }
tokio-util = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["http-client"] }
base-execution-txpool = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "sync", "rt", "time"] }

[dev-dependencies]
alloy-signer = { workspace = true }
base-txpool-rpc = { workspace = true }
base-common-network = { workspace = true }
base-testing-support = { workspace = true }
base-common-types-chain = { workspace = true }
eyre = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive"] }
jsonrpsee = { workspace = true, features = ["server"] }
base-common-client-ethereum = { workspace = true, features = ["default"] }
base-node-runner = { workspace = true, features = ["test-utils"] }
base-common-chain-config = { workspace = true, features = ["std"] }
base-common-types-rpc = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }

[features]
default = ["metrics"]
metrics = ["base-common-observability-metrics/metrics", "base-common-observability-events/metrics", "dep:metrics"]
