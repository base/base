[package]
name = "base-tx-forwarding"
description = "Transaction forwarding extension for Base node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
serde_json = { workspace = true }
reth-tasks = { workspace = true }
base-metrics = { workspace = true }
alloy-primitives = { workspace = true }
base-node-runner = { workspace = true }
metrics = { workspace = true, optional = true }
base-observability-events = { workspace = true }
url = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
tokio-util = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["http-client"] }
base-execution-txpool = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "sync", "rt", "time"] }
[dev-dependencies]
alloy-signer = { workspace = true }
alloy-network = { workspace = true }
alloy-consensus = { workspace = true }
base-test-utils = { workspace = true }
base-txpool-rpc = { workspace = true }
base-common-consensus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
eyre = { workspace = true, features = ["default"] }
jsonrpsee = { workspace = true, features = ["server"] }
alloy-provider = { workspace = true, features = ["default"] }
base-node-runner = { workspace = true, features = ["test-utils"] }
base-common-rpc-types = { workspace = true, features = ["default"] }
base-execution-chainspec = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }

[features]
default = [ "metrics" ]
metrics = [
	"base-metrics/metrics",
	"base-observability-events/metrics",
	"dep:metrics",
]
