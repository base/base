[package]
name = "base-execution-payer-rpc"
description = "RPC proxy for the network payer service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
# base
base-common-consensus = { workspace = true, features = ["k256"] }
base-execution-eip8130-rpc.workspace = true
base-common-rpc-types.workspace = true
base-execution-rpc.workspace = true
base-common-chains.workspace = true
base-node-runner.workspace = true

# reth
reth-storage-api.workspace = true
reth-chainspec.workspace = true

# alloy
alloy-rpc-types-eth.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true

# rpc
jsonrpsee.workspace = true

# misc
thiserror = { workspace = true, features = ["std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
# base
base-node-runner = { workspace = true, features = ["test-utils"] }
base-execution-chainspec.workspace = true
base-test-utils.workspace = true

# reth
reth-provider = { workspace = true, features = ["test-utils"] }

# alloy
alloy-signer-local.workspace = true
alloy-genesis.workspace = true
alloy-signer.workspace = true

# misc
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
httpmock.workspace = true
mockall.workspace = true
eyre.workspace = true
