[package]
name = "base-execution-network-discovery"
description = "Helpers for working around NAT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
aes = { workspace = true }
ctr = { workspace = true }
hkdf = { workspace = true }
uint = { workspace = true }
metrics = { workspace = true }
socket2 = { workspace = true }
hashlink = { workspace = true }
smallvec = { workspace = true }
itertools = { workspace = true }
thiserror = { workspace = true }
delay_map = { workspace = true }
lazy_static = { workspace = true }
futures-util = { workspace = true }
more-asserts = { workspace = true }
alloy-eip2124 = { workspace = true }
if-addrs_0_14_0 = { workspace = true }
linked_hash_set = { workspace = true }
serde = { optional = true, workspace = true }
fnv = { workspace = true, features = ["default"] }
hex = { workspace = true, features = ["default"] }
rand = { workspace = true, features = ["default"] }
dashmap = { workspace = true, features = ["inline"] }
futures = { workspace = true, features = ["default"] }
aes-gcm = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
arrayvec = { workspace = true, features = ["default"] }
schnellru = { workspace = true, features = ["default"] }
parking_lot = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default"] }
data-encoding = { workspace = true, features = ["default"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
base-common-runtime = { workspace = true, features = ["time"] }
enr = { workspace = true, features = ["default", "k256", "ed25519"] }
rand_08 = { workspace = true, optional = false, features = ["default"] }
hickory-resolver = { workspace = true, features = ["default", "tokio"] }
zeroize = { workspace = true, features = ["default", "zeroize_derive"] }
serde_with = { workspace = true, optional = true, features = ["macros"] }
multiaddr = { workspace = true, optional = false, features = ["default"] }
tracing = { features = ["attributes", "default", "log"], workspace = true }
alloy-primitives = { features = ["map-foldhash", "rand"], workspace = true }
alloy-rlp = { features = ["core-net", "derive", "default"], workspace = true }
base-common-observability-metrics = { workspace = true, features = ["metrics"] }
base-execution-network-wire = { features = ["secp256k1", "std"], workspace = true }
secp256k1 = { features = ["global-context", "recovery", "serde", "std"], workspace = true }
libp2p-identity = { workspace = true, features = ["ed25519", "secp256k1"], optional = false }
tokio = { features = ["io-util", "net", "time", "default", "sync", "macros", "rt"], workspace = true }

[dev-dependencies]
if-addrs = { workspace = true }
rand_core = { workspace = true }
alloy-chains = { workspace = true }
rand_xorshift = { workspace = true }
assert_matches = { workspace = true }
alloy-hardforks = { workspace = true }
base-common-chain-config = { workspace = true }
rand = { workspace = true, features = ["default"] }
rand_08 = { features = ["default"], workspace = true }
rand_0_7 = { workspace = true, features = ["default"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
quickcheck = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
base-common-observability-tracing = { features = ["default"], workspace = true }
secp256k1 = { features = ["global-context", "rand", "recovery", "std"], workspace = true }
tokio = { features = ["macros", "rt", "rt-multi-thread", "sync", "default", "full"], workspace = true }

[features]
default = ["serde"]
serde = [
    "alloy-chains/serde",
    "alloy-primitives/serde",
    "dashmap/serde",
    "dep:serde",
    "dep:serde_with",
    "enr/serde",
    "hickory-resolver/serde",
    "linked_hash_set/serde",
    "parking_lot/serde",
    "rand/serde",
    "rand_08/serde",
    "secp256k1/serde",
]
test-utils = []
