[package]
name = "base-execution-network-discovery"
description = "Helpers for working around NAT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
enr = {workspace = true}
itertools = {workspace = true}
metrics = { workspace = true }
thiserror = {workspace = true}
alloy-eip2124 = {workspace = true}
futures-util = { workspace = true }
if-addrs_0_14_0 = { workspace = true }
linked_hash_set = { workspace = true }
serde = {optional = true, workspace = true}
rand = { workspace = true, features = ["default"] }
dashmap = { workspace = true, features = ["inline"] }
futures = { workspace = true, features = ["default"] }
schnellru = {workspace = true, features = ["default"]}
derive_more = { workspace = true, features = ["full"] }
tracing = {features = ["attributes"], workspace = true}
tokio-stream = {workspace = true, features = ["default"]}
parking_lot = { workspace = true, features = ["default"] }
data-encoding = { workspace = true, features = ["default"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
alloy-rlp = {features = ["core-net", "derive"], workspace = true}
tokio = {features = ["io-util", "net", "time"], workspace = true}
base-common-runtime-tasks = { workspace = true, features = ["time"] }
rand_08 = { workspace = true, optional = true, features = ["default"] }
serde_with = {workspace = true, optional = true, features = ["macros"]}
hickory-resolver = { workspace = true, features = ["default", "tokio"] }
base-execution-network-discv5 = {features = ["libp2p"], workspace = true}
alloy-primitives = {features = ["map-foldhash", "rand"], workspace = true}
base-common-observability-metrics = { workspace = true, features = ["metrics"]}
base-execution-network-types = {features = ["secp256k1", "std"], workspace = true}
secp256k1 = {features = ["global-context", "recovery", "serde", "std"], workspace = true}

[dev-dependencies]
alloy-chains = { workspace = true }
alloy-hardforks = {workspace = true}
assert_matches = { workspace = true }
base-common-chain-config = {workspace = true}
rand = { workspace = true, features = ["default"] }
rand_08 = {features = ["default"], workspace = true}
alloy-rlp = { workspace = true, features = ["core-net"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
base-common-observability-tracing = {features = ["default"], workspace = true}
tokio = {features = ["macros", "rt", "rt-multi-thread", "sync"], workspace = true}
secp256k1 = {features = ["global-context", "rand", "recovery", "std"], workspace = true}

[features]
default = ["serde"]
serde = ["alloy-chains/serde", "alloy-primitives/serde", "dashmap/serde", "dep:serde", "dep:serde_with", "base-execution-network-discv5/serde", "enr/serde", "hickory-resolver/serde", "linked_hash_set/serde", "parking_lot/serde", "rand/serde", "rand_08?/serde", "secp256k1/serde"]
test-utils = ["dep:rand_08"]
