[package]
name = "base-execution-network-service"
description = "Ethereum network support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rayon = { workspace = true }
metrics = { workspace = true }
smallvec = { workspace = true }
auto_impl = { workspace = true }
thiserror = { workspace = true }
itertools = { workspace = true }
alloy-eips = { workspace = true }
aquamarine = { workspace = true }
rustc-hash = { workspace = true }
pin-project = { workspace = true }
alloy-eip2124 = { workspace = true }
base-common-io = { workspace = true }
base-common-runtime = { workspace = true }
alloy-rpc-types-admin = { workspace = true }
base-execution-txpool = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-evm-blocks = { workspace = true }
base-execution-state-types = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
rand = { workspace = true, features = ["default"] }
base-execution-state-database = { workspace = true }
futures = { features = ["default"], workspace = true }
rand_08 = { workspace = true, features = ["default"] }
derive_more = { features = ["full"], workspace = true }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
schnellru = { workspace = true, features = ["default"] }
tracing = { features = ["attributes"], workspace = true }
parking_lot = { features = ["default"], workspace = true }
tokio-stream = { workspace = true, features = ["default"] }
enr = { workspace = true, features = ["rust-secp256k1", "serde"] }
tokio-util = { workspace = true, features = ["default", "codec"] }
alloy-rlp = { workspace = true, features = ["core-net", "derive"] }
serde = { workspace = true, optional = true, features = ["derive"] }
base-execution-network-discovery = { features = ["default"], workspace = true }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "std"] }
base-common-types-chain = { workspace = true, features = ["k256", "reth", "serde"] }
alloy-primitives = { features = ["getrandom", "map-foldhash", "rand"], workspace = true }
base-common-observability-metrics = { workspace = true, features = ["common", "metrics"] }
tokio = { features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"], workspace = true }
base-execution-network-wire = { features = ["default", "requests", "transport", "net", "serde", "std"], workspace = true }

[dev-dependencies]
url = { workspace = true }
test-case = { workspace = true }
alloy-trie = { workspace = true }
alloy-chains = { workspace = true }
alloy-genesis = { workspace = true }
alloy-hardforks = { workspace = true }
base-testing-support = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-state-trie = { workspace = true }
base-execution-evm-runtime = { workspace = true }
base-execution-state-types = { workspace = true }
tokio = { workspace = true, features = ["full"] }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
parking_lot = { workspace = true, features = ["default"] }
base-common-types-chain = { workspace = true, features = ["reth"] }
base-execution-txpool = { workspace = true, features = ["test-utils"] }
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
base-execution-network-service = { workspace = true, features = ["test-utils"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "rand"] }
base-execution-network-wire = { workspace = true, features = ["std", "test-utils"] }
base-execution-network-discovery = { workspace = true, features = ["default", "test-utils"] }

[features]
serde = [
    "dep:serde",
    "secp256k1/serde",
    "enr/serde",
    "base-execution-network-discovery/serde",
    "base-execution-network-wire/serde",
    "base-common-types-chain/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-trie/serde",
    "parking_lot/serde",
    "rand/serde",
    "smallvec/serde",
    "url/serde",
    "base-execution-txpool/serde",
    "rand_08/serde",
    "base-execution-state-types/serde",
    "base-execution-state-trie/serde",
    "alloy-eip7928/serde",
    "base-execution-evm-runtime/serde",
]
test-utils = [
    "base-execution-txpool/test-utils",
    "base-execution-network-wire/test-utils",
    "base-execution-evm-blocks/test-utils",
    "base-execution-network-discovery/test-utils",
    "base-common-types-chain/test-utils",
    "base-execution-state-provider/test-utils",
    "base-common-runtime/test-utils",
    "base-execution-state-types/test-utils",
    "base-execution-state-trie/test-utils",
    "base-execution-evm-runtime/test-utils",
    "alloy-eip7928/std",
    "alloy-primitives/rand",
]
default = ["std"]
std = [
    "base-common-types-chain/std",
    "base-execution-evm-blocks/std",
    "alloy-eip7928/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "derive_more/std",
    "base-execution-network-wire/std",
    "base-execution-state-types/std",
    "tracing/std",
]
