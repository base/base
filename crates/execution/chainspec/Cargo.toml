[package]
name = "base-execution-chainspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "EVM chain spec implementation for Base."

[lints]
workspace = true

[dependencies]
alloy-trie = { workspace = true }
auto_impl = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
serde_json = { workspace = true }
alloy-chains = { workspace = true }
alloy-genesis = { workspace = true }
base-protocol = { workspace = true }
alloy-consensus = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-primitives = { workspace = true }
reth-ethereum-forks = { workspace = true }
base-common-consensus = { workspace = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, optional = true }
reth-chainspec = { workspace = true, features = ["default"] }
base-common-genesis = { workspace = true, features = ["std"] }
reth-network-peers = { workspace = true, features = ["default"] }
base-common-chains = { workspace = true, features = ["default"] }
base-common-rpc-types = { workspace = true, features = ["default"] }
[dev-dependencies]
reth-chainspec = { workspace = true, features = ["default", "test-utils"] }
[features]
default = [ "std" ]
std = [
	"alloy-chains/std",
	"alloy-consensus/std",
	"alloy-eips/std",
	"alloy-genesis/std",
	"alloy-primitives/std",
	"base-common-chains/std",
	"base-common-consensus/std",
	"base-common-genesis/std",
	"base-common-rpc-types/std",
	"base-protocol/std",
	"reth-chainspec/std",
	"reth-ethereum-forks/std",
	"reth-network-peers/std",
	"reth-primitives-traits/std",
	"serde?/std",
	"serde_json/std",
	"thiserror/std",
]
serde = [
	"alloy-chains/serde",
	"alloy-consensus/serde",
	"alloy-eips/serde",
	"alloy-hardforks/serde",
	"alloy-primitives/serde",
	"base-common-chains/serde",
	"base-common-consensus/serde",
	"base-common-genesis/serde",
	"base-common-rpc-types/serde",
	"base-protocol/serde",
	"reth-ethereum-forks/serde",
	"reth-primitives-traits/serde",
]
