[package]
name = "base-execution-chainspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "EVM chain spec implementation for Base."

[lints]
workspace = true

[dependencies]
auto_impl = { workspace = true }
thiserror = { workspace = true }
alloy-trie = { workspace = true }
alloy-eips = { workspace = true }
serde_json = { workspace = true }
alloy-chains = { workspace = true }
alloy-eip2124 = { workspace = true }
alloy-genesis = { workspace = true }
base-protocol = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-primitives = { workspace = true }
base-common-types-chain = { workspace = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, optional = true }
base-common-genesis = { workspace = true, features = ["std"] }
reth-network-peers = { workspace = true, features = ["default"] }
base-common-chains = { workspace = true, features = ["default"] }
base-common-types-rpc = { workspace = true, features = ["default"] }

[features]
default = [ "std" ]
std = [
    "alloy-chains/std",
    "base-common-types-chain/std",
    "alloy-eips/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "base-common-chains/std",
    "base-common-genesis/std",
    "base-common-types-rpc/std",
    "base-protocol/std",
    "reth-network-peers/std",
    "reth-primitives-traits/std",
    "serde?/std",
    "serde_json/std",
    "thiserror/std",
]
serde = [
    "alloy-chains/serde",
    "base-common-types-chain/serde",
    "alloy-eips/serde",
    "alloy-hardforks/serde",
    "alloy-primitives/serde",
    "base-common-chains/serde",
    "base-common-genesis/serde",
    "base-common-types-rpc/serde",
    "base-protocol/serde",
    "reth-primitives-traits/serde",
]
