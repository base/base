[package]
name = "base-execution-eip8130-rpc-node"
description = "BaseNodeExtension wiring for the standalone EIP-8130 eth_getTransactionCount and eth_estimateGas overrides"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
base-node-runner = { workspace = true }
base-execution-eip8130-rpc = { workspace = true }
tracing = { workspace = true, features = ["std"] }
[dev-dependencies]
alloy-eips = { workspace = true }
serde_json = { workspace = true }
alloy-signer = { workspace = true }
alloy-genesis = { workspace = true }
base-test-utils = { workspace = true }
alloy-primitives = { workspace = true }
base-common-network = { workspace = true }
base-common-consensus = { workspace = true }
base-common-precompiles = { workspace = true }
eyre = { workspace = true, features = ["default"] }
alloy-provider = { workspace = true, features = ["default"] }
alloy-rpc-client = { workspace = true, features = ["default"] }
base-node-runner = { workspace = true, features = ["test-utils"] }
base-execution-chainspec = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
