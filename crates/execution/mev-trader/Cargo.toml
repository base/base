[package]
name = "base-mev-trader"
description = "Read-only in-node MEV measurement pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# alloy
alloy-rpc-types-engine.workspace = true
alloy-eips = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["k256", "std"] }

# base
base-execution-evm.workspace = true
base-execution-chainspec.workspace = true
base-common-consensus = { workspace = true, features = ["evm", "std"] }

# reth / revm
reth-evm.workspace = true
reth-revm.workspace = true
reth-provider.workspace = true
revm = { workspace = true, features = ["std"] }
revm-bytecode = { workspace = true, features = ["std"] }
revm-database = { workspace = true, features = ["std"] }

# execution
rayon.workspace = true
futures.workspace = true
sha2 = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }