[package]
name = "base-mev-trader"
description = "Read-only in-node MEV measurement pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# alloy
alloy-rpc-types-engine.workspace = true
alloy-eips = { workspace = true, features = ["std"] }
# k256 enables owner-signature VERIFY-only recovery (EIP-191 recover_address_from_msg)
# for B1 arming/kill-reset attestation. Recover-only: no signing, no private key.
alloy-primitives = { workspace = true, features = ["k256", "std"] }
alloy-consensus = { workspace = true, features = ["k256", "std"] }

# base
base-execution-evm.workspace = true
base-execution-chainspec.workspace = true
base-common-consensus = { workspace = true, features = ["evm", "std"] }

# reth / revm
reth-evm.workspace = true
reth-revm.workspace = true
reth-provider.workspace = true
revm = { workspace = true, features = ["std"] }
revm-bytecode = { workspace = true, features = ["std"] }
revm-database = { workspace = true, features = ["std"] }

# execution
redb.workspace = true
rayon.workspace = true
futures.workspace = true
getrandom.workspace = true
sha2 = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }

[dev-dependencies]
reth-revm = { workspace = true, features = ["test-utils"] }

[features]
edge-measurement = []
t4a-shadow = []
t4b-shadow = ["t4a-shadow"]
test-utils = ["reth-revm/test-utils"]
# P0-A external-anchor fresh-leaf bootstrap and activation. This is deliberately
# absent from default features so production cannot create, adopt, or reseed an anchor.
p0-provisioning = []
# R9 claim-store provisioning surface (bootstrap = create-a-new-store). NOT in
# default features: the live-node build never compiles `bootstrap`, so a running
# node cannot mint a fresh store. Enabled only for a dedicated provisioning
# binary (and implicitly under `cfg(test)` so the test suite can build fixtures).
r9-provisioning = []