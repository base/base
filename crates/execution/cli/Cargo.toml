[package]
name = "base-execution-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
humantime = { workspace = true }
serde_json = { workspace = true }
alloy-eips = { workspace = true }
reth-tasks = { workspace = true }
reth-discv5 = { workspace = true }
reth-db-api = { workspace = true }
reth-network = { workspace = true }
reth-provider = { workspace = true }
reth-cli-util = { workspace = true }
base-metering = { workspace = true }
base-reth-cli = { workspace = true }
reth-node-core = { workspace = true }
base-cli-utils = { workspace = true }
base-txpool-rpc = { workspace = true }
reth-stages-types = { workspace = true }
reth-cli-commands = { workspace = true }
reth-node-metrics = { workspace = true }
base-execution-trie = { workspace = true }
reth-rpc-server-types = { workspace = true }
base-shadow-indexer-db = { workspace = true }
base-observability-events = { workspace = true }
tar = { workspace = true, features = ["default"] }
url = { workspace = true, features = ["default"] }
zstd = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
base-execution-payload-builder = { workspace = true }
backon = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
secp256k1 = { workspace = true, features = ["default"] }
reth-discv4 = { workspace = true, features = ["default"] }
reth-net-nat = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default"] }
base-node-core = { workspace = true, features = ["default"] }
reth-db = { workspace = true, features = ["default", "mdbx"] }
reth-network-p2p = { workspace = true, features = ["default"] }
reth-network-peers = { workspace = true, features = ["default"] }
base-common-chains = { workspace = true, features = ["default"] }
base-tx-forwarding = { workspace = true, features = ["default"] }
base-common-consensus = { workspace = true, features = ["reth"] }
base-txpool-tracing = { workspace = true, features = ["default"] }
base-shadow-indexer = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-execution-chainspec = { workspace = true, features = ["default"] }
proptest = { workspace = true, optional = true, features = ["default"] }
reqwest = { workspace = true, features = ["default", "json", "stream"] }
base-upgrade-signal = { workspace = true, features = ["default", "metrics"] }
tokio = { workspace = true, features = ["default", "macros", "time", "sync"] }
[dev-dependencies]
alloy-chains = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-primitives = { workspace = true }
base-common-genesis = { workspace = true }
rstest = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
axum = { workspace = true, features = ["tokio", "http1"] }
base-node-core = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["default", "rt-multi-thread", "macros"] }
[build-dependencies]
base-execution-chainspec = { workspace = true, features = ["default", "std"] }

[features]
otlp = ["reth-node-core/otlp"]
otlp-logs = ["reth-node-core/otlp-logs"]
tracy = ["reth-node-core/tracy"]
default = []

# Opentelemetry feature to activate tracing and logs export

asm-keccak = [ "base-node-core/asm-keccak", "reth-node-core/asm-keccak" ]

keccak-cache-global = [
	"base-node-core/keccak-cache-global",
	"reth-node-core/keccak-cache-global",
]

# Jemalloc allocator support
jemalloc = [ "reth-node-core/jemalloc", "reth-node-metrics/jemalloc" ]
jemalloc-prof = [ "jemalloc", "reth-node-metrics/jemalloc-prof" ]
jemalloc-symbols = [ "jemalloc-prof", "reth-node-metrics/jemalloc-symbols" ]


dev = [
	"base-common-consensus/arbitrary",
	"dep:proptest",
	"reth-cli-commands/arbitrary",
]

serde = [
    "alloy-eips/serde",
    "base-common-chains/serde",
    "base-common-consensus/serde",
    "base-execution-chainspec/serde",
    "reth-network/serde",
    "secp256k1/serde",
    "url/serde",
]
