[package]
name = "base-txpool-tracing"
description = "Transaction tracing extensions for Base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# workspace
base-execution-txpool.workspace = true
base-node-runner.workspace = true
base-observability-events.workspace = true

# reth
reth-tracing.workspace = true
reth-provider.workspace = true
reth-node-api.workspace = true
reth-transaction-pool.workspace = true
reth-primitives-traits.workspace = true

# alloy
alloy-primitives.workspace = true

# async
tokio.workspace = true
futures.workspace = true
tokio-stream.workspace = true

# misc
lru.workspace = true
chrono.workspace = true
base-metrics.workspace = true
metrics = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"] }
derive_more = { workspace = true, features = ["display"] }
serde_json.workspace = true

[dev-dependencies]
# reth
reth-transaction-pool = { workspace = true, features = ["test-utils"] }

# metrics
metrics-exporter-prometheus.workspace = true

# misc
rstest.workspace = true

[features]
default = [ "metrics" ]
metrics = [
	"base-metrics/metrics",
	"base-observability-events/metrics",
	"dep:metrics",
]
