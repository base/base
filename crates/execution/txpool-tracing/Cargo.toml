[package]
name = "base-txpool-tracing"
description = "Transaction tracing extensions for Base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
base-metrics = { workspace = true }
reth-provider = { workspace = true }
reth-node-api = { workspace = true }
alloy-primitives = { workspace = true }
base-node-runner = { workspace = true }
reth-transaction-pool = { workspace = true }
reth-primitives-traits = { workspace = true }
metrics = { workspace = true, optional = true }
base-observability-events = { workspace = true }
tracing = { workspace = true, features = ["std"] }
lru = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default"] }
chrono = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["display"] }
reth-tracing = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default"] }
[dev-dependencies]
revm-database = { workspace = true }
base-test-utils = { workspace = true }
eyre = { workspace = true, features = ["default"] }
alloy-eips = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-rpc-types-engine = { workspace = true, features = ["std"] }
base-common-consensus = { workspace = true, features = ["reth"] }
base-node-runner = { workspace = true, features = ["test-utils"] }
reth-transaction-pool = { workspace = true, features = ["test-utils"] }
[features]
default = [ "metrics" ]
metrics = [
	"base-metrics/metrics",
	"base-observability-events/metrics",
	"dep:metrics",
]
