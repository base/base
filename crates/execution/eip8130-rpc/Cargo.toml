[package]
name = "base-execution-eip8130-rpc"
description = "RPC-layer helpers for EIP-8130: 2D nonce reads and gas estimation"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
jsonrpsee = { workspace = true }
alloy-eips = { workspace = true }
reth-provider = { workspace = true }
jsonrpsee-types = { workspace = true }
alloy-primitives = { workspace = true }
base-execution-rpc = { workspace = true }
reth-rpc-eth-types = { workspace = true }
base-common-types-chain = { workspace = true }
base-execution-evm-runtime = {workspace = true}
base-execution-evm-machine = { workspace = true }
tracing = { workspace = true, features = ["std"] }
base-execution-evm-precompiles = { workspace = true }
base-common-types-rpc = { workspace = true, features = ["default"] }
base-common-chain-config = {features = ["default"], workspace = true}
base-execution-state-api = { workspace = true, features = ["default"] }
base-execution-evm-blocks = { workspace = true, features = ["default"] }

[dev-dependencies]
alloy-eips = { workspace = true }
serde_json = { workspace = true }
alloy-signer = { workspace = true }
alloy-genesis = { workspace = true }
base-protocol = { workspace = true }
alloy-primitives = { workspace = true }
base-common-network = { workspace = true }
base-testing-support = { workspace = true }
base-common-types-chain = { workspace = true }
eyre = { workspace = true, features = ["default"] }
base-execution-evm-precompiles = { workspace = true }
alloy-provider = { workspace = true, features = ["default"] }
alloy-rpc-client = { workspace = true, features = ["default"] }
base-node-runner = { workspace = true, features = ["test-utils"] }
base-common-chain-config = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
