[package]
name = "base-shadow-indexer-db"
description = "Shadow indexer database access layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# database
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros", "tls-native-tls"] }

# primitives
reth-primitives-traits = { workspace = true, features = ["serde"] }
base-common-consensus = { workspace = true, features = ["reth"] }
alloy-primitives.workspace = true

# serialization
serde.workspace = true
chrono.workspace = true

# async
tokio.workspace = true

# error handling
anyhow.workspace = true

# tracing
tracing.workspace = true

[dev-dependencies]
alloy-consensus.workspace = true
serde_json.workspace = true
