[package]
name = "base-shadow-indexer-db"
description = "Shadow indexer database access layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["default"] }
chrono = { workspace = true, features = ["default"] }
anyhow = { workspace = true, features = ["default"] }
base-common-consensus = { workspace = true, features = ["reth"] }
reth-primitives-traits = { workspace = true, features = ["serde"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros", "tls-native-tls"] }
[dev-dependencies]
serde_json = { workspace = true }
alloy-consensus = { workspace = true }
alloy-primitives = { workspace = true }
