[package]
name = "base-execution-state-memory"
description = "Base execution accounts, memory databases, journals, and state transitions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[dependencies]
either = { workspace = true }
nonmax = { workspace = true }
bitflags = { workspace = true }
auto_impl = { workspace = true }
thiserror = { workspace = true }
alloy-trie = { workspace = true }
revm-bytecode = {workspace = true}
alloy-eip7928 = { workspace = true }
alloy-genesis = { workspace = true }
revm-primitives = {workspace = true}
alloy-primitives = { workspace = true }
bytes = { workspace = true, optional = true }
base-common-types-chain = { workspace = true }
modular-bitfield = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["deref", "debug"] }
arbitrary = { workspace = true, optional = true, features = ["derive"]}
serde = {workspace = true, features = ["derive", "rc"], optional = true}

[dev-dependencies]
mockall = { workspace = true }
proptest = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
serde = { workspace = true, features = ["derive"]}
serde_json = {features = ["alloc"], workspace = true}
arbitrary = { workspace = true, features = ["derive"]}
alloy-primitives = { workspace = true, features = ["arbitrary"] }

[lints]
workspace = true

[features]
default = ["std"]
serde = [
    "dep:serde",
    "revm-primitives/serde",
    "either/serde",
    "alloy-primitives/serde",
    "revm-bytecode/serde",
    "bitflags/serde",
    "alloy-eip7928/serde",
    "nonmax/serde",
]
std = [
    "serde?/std",
    "revm-primitives/std",
    "either/std",
    "thiserror/std",
    "base-common-types-chain/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-trie/std",
    "revm-bytecode/std",
    "derive_more/std",
    "serde_json/std",
    "bitflags/std",
    "alloy-eip7928/std",
    "nonmax/std",
]
arbitrary = ["dep:arbitrary", "alloy-primitives/arbitrary"]
reth-codec = ["dep:bytes", "dep:modular-bitfield", "base-common-types-chain/alloy"]
test-utils = ["arbitrary", "base-common-types-chain/test-utils"]
map-foldhash = ["revm-primitives/map-foldhash"]
