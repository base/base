[package]
name = "base-execution-state-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Trie node storage for serving proofs in FP window fast"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
metrics = { workspace = true}
auto_impl = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
derive_more = { workspace = true }
static_assertions = { workspace = true }
base-execution-state-api = {workspace = true}
base-execution-evm-runtime = {workspace = true}
base-execution-state-provider = {workspace = true}
strum = { workspace = true, features = ["derive"] }
bytes = { workspace = true, features = ["default"] }
tracing = {features = ["attributes"], workspace = true}
parking_lot = {features = ["default"], workspace = true}
alloy-rlp = { workspace = true, features = ["core-net"] }
rocksdb = { workspace = true, features = ["lz4", "zstd"] }
tokio = { workspace = true, features = ["default", "sync"] }
crossbeam-utils = { workspace = true, features = ["default"] }
bincode = { workspace = true, features = ["default", "serde"] }
crossbeam-channel = { workspace = true, features = ["default"] }
fixed-cache = { workspace = true, features = ["alloc", "stats"] }
alloy-primitives = {features = ["map-foldhash"], workspace = true}
base-common-types-chain = { workspace = true, features = ["alloy"] }
base-execution-state-memory = {features = ["std"], workspace = true}
eyre = { workspace = true, optional = true, features = ["default"] }
rand = { workspace = true, optional = true, features = ["default"] }
base-common-runtime-tasks = { workspace = true, features = ["rayon"]}
base-execution-state-trie = { features = ["serde"], workspace = true}
reth-primitives-traits = {features = ["dashmap", "std"], workspace = true}
base-execution-evm-blocks = { workspace = true, features = ["default", "witness"] }
base-execution-state-database = { workspace = true, features = ["default", "mdbx"] }
base-execution-state-types = {features = ["default", "serde", "std"], workspace = true}
base-common-observability-metrics = {features = ["common", "metrics"], workspace = true}

[dev-dependencies]
mockall = { workspace = true }
test-case = { workspace = true }
alloy-genesis = { workspace = true }
reth-db-common = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-rpc-types-debug = { workspace = true }
reth-primitives-traits = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-state-types = {workspace = true}
base-execution-state-memory = {workspace = true}
base-execution-evm-runtime = { workspace = true }
eyre = { workspace = true, features = ["default"] }
rand = { workspace = true, features = ["default"] }
rand_08 = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
serial_test = { workspace = true, features = ["default"] }
secp256k1 = { workspace = true, features = ["default", "rand", "std"] }
criterion = { workspace = true, features = ["default", "html_reports"] }
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }
base-execution-state-trie = { workspace = true, features = ["test-utils"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
base-execution-state-provider = {workspace = true, features = ["test-utils"]}
base-execution-state-database = {workspace = true, features = ["default", "test-utils"]}
tokio = { workspace = true, features = ["default", "test-util", "rt-multi-thread", "macros", "rt"] }
base-common-types-chain = { workspace = true, features = ["reth", "alloy", "test-utils", "serde", "std"] }

[[bench]]
name = "witness_reads"
harness = false

[[bench]]
name = "deep_history_reads"
harness = false

[features]
serde-bincode-compat = [
    "base-common-types-chain/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
    "base-execution-state-types/serde-bincode-compat",
    "base-execution-state-trie/serde-bincode-compat",
]
metrics = [
    "base-common-observability-metrics/metrics",
    "dep:eyre",
    "base-execution-evm-blocks/metrics",
    "base-execution-state-trie/metrics",
]
default = ["metrics"]
trie-debug = ["dep:rand", "base-execution-state-trie/trie-debug"]
test-utils = [
    "reth-primitives-traits/test-utils",
    "base-execution-state-provider/test-utils",
    "base-execution-state-trie/test-utils",
    "base-common-runtime-tasks/test-utils",
    "base-execution-state-types/test-utils",
    "base-execution-state-memory/test-utils",
]
