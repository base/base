[package]
name = "base-execution-state-types"
description = "Commonly used types for trie usage in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = {workspace = true}
alloy-eips = {workspace = true}
bytes = {workspace = true, optional = true}
reth-primitives-traits = {workspace = true}
base-common-types-chain = { workspace = true}
rayon = { workspace = true, optional = true }
arrayvec = { workspace = true, optional = true }
base-execution-state-memory = { workspace = true }
nybbles = { workspace = true, features = ["rlp"] }
alloy-serde = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"] }
derive_more = {features = ["full"], workspace = true}
modular-bitfield = {optional = true, workspace = true}
tracing = { workspace = true, features = ["attributes"] }
alloy-trie = { workspace = true, features = ["ethereum"] }
itertools = { workspace = true, features = ["use_alloc"] }
base-common-types-rpc = { workspace = true, optional = true }
alloy-primitives = {features = ["map-foldhash"], workspace = true}
serde = {optional = true, features = ["derive"], workspace = true}
alloy-rlp = { workspace = true, features = ["core-net", "arrayvec"] }
arbitrary = {optional = true, features = ["derive"], workspace = true}
hash-db = { workspace = true, optional = true, features = ["default"] }
serde_with = { workspace = true, features = ["macros"], optional = true }
plain_hasher = { workspace = true, optional = true, features = ["default"] }

[dev-dependencies]
bytes = {workspace = true}
serde = {workspace = true}
arrayvec = { workspace = true }
alloy-genesis = { workspace = true }
bincode_1_3_3 = { workspace = true }
assert_matches = { workspace = true }
base-common-types-chain = {workspace = true}
proptest-arbitrary-interop = {workspace = true}
arbitrary = {features = ["derive"], workspace = true}
proptest = {features = ["default"], workspace = true}
serde_json = {features = ["alloc"], workspace = true}
hash-db = { workspace = true, features = ["default"] }
serde_with = { workspace = true, features = ["macros"] }
plain_hasher = { workspace = true, features = ["default"] }
alloy-trie = { workspace = true, features = ["arbitrary", "serde"] }
toml_0_9_12_spec_1_1_0 = { workspace = true, features = ["default"] }
alloy-primitives = {features = ["getrandom", "map-foldhash", "serde"], workspace = true}
reth-primitives-traits = {workspace = true, features = ["arbitrary", "reth-codec", "serde"]}

[features]
default = ["std"]
std = [
    "base-common-types-chain/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "base-common-types-rpc?/std",
    "alloy-serde?/std",
    "alloy-trie/std",
    "arrayvec?/std",
    "bytes?/std",
    "derive_more/std",
    "nybbles/std",
    "reth-primitives-traits/std",
    "serde?/std",
    "serde_with?/std",
    "serde_json/std",
    "base-execution-state-memory/std",
    "alloy-eips/std",
    "thiserror/std",
    "strum/std",
    "tracing/std",
]
eip1186 = ["base-common-types-rpc/serde", "dep:alloy-serde"]
serde = [
    "dep:serde",
    "arrayvec?/serde",
    "bytes?/serde",
    "nybbles/serde",
    "alloy-primitives/serde",
    "base-common-types-chain/serde",
    "alloy-trie/serde",
    "base-common-types-rpc?/serde",
    "reth-primitives-traits/serde",
    "base-execution-state-memory/serde",
    "alloy-eips/serde",
]
reth-codec = [
    "dep:bytes",
    "dep:arrayvec",
    "dep:modular-bitfield",
    "reth-primitives-traits/reth-codec",
]
serde-bincode-compat = [
    "serde",
    "base-common-types-chain/serde-bincode-compat",
    "dep:serde_with",
    "alloy-genesis/serde-bincode-compat",
    "base-common-types-rpc?/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
]
test-utils = [
    "dep:plain_hasher",
    "dep:hash-db",
    "arbitrary",
    "reth-primitives-traits/test-utils",
    "base-common-types-chain/test-utils",
    "std",
    "dep:arbitrary",
]
arbitrary = [
    "std",
    "alloy-trie/arbitrary",
    "dep:arbitrary",
    "alloy-serde?/arbitrary",
    "reth-primitives-traits/arbitrary",
    "base-common-types-chain/arbitrary",
    "alloy-primitives/arbitrary",
    "nybbles/arbitrary",
    "base-common-types-rpc?/arbitrary",
    "alloy-eips/arbitrary",
    "base-execution-state-memory/arbitrary",
]
rayon = ["dep:rayon"]
