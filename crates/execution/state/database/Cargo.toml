[package]
name = "base-execution-state-database"
description = "Database primitives used in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
serde = { workspace = true }
metrics = {workspace = true }
arrayvec = { workspace = true }
thiserror = {workspace = true }
modular-bitfield = { workspace = true }
base-common-io-files = { workspace = true }
bitflags = { workspace = true, optional = true}
smallvec = { workspace = true, optional = true}
page_size = { workspace = true, optional = true }
sysinfo = { workspace = true, features = ["system"] }
derive_more = {workspace = true,  features = ["full"]}
roaring = { workspace = true, features = ["default"] }
tracing = {workspace = true,  features = ["attributes"]}
reth-nippy-jar = { workspace = true, features = ["default"] }
alloy-primitives = {workspace = true, features = ["map-foldhash"]}
base-common-types-chain = { workspace = true, features = ["serde"]}
base-execution-state-mdbx-sys = { workspace = true, optional = true}
eyre = { workspace = true, optional = true, features = ["default"] }
strum = { workspace = true, features = ["derive"], optional = true }
dashmap = { workspace = true, features = ["inline"], optional = true }
quanta = { workspace = true, optional = true, features = ["default"] }
rustc-hash = { workspace = true, features = ["std"], optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
byteorder = { workspace = true, features = ["default"], optional = true}
proptest = { workspace = true, optional = true, features = ["default"] }
tempfile = { workspace = true, optional = true, features = ["default"] }
parking_lot = {workspace = true, optional = true, features = ["default"]}
crossbeam-queue = { workspace = true, features = ["default"], optional = true}
base-common-observability-tracing = { workspace = true, features = ["default"] }
reth-primitives-traits = { workspace = true, features = ["serde", "reth-codec"] }
base-execution-state-types = {workspace = true, features = ["reth-codec", "serde"]}
base-execution-state-memory = {workspace = true, features = ["reth-codec", "serde"]}
base-common-observability-metrics = { workspace = true, optional = true, features = ["metrics"]}

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, features = ["default"] }
[dev-dependencies]
serde = { workspace = true }
test-fuzz = { workspace = true }
assert_matches = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
rand = { workspace = true, features = ["default"] }
arbitrary = {workspace = true, features = ["derive"]}
proptest = {workspace = true, features = ["default"]}
tempfile = {workspace = true, features = ["default"]}
serde_json = { workspace = true, features = ["alloc"] }
parking_lot = { workspace = true, features = ["default"] }
base-common-types-chain = {workspace = true, features = ["test-utils"]}
reth-primitives-traits = { workspace = true, features = ["reth-codec"] }
base-execution-state-memory = {workspace = true, features = ["reth-codec"]}
alloy-primitives = {workspace = true, features = ["getrandom", "map-foldhash", "rand"]}
base-execution-state-types = {workspace = true, features = ["arbitrary", "reth-codec"]}

[[test]]
name = "mdbx_cursor"
path = "tests/mdbx_cursor.rs"
required-features = ["mdbx"]

[[test]]
name = "mdbx_environment"
path = "tests/mdbx_environment.rs"
required-features = ["mdbx"]

[[test]]
name = "mdbx_transaction"
path = "tests/mdbx_transaction.rs"
required-features = ["mdbx"]

[features]
default = ["mdbx"]
mdbx = [
    "dep:eyre",
    "dep:page_size",
    "dep:quanta",
    "base-common-observability-metrics",
    "dep:strum",
    "dep:rustc-hash",
    "return-borrowed",
    "read-tx-timeouts",
    "dep:bitflags",
    "dep:smallvec",
    "dep:base-execution-state-mdbx-sys",
    "dep:byteorder",
    "dep:parking_lot",
    "dep:crossbeam-queue",
]
test-utils = [
    "dep:tempfile",
    "mdbx",
    "arbitrary",
    "dep:parking_lot",
    "reth-nippy-jar/test-utils",
    "reth-primitives-traits/test-utils",
    "base-execution-state-types/test-utils",
    "base-execution-state-memory/test-utils",
    "base-common-types-chain/test-utils",
]
arbitrary = [
    "alloy-primitives/arbitrary",
    "base-common-types-chain/arbitrary",
    "reth-primitives-traits/arbitrary",
    "base-execution-state-types/arbitrary",
    "base-execution-state-memory/arbitrary",
    "dep:arbitrary",
    "dep:proptest",
]
disable-lock = []
return-borrowed = []
read-tx-timeouts = ["dep:dashmap"]
