[package]
name = "base-execution-base-tx"
description = "Base transaction native validation, intrinsic gas, and fee helpers"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives.workspace = true

base-precompile-storage.workspace = true
base-common-precompiles.workspace = true
base-common-base-tx = { workspace = true, default-features = false }
base-common-consensus = { workspace = true, default-features = false, features = ["k256"] }

revm.workspace = true

thiserror.workspace = true

[dev-dependencies]
k256 = { workspace = true, features = ["ecdsa"] }
base-precompile-storage = { workspace = true, features = ["test-utils"] }

[features]
test-utils = [
	"base-common-precompiles/test-utils",
	"base-precompile-storage/test-utils",
]
