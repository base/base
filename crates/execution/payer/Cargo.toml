[package]
name = "base-execution-payer"
description = "ERC-8168 payer-service pricing: on-chain payer config, price-feed decoding, and EIP-8130 token-payment math"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
# alloy
alloy-primitives.workspace = true

# base
base-precompile-macros = { workspace = true, optional = true }
base-precompile-storage = { workspace = true, optional = true }

# revm
revm = { workspace = true, optional = true }

# misc
thiserror.workspace = true

[dev-dependencies]
base-precompile-storage = { workspace = true, features = ["test-utils"] }

[features]
# On-chain payer-config storage mirror + reader (pulls in the native
# precompile-storage machinery and, transitively, revm). The default build is
# the pure, chain-read-free pricing core.
storage = ["dep:base-precompile-macros", "dep:base-precompile-storage", "dep:revm"]
test-utils = ["storage", "base-precompile-storage/test-utils"]
