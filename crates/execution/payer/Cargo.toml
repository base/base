[package]
name = "base-execution-payer"
description = "ERC-8168 token payer that co-signs EIP-8130 transactions at ingress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# workspace
base-txpool-rpc.workspace = true
base-node-runner.workspace = true
base-common-chains.workspace = true
base-execution-rpc.workspace = true
base-execution-txpool.workspace = true
base-common-price-feed.workspace = true
base-common-consensus = { workspace = true, features = ["k256", "std"] }

# reth
reth-revm.workspace = true
reth-chainspec.workspace = true
reth-storage-api.workspace = true

# alloy
alloy-signer.workspace = true
alloy-json-rpc.workspace = true
alloy-signer-local.workspace = true
alloy-eips = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std", "serde"] }

# revm
revm = { workspace = true, features = ["std"] }

# rpc
jsonrpsee = { workspace = true, features = ["server", "macros"] }

# cli
clap = { workspace = true, features = ["derive", "env"] }

# misc
tracing.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
toml = { workspace = true, features = ["parse", "serde"] }
serde = { workspace = true, features = ["derive", "std"] }

[dev-dependencies]
base-test-utils.workspace = true
base-execution-chainspec.workspace = true
base-common-consensus = { workspace = true, features = ["reth"] }
base-common-price-feed = { workspace = true, features = ["test-utils"] }

mockall.workspace = true
tempfile.workspace = true
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt"] }
reth-provider = { workspace = true, features = ["test-utils"] }
