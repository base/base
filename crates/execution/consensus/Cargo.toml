[package]
name = "base-execution-consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude = [".github/"]

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-trie = { workspace = true }
base-protocol = { workspace = true }
alloy-hardforks = { workspace = true }
base-evm-handler = { workspace = true }
reth-storage-errors = { workspace = true }
reth-primitives-traits = { workspace = true }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
reth-storage-api = { workspace = true, features = ["default"] }
reth-trie-common = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"]}
base-common-types-chain = { workspace = true, features = ["reth"] }
reth-execution-types = { workspace = true, features = ["default"] }
base-common-chain-config = {features = ["default", "std"], workspace = true}

[dev-dependencies]
reth-trie = { workspace = true }
alloy-chains = { workspace = true }
reth-db-common = { workspace = true }
alloy-hardforks = { workspace = true }
base-common-chain-config = { workspace = true }
rand = { workspace = true, features = ["default"] }
reth-provider = { workspace = true, features = ["test-utils"] }
base-execution-evm = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
base-common-types-chain = { workspace = true, features = ["reth", "serde"] }

[features]
default = ["std"]
std = [
    "alloy-chains/std",
    "base-common-types-chain/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-trie/std",
    "base-common-chain-config/std",
    "base-protocol/std",
    "reth-execution-types/std",
    "reth-primitives-traits/std",
    "base-execution-evm/std",
    "reth-storage-api/std",
    "reth-storage-errors/std",
    "reth-trie-common/std",
    "base-evm-handler/std",
    "thiserror/std",
    "tracing/std",
    "alloy-eip7928/std",
]
test-utils = ["std", "reth-primitives-traits/test-utils"]
