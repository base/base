[package]
name = "base-tx-manager"
description = "Transaction lifecycle management for Base onchain components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
base-metrics = { workspace = true }
alloy-network = { workspace = true }
alloy-consensus = { workspace = true }
alloy-transport = { workspace = true }
alloy-primitives = { workspace = true }
base-common-signer = { workspace = true }
metrics = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["default"] }
backon = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
base-runtime = { workspace = true, features = ["tokio"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std", "kzg"] }
alloy-provider = { workspace = true, features = ["default"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default", "sync", "time"] }
[dev-dependencies]
rayon = { workspace = true }
humantime = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
alloy-signer = { workspace = true }
alloy-json-rpc = { workspace = true }
alloy-node-bindings = { workspace = true }
rstest = { workspace = true, features = ["default"] }
proptest = { workspace = true, features = ["default"] }
base-runtime = { workspace = true, features = ["test-utils"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
tokio = { workspace = true, features = ["default", "macros", "net", "rt", "rt-multi-thread"] }

[features]
metrics = [ "base-metrics/metrics", "dep:metrics" ]
