[package]
name = "base-balance-monitor"
description = "Periodic onchain balance monitoring for Base services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true }
base-common-network = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["default"] }
alloy-provider = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "sync", "time"] }
[dev-dependencies]
alloy-node-bindings = { workspace = true }
tokio = { workspace = true, features = ["default", "macros", "rt"] }
