[package]
name = "base-upgrade-signal"
description = "L1 upgrade signal reader utilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# workspace
base-retry = { workspace = true, optional = true }
base-metrics = { workspace = true, optional = true }
base-common-genesis = { workspace = true, features = ["std"], optional = true }

# alloy
alloy-json-rpc = { workspace = true, optional = true }
alloy-provider = { workspace = true, features = ["reqwest", "reqwest-default-tls"], optional = true }
alloy-transport = { workspace = true, optional = true }
alloy-rpc-client = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, features = ["std"], optional = true }
alloy-primitives = { workspace = true, features = ["std"], optional = true }
alloy-rpc-types-eth = { workspace = true, features = ["std"], optional = true }

# general
url = { workspace = true, optional = true }
eyre = { workspace = true, optional = true }
backon = { workspace = true, optional = true }
tracing.workspace = true
futures = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"], optional = true }
reqwest = { workspace = true, features = ["charset", "default-tls", "http2", "json", "system-proxy"], optional = true }
thiserror = { workspace = true, features = ["std"], optional = true }
serde_json = { workspace = true, features = ["std"], optional = true }
clap = { workspace = true, features = ["derive", "env"], optional = true }
serde = { workspace = true, features = ["derive", "std"] }

[dev-dependencies]
rstest.workspace = true
httpmock.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[[bin]]
name = "contract_upgrade_ids"
required-features = ["reader"]

[features]
default = [ "reader" ]
reader = [
	"dep:alloy-json-rpc",
	"dep:alloy-primitives",
	"dep:alloy-provider",
	"dep:alloy-rpc-client",
	"dep:alloy-rpc-types-eth",
	"dep:alloy-sol-types",
	"dep:alloy-transport",
	"dep:backon",
	"dep:base-common-genesis",
	"dep:base-metrics",
	"dep:base-retry",
	"dep:clap",
	"dep:eyre",
	"dep:futures",
	"dep:reqwest",
	"dep:serde_json",
	"dep:thiserror",
	"dep:tower",
	"dep:url",
]
metrics = [ "base-metrics?/metrics", "dep:metrics" ]
