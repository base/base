[package]
name = "base-jwt"
description = "JWT secret handling and validation for Base node components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
base-consensus-engine = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"], optional = true }
url = { workspace = true, optional = true, features = ["default"] }
eyre = { workspace = true, optional = true, features = ["default"] }
backon = { workspace = true, optional = true, features = ["default"] }
alloy-rpc-types-engine = { workspace = true, features = ["jwt", "std"] }
alloy-provider = { workspace = true, optional = true, features = ["default"] }
base-common-rpc-types = { workspace = true, optional = true, features = ["network"]}

[features]
test-utils = [ "base-consensus-engine?/test-utils" ]
engine-validation = [
    "dep:alloy-provider",
    "dep:backon",
    "dep:base-common-rpc-types",
    "dep:base-consensus-engine",
    "dep:eyre",
    "dep:tracing",
    "dep:url",
]
