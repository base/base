[package]
name = "base-batcher-source"
description = "Ordered L2 block polling and L1 head sourcing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base-runtime = { workspace = true }
tracing = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["default"] }
base-protocol = { workspace = true, features = ["std"] }
derive_more = { workspace = true, features = ["debug"] }
base-common-types-chain = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default", "macros", "sync"] }
[dev-dependencies]
mockall = { workspace = true }
base-common-types-chain = { workspace = true }
tokio = { workspace = true, features = ["default", "rt"] }
alloy-primitives = { workspace = true, features = ["std"] }
base-runtime = { workspace = true, features = ["test-utils"] }
