[package]
name = "base-batcher-core"
description = "Batcher driver: async BatchDriver wiring encoder, source, and tx manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
auto_impl = { workspace = true }
base-blobs = { workspace = true }
base-tx-manager = { workspace = true }
base-batcher-source = { workspace = true }
base-batcher-encoder = { workspace = true }
tracing = { workspace = true, features = ["std"] }
async-trait = { workspace = true, optional = true }
thiserror = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["default"] }
base-protocol = { workspace = true, features = ["std"] }
base-runtime = { workspace = true, features = ["tokio"] }
serde = { workspace = true, features = ["derive", "std"] }
alloy-primitives = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default", "sync", "macros", "rt"] }
derive_more = { workspace = true, features = ["debug", "display", "from_str"] }
base-common-types-chain = { workspace = true, features = ["std"], optional = false}
base-common-types-rpc = { workspace = true, features = ["std"], optional = true }
[dev-dependencies]
async-trait = { workspace = true }
rstest = { workspace = true, features = ["default"] }
base-runtime = { workspace = true, features = ["test-utils"] }
base-common-types-chain = { workspace = true, features = ["std"] }
base-common-types-rpc = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default", "macros", "rt", "time"] }
[[test]]
name = "reorg"
required-features = ["test-utils"]

[[test]]
name = "throttle"
required-features = ["test-utils"]

[[test]]
name = "heads"
required-features = ["test-utils"]

[[test]]
name = "lifecycle"
required-features = ["test-utils"]

[[test]]
name = "pause_resume"
required-features = ["test-utils"]

[features]
metrics = [ "base-batcher-encoder/metrics", "base-tx-manager/metrics" ]
test-utils = [
    "base-protocol/test-utils",
    "base-runtime/test-utils",
    "dep:base-common-types-rpc",
    "dep:async-trait",
]
