[package]
name = "base-batcher-service"
description = "Batcher service: config, CLI arguments, and service startup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base-retry = { workspace = true }
async-trait = { workspace = true }
base-metrics = { workspace = true }
base-tx-manager = { workspace = true }
base-batcher-core = { workspace = true }
base-common-network = {workspace = true}
base-batcher-admin = { workspace = true }
base-batcher-source = { workspace = true }
base-balance-monitor = { workspace = true }
base-batcher-encoder = { workspace = true }
metrics = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
backon = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["debug"] }
base-protocol = { workspace = true, features = ["std"] }
base-runtime = { workspace = true, features = ["tokio"] }
tokio-util = { workspace = true, features = ["default"] }
base-common-consensus = { workspace = true, features = ["std"] }
base-common-rpc-types = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["serde", "std"] }
jsonrpsee = { workspace = true, features = ["http-client", "macros"] }
tokio = { workspace = true, features = ["default", "rt", "sync", "time"] }
base-consensus-rpc = { workspace = true, features = ["default", "client"] }
alloy-provider = { workspace = true, features = ["default", "pubsub", "ws"] }

[dev-dependencies]
httpmock = { workspace = true, features = ["default"] }
base-runtime = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }

[features]
metrics = [
    "base-batcher-core/metrics",
    "base-batcher-encoder/metrics",
    "base-consensus-rpc/metrics",
    "base-metrics/metrics",
    "base-tx-manager/metrics",
    "dep:metrics",
]
