[package]
name = "base-batcher-encoder"
description = "Batcher encoding pipeline: BatchPipeline trait and BatchEncoder state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-rlp = { workspace = true }
base-metrics = { workspace = true }
metrics = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"] }
base-comp = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std"] }
base-protocol = { workspace = true, features = ["std"] }
derive_more = { workspace = true, features = ["debug"] }
alloy-primitives = { workspace = true, features = ["std"] }
base-common-genesis = { workspace = true, features = ["std"] }
base-common-consensus = { workspace = true, features = ["std"] }
rand = { workspace = true, features = ["default", "std", "small_rng"] }
clap = { workspace = true, features = ["default", "derive"], optional = true }
[dev-dependencies]
rstest = { workspace = true, features = ["default"] }
base-common-consensus = { workspace = true, features = ["std"] }

[features]
clap = [ "dep:clap" ]
metrics = [ "base-metrics/metrics", "dep:metrics" ]
