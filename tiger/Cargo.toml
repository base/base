[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
homepage = "https://github.com/base/base"
repository = "https://github.com/base/base"

# The tiger client: a Base execution client without reth or revm. Its own workspace, so its
# dependency tree and lockfile stay separate from the base workspace. See README.md for why each
# dependency is here and SCOPE.md for what the client does.
[workspace]
resolver = "2"
members = ["evm", "net", "node", "p2p", "precompiles", "store", "trie"]

[workspace.dependencies]
# tiger
base-tiger-evm = { path = "evm" }
base-tiger-store = { path = "store" }
base-tiger-trie = { path = "trie" }
base-tiger-net = { path = "net" }
base-tiger-p2p = { path = "p2p" }
base-tiger-precompiles = { path = "precompiles" }

# base: engine-neutral Base types whose dependency trees hold no reth or revm.
base-common-flz = { path = "../crates/common/flz", default-features = false }
base-common-base-tx = { path = "../crates/common/base-tx", default-features = false }
base-common-evm2 = { path = "../crates/common/evm2", default-features = false }
base-common-genesis = { path = "../crates/common/genesis", default-features = false }
base-common-l1-fees = { path = "../crates/common/l1-fees", default-features = false }
base-common-consensus = { path = "../crates/common/consensus", default-features = false }
base-common-rpc-types = { path = "../crates/common/rpc-types", default-features = false }
base-common-rpc-types-engine = { path = "../crates/common/rpc-types-engine", default-features = false }

# evm2
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "9b037449c846515624ff6afde739f2b764851446", default-features = false }
evm2-inspectors = { git = "https://github.com/alloy-rs/evm2", rev = "9b037449c846515624ff6afde739f2b764851446", default-features = false, features = ["std", "serde"] }

# alloy
alloy-rlp = { version = "0.3.16", default-features = false }
alloy-trie = { version = "0.9.8", default-features = false }
alloy-eips = { version = "2.5.0", default-features = false }
alloy-consensus = { version = "2.5.0", default-features = false }
alloy-genesis = { version = "2.5.0", default-features = false }
alloy-rpc-types-eth = { version = "2.5.0", default-features = false }
alloy-rpc-types-engine = { version = "2.5.0", default-features = false }
alloy-sol-types = { version = "1.6.1", default-features = false, features = ["std"] }
alloy-primitives = { version = "1.6.1", default-features = false, features = ["map-foldhash"] }

# build
cc = "1.2"

# storage (base-reth on-disk format)
zstd = { version = "0.13", default-features = false }
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "zstd", "bindgen-runtime"] }

# crypto (networking)
aes = { version = "0.8.4", default-features = false }
ctr = { version = "0.9.2", default-features = false }
ring = { version = "0.17.14", default-features = false }
getrandom = { version = "0.3.4", default-features = false }
secp256k1 = { version = "0.31.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# tests only
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

# serialization
serde = { version = "1.0.228", default-features = false }
serde_json = { version = "1.0.151", default-features = false }

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg-macro = "warn"
use-self = "warn"
uninlined-format-args = "warn"
undocumented-unsafe-blocks = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package]
"*" = { debug = false, opt-level = 2 }
# Proc macros, build scripts' dependencies and the crates every build script waits on only run
# while compiling, so they skip the optimization above. `"*"` outranks `build-override`, so they
# are named. Optimizing them made clean `cargo check`, `cargo build` and `cargo test` about 15s
# slower, mostly by delaying the RocksDB build. Add a crate here only if no runtime code uses it.
alloy-rlp-derive = { opt-level = 0 }
alloy-sol-macro-expander = { opt-level = 0 }
alloy-sol-macro-input = { opt-level = 0 }
alloy-tx-macros = { opt-level = 0 }
aho-corasick = { opt-level = 0 }
ambassador = { opt-level = 0 }
ark-ff-macros = { opt-level = 0 }
auto_impl = { opt-level = 0 }
autocfg = { opt-level = 0 }
bindgen = { opt-level = 0 }
cc = { opt-level = 0 }
clang-sys = { opt-level = 0 }
darling_core = { opt-level = 0 }
derive-where = { opt-level = 0 }
derive_more-impl = { opt-level = 0 }
educe = { opt-level = 0 }
evm2-macros = { opt-level = 0 }
find-msvc-tools = { opt-level = 0 }
jobserver = { opt-level = 0 }
nom = { opt-level = 0 }
num_enum_derive = { opt-level = 0 }
pkg-config = { opt-level = 0 }
proc-macro2 = { opt-level = 0 }
quote = { opt-level = 0 }
regex = { opt-level = 0 }
regex-automata = { opt-level = 0 }
regex-syntax = { opt-level = 0 }
serde_derive = { opt-level = 0 }
serde_with_macros = { opt-level = 0 }
shlex = { opt-level = 0 }
strum_macros = { opt-level = 0 }
syn = { opt-level = 0 }
syn-solidity = { opt-level = 0 }
thiserror-impl = { opt-level = 0 }
version_check = { opt-level = 0 }

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
panic = "unwind"
codegen-units = 16

# One codegen unit keeps the hot hashing and state paths inlined across the EVM and the generic
# precompile dispatch compiled into it; split units left them out of line by chance. About 1.4%
# fewer execution instructions per replayed mainnet block, for about 13 s (7%) more clean build.
[profile.release.package.base-tiger-evm]
codegen-units = 1

[profile.release.package.evm2]
codegen-units = 1

# Fat LTO and one codegen unit: slower to build, about 4% fewer instructions per replayed block
# than release (README.md, "Optimized builds"). `pgo.sh` builds with it by default.
[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
