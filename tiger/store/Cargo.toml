[package]
name = "base-tiger-store"
description = "The tiger client's storage: base-reth's on-disk format (MDBX tables, static files, RocksDB indices)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
# alloy
alloy-trie = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std"] }
alloy-rlp = { workspace = true, features = ["std"] }

# base
base-common-consensus = { workspace = true, features = ["std"] }

# storage
zstd.workspace = true
rocksdb.workspace = true

[build-dependencies]
cc.workspace = true

[features]
# A 64 GiB MDBX map instead of 8 TiB, so a test process holding many datadirs stays inside the
# 128 TiB user address space.
test-utils = []
