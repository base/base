[package]
name = "base-tiger"
description = "The tiger client: a Base execution client without reth or revm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tiger"
path = "src/main.rs"

[dependencies]
# tiger
base-tiger-evm.workspace = true
base-tiger-store.workspace = true
base-tiger-net.workspace = true
base-tiger-trie.workspace = true

# base
base-proof-mpt = { path = "../../crates/proof/mpt", default-features = false, features = ["std"] }
base-common-genesis = { workspace = true, features = ["std"] }
base-common-consensus = { workspace = true, features = ["std", "k256", "serde"] }
base-common-rpc-types = { workspace = true, features = ["std"] }
base-common-rpc-types-engine = { workspace = true, features = ["serde"] }

# evm2
evm2 = { workspace = true, features = ["std"] }

# alloy
alloy-rlp = { workspace = true, features = ["derive"] }
alloy-genesis = { workspace = true, features = ["std"] }
alloy-rpc-types-eth = { workspace = true, features = ["std", "serde"] }
alloy-rpc-types-engine = { workspace = true, features = ["std", "serde"] }
alloy-trie = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std"] }
alloy-serde = { version = "2.5.0", default-features = false, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std", "serde"] }

# crypto (Engine API JWT, node key)
sha2.workspace = true
hmac.workspace = true
secp256k1 = { workspace = true, features = ["std"] }

# serialization
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }

[features]
# Edge coverage for guided fuzzing; build with `RUSTC_WRAPPER=etc/tools/diff-adapter/sancov-rustc.sh`
# and `SANCOV_CRATES` naming the crates to instrument (see README.md).
edge-coverage = []
