[package]
name = "base-tiger-p2p"
description = "tp2p: an encrypted peer-to-peer network for Base execution and consensus nodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

# Only crates already in both tiger's and the base workspace's lockfiles, so tp2p adds no crate to
# either (README.md, "Dependencies").
[dependencies]
ring = { workspace = true, features = ["alloc"] }
secp256k1 = { workspace = true, features = ["std", "global-context"] }
