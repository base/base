[package]
name = "base-tiger-evm"
description = "Base block execution on evm2 for the tiger client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# tiger
base-tiger-precompiles.workspace = true
base-tiger-precompile-storage.workspace = true

# base
base-common-flz.workspace = true
base-common-evm2.workspace = true
base-common-base-tx.workspace = true
base-common-genesis.workspace = true
base-common-l1-fees.workspace = true
base-common-consensus = { workspace = true, features = ["std", "k256"] }

# evm2
evm2 = { workspace = true, features = ["std", "secp256k1", "asm-keccak"] }

# alloy
alloy-rlp.workspace = true
alloy-trie.workspace = true
alloy-eips.workspace = true
alloy-consensus = { workspace = true, features = ["std", "secp256k1"] }
alloy-primitives.workspace = true

[dev-dependencies]
alloy-sol-types.workspace = true
k256.workspace = true
