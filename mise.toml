min_version = "2026.10.9"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64"]

[tools]
go = "1.24.13"
just = "1.58.0"
# Newer Soldeer versions rewrite the checked-in lockfile during installation.
foundry = "1.5.1"
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-", matching = "linux-musl.tar.gz" }
"github:EmbarkStudios/cargo-deny" = { version = "0.20.2", matching = "linux-musl.tar.gz" }
"github:est31/cargo-udeps" = { version = "0.1.61", matching = "linux-musl.tar.gz" }
"github:mozilla/sccache" = { version = "0.18.0", matching = "linux-musl.tar.gz" }
"github:lycheeverse/lychee" = { version = "0.24.2", version_prefix = "lychee-v", matching = "linux-musl.tar.gz" }
"github:ggwpez/zepter" = "1.88.1"
solidity = { version = "0.8.33", bin = "solc", platforms.linux-x64.asset_pattern = "solc-static-linux", platforms.linux-arm64.asset_pattern = "solc-static-linux-arm" }

# Rust goes last so old cargo-installed CLIs cannot shadow the locked tools.
# Keep stable first in this array and aligned with rust-toolchain.toml. The
# nightly request is locked to a date and provides the cargo +nightly alias.
rust = [
    { version = "1.96.0", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["riscv32imac-unknown-none-elf"] },
    { version = "nightly", profile = "minimal", components = ["rustfmt", "rust-src"] },
]

[env]
# Keep Forge from downloading an unlocked compiler of its own.
FOUNDRY_SOLC = { value = "{{ tools.solidity.path }}/solc", tools = true }
