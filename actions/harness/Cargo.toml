[package]
name = "base-action-harness"
description = "Action test harness for Base — simulated L1/L2 actors for protocol integration testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
base-runtime = { workspace = true }
alloy-signer = { workspace = true }
alloy-network = { workspace = true }
base-state-api = { workspace = true }
reth-db-common = { workspace = true }
alloy-transport = { workspace = true }
base-test-utils = { workspace = true }
base-tx-manager = { workspace = true }
alloy-primitives = { workspace = true }
base-common-signer = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
base-consensus-node = { workspace = true }
base-batcher-source = { workspace = true }
base-batcher-encoder = { workspace = true }
base-consensus-gossip = { workspace = true }
base-consensus-engine = { workspace = true }
base-consensus-safedb = { workspace = true }
reth-primitives-traits = { workspace = true }
eyre = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
alloy-genesis = { workspace = true, features = ["std"] }
base-protocol = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["default"] }
alloy-consensus = { workspace = true, features = ["std"] }
miniz_oxide = { workspace = true, features = ["default"] }
alloy-provider = { workspace = true, features = ["default"] }
base-common-genesis = { workspace = true, features = ["std"] }
reth-trie-common = { workspace = true, features = ["default"] }
reth-provider = { workspace = true, features = ["test-utils"] }
alloy-rpc-types-engine = { workspace = true, features = ["std"] }
base-common-chains = { workspace = true, features = ["default"] }
base-execution-evm = { workspace = true, features = ["default"] }
base-consensus-rpc = { workspace = true, features = ["default"] }
reth-execution-types = { workspace = true, features = ["default"] }
base-batcher-core = { workspace = true, features = ["test-utils"] }
base-common-rpc-types = { workspace = true, features = ["network"]}
base-execution-txpool = { workspace = true, features = ["default"] }
reth-db = { workspace = true, features = ["default", "test-utils"] }
base-common-rpc-types-engine = { workspace = true, features = ["std"] }
base-common-consensus = { workspace = true, features = ["std", "evm"] }
base-consensus-derive = { workspace = true, features = ["test-utils"] }
base-execution-chainspec = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "rt", "time", "sync"] }
base-execution-payload-types = { workspace = true, features = ["default"] }
base-execution-payload-builder = { workspace = true, features = ["default"] }
base-builder-core = { workspace = true, features = ["default", "test-utils"] }
[dev-dependencies]
base-blobs = { workspace = true }
base-common-precompiles = { workspace = true }
base-precompile-storage = { workspace = true }
alloy-sol-types = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default", "rt", "macros"] }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
