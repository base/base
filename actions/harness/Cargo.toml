[package]
name = "base-action-harness"
description = "Action test harness for Base — simulated L1/L2 actors for protocol integration testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
alloy-signer = { workspace = true }
reth-db-common = { workspace = true }
alloy-transport = { workspace = true }
alloy-primitives = { workspace = true }
base-testing-support = { workspace = true }
base-common-types-rpc = { workspace = true }
base-consensus-engine = { workspace = true }
reth-primitives-traits = { workspace = true }
base-common-runtime-tasks = { workspace = true }
base-execution-state-memory = {workspace = true}
base-common-l1-transactions = { workspace = true }
eyre = { workspace = true, features = ["default"] }
base-batcher-encoding-channel = { workspace = true }
base-consensus-network-service = { workspace = true }
tempfile = { workspace = true, features = ["default"] }
alloy-genesis = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["default"] }
miniz_oxide = { workspace = true, features = ["default"] }
reth-provider = { workspace = true, features = ["test-utils"] }
base-common-types-chain = { workspace = true, features = ["std"] }
base-common-types-payload = {workspace = true, features = ["std"]}
base-execution-txpool = { workspace = true, features = ["default"] }
base-consensus-batch-types = { workspace = true, features = ["std"] }
base-execution-state-types = {features = ["default"], workspace = true}
base-common-client-ethereum = {workspace = true, features = ["default"]}
base-execution-evm-blocks = { workspace = true, features = ["default"] }
base-consensus-driver-service = {features = ["default"], workspace = true}
tokio = { workspace = true, features = ["default", "rt", "time", "sync"] }
base-batcher-service-driver = {workspace = true, features = ["test-utils"]}
base-common-chain-config = {features = ["default", "std"], workspace = true}
base-execution-payload-builder = { workspace = true, features = ["default"] }
base-builder-core = { workspace = true, features = ["default", "test-utils"] }
base-consensus-derive-pipeline = { workspace = true, features = ["test-utils"] }
base-execution-state-database = { workspace = true, features = ["default", "test-utils"] }

[dev-dependencies]
base-execution-evm-precompiles = {workspace = true}
base-batcher-encoding-channel = { workspace = true }
alloy-sol-types = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["default", "rt", "macros"] }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
