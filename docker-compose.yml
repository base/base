# Public operator node. Pin the image with NODE_TAG=vX.Y.Z, or pass --build.
services:
  node:
    image: ghcr.io/base/node:${NODE_TAG:-latest}
    build:
      context: .
      dockerfile: etc/docker/Dockerfile.rust-services
      target: base
      args:
        PROFILE: ${PROFILE:-release}
    restart: unless-stopped
    ports:
      - "8545:8545" # Execution RPC
      - "8546:8546" # Execution websocket
      - "7545:7545" # Consensus RPC
      - "7301:6060" # Execution metrics
      - "7300:7300" # Consensus metrics
      - "30303:30303" # Execution P2P
      - "30303:30303/udp"
      - "9222:9222" # Consensus P2P
      - "9222:9222/udp"
    command:
      - --metrics.enabled
      - --metrics.addr=0.0.0.0
      - --metrics.port=7300
      - rpc
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.origins=*
      - --rpc.port=7545
      - --p2p.listen.udp=9222
      - --metrics=0.0.0.0:6060
    volumes:
      - ${HOST_DATA_DIR:-./reth-data}:/data
    env_file:
      - ${NETWORK_ENV:-.env.mainnet}
