name: Setup
description: Shared CI setup for Rust projects

inputs:
  toolchain:
    description: Rust toolchain channel (stable or nightly)
    default: "stable"
  components:
    description: Rust components to install (e.g. clippy, rustfmt)
    default: ""
  tools:
    description: Cargo tools to install via taiki-e/install-action
    default: ""
  foundry:
    description: Install Foundry
    default: "false"
  sp1:
    description: Install the SP1 toolchain (cargo-prove) for building ELFs
    default: "false"
  sp1-version:
    description: SP1 release tag used when sp1 is enabled (matches etc/just/succinct.just)
    default: "v6.4.0"
  native-deps:
    description: Install native build dependencies (clang, llvm, etc.)
    default: "false"
  free-disk:
    description: Free disk space before building
    default: "false"
  rust-cache-shared-key:
    description: Shared key for Rust cache (empty to skip caching)
    default: ""
  rust-cache-save:
    description: Whether to save the Rust cache
    default: "false"
  just:
    description: Install just
    default: "true"
  sccache-write:
    description: >
      Whether this job may write to the shared GHA sccache. Default is read-only
      so only designated writers (CI Test, main cache warmer) compete for the
      200 uploads/min repo limit.
    default: "false"

runs:
  using: composite
  steps:
    - name: Free Disk Space (fast pre-clean)
      if: inputs.free-disk == 'true'
      id: disk-space
      shell: bash
      run: |
        available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
        echo "Available disk space: $((available_kib / 1024 / 1024)) GiB"
        if (( available_kib < 100 * 1024 * 1024 )); then
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          echo "Available disk space after pre-clean: $((available_kib / 1024 / 1024)) GiB"
        fi
        (( available_kib < 100 * 1024 * 1024 )) && cleanup=true || cleanup=false
        echo "cleanup=$cleanup" >> "$GITHUB_OUTPUT"

    - name: Free Disk Space
      if: steps.disk-space.outputs.cleanup == 'true'
      continue-on-error: true
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: true
        large-packages: false
        swap-storage: true

    - name: Install native dependencies
      if: inputs.native-deps == 'true'
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          clang \
          libclang-dev \
          libprotobuf-dev \
          libsqlite3-dev \
          llvm \
          llvm-dev \
          pkg-config \
          protobuf-compiler

    - name: Install Rust (stable via rust-toolchain.toml)
      if: inputs.toolchain == 'stable'
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        rustup show active-toolchain
        if [ -n "$COMPONENTS" ]; then
          rustup component add $COMPONENTS
        fi

    - name: Install Rust (nightly)
      if: inputs.toolchain == 'nightly'
      uses: dtolnay/rust-toolchain@0c3131df9e5407c0c36352032d04af846dbe0fb7 # nightly
      with:
        components: ${{ inputs.components }}

    - name: Configure sccache
      shell: bash
      env:
        SCCACHE_WRITE: ${{ inputs.sccache-write }}
      run: |
        if [ "$SCCACHE_WRITE" = "true" ]; then
          echo "SCCACHE_GHA_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"
          echo "sccache mode: READ_WRITE (designated writer)"
        else
          echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >> "$GITHUB_ENV"
          echo "sccache mode: READ_ONLY"
        fi

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      env:
        SCCACHE_GHA_RW_MODE: ${{ inputs.sccache-write == 'true' && 'READ_WRITE' || 'READ_ONLY' }}

    - name: Rust cache
      if: inputs.rust-cache-shared-key != ''
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      with:
        cache-on-failure: true
        shared-key: ${{ inputs.rust-cache-shared-key }}
        save-if: ${{ inputs.rust-cache-save }}
        cache-targets: "false"

    - name: Install just
      if: inputs.just == 'true'
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: "1.43.1"

    - name: Install cargo tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@3575e532701a5fc614b0c842e4119af4cc5fd16d # v2.62.60
      with:
        tool: ${{ inputs.tools }}

    - name: Install Foundry
      if: inputs.foundry == 'true'
      uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
      with:
        version: stable

    - name: Install SP1 toolchain
      if: inputs.sp1 == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # Commit for succinctlabs/sp1 v6.4.0; update alongside SP1_VERSION.
        SP1UP_REF: f66b4bff51d0ccff51d152e0f7f66b2ffedf3529
        SP1_VERSION: ${{ inputs.sp1-version }}
      run: |
        if [ -x "$HOME/.sp1/bin/cargo-prove" ]; then
          echo "cargo-prove already installed"
        else
          mkdir -p "$HOME/.sp1/bin"
          curl --fail --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Accept: application/vnd.github.raw" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "User-Agent: base-base-ci" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/succinctlabs/sp1/contents/sp1up/sp1up?ref=$SP1UP_REF" \
            -o "$HOME/.sp1/bin/sp1up"
          chmod +x "$HOME/.sp1/bin/sp1up"
          "$HOME/.sp1/bin/sp1up" --version "$SP1_VERSION"
        fi
        echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

    - name: Set LIBCLANG_PATH
      if: inputs.native-deps == 'true'
      shell: bash
      run: |
        LLVM_BIN=$(command -v llvm-config || ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)
        LLVM_VERSION=$($LLVM_BIN --version | cut -d. -f1)
        echo "LIBCLANG_PATH=/usr/lib/llvm-${LLVM_VERSION}/lib" >> $GITHUB_ENV
