name: Start Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor

permissions:
  contents: write
  pull-requests: write

jobs:
  start:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Create release branch
        run: ./etc/scripts/release/start-release.sh "${{ inputs.bump_type }}"

      - name: Run version sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(cat "${{ runner.temp }}/release_branch")
          git checkout "$BRANCH"
          ./etc/scripts/release/version-sync.sh "$BRANCH"

      - name: Summary
        run: |
          CURRENT=$(cat "${{ runner.temp }}/current_version")
          NEW=$(cat "${{ runner.temp }}/new_version")
          BRANCH=$(cat "${{ runner.temp }}/release_branch")

          echo "## Release Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${CURRENT} → v${NEW}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next: merge the version sync PR, then run **Publish Release**" >> $GITHUB_STEP_SUMMARY
