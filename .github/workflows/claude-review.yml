name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # This allows posting comments and reviews
  # It does not allow pushing any commits or modifying any files in the repo
  pull-requests: write

jobs:
  review:
    name: Review PR
    # Note: This job runs on the BaseRunnerGroup to be able to access LLM Gateway
    # It will not work on other runners
    # Skip for external contributor PRs (forks) — secrets and runner group are unavailable
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: BaseRunnerGroup
    steps:
      - name: Harden the runner (Block unauthorized outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            bun.sh:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            ${{ vars.LLM_GATEWAY_HOSTNAME }}:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Run Claude Code
        id: claude-review
        uses: anthropics/claude-code-action@1b8ee3b94104046d71fde52ec3557651ad8c0d71 # v1.0.29
        env:
          ANTHROPIC_BASE_URL: https://${{ vars.LLM_GATEWAY_HOSTNAME }}

        with:
          anthropic_api_key: ${{ secrets.LLM_GATEWAY_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # When track_progress is enabled:
          # - Creates a tracking comment with progress checkboxes
          # - Includes all PR context (comments, attachments, images)
          # - Updates progress as the review proceeds
          # - Marks as completed when done
          track_progress: false

          # review instructions
          prompt: |
            You are reviewing a Pull Request for Base Reth Node — a Rust Ethereum L2 node built on Reth.

            CODEBASE:
            - 4 core crate groups: crates/{client, builder, consensus, shared}
            - devnet/: system and E2E test infrastructure for Base node
            - Error handling: thiserror enums with From impls
            - Async: tokio, async-trait, arc-swap for lock-free config
            - CI already enforces: clippy (52 rules, -D warnings), rustfmt (2024 edition), cargo-deny, cargo-udeps

            REVIEW GUIDELINES:
            - Review like a senior Rust engineer on the team
            - Focus on correctness, safety, and idiomatic Rust
            - Review code using the PR context and the `gh pr diff` / `gh pr view` commands; do not rely on broad local repo reads
            - DO NOT comment on formatting or style — clippy and rustfmt handle that
            - DO NOT post praise, "looks good", or filler comments. If everything looks fine, post nothing
            - Use inline comments for specific code feedback via mcp__github_inline_comment__create_inline_comment
            - Post one summary comment at the end with your overall assessment (if you have findings)

            DUPLICATE AVOIDANCE:
            Before posting any inline comment, first fetch all existing inline review comments on this PR by running:
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.user.login == "github-actions[bot]") | {path, body}'
            Do NOT post a comment if there is already a comment from github-actions[bot] on the same file raising the same or substantially similar issue.
            Only post new findings that haven't been raised before.

            WHAT TO LOOK FOR:
            - Error handling: .unwrap()/.expect() in non-test code, discarded error context (.map_err(|_| ...)), missing From impls
            - Memory & performance: unnecessary .clone() on large types in hot paths, unbounded collections from external input
            - Concurrency: locks held across .await, channel misuse (no backpressure, unhandled closed channels), cancellation safety in tokio::select!
            - Safety: unsafe without // SAFETY comments, unchecked arithmetic on financial/gas values, HashMap in determinism-sensitive code
            - API design: missing #[must_use] on Result-returning public methods, breaking changes to public interfaces
            - Architecture: dependency direction violations (shared depending on client/builder), tight coupling between crate layers
            - Rust idioms: &String instead of &str, &Vec<T> instead of &[T], manual implementations of standard traits, needless lifetime annotations

            BLOCK PRODUCTION HALT/STALL CRITICAL FINDINGS:
            Treat PRs touching builder, execution, precompile, payload assembly, state-root, tx selection, metering, payload/data transport, or flashblocks publishing paths as block-production-sensitive.
            After forming your standard review findings, check whether the PR is block-production-sensitive. If it is, run `git show HEAD:docs/guides/BLOCK_PRODUCTION_REVIEW.md` and use that guide as an additional authoritative source for Critical block-production halt/stall findings.
            The guide's known trigger classes are not exhaustive. Use your own engineering judgment to identify analogous changes that could halt block production, stall payload finalization, prevent validator re-execution, or indefinitely exclude valid transactions.

            Leave an inline Critical finding for any unmitigated change that can introduce, widen, or obscure a block-production halt/stall trigger described in the guide or an analogous trigger you identify.
            A Critical finding must explain the triggering input/state/config, affected code path, propagated error or panic, why block production or validator progression can halt/stall, and the missing mitigation or test.

            COMMENT MANAGEMENT:
            Before posting your review summary, delete ONLY your own previous summary comments from earlier runs, identified by the leading marker `<!-- CLAUDE_REVIEW_SUMMARY -->`.
            Do NOT use `gh pr comment --delete-last`: it deletes the most recent github-actions[bot] top-level comment regardless of which workflow created it, so it wipes unrelated bot comments (e.g. the benchmark results comment) that also post as github-actions[bot].
            1. List your prior summary comment ids: gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.body | startswith("<!-- CLAUDE_REVIEW_SUMMARY -->")) | .id'
            2. Delete each id individually: gh api -X DELETE repos/${{ github.repository }}/issues/comments/<id>
            3. Then post your new summary using: gh pr comment ${{ github.event.pull_request.number }} --body "<!-- CLAUDE_REVIEW_SUMMARY -->\n\n<your summary>"

          claude_args: |
            --model claude-opus-4-6-default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git ls-files docs),Bash(git show HEAD:docs/:*),Bash(cat /home/runner/.claude/projects/:*),Bash(gh pr comment ${{ github.event.pull_request.number }} --body:*),Bash(gh pr comment ${{ github.event.pull_request.number }} --edit-last --body:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments:*),Bash(gh api -X DELETE repos/${{ github.repository }}/issues/comments/:*)"
