name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job asks for what it needs. Neither can push commits or modify files in the repo.
permissions:
  contents: read

jobs:
  review:
    name: Review PR
    permissions:
      contents: read
      # Post inline comments, replies, and the summary. Resolving or reopening a review thread is
      # refused for the token on the BaseRunnerGroup runner, so the `threads` job does that.
      pull-requests: write
    # Note: This job runs on the BaseRunnerGroup to be able to access LLM Gateway
    # It will not work on other runners
    # Skip for external contributor PRs (forks) — secrets and runner group are unavailable
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: BaseRunnerGroup
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Block unauthorized outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            ${{ vars.LLM_GATEWAY_HOSTNAME }}:443

      # Agents read the PR's files, so check out the PR head (not the default merge commit) to make the
      # line numbers they report match the diff that comments are anchored to. Do not leave the job
      # token in .git/config, where an agent reading untrusted PR content could copy it.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Models, prompts, and which reviewers run are defined in .agents/skills/pr-review/.
      # Run the pipeline from a clean checkout of the base branch, so a PR cannot add or replace files
      # (agents, prompts, or a module that shadows the standard library) in the code that holds the
      # tokens. The agents read the PR's files from the working directory, and `--setting-sources user`
      # keeps the PR's own Claude settings and hooks out. This does not cover this workflow file: a
      # `pull_request` run uses the PR's copy of it, which is why only same-repository PRs run.
      # The PR that introduces the pipeline has no base copy and runs its own.
      - name: Check out the review pipeline from the base branch
        id: pipeline
        run: |
          git fetch --depth 1 origin "$BASE_REF"
          script=.agents/skills/pr-review/review.py
          if git cat-file -e "FETCH_HEAD:$script" 2>/dev/null; then
            git worktree prune
            git worktree add --force --detach "$RUNNER_TEMP/pipeline" FETCH_HEAD
            script="$RUNNER_TEMP/pipeline/$script"
          fi
          echo "script=$script" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.284

      # --handoff-file writes the threads to resolve or reopen, with the commit they were judged on,
      # to a file for the `threads` job instead of changing them here.
      - name: Review pull request
        run: |
          python3 "$SCRIPT" --pr "$PR_NUMBER" --post --artifacts-dir "$RUNNER_TEMP/pr-review" \
            --handoff-file "$RUNNER_TEMP/handoff/threads.json"
        env:
          SCRIPT: ${{ steps.pipeline.outputs.script }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_BASE_URL: https://${{ vars.LLM_GATEWAY_HOSTNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review
          path: ${{ runner.temp }}/pr-review
          retention-days: 7
          if-no-files-found: ignore

      # Only the thread list is passed on, not the full artifacts, which hold prompts and model output.
      - name: Upload thread actions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review-threads
          path: ${{ runner.temp }}/handoff/threads.json
          retention-days: 1
          if-no-files-found: ignore

  threads:
    name: Resolve and reopen review threads
    needs: review
    # Run even if the review job failed after posting, but not if the run was cancelled (a newer push).
    if: ${{ !cancelled() && needs.review.result != 'skipped' }}
    # A GitHub-hosted runner, because the BaseRunnerGroup runner's token cannot resolve review threads.
    # This job has no access to the LLM gateway and never runs the agents.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # The same rule as the review job: run the base branch's copy of the script, never the PR's, unless
      # the PR introduces the pipeline. The thread actions come from a job that read untrusted content
      # through a model, so the script re-checks each one against GitHub before acting on it.
      - name: Check out the review pipeline from the base branch
        id: pipeline
        run: |
          git fetch --depth 1 origin "$BASE_REF"
          script=.agents/skills/pr-review/review.py
          if git cat-file -e "FETCH_HEAD:$script" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/pipeline" FETCH_HEAD
            script="$RUNNER_TEMP/pipeline/$script"
          fi
          echo "script=$script" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Download thread actions
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-review-threads
          path: ${{ runner.temp }}/handoff

      - name: Resolve and reopen threads
        if: steps.download.outcome == 'success'
        run: python3 "$SCRIPT" --pr "$PR_NUMBER" --apply-thread-actions "$RUNNER_TEMP/handoff/threads.json"
        env:
          SCRIPT: ${{ steps.pipeline.outputs.script }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
