name: Claude Code Review

# The review is expensive, so it does not run on every push:
#  - once, when a pull request is opened or marked ready for review;
#  - again when a member of the Base organization who has write access to this repository comments `/review`.
# A push only updates one line of the review comment, which counts the commits that have not been reviewed.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  # An `issue_comment` run uses the workflow file on the default branch, never the pull request's copy, so a
  # pull request cannot change how its own `/review` is handled. `/review` therefore starts working once
  # this file is on the default branch.
  issue_comment:
    types: [created]

# This workflow can post comments and edit its own comments. It cannot push commits or modify files in the
# repo, and GitHub does not let this token resolve review threads (see .agents/skills/pr-review/SKILL.md).
permissions:
  contents: read

jobs:
  # Decides whether a comment may start a review. It has no concurrency group on purpose: GitHub keeps only one
  # run waiting per group, so a request that is going to be refused (a member without write access) must be
  # refused here, before it can take the place of an authorized `/review` that is waiting in the review job's
  # group. It needs no secrets and runs on a hosted runner.
  authorize:
    name: Authorize request
    permissions:
      contents: read
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request && github.event.issue.state == 'open'
      && (github.event.comment.body == '/review'
          || startsWith(github.event.comment.body, '/review ')
          || startsWith(github.event.comment.body, format('/review{0}', fromJSON('"\n"')))
          || startsWith(github.event.comment.body, format('/review{0}', fromJSON('"\r"'))))
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check that the commenter has write access
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          can_push=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq '.user.permissions.push' 2>/dev/null || echo false)
          if [ "$can_push" = true ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not reviewing: $COMMENTER does not have write access to this repository."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: Review PR
    needs: authorize
    permissions:
      contents: read
      pull-requests: write
    # Concurrency is set on the job, not the workflow: every comment on every pull request starts a run of this
    # workflow, and a comment that is not a review request must not get in the way of a review in progress.
    # A second request waits for the first rather than cancelling it, because a review cannot be redone cheaply.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    # Note: This job runs on the BaseRunnerGroup to be able to access LLM Gateway
    # It will not work on other runners
    # Runs for a pull request that is opened or marked ready (not a draft, not a fork: secrets and the runner
    # group are unavailable to forks), or for a comment that the `authorize` job let through: `/review` itself,
    # alone or followed by a space or a line break, on an open pull request, from a member of the organization
    # with write access. Everything that can refuse a request is decided in `authorize`, before this job joins
    # the concurrency group below, because GitHub keeps one waiting run per group and a request that will be
    # refused must not take the place of one that is waiting. `!cancelled()` is needed because `authorize` is
    # skipped for a pull request event, and a job whose dependency was skipped is skipped too without it.
    if: >-
      !cancelled() && (
        (github.event_name == 'pull_request' && github.event.action != 'synchronize'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'issue_comment' && needs.authorize.result == 'success'
          && needs.authorize.outputs.allowed == 'true'))
    runs-on:
      group: BaseRunnerGroup
    # Agents have no time limit of their own, so this is the only bound. About 1 in 9 Opus calls takes 5-13
    # minutes, and a deep review chains several calls after the slowest reviewer (vote, chair, final round),
    # so it needs room for a few slow ones. A run that is killed loses the summary, not the findings already posted.
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Block unauthorized outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            ${{ vars.LLM_GATEWAY_HOSTNAME }}:443

      # Read the pull request from the API, not from the event: a comment event does not carry it, and the
      # head may have moved since a queued run was triggered. The comment text goes through the environment,
      # never into the script.
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # Whether the commenter may ask was decided by the `authorize` job; this is a second look at the text.
          if [ "$EVENT" = issue_comment ] && ! [[ "$COMMENT_BODY" =~ ^/review([[:space:]]|$) ]]; then
            echo "::notice::Not reviewing: the comment is not a /review request."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r state head_repo head_sha draft < <(gh api "repos/$REPO/pulls/$NUMBER" \
            --jq '[.state, .head.repo.full_name, .head.sha, .draft] | @tsv')
          if [ "$state" != open ] || [ "$head_repo" != "$REPO" ]; then
            echo "::notice::Not reviewing: the pull request is not open, or it comes from a fork."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$draft" = true ]; then
            echo "::notice::Not reviewing: the pull request is a draft. Mark it ready for review."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected head commit from the API."
            exit 1
          fi
          # Marking a draft ready again must not pay for a second review; `/review` asks for one explicitly.
          if [ "$EVENT" = pull_request ]; then
            existing=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq \
              '.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot") | select(.body | startswith("<!-- CLAUDE_REVIEW_SUMMARY -->")) | .id' | wc -l)
            if [ "$existing" -gt 0 ]; then
              echo "::notice::Not reviewing: this pull request already has a review. Comment /review for a new one."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          {
            echo "ok=true"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      # Nothing from the pull request is on disk yet, so this cannot be influenced by it.
      - name: Install Claude Code
        if: steps.pr.outputs.ok == 'true'
        working-directory: ${{ runner.temp }}
        run: npm install --global @anthropic-ai/claude-code@2.1.293

      # Agents read the PR's files, so check out the PR head (not the default merge commit) to make the
      # line numbers they report match the diff that comments are anchored to. Do not leave the job
      # token in .git/config, where an agent reading untrusted PR content could copy it.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.pr.outputs.ok == 'true'
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      # Models, prompts, and which reviewers run are defined in .agents/skills/pr-review/.
      # The script that holds the secrets always comes from a clean checkout of the default branch, never
      # from the pull request: a pull request cannot add or replace files (agents, prompts, or a module that
      # shadows the standard library) in code it does not control. The agents read the pull request's files
      # from the working directory, and `--setting-sources user` keeps the PR's own Claude settings and hooks
      # out. The one exception is the pull request that introduces the pipeline, which has no default-branch
      # copy yet and runs its own; that is allowed for a `pull_request` run only, whose workflow file is the
      # PR's own anyway. A `/review` comment never runs a pull request's copy.
      - name: Check out the review pipeline from the default branch
        id: pipeline
        if: steps.pr.outputs.ok == 'true'
        run: |
          git fetch --depth 1 origin "$DEFAULT_BRANCH"
          script=.agents/skills/pr-review/review.py
          if git cat-file -e "FETCH_HEAD:$script" 2>/dev/null; then
            rm -rf "$RUNNER_TEMP/pipeline"
            git worktree prune
            git worktree add --force --detach "$RUNNER_TEMP/pipeline" FETCH_HEAD
            script="$RUNNER_TEMP/pipeline/$script"
          elif [ "$EVENT" != pull_request ]; then
            echo "::error::The default branch has no review pipeline, and a comment may not run the pull request's copy."
            exit 1
          fi
          echo "script=$script" >> "$GITHUB_OUTPUT"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}

      # The script exits with 3 when the pull request's head is no longer the commit that was checked out. The
      # review runs once per pull request, so it must not be lost to a push that landed a moment earlier:
      # follow the pull request to its new head and try once more.
      - name: Review pull request
        if: steps.pr.outputs.ok == 'true'
        run: |
          review() { python3 "$SCRIPT" --pr "$NUMBER" --post --artifacts-dir "$RUNNER_TEMP/pr-review"; }
          code=0
          review || code=$?
          if [ "$code" -eq 3 ]; then
            head=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha)
            echo "::notice::The pull request moved to $head while the review started; reviewing that commit."
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected head commit from the API."; exit 1; }
            git fetch --depth 1 origin "$head"
            git checkout --detach "$head"
            code=0
            review || code=$?
          fi
          exit "$code"
        env:
          SCRIPT: ${{ steps.pipeline.outputs.script }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_BASE_URL: https://${{ vars.LLM_GATEWAY_HOSTNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}

      - name: Upload review artifacts
        if: always() && steps.pr.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review
          path: ${{ runner.temp }}/pr-review
          retention-days: 7
          if-no-files-found: ignore

  # Keeps the review comment honest after a push: rewrites one line to say how many commits came after the
  # one that was reviewed, with a link to their diff. Runs no model and needs no gateway access.
  status:
    name: Update review status
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'synchronize'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    # A newer push makes an older update pointless.
    concurrency:
      group: claude-review-status-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Only the default branch is checked out, never the pull request: the script calls the GitHub API and
      # reads nothing from the pull request's files. Until the pipeline is on the default branch there is
      # nothing to run, and the step below says so.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Update the count of unreviewed commits
        run: |
          if [ ! -f .agents/skills/pr-review/review.py ]; then
            echo "::notice::The review pipeline is not on the default branch yet, so there is no status line to update."
            exit 0
          fi
          python3 .agents/skills/pr-review/review.py --pr "$PR_NUMBER" --refresh-status
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
