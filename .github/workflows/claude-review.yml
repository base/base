name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # This allows posting comments and reviews and un-resolving review threads
  # It does not allow pushing any commits or modifying any files in the repo
  pull-requests: write

jobs:
  review:
    name: Review PR
    # Note: This job runs on the BaseRunnerGroup to be able to access LLM Gateway
    # It will not work on other runners
    # Skip for external contributor PRs (forks) — secrets and runner group are unavailable
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: BaseRunnerGroup
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Block unauthorized outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            ${{ vars.LLM_GATEWAY_HOSTNAME }}:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # Models, prompts, and which reviewers run are defined in .agents/skills/pr-review/.
      # Run the base branch's copy of the pipeline, not the PR's, so a PR cannot change its own reviewer.
      # The PR that introduces the pipeline has no base copy and runs its own.
      - name: Check out the review pipeline from the base branch
        run: |
          git fetch --depth 1 origin "$BASE_REF"
          if git cat-file -e FETCH_HEAD:.agents/skills/pr-review/review.py 2>/dev/null; then
            git checkout FETCH_HEAD -- .agents/skills/pr-review
          fi
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.284

      - name: Review pull request
        run: python3 .agents/skills/pr-review/review.py --pr "$PR_NUMBER" --post --artifacts-dir "$RUNNER_TEMP/pr-review"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_BASE_URL: https://${{ vars.LLM_GATEWAY_HOSTNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review
          path: ${{ runner.temp }}/pr-review
          retention-days: 7
          if-no-files-found: ignore
