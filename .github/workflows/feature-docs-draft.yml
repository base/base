name: Feature verification docs draft

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      source_pr:
        description: Merged source PR number to replay
        required: true
        type: string
      dry_run:
        description: Collect and infer but never publish
        type: boolean
        default: true

concurrency:
  group: feature-docs-draft
  cancel-in-progress: false
  queue: max # up to 100 pending runs; excess is dropped and must be replayed

permissions: {}

jobs:
  bootstrap:
    # Manual dispatch is only trusted from main; automatic runs require the
    # default-off variable to be enabled. Nothing in this job runs repo scripts.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       vars.FEATURE_DOCS_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      control_sha: ${{ steps.resolve.outputs.control_sha }}
      snapshot_sha: ${{ steps.resolve.outputs.snapshot_sha }}
      source_pr: ${{ steps.resolve.outputs.source_pr }}
      mode: ${{ steps.resolve.outputs.mode }}
      eligible: ${{ steps.resolve.outputs.eligible }}
    steps:
      - name: Resolve trusted control SHA and eligibility (inline, no repo scripts)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.source_pr }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          APP_SLUG: ${{ vars.FEATURE_DOCS_APP_SLUG }}
        run: |
          set -euo pipefail

          # Select the source PR number from trusted event context or the manual
          # dispatch input, then validate it as a canonical decimal BEFORE any
          # source API call or job output. A crafted dispatch string can never
          # reach `gh api` or a later `run:` block.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            pr="$DISPATCH_PR"
            mode="$([ "$DISPATCH_DRY_RUN" = "false" ] && echo auto || echo dry_run)"
          else
            pr="$EVENT_PR"
            mode="auto"
          fi
          if ! printf '%s' "$pr" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::source_pr must be a canonical decimal PR number"
            exit 1
          fi

          # Reviewed control tip resolved BEFORE any repo script executes, then
          # validated as a full 40-hex object SHA.
          sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if ! printf '%s' "$sha" | grep -Eiq '^[0-9a-f]{40}$'; then
            echo "::error::resolved main tip is not a 40-hex SHA"
            exit 1
          fi
          echo "control_sha=$sha"  >> "$GITHUB_OUTPUT"
          echo "snapshot_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_pr=$pr"     >> "$GITHUB_OUTPUT"
          echo "mode=$mode"        >> "$GITHUB_OUTPUT"

          # Recursion guard: reserve the automation namespace and the bot
          # identity, using PR metadata only. Ordinary merged fork PRs stay
          # eligible. Every dynamic value is read through a quoted env variable;
          # no GitHub Actions expression syntax is interpolated in this run block.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            head_ref="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.head.ref')"
            author="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.user.login')"
          else
            head_ref="$EVENT_HEAD_REF"; author="$EVENT_AUTHOR"
          fi
          if [[ "$head_ref" == automation/verify-base/* ]] || \
             [[ "$author" == "${APP_SLUG}[bot]" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: bootstrap
    if: needs.bootstrap.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      evidence_sha256: ${{ steps.collect.outputs.evidence_sha256 }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout main (statically trusted repository/ref; control SHA verified below)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: base/base
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked-out HEAD matches the captured control SHA (inline, fail closed)
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.bootstrap.outputs.control_sha }}
          SOURCE_PR: ${{ needs.bootstrap.outputs.source_pr }}
        run: |
          set -euo pipefail
          # The checkout step above is a static, literal repository/ref (not a
          # dynamic job-output ref), which is what makes this checkout itself
          # analyzer-trusted. This guard re-establishes the exact-SHA contract
          # that a dynamic ref used to provide: main can advance between the
          # bootstrap capture and this checkout, so we compare the actually
          # checked-out commit to the SHA bootstrap captured and fail closed
          # before any repo script runs on drift or an invalid capture.
          if ! printf '%s' "$EXPECTED_CONTROL_SHA" | grep -Eiq '^[0-9a-f]{40}$'; then
            echo "::error::captured control_sha is not a 40-hex SHA; refusing to run repo scripts"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_CONTROL_SHA" ]; then
            echo "::error::checked-out main HEAD ($actual_sha) does not match the captured control SHA ($EXPECTED_CONTROL_SHA); main advanced after bootstrap captured it. Replay with: gh workflow run feature-docs-draft.yml --ref main -f source_pr=$SOURCE_PR -F dry_run=false"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Collect read-only evidence
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_PR: ${{ needs.bootstrap.outputs.source_pr }}
          CONTROL_SHA: ${{ needs.bootstrap.outputs.control_sha }}
          SNAPSHOT_SHA: ${{ needs.bootstrap.outputs.snapshot_sha }}
          MODE: ${{ needs.bootstrap.outputs.mode }}
          # Identifies app-authored deterministic-branch PRs for the pre-model
          # idempotency/cap check (MAX_OPEN / DAILY_LIMIT); read-only lookup.
          FEATURE_DOCS_APP_SLUG: ${{ vars.FEATURE_DOCS_APP_SLUG }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feature-docs"
          python3 etc/scripts/ci/feature_docs.py collect \
            --source-pr "$SOURCE_PR" \
            --control-sha "$CONTROL_SHA" \
            --snapshot-sha "$SNAPSHOT_SHA" \
            --mode "$MODE" \
            --out "$RUNNER_TEMP/feature-docs/evidence.json"
          echo "evidence_sha256=$(sha256sum "$RUNNER_TEMP/feature-docs/evidence.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-docs-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-docs/evidence.json
          if-no-files-found: error

  infer:
    needs: [bootstrap, collect]
    runs-on:
      group: BaseRunnerGroup
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result_sha256: ${{ steps.infer.outputs.result_sha256 }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Runner-specific artifact endpoints MUST be verified via a smoke-test
          # harden-runner insights run before enablement. Both download (evidence)
          # and upload (result) use this backend, plus the gateway for inference.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ${{ vars.LLM_GATEWAY_HOSTNAME }}:443
      - name: Checkout main (statically trusted repository/ref; control SHA verified below)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: base/base
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked-out HEAD matches the captured control SHA (inline, fail closed)
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.bootstrap.outputs.control_sha }}
          SOURCE_PR: ${{ needs.bootstrap.outputs.source_pr }}
        run: |
          set -euo pipefail
          # See the identical guard in the `collect` job: the checkout above
          # is a static, literal repository/ref; this step re-verifies the
          # exact captured control SHA and fails closed before any repo
          # script (including the model-facing inference script) runs.
          if ! printf '%s' "$EXPECTED_CONTROL_SHA" | grep -Eiq '^[0-9a-f]{40}$'; then
            echo "::error::captured control_sha is not a 40-hex SHA; refusing to run repo scripts"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_CONTROL_SHA" ]; then
            echo "::error::checked-out main HEAD ($actual_sha) does not match the captured control SHA ($EXPECTED_CONTROL_SHA); main advanced after bootstrap captured it. Replay with: gh workflow run feature-docs-draft.yml --ref main -f source_pr=$SOURCE_PR -F dry_run=false"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: feature-docs-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-docs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Infer one structured suggestion (HTTP, tool-less)
        id: infer
        env:
          ANTHROPIC_BASE_URL: https://${{ vars.LLM_GATEWAY_HOSTNAME }}
          LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
          FEATURE_DOCS_MODEL: ${{ vars.FEATURE_DOCS_MODEL }}
          EXPECTED_EVIDENCE_SHA256: ${{ needs.collect.outputs.evidence_sha256 }}
        run: |
          set -euo pipefail
          python3 etc/scripts/ci/feature_docs.py infer \
            --evidence "$RUNNER_TEMP/feature-docs/evidence.json" \
            --expected-sha256 "$EXPECTED_EVIDENCE_SHA256" \
            --result "$RUNNER_TEMP/feature-docs/result.json"
          echo "result_sha256=$(sha256sum "$RUNNER_TEMP/feature-docs/result.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-docs-result-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-docs/result.json
          if-no-files-found: error

  publish:
    needs: [bootstrap, collect, infer]
    # Read-only prepare/preview runs in both modes, including disabled dry runs.
    # Only the App-token and write steps below require enabled + auto.
    if: needs.bootstrap.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # `prepare` re-runs the deterministic MAX_OPEN/DAILY_LIMIT cap check
      # immediately before writing, which requires listing PRs read-only.
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout main (statically trusted repository/ref; snapshot SHA verified below)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: base/base
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked-out HEAD matches the captured snapshot SHA (inline, fail closed)
        env:
          EXPECTED_SNAPSHOT_SHA: ${{ needs.bootstrap.outputs.snapshot_sha }}
          SOURCE_PR: ${{ needs.bootstrap.outputs.source_pr }}
        run: |
          set -euo pipefail
          # See the identical guard in the `collect`/`infer` jobs: the checkout
          # above is a static, literal repository/ref; this step re-verifies
          # the exact captured snapshot SHA and fails closed before `prepare`
          # or `publish` read any page/source content from this checkout.
          # The later "Abort if main drifted" step re-checks drift against the
          # live API before any write-capable token exists; this step
          # additionally guarantees the checkout itself landed on that SHA.
          if ! printf '%s' "$EXPECTED_SNAPSHOT_SHA" | grep -Eiq '^[0-9a-f]{40}$'; then
            echo "::error::captured snapshot_sha is not a 40-hex SHA; refusing to read repo content"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SNAPSHOT_SHA" ]; then
            echo "::error::checked-out main HEAD ($actual_sha) does not match the captured snapshot SHA ($EXPECTED_SNAPSHOT_SHA); main advanced after bootstrap captured it. Replay with: gh workflow run feature-docs-draft.yml --ref main -f source_pr=$SOURCE_PR -F dry_run=false"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: feature-docs-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-docs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: feature-docs-result-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-docs
      - name: Abort if main drifted from the captured snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_SHA: ${{ needs.bootstrap.outputs.snapshot_sha }}
          SOURCE_PR: ${{ needs.bootstrap.outputs.source_pr }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$SNAPSHOT_SHA" ]; then
            echo "::error::main drifted; replay with: gh workflow run feature-docs-draft.yml --ref main -f source_pr=$SOURCE_PR -F dry_run=false"
            exit 1
          fi
      # Read-only preflight under the default GITHUB_TOKEN: re-verify the evidence
      # and result digests, validate the schema, and render the canonical
      # page+index payload BEFORE any write-capable token exists. A no_op/abstain
      # decision sets publishable=false, so no App token is minted and no writer
      # step runs.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Prepare and validate the rendered payload (read-only, no App token)
        id: prepare
        env:
          # Read-only default token: `prepare` re-runs the deterministic
          # MAX_OPEN/DAILY_LIMIT cap check immediately before writing.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FEATURE_DOCS_APP_SLUG: ${{ vars.FEATURE_DOCS_APP_SLUG }}
          EXPECTED_EVIDENCE_SHA256: ${{ needs.collect.outputs.evidence_sha256 }}
          EXPECTED_RESULT_SHA256: ${{ needs.infer.outputs.result_sha256 }}
          SNAPSHOT_SHA: ${{ needs.bootstrap.outputs.snapshot_sha }}
        run: |
          set -euo pipefail
          # `prepare` writes publishable=true|false to $GITHUB_OUTPUT and a
          # human-readable proposed-patch summary to $GITHUB_STEP_SUMMARY.
          python3 etc/scripts/ci/feature_docs.py prepare \
            --evidence "$RUNNER_TEMP/feature-docs/evidence.json" \
            --evidence-sha256 "$EXPECTED_EVIDENCE_SHA256" \
            --result "$RUNNER_TEMP/feature-docs/result.json" \
            --result-sha256 "$EXPECTED_RESULT_SHA256" \
            --snapshot-sha "$SNAPSHOT_SHA" \
            --repo . \
            --payload-out "$RUNNER_TEMP/feature-docs/payload.json"
      # Persist the canonical rendered payload (also the dry-run proposed patch)
      # BEFORE any push so an operator recovery reuses the exact bytes, no model.
      - name: Upload rendered payload artifact (pre-push)
        if: steps.prepare.outputs.publishable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-docs-payload-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-docs/payload.json
          if-no-files-found: error
      # App token is minted ONLY when a page is actually publishable.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        if: >-
          steps.prepare.outputs.publishable == 'true' &&
          vars.FEATURE_DOCS_AUTOMATION_ENABLED == 'true' &&
          needs.bootstrap.outputs.mode == 'auto'
        with:
          app-id: ${{ secrets.FEATURE_DOCS_APP_ID }}
          private-key: ${{ secrets.FEATURE_DOCS_APP_PRIVATE_KEY }}
          owner: base
          repositories: base
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write # only for the named maintainer assignment
      - name: Publish the draft from the persisted payload (App auth only)
        if: >-
          steps.prepare.outputs.publishable == 'true' &&
          vars.FEATURE_DOCS_AUTOMATION_ENABLED == 'true' &&
          needs.bootstrap.outputs.mode == 'auto'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_SHA: ${{ needs.bootstrap.outputs.snapshot_sha }}
          FEATURE_DOCS_ASSIGNEE: ${{ vars.FEATURE_DOCS_ASSIGNEE }}
          # Defense in depth: the script re-asserts the deterministic-branch
          # ownership identity and the default-off gate even though the step
          # `if:` above already restricts execution to enabled + auto.
          FEATURE_DOCS_APP_SLUG: ${{ vars.FEATURE_DOCS_APP_SLUG }}
          FEATURE_DOCS_AUTOMATION_ENABLED: ${{ vars.FEATURE_DOCS_AUTOMATION_ENABLED }}
        run: |
          set -euo pipefail
          # The App token is used ONLY for git push and gh pr create; the working
          # tree was already checked out read-only above with persist-credentials
          # false, so the default token is never left in .git/config.
          python3 etc/scripts/ci/feature_docs.py publish \
            --payload "$RUNNER_TEMP/feature-docs/payload.json" \
            --snapshot-sha "$SNAPSHOT_SHA"
