name: Benchmarks (iai · deterministic)

# Deterministic, instruction-count benchmarks for the compute-bound subset, run
# under Valgrind's Cachegrind simulator. Counts are identical run-to-run, so a
# base-vs-head delta reflects a code change, not machine noise — unlike the
# wall-clock advisory job, which cannot reliably read these per PR. This check is
# advisory: it posts a single comment and never gates a merge.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - rf/chore/iai-callgrind-benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read
  pull-requests: write

jobs:
  bench-iai:
    name: Benchmarks (iai · deterministic)
    runs-on:
      group: BasePerfRunnerGroup
    timeout-minutes: 60
    env:
      # For pull_request, github.sha is the merge commit and base.sha is the base
      # branch tip. For push/workflow_dispatch there is no base; it is resolved to
      # the merge-base with origin/main in the prepare step below.
      HEAD_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          native-deps: "true"
          rust-cache-shared-key: "benchmark"
          just: "false"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Cachegrind is a Valgrind tool; this is also the runner's Valgrind check.
      - name: Install Valgrind
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          valgrind --version

      # The runner binary version must match the iai-callgrind library version.
      - uses: taiki-e/install-action@3575e532701a5fc614b0c842e4119af4cc5fd16d # v2.62.60
        with:
          tool: iai-callgrind-runner@0.16.1

      # Resolve the base commit and hoist the head copies of the run + compare
      # scripts out of the tree, so both passes run the same authoritative list
      # even while the tree is switched back to the base commit.
      - name: Prepare base commit and scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            git fetch --no-tags --depth 50 origin main
            BASE_SHA="$(git merge-base HEAD FETCH_HEAD)"
          fi
          git fetch --no-tags --depth 1 origin "$BASE_SHA"
          cp etc/scripts/ci/run_iai_subset.sh "$RUNNER_TEMP/run_iai_subset.sh"
          cp etc/scripts/ci/iai_compare.py "$RUNNER_TEMP/iai_compare.py"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      # A bench missing on the base commit (e.g. the PR that introduces it) must
      # not fail the run; it is reported as "new". Tree switches are not
      # continue-on-error: benchmarking the wrong commit would invalidate the run.
      - name: Switch tree to base commit
        shell: bash
        run: git checkout --force --detach "$BASE_SHA"

      - name: Run subset (base)
        continue-on-error: true
        shell: bash
        run: bash "$RUNNER_TEMP/run_iai_subset.sh" > "$RUNNER_TEMP/base.txt" 2>&1

      - name: Switch tree to head commit
        shell: bash
        run: git checkout --force --detach "$HEAD_SHA"

      - name: Run subset (head)
        continue-on-error: true
        shell: bash
        run: bash "$RUNNER_TEMP/run_iai_subset.sh" > "$RUNNER_TEMP/head.txt" 2>&1

      - name: Render comparison
        shell: bash
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/iai_compare.py" \
            --base "$RUNNER_TEMP/base.txt" \
            --head "$RUNNER_TEMP/head.txt" \
            --output "$RUNNER_TEMP/comment.md" \
            --run-url "$WORKFLOW_RUN_URL" \
            --threshold-pct 2
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      # Keep one concise status comment current. Skip forked PRs because their
      # pull_request workflows cannot write comments with GITHUB_TOKEN.
      - name: Post or update results on PR
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- iai-bench-results -->'
          existing_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            | head -1)

          body=$(cat "$RUNNER_TEMP/comment.md")
          if [ -n "$existing_id" ]; then
            gh api "repos/${REPO}/issues/comments/${existing_id}" \
              -X PATCH --field body="$body" > /dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --field body="$body" > /dev/null
          fi
