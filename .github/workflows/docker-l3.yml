name: Docker (L3)

on:
  push:
    branches: [l3]
  workflow_dispatch: {}

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/node-reth-dev

permissions:
  contents: read

jobs:
  build-rust-services:
    strategy:
      fail-fast: false
      matrix:
        target: [client, base, builder, consensus, batcher, zk-prover]

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        env:
          BASE_SUCCINCT_ELF_REQUIRE: "0"
        run: |
          docker buildx bake -f etc/docker/docker-bake.hcl ${{ matrix.target }} \
            --set ${{ matrix.target }}.tags=${{ env.REGISTRY_IMAGE }}:${{ matrix.target }}-sha-${{ github.sha }} \
            --set ${{ matrix.target }}.platform=linux/amd64 \
            --set ${{ matrix.target }}.output=type=image,push=true \
            --set ${{ matrix.target }}.cache-from=type=registry,ref=${{ env.REGISTRY_IMAGE }}:cache-l3-${{ matrix.target }}-linux-amd64 \
            --set ${{ matrix.target }}.cache-from=type=registry,ref=${{ env.REGISTRY_IMAGE }}:cache-${{ matrix.target }}-linux-amd64 \
            --set ${{ matrix.target }}.cache-to=type=registry,ref=${{ env.REGISTRY_IMAGE }}:cache-l3-${{ matrix.target }}-linux-amd64,mode=max

      - name: Tag as latest l3
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ matrix.target }}-l3 \
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.target }}-sha-${{ github.sha }}

  build-devnet-setup:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devnet-setup
        run: |
          docker buildx build \
            -f etc/docker/Dockerfile.devnet \
            -t ${{ env.REGISTRY_IMAGE }}:devnet-setup-sha-${{ github.sha }} \
            --platform linux/amd64 \
            --push \
            --cache-from type=registry,ref=${{ env.REGISTRY_IMAGE }}:cache-l3-devnet-setup-linux-amd64 \
            --cache-to type=registry,ref=${{ env.REGISTRY_IMAGE }}:cache-l3-devnet-setup-linux-amd64,mode=max \
            .

      - name: Tag as latest l3
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:devnet-setup-l3 \
            ${{ env.REGISTRY_IMAGE }}:devnet-setup-sha-${{ github.sha }}
