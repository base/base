name: Build Dev
run-name: Build Dev ${{ inputs.ref }}

# Builds Linux binaries for development and testing.
# The commit is tagged dev-<first 12 hex digits of the SHA> and its
# binaries are published to a GitHub prerelease of the same name.
#
# The branch is unreviewed code, and cargo runs its build scripts and proc-macros. The build job
# therefore has a read-only token, persists no credentials, and uses no OIDC, attestations,
# signing keys. Cargo runs inside a container without access to the runner's
# Actions cache credentials. Only the publish job can write to the repository.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch name or full commit SHA in this repository'
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit
        id: resolve
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$REF"
          elif git check-ref-format --branch "$REF" > /dev/null 2>&1 && git rev-parse --verify --quiet "refs/remotes/origin/$REF^{commit}" > /dev/null; then
            sha=$(git rev-parse "refs/remotes/origin/$REF^{commit}")
          else
            echo "::error::'$REF' is not a branch in this repository or a full 40-character commit SHA"
            exit 1
          fi
          # Fork commits can be fetched by SHA through the repository network, so only build
          # commits that a branch in this repository contains.
          if [[ -z "$(git branch --remotes --contains "$sha" 2>/dev/null)" ]]; then
            echo "::error::$sha is not on any branch in this repository"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=dev-${sha:0:12}" >> "$GITHUB_OUTPUT"

  build:
    needs: [resolve]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 links against glibc 2.35, so the binaries run on 22.04 and newer.
        target:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
        binary:
          - base
          - base-reth-node
          - base-consensus
          - basectl
          - sidecrush
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Fetch build source
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          git init -q "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" fetch --depth=1 --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$SHA"
          git -C "$RUNNER_TEMP/source" -c advice.detachedHead=false checkout --detach "$SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Prepare build container
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/build-image"
          docker build --tag base-dev-builder --file - "$RUNNER_TEMP/build-image" <<'DOCKERFILE'
          FROM ubuntu:22.04@sha256:b000e69a50ff940390233025e7a337fb8469b509e2334fa4d018ac30f3e18cdb
          RUN apt-get update && apt-get install -y --no-install-recommends \
              build-essential ca-certificates clang git libclang-dev pkg-config \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: Build and package binary in container
        env:
          BIN: ${{ matrix.binary }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TRIPLE: ${{ matrix.target.triple }}
        run: |
          set -euo pipefail
          toolchain=$(dirname "$(dirname "$(rustup which --toolchain stable cargo)")")
          archive="${BIN}-${TAG}-${TRIPLE}.tar.gz"
          # Do not pass the runner environment, checkout credentials, or writable
          # host mounts to Cargo. Only the archive bytes come back to the runner.
          docker run --rm --interactive --user "$(id -u):$(id -g)" \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/source,dst=/source,readonly" \
            --mount "type=bind,src=$toolchain,dst=/toolchain,readonly" \
            --env HOME=/tmp --env CARGO_TARGET_DIR=/tmp/target \
            --workdir /source base-dev-builder bash -se -- "$BIN" "$TRIPLE" > "$archive" <<'BUILD'
          set -euo pipefail
          export PATH="/toolchain/bin:$PATH"
          bin=$1
          triple=$2
          case "$triple:$bin" in
            aarch64-unknown-linux-gnu:base|aarch64-unknown-linux-gnu:base-consensus|aarch64-unknown-linux-gnu:basectl)
              cargo rustc --locked --profile maxperf -p "$bin" --bin "$bin" -- -C link-arg=-lblst >&2
              ;;
            *) cargo build --locked --profile maxperf --bin "$bin" >&2 ;;
          esac
          tar -czf - -C "$CARGO_TARGET_DIR/maxperf" "$bin"
          BUILD
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-${{ matrix.binary }}-${{ matrix.target.triple }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  # Runs no branch code: it only checks the artifacts, tags the commit and uploads them.
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-dev-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: dev-*
          merge-multiple: true

      - name: Check artifacts
        working-directory: artifacts
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in *; do
            if [[ ! "$f" =~ ^[a-z-]+-${TAG}-(x86_64|aarch64)-unknown-linux-gnu\.tar\.gz(\.sha256)?$ ]]; then
              echo "::error::unexpected artifact $f"
              exit 1
            fi
          done
          sha256sum -c -- *.sha256

      - name: Create or reuse tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            commit=$(gh api "repos/$GH_REPO/commits/$existing" --jq .sha)
            if [[ "$commit" != "$SHA" ]]; then
              echo "::error::Tag $TAG already points at $commit, not $SHA"
              exit 1
            fi
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # --target creates the lightweight tag at the commit when it does not exist yet.
            gh release create "$TAG" --title "$TAG" --target "$SHA" --prerelease --latest=false \
              --notes "Unsigned dev build of $SHA for development environments. Not a supported release." \
              || gh release view "$TAG" > /dev/null
          fi

      - name: Upload binaries
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG" -- *.tar.gz *.tar.gz.sha256
          {
            echo "## Dev build"
            echo ""
            echo "**Commit**: \`${{ needs.resolve.outputs.sha }}\`"
            echo "**Release**: https://github.com/$GH_REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
