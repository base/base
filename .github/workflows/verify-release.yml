name: Verify Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify. Leave blank to verify the latest release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-signatures:
    runs-on: ubuntu-24.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release signatures
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--install "$RELEASE_TAG")
          fi

          bash baseup/baseup verify-release "${args[@]}"
