name: Build Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true
        type: string
      is_final:
        description: 'Whether this is a final release (creates GitHub release + uploads binaries)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # Build native binaries for release artifacts
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            runner: depot-ubuntu-24.04-16
            os: linux
          - triple: aarch64-unknown-linux-gnu
            runner: depot-ubuntu-24.04-arm-16
            os: linux
          - triple: aarch64-apple-darwin
            runner: macos-14
            os: macos
        binary:
          - base
          - base-reth-node
          - base-consensus
          - basectl

    runs-on: ${{ matrix.target.runner }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: matrix.target.os == 'linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Install system dependencies (Linux)
        if: matrix.target.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config protobuf-compiler

      - name: Install system dependencies (macOS)
        if: matrix.target.os == 'macos' && matrix.binary == 'basectl'
        run: brew install protobuf

      - name: Install Go for basectl
        if: matrix.binary == 'basectl'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2 # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-on-failure: true
          shared-key: release-${{ matrix.target.triple }}
          save-if: ${{ true }}
          cache-targets: "false"

      - name: Build binary
        run: |
          if [ "${{ matrix.target.triple }}" = "aarch64-unknown-linux-gnu" ]; then
            case "${{ matrix.binary }}" in
              base|base-consensus|basectl)
                cargo rustc --locked --profile maxperf -p "${{ matrix.binary }}" --bin "${{ matrix.binary }}" -- -C link-arg=-lblst
                exit
            esac
          fi
          cargo build --locked --profile maxperf --bin "${{ matrix.binary }}"

      - name: Package binary
        run: |
          TAG="${{ inputs.tag }}"
          TARGET="${{ matrix.target.triple }}"
          BIN="${{ matrix.binary }}"
          ARCHIVE="${BIN}-${TAG}-${TARGET}.tar.gz"
          tar -czf "$ARCHIVE" -C target/maxperf "$BIN"
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - name: Sign archives
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -z "$GPG_SIGNING_KEY" || -z "$GPG_PASSPHRASE" ]]; then
            echo "::error::GPG_SIGNING_KEY and GPG_PASSPHRASE secrets are required to sign release binaries"
            exit 1
          fi

          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT

          echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --batch --import
          for archive in *.tar.gz; do
            printf '%s' "$GPG_PASSPHRASE" | \
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$archive"
          done

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "*.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.binary }}-${{ matrix.target.triple }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.tar.gz.asc
          if-no-files-found: error
          retention-days: 1

      - name: Create or reuse GitHub Release
        if: inputs.is_final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "" --draft || gh release view "$TAG" > /dev/null
          fi

      - name: Upload binary to GitHub Release
        if: inputs.is_final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          shopt -s nullglob
          files=("${{ matrix.binary }}-${TAG}-${{ matrix.target.triple }}.tar.gz"*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No binary artifacts found for ${{ matrix.binary }}-${TAG}-${{ matrix.target.triple }}"
            exit 1
          fi
          gh release upload --clobber "$TAG" "${files[@]}"

  # Build multi-arch Docker images
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - arch: linux/amd64
            runs-on: depot-ubuntu-24.04-16
          - arch: linux/arm64
            runs-on: depot-ubuntu-24.04-arm-16
        image:
          - target: base
            name: node
          - target: unified
            name: base
          - target: execution
            name: base-reth-node
          - target: consensus
            name: base-consensus
          - target: builder
            name: base-builder
          - target: basectl
            name: basectl
          - target: snapshotter
            name: base-snapshotter

    runs-on: ${{ matrix.settings.runs-on }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Prepare
        run: |
          platform="${{ matrix.settings.arch }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Backfill unified image target
        if: matrix.image.target == 'unified'
        run: |
          # The workflow comes from main, but the checked-out release tag may predate
          # the unified target introduced alongside this matrix entry.
          if ! grep -qF 'target "unified"' etc/docker/docker-bake.hcl; then
            cat >> etc/docker/docker-bake.hcl <<'EOF'

          target "unified" {
            inherits = ["_rust-service-common"]
            target = "unified"
            args = {
              CARGO_CHEF_ARGS = "--package base"
              CARGO_FEATURES = PROFILE == "profiling" ? "--features=jemalloc-prof" : ""
              SCCACHE_CACHE_ID = "rust-services-unified-sccache"
            }
            tags = ["base-unified:local"]
          }
          EOF
          fi

          if ! grep -qF 'AS unified' etc/docker/Dockerfile.rust-services; then
            cat >> etc/docker/Dockerfile.rust-services <<'EOF'

          FROM runtime-base AS unified
          COPY --from=base-builder /app/base ./base
          ENTRYPOINT ["./base"]
          EOF
          fi

      - name: Prepare image labels
        id: image-labels
        run: |
          echo "source=https://github.com/${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "revision=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          TARGET: ${{ matrix.image.target }}
          PROFILE: maxperf
        run: |
          depot bake --project "${{ vars.DEPOT_PROJECT_ID }}" -f etc/docker/docker-bake.hcl "$TARGET" \
            --set "${TARGET}.tags=${IMAGE}" \
            --set "${TARGET}.platform=${{ matrix.settings.arch }}" \
            --set "${TARGET}.output=type=image,push-by-digest=true,name-canonical=true,push=true" \
            --set "${TARGET}.labels.org.opencontainers.image.source=${{ steps.image-labels.outputs.source }}" \
            --set "${TARGET}.labels.org.opencontainers.image.revision=${{ steps.image-labels.outputs.revision }}" \
            --set "${TARGET}.labels.org.opencontainers.image.created=${{ steps.image-labels.outputs.created }}" \
            --set "${TARGET}.labels.org.opencontainers.image.version=${{ steps.image-labels.outputs.version }}" \
            --metadata-file ${{ runner.temp }}/metadata.json

      - name: Export digest
        env:
          TARGET: ${{ matrix.image.target }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="$(jq -er --arg t "$TARGET" '.[$t]."containerimage.digest"' ${{ runner.temp }}/metadata.json)"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Publish successful Docker builds even when another matrix entry fails.
  find-docker-artifacts:
    needs: [build-and-push]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      has_digests: ${{ steps.artifacts.outputs.has_digests }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Find Docker artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          artifact_names=$(gh api "repos/$GH_REPO/actions/runs/$GH_RUN_ID/artifacts" \
            --paginate --jq '.artifacts[].name')
          if grep -q '^digests-' <<< "$artifact_names"; then
            echo "has_digests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_digests=false" >> "$GITHUB_OUTPUT"
          fi

  # Merge Docker manifests and publish
  publish:
    needs: [find-docker-artifacts]
    if: ${{ !cancelled() && needs.find-docker-artifacts.outputs.has_digests == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Create manifest lists and push
        id: create-manifest
        run: |
          set -euo pipefail
          shopt -s nullglob

          TAG="${{ inputs.tag }}"
          image_tags() {
            local image="$1"
            if [[ "$TAG" =~ -rc\. ]]; then
              echo "${image}:${TAG}"
            else
              local version="${TAG#v}"
              IFS='.' read -r major minor patch <<< "$version"
              echo "${image}:${TAG},${image}:${major}.${minor},${image}:${major},${image}:latest"
            fi
          }

          publish_image() {
            local image="$1"
            local package="$2"
            local digests=("${{ runner.temp }}/digests/digests-${package}-linux-"*/*)
            if [[ ${#digests[@]} -eq 0 ]]; then
              echo "::warning::No successful architecture builds found for $image"
              return 1
            fi
            if [[ ${#digests[@]} -gt 2 ]]; then
              echo "::error::Expected at most two architecture digests for $image, found ${#digests[@]}"
              return 1
            fi
            if [[ ${#digests[@]} -eq 1 ]]; then
              echo "::warning::Publishing $image with only one successful architecture"
            fi

            local tag_args=()
            IFS=',' read -ra tags <<< "$(image_tags "$image")"
            for tag in "${tags[@]}"; do
              tag_args+=(-t "$tag")
            done

            local sources=()
            for digest in "${digests[@]}"; do
              sources+=("${image}@sha256:${digest##*/}")
            done

            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
            docker buildx imagetools inspect "${image}:${TAG}"
          }

          packages=(
            node
            base
            base-reth-node
            base-consensus
            base-builder
            basectl
            base-snapshotter
          )
          pushed=false
          published=()
          for package in "${packages[@]}"; do
            if publish_image "${{ env.REGISTRY_NAMESPACE }}/${package}" "$package"; then
              pushed=true
              published+=("$package")
            fi
          done

          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          echo "published=$(IFS=,; echo "${published[*]}")" >> "$GITHUB_OUTPUT"

      - name: Create or reuse GitHub Release
        if: inputs.is_final && steps.create-manifest.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "" --draft || gh release view "$TAG" > /dev/null
          fi

      - name: Summary
        run: |
          TAG="${{ inputs.tag }}"

          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.is_final }}" == "true" ]]; then
            echo "**Type**: Final Release" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type**: Release Candidate" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ steps.create-manifest.outputs.pushed }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            IFS=',' read -ra packages <<< "${{ steps.create-manifest.outputs.published }}"
            for package in "${packages[@]}"; do
              echo "docker pull ${{ env.REGISTRY_NAMESPACE }}/${package}:${TAG}" >> $GITHUB_STEP_SUMMARY
            done
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
