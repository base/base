name: Proof Build Recipes

on:
  push:
    branches: [main]
    paths:
      - 'etc/docker/proof-builds/**'
      - '.github/workflows/proof-build-recipes.yml'
  pull_request:
    paths:
      - 'etc/docker/proof-builds/**'
      - '.github/workflows/proof-build-recipes.yml'
  merge_group:

permissions:
  contents: read

concurrency:
  group: proof-build-recipes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proof-build-recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check shell scripts
        run: |
          shellcheck etc/docker/proof-builds/*.sh
          for script in etc/docker/proof-builds/*.sh; do
            sh -n "$script"
          done

      - name: Test recipes
        run: python3 etc/docker/proof-builds/test_recipes.py
