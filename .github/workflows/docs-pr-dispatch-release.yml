name: Notify Docs (release)

# Fires when a release tag is pushed (e.g. v0.8.0). The docs-side router
# uses this to drive version-bump edits in node-operator docs and to refresh
# llms.txt indexes — orthogonal to the code-change path in docs-pr-dispatch.yml,
# because GitHub Actions doesn't allow `paths` + `tags` filters on the same
# `push:` trigger.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to dispatch (e.g. v0.8.0). Required for manual runs."
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCS_REPOSITORY: soheimam/nodes-docs
  EVENT_TYPE: base-release-published

jobs:
  notify:
    name: Dispatch release to docs repo
    if: github.repository == 'soheimam/base'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Authorize trigger
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm=$(curl -sS --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/collaborators/${ACTOR}/permission" \
            | jq -r '.permission // "none"')
          case "$perm" in
            admin|maintain|write)
              echo "Actor '$ACTOR' has '$perm' permission on $REPO."
              ;;
            *)
              echo "Actor '$ACTOR' has '$perm' permission on $REPO — refusing to dispatch." >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag + previous tag + release notes
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # On tag pushes github.ref looks like 'refs/tags/v0.8.0'.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${INPUT_TAG:-}"
          fi
          if [[ -z "$tag" ]]; then
            echo "No tag resolved." >&2
            exit 1
          fi

          # Find the previous semver tag for context. If there's only one tag,
          # leave it empty.
          previous_tag=$(git tag --sort=-version:refname --merged "$tag" \
            | grep -v "^${tag}$" | head -n1 || true)

          # Pull the release notes if a GitHub Release exists for this tag.
          notes_file="$RUNNER_TEMP/release_notes.txt"
          : > "$notes_file"
          if curl -sS --fail-with-body \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/releases/tags/${tag}" \
              -o "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -r '.body // ""' "$RUNNER_TEMP/release.json" > "$notes_file"
          else
            echo "(no GitHub release object for ${tag} — sending empty notes)"
          fi

          {
            echo "tag=${tag}"
            echo "previous_tag=${previous_tag}"
            echo "notes_path=${notes_file}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate DOCS_REPO_TOKEN secret is configured
        env:
          DOCS_PAT: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCS_PAT:-}" ]]; then
            echo "DOCS_REPO_TOKEN secret is not configured." >&2
            exit 1
          fi

      - name: Build dispatch payload
        id: payload
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.tag.outputs.previous_tag }}
          NOTES_PATH: ${{ steps.tag.outputs.notes_path }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          payload_file="$RUNNER_TEMP/dispatch.json"
          jq -n \
            --arg event_type "$EVENT_TYPE" \
            --arg sha "$SHA" \
            --arg tag "$TAG" \
            --arg previous_tag "$PREVIOUS_TAG" \
            --rawfile release_notes "$NOTES_PATH" \
            '{
              event_type: $event_type,
              client_payload: {
                kind: "release",
                sha: $sha,
                tag: $tag,
                previous_tag: $previous_tag,
                release_notes: $release_notes
              }
            }' > "$payload_file"

          echo "payload_path=$payload_file" >> "$GITHUB_OUTPUT"
          echo "Payload size: $(wc -c < "$payload_file") bytes"

      - name: Send repository_dispatch to docs repo
        env:
          DOCS_PAT: ${{ secrets.DOCS_REPO_TOKEN }}
          PAYLOAD_PATH: ${{ steps.payload.outputs.payload_path }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          response_body="$RUNNER_TEMP/response.txt"
          status_code=$(curl -sS \
            -o "$response_body" \
            -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DOCS_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DOCS_REPOSITORY/dispatches" \
            --data-binary @"$PAYLOAD_PATH")

          echo "Dispatch status: $status_code"
          if [[ -s "$response_body" ]]; then
            echo "Response body:"
            cat "$response_body"
          fi

          if [[ "$status_code" != "204" ]]; then
            echo "Dispatch failed (expected 204, got $status_code)." >&2
            exit 1
          fi

          echo "Dispatched '$EVENT_TYPE' to $DOCS_REPOSITORY for tag ${TAG}"
