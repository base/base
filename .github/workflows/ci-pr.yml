name: CI PR

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  issues: write
  packages: read
  pull-requests: write

jobs:
  # Depot CI does not currently run pull_request workflows for forks.
  ci:
    if: github.event.pull_request.head.repo.fork == true
    uses: ./.github/workflows/ci-core.yml
    with:
      allow_registry_login: false
      base_ref: ${{ github.base_ref || 'main' }}
      build_command: >-
        just build::affected-ci "origin/${{ github.base_ref || 'main' }}"
      clippy_command: >-
        just check::clippy-affected-ci "origin/${{ github.base_ref || 'main' }}"
      run_system_tests: false
      run_sigsegv: false
      save_rust_cache: false
      test_command: >-
        just test-affected-ci "origin/${{ github.base_ref || 'main' }}"
    secrets: inherit
