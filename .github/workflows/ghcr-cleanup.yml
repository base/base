name: GHCR Cleanup

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be deleted without deleting it
        required: false
        default: true
        type: boolean

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Delete images older than 60 days
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Clean up GHCR images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: ${{ github.repository_owner }}
          packages: node,base-anvil
          delete-tags: "*"
          delete-untagged: true
          exclude-tags: "v*"
          older-than: 60 days
          dry-run: ${{ inputs.dry_run }}
          validate: true

      # The cleanup action fails when any explicitly configured package does not
      # exist, so wait until the first release has created the complete set.
      - name: Find split release images
        id: split-images
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          packages=(base base-reth-node base-consensus base-builder basectl base-snapshotter)
          for package in "${packages[@]}"; do
            if ! gh api "/orgs/${OWNER}/packages/container/${package}/versions?per_page=1" >/dev/null 2>&1; then
              echo "::notice::Skipping split-image cleanup until ${package} exists and is readable"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Clean up split release images
        if: steps.split-images.outputs.ready == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: ${{ github.repository_owner }}
          packages: base,base-reth-node,base-consensus,base-builder,basectl,base-snapshotter
          delete-tags: "*"
          delete-untagged: true
          exclude-tags: "v*"
          older-than: 60 days
          dry-run: ${{ inputs.dry_run }}
          validate: true
