name: Benchmarks (advisory)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read
  pull-requests: write

jobs:
  # Base and head are measured on the *same* physical runner, back to back, so a
  # reported delta reflects the code change rather than variance between two hosts.
  # Compilation is the bulk of the wall-clock and does not affect measurement, so both
  # trees are built concurrently first; only the measurement is kept serial.
  # (Per-benchmark interleaving would tighten this further and is a possible follow-up.)
  bench:
    name: Benchmarks (advisory)
    runs-on:
      group: BasePerfRunnerGroup
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Head is the root checkout so ./.github/actions/setup and the compare script
      # resolve at the workspace root; base is checked out alongside it into base-src.
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base-src
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          foundry: "true"
          native-deps: "true"
          rust-cache-shared-key: "benchmark"
          just: "false"

      # Advisory only: a bench that fails to compile or run must not fail the job.
      # A bench that runs on base but breaks on head simply produces no head result,
      # which the comparison step surfaces as lost coverage. The curated subset lives
      # in run_bench_subset.sh so a single list runs against both trees — see that
      # script for why these particular benches were chosen. Every invocation runs the
      # *head* checkout's copy (via GITHUB_WORKSPACE) so the base side cannot use a
      # stale list from the base commit; only the working directory differs.
      #
      # Build both trees at once: compilation is CPU-bound and does not touch the
      # measurement, and the two trees use separate target dirs (base-src/target vs
      # target) so they do not contend, while a shared sccache lets identical
      # dependency crates compile once. The measurement steps below then find fresh
      # artifacts and only run.
      - name: Compile benchmark subset (base and head)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          script="$GITHUB_WORKSPACE/etc/scripts/ci/run_bench_subset.sh"
          ( cd base-src && bash "$script" compile ) & base_pid=$!
          ( bash "$script" compile ) & head_pid=$!
          wait "$base_pid"; echo "base compile exit=$?"
          wait "$head_pid"; echo "head compile exit=$?"

      # Measurement is serial on this one idle host so a reported delta reflects the
      # code change, not host variance or contention. The benches are already built,
      # so these steps only run them.
      - name: Measure benchmark subset (base)
        continue-on-error: true
        working-directory: base-src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/etc/scripts/ci/run_bench_subset.sh" measure

      - name: Measure benchmark subset (head)
        continue-on-error: true
        shell: bash
        run: bash "$GITHUB_WORKSPACE/etc/scripts/ci/run_bench_subset.sh" measure

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Render comparison
        id: render
        shell: bash
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 etc/scripts/ci/bench_compare.py \
            --base-dir base-src/target/criterion \
            --head-dir target/criterion \
            --output "$RUNNER_TEMP/bench-comment.md" \
            --run-url "$WORKFLOW_RUN_URL" \
            --threshold-pct 10 \
            --improvement-pct 10 \
            --github-output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/bench-comment.md" >> "$GITHUB_STEP_SUMMARY"

      # Only comment on a notable regression, improvement, or lost coverage, to keep
      # PR noise low. If a prior run left a comment that a later push has since made
      # unremarkable, delete it. Skip forked PRs — we can't comment on them.
      - name: Comment or clear benchmark results on PR
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHOULD_COMMENT: ${{ steps.render.outputs.should_comment }}
        run: |
          set -euo pipefail
          marker='<!-- bench-pr-results -->'
          existing_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            | head -1)

          if [ "$SHOULD_COMMENT" = "true" ]; then
            body=$(cat "$RUNNER_TEMP/bench-comment.md")
            if [ -n "$existing_id" ]; then
              gh api "repos/${REPO}/issues/comments/${existing_id}" \
                -X PATCH --field body="$body" > /dev/null
            else
              gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                --field body="$body" > /dev/null
            fi
          elif [ "$SHOULD_COMMENT" = "false" ] && [ -n "$existing_id" ]; then
            # Only clear a stale comment when the render step explicitly decided this
            # PR is unremarkable. If render never ran (e.g. it crashed) SHOULD_COMMENT
            # is empty, and we must not delete a legitimate warning from a prior run.
            gh api "repos/${REPO}/issues/comments/${existing_id}" -X DELETE > /dev/null
          fi
