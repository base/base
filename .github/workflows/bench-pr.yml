name: Benchmarks (advisory)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read
  pull-requests: write

jobs:
  # Base and head are benchmarked on the same physical runner and pinned CPU in
  # base-head-head-base order for each suite. This balances gradual environmental
  # drift and measures same-code repeat spread on both revisions.
  #
  # Both revisions are compiled before measurement. Their executables are copied out
  # of Cargo's shared target dir, preserving incremental compilation while keeping
  # build work out of the timed sequence. The tree ends at head for reporting.
  bench:
    name: Benchmarks (advisory)
    runs-on:
      group: BasePerfRunnerGroup
    timeout-minutes: 90
    env:
      # `github.sha` is the synthetic merge commit for pull_request runs. Comparing
      # against it measures the PR as it would land and maximizes shared Cargo inputs
      # with its base parent. On workflow_dispatch it remains the selected commit.
      HEAD_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Single checkout at the PR merge commit. The tree is switched to the base commit
      # for the first pass and back to the merge result for the second;
      # ./.github/actions/setup and the compare script resolve at the workspace root.
      - name: Checkout PR merge commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          foundry: "true"
          native-deps: "true"
          rust-cache-shared-key: "benchmark"
          just: "false"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Fetch the base commit so the single tree can be switched to it, and hoist the
      # head checkout's authoritative bench list out of the tree so both passes run
      # the *same* list even while the tree is switched to the base commit — the base
      # run cannot use a stale list from the base commit. See run_bench_subset.sh for
      # why these particular benches were chosen.
      - name: Prepare base commit and bench list
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin "$BASE_SHA"
          cp etc/scripts/ci/run_bench_subset.sh "$RUNNER_TEMP/run_bench_subset.sh"

      # Advisory only: a bench that fails to compile or run must not stop the rest. A
      # missing executable/result is surfaced by the comparison. Tree switches are
      # not continue-on-error: benchmarking the wrong commit would invalidate the run.
      # --force leaves the ignored shared target dir intact across both builds.
      - name: Switch tree to base commit
        shell: bash
        run: git checkout --force --detach "$BASE_SHA"

      - name: Build benchmark subset (base)
        continue-on-error: true
        shell: bash
        run: bash "$RUNNER_TEMP/run_bench_subset.sh" build "$RUNNER_TEMP/bench-bins/base"

      - name: Switch tree to head commit
        shell: bash
        run: git checkout --force --detach "$HEAD_SHA"

      - name: Build benchmark subset (head)
        continue-on-error: true
        shell: bash
        run: bash "$RUNNER_TEMP/run_bench_subset.sh" build "$RUNNER_TEMP/bench-bins/head"

      - name: Run benchmark subset (ABBA)
        continue-on-error: true
        shell: bash
        run: >-
          bash "$RUNNER_TEMP/run_bench_subset.sh" run
          "$RUNNER_TEMP/bench-bins/base"
          "$RUNNER_TEMP/bench-bins/head"

      - name: Render comparison
        id: render
        shell: bash
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 etc/scripts/ci/bench_compare.py \
            --criterion-dir target/criterion \
            --base-baseline pr-base-1 \
            --base-baseline pr-base-2 \
            --head-baseline pr-head-1 \
            --head-baseline pr-head-2 \
            --output "$RUNNER_TEMP/bench-comment.md" \
            --run-url "$WORKFLOW_RUN_URL" \
            --threshold-pct 10 \
            --improvement-pct 10 \
            --github-output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/bench-comment.md" >> "$GITHUB_STEP_SUMMARY"

      # Only comment on a stable regression/improvement or incomplete/lost coverage,
      # keeping noisy repetitions in the job summary without adding PR noise. If a
      # later push becomes unremarkable, delete the stale comment. Skip forked PRs.
      - name: Comment or clear benchmark results on PR
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHOULD_COMMENT: ${{ steps.render.outputs.should_comment }}
        run: |
          set -euo pipefail
          marker='<!-- bench-pr-results -->'
          existing_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            | head -1)

          if [ "$SHOULD_COMMENT" = "true" ]; then
            body=$(cat "$RUNNER_TEMP/bench-comment.md")
            if [ -n "$existing_id" ]; then
              gh api "repos/${REPO}/issues/comments/${existing_id}" \
                -X PATCH --field body="$body" > /dev/null
            else
              gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                --field body="$body" > /dev/null
            fi
          elif [ "$SHOULD_COMMENT" = "false" ] && [ -n "$existing_id" ]; then
            # Only clear a stale comment when the render step explicitly decided this
            # PR is unremarkable. If render never ran (e.g. it crashed) SHOULD_COMMENT
            # is empty, and we must not delete a legitimate warning from a prior run.
            gh api "repos/${REPO}/issues/comments/${existing_id}" -X DELETE > /dev/null
          fi
