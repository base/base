name: Feature docs script tests

on:
  pull_request:
    paths:
      - etc/scripts/ci/feature_docs.py
      - etc/scripts/ci/feature_docs_schema.py
      - etc/scripts/ci/checkout-guard-test.sh
      - .github/workflows/feature-docs-draft.yml
      - .github/workflows/feature-docs-test.yml
  push:
    branches: [main]
    paths:
      - etc/scripts/ci/feature_docs.py
      - etc/scripts/ci/feature_docs_schema.py
      - etc/scripts/ci/checkout-guard-test.sh
      - .github/workflows/feature-docs-draft.yml
      - .github/workflows/feature-docs-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Run credential-free unit tests
        run: python3 etc/scripts/ci/feature_docs.py test
      - name: Validate the inline post-checkout SHA guards (offline, temp git repos)
        run: bash etc/scripts/ci/checkout-guard-test.sh
