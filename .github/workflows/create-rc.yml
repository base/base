name: Create RC

on:
  push:
    branches:
      - 'releases/v*'

permissions:
  actions: write
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    # Serialize RC number allocation and dispatch, never the artifact builds.
    # The default single pending slot cancels older queued RCs on rapid pushes.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tag the triggering commit even if the branch advances while queued.
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Check version is set
        id: version-check
        run: |
          source ./etc/scripts/release/common.sh
          VERSION=$(get_cargo_version)
          if [[ "$VERSION" == "0.0.0" ]]; then
            echo "::notice::Cargo.toml version is 0.0.0 — version sync PR not yet merged. Skipping RC."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version-check.outputs.skip == 'false'
        run: ./etc/scripts/release/create-tag.sh "${{ github.ref_name }}" rc

      - name: Read tag
        id: read-tag
        if: steps.version-check.outputs.skip == 'false'
        run: |
          TAG_FILE="${{ runner.temp }}/release_tag"
          if [[ ! -f "$TAG_FILE" ]]; then
            echo "::error::release_tag file not found — create-tag.sh may have failed"
            exit 1
          fi
          TAG=$(cat "$TAG_FILE")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      # GITHUB_TOKEN tag pushes do not trigger workflows; dispatch explicitly.
      # This only waits for the dispatch request, not for the build to finish.
      - name: Dispatch RC artifact build
        if: steps.version-check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.read-tag.outputs.tag }}
        run: gh workflow run build-rc.yml --ref "$TAG"

      - name: Summary
        run: |
          SKIP="${{ steps.version-check.outputs.skip }}"
          if [[ "$SKIP" == "true" ]]; then
            echo "## RC Skipped"
            echo ""
            echo "Cargo.toml version is still 0.0.0. Merge the version sync PR first."
          else
            TAG="${{ steps.read-tag.outputs.tag }}"
            echo "## Tag Ready"
            echo ""
            echo "**Tag**: \`$TAG\`"
            echo "**Type**: Release Candidate"
            echo ""
            echo "Artifact build dispatched to the independent **Build RC** workflow."
          fi >> "$GITHUB_STEP_SUMMARY"
