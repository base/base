name: baseup Pages

on:
  push:
    branches:
      - main
    paths:
      - 'baseup/**'
      - '.github/workflows/baseup-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: baseup-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare site
        run: |
          mkdir -p "${{ runner.temp }}/site"
          cp baseup/install "${{ runner.temp }}/site/install"
          cp baseup/baseup "${{ runner.temp }}/site/baseup"
          cp baseup/README.md "${{ runner.temp }}/site/README.md"
          touch "${{ runner.temp }}/site/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
