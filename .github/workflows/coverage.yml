name: Coverage

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

permissions:
  contents: read

jobs:
  unit:
    name: Unit + Integration Coverage
    runs-on:
      group: BasePerfRunnerGroup
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          free-disk: "true"
          native-deps: "true"
          foundry: "true"
          components: llvm-tools-preview
          tools: cargo-nextest,cargo-llvm-cov
          rust-cache-shared-key: "stable"
      - name: Collect unit coverage
        run: just cov::unit
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/unit.lcov
          flags: unit
          fail_ci_if_error: false
          disable_search: true

  action:
    name: Action Test Coverage
    runs-on:
      group: BasePerfRunnerGroup
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          free-disk: "true"
          native-deps: "true"
          foundry: "true"
          components: llvm-tools-preview
          tools: cargo-nextest,cargo-llvm-cov
          rust-cache-shared-key: "stable"
      - name: Collect action-test coverage
        run: just cov::action
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/action.lcov
          flags: action
          fail_ci_if_error: false
          disable_search: true

  system:
    name: System Test Coverage
    runs-on:
      group: BasePerfRunnerGroup
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          free-disk: "true"
          native-deps: "true"
          foundry: "true"
          sp1: "true"
          components: llvm-tools-preview
          tools: cargo-nextest,cargo-llvm-cov
          rust-cache-shared-key: "stable"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Pull system-test images
        run: just devnet pull-images
      - name: Collect system-test coverage
        run: just cov::system
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/system.lcov
          flags: system
          fail_ci_if_error: false
          disable_search: true
