name: Udeps Report

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ISSUE_TITLE: "ci: cargo-udeps findings"

permissions:
  contents: read
  issues: write

jobs:
  udeps-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          free-disk: "true"
          toolchain: nightly
          native-deps: "true"
          mold: "true"
          foundry: "true"
          tools: cargo-udeps
          rust-cache-shared-key: "nightly-udeps-fixes"
          rust-cache-save: "true"

      - name: Build test contracts
        run: just build::contracts

      - name: Run cargo udeps
        id: udeps
        env:
          UDEPS_JSON: ${{ runner.temp }}/udeps.json
          UDEPS_STDERR: ${{ runner.temp }}/udeps.stderr
          ISSUE_BODY: ${{ runner.temp }}/udeps-issue.md
        run: |
          set +e
          BASE_SUCCINCT_ELF_STUB=1 cargo +nightly udeps --locked --workspace --all-features --all-targets --output json >"$UDEPS_JSON" 2>"$UDEPS_STDERR"
          status=$?
          set -e
          export UDEPS_STATUS="$status"

          python3 - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          json_path = Path(os.environ["UDEPS_JSON"])
          stderr_path = Path(os.environ["UDEPS_STDERR"])
          issue_body_path = Path(os.environ["ISSUE_BODY"])
          status = int(os.environ["UDEPS_STATUS"])
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          stdout = json_path.read_text() if json_path.exists() else ""
          if not stdout.strip():
              sys.stderr.write(stderr_path.read_text())
              raise SystemExit(status or 1)

          try:
              payload = json.loads(stdout)
          except json.JSONDecodeError:
              sys.stderr.write(stderr_path.read_text())
              raise

          unused = payload.get("unused_deps", {})
          has_findings = bool(unused)

          lines = [
              "## Summary",
              "",
              "`cargo +nightly udeps --locked --workspace --all-features --all-targets --output json` reported unused dependencies.",
              "",
              f"- Updated at: {datetime.now(timezone.utc).isoformat()}",
              f"- Workflow run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "",
              "## Findings",
              "",
          ]

          for package, details in sorted(unused.items()):
              package_name = package.split(" ", 1)[0]
              lines.append(f"### `{package_name}`")
              normal = details.get("normal", [])
              development = details.get("development", [])
              build = details.get("build", [])
              if normal:
                  lines.append(f"- `dependencies`: {', '.join(f'`{dep}`' for dep in normal)}")
              if development:
                  lines.append(f"- `dev-dependencies`: {', '.join(f'`{dep}`' for dep in development)}")
              if build:
                  lines.append(f"- `build-dependencies`: {', '.join(f'`{dep}`' for dep in build)}")
              lines.append("")

          issue_body_path.write_text("\n".join(lines))

          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"has_findings={'true' if has_findings else 'false'}\n")
              fh.write(f"finding_count={len(unused)}\n")
          PY

      - name: Create or update issue
        id: issue
        if: steps.udeps.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ runner.temp }}/udeps-issue.md
        run: |
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title \
            --limit 20 | python3 -c 'import json, os, sys; title = os.environ["ISSUE_TITLE"]; issues = json.load(sys.stdin); print(next((issue["number"] for issue in issues if issue["title"] == title), ""))')"

          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$ISSUE_BODY"
          else
            issue_url="$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file "$ISSUE_BODY")"
            issue_number="${issue_url##*/}"
          fi

          issue_url="$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "url=$issue_url" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          FINDINGS: ${{ steps.udeps.outputs.has_findings }}
          FINDING_COUNT: ${{ steps.udeps.outputs.finding_count }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          echo "## Udeps Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Findings detected: \`${FINDINGS}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$FINDING_COUNT" ]]; then
            echo "- Packages with findings: \`${FINDING_COUNT}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$ISSUE_NUMBER" ]]; then
            echo "- Open issue: #${ISSUE_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$ISSUE_URL" ]]; then
            echo "- Issue URL: $ISSUE_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
