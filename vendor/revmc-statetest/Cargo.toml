[package]
name = "revmc-statetest"
description = "EVM statetest runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
dashmap = { workspace = true }
walkdir = { workspace = true }
thread_local = { workspace = true }
revm-interpreter = { workspace = true }
revm-statetest-types = { workspace = true }
revmc = { workspace = true, features = ["llvm"] }
eyre = { workspace = true, features = ["default"] }
revm-state = { workspace = true, features = ["std"] }
console = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["default"] }
revm-context = { workspace = true, features = ["std"] }
revm-handler = { workspace = true, features = ["std"] }
tempfile = { workspace = true, features = ["default"] }
revm-database = { workspace = true, features = ["std"] }
indicatif = { workspace = true, features = ["default"] }
thiserror = { workspace = true, features = ["default"] }
libloading = { workspace = true, features = ["default"] }
revm-primitives = { workspace = true, features = ["std"] }
k256 = { workspace = true, features = ["default", "ecdsa"] }
revm-context-interface = { workspace = true, features = ["std"] }
revm-bytecode = { workspace = true, features = ["parse", "std"] }
tracing-subscriber = { workspace = true, features = ["default"] }
revm-database-interface = { workspace = true, features = ["std"] }
revm-inspector = { workspace = true, features = ["std", "tracer"] }
alloy-trie = { workspace = true, features = ["default", "ethereum"] }
serde_json = { workspace = true, features = ["default", "preserve_order"] }
alloy-rlp = { workspace = true, features = ["default", "arrayvec", "derive"] }
[lib]
path = "src/lib.rs"

[lints]
workspace = true
