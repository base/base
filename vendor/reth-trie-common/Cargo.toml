[package]
name = "reth-trie-common"
description = "Commonly used types for trie usage in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
bytes = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, optional = true }
base-common-types-chain = { workspace = true  }
arrayvec = { workspace = true, optional = true }
base-execution-state-memory = { workspace = true }
nybbles = { workspace = true, features = ["rlp"] }
alloy-serde = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["full"] }
alloy-trie = { workspace = true, features = ["ethereum"] }
itertools = { workspace = true, features = ["use_alloc"] }
base-common-types-rpc = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
alloy-rlp = { workspace = true, features = ["core-net", "arrayvec"] }
hash-db = { workspace = true, optional = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
serde_with = { workspace = true, features = ["macros"], optional = true }
plain_hasher = { workspace = true, optional = true, features = ["default"] }

[dev-dependencies]
bytes = { workspace = true }
serde = { workspace = true }
arrayvec = { workspace = true }
alloy-eips = { workspace = true }
alloy-genesis = { workspace = true }
bincode_1_3_3 = { workspace = true }
base-common-types-chain = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
hash-db = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
proptest = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
serde_with = { workspace = true, features = ["macros"] }
plain_hasher = { workspace = true, features = ["default"] }
reth-primitives-traits = { workspace = true, features = ["serde"] }
alloy-trie = { workspace = true, features = ["arbitrary", "serde"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "getrandom"] }

[features]
default = ["std"]
std = [
    "base-common-types-chain/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "base-common-types-rpc?/std",
    "alloy-serde?/std",
    "alloy-trie/std",
    "arrayvec?/std",
    "bytes?/std",
    "derive_more/std",
    "nybbles/std",
    "reth-primitives-traits/std",
    "serde?/std",
    "serde_with?/std",
    "serde_json/std",
    "base-execution-state-memory/std",
    "alloy-eips/std",
    "thiserror/std",
]
eip1186 = ["base-common-types-rpc/serde", "dep:alloy-serde"]
serde = [
    "dep:serde",
    "arrayvec?/serde",
    "bytes?/serde",
    "nybbles/serde",
    "alloy-primitives/serde",
    "base-common-types-chain/serde",
    "alloy-trie/serde",
    "base-common-types-rpc?/serde",
    "reth-primitives-traits/serde",
    "base-execution-state-memory/serde",
    "alloy-eips/serde",
]
reth-codec = ["dep:bytes", "dep:arrayvec"]
serde-bincode-compat = [
    "serde",
    "base-common-types-chain/serde-bincode-compat",
    "dep:serde_with",
    "alloy-genesis/serde-bincode-compat",
    "base-common-types-rpc?/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
]
test-utils = [
    "dep:plain_hasher",
    "dep:hash-db",
    "arbitrary",
    "reth-primitives-traits/test-utils",
    "base-common-types-chain/test-utils",
]
arbitrary = [
    "std",
    "alloy-trie/arbitrary",
    "dep:arbitrary",
    "alloy-serde?/arbitrary",
    "reth-primitives-traits/arbitrary",
    "base-common-types-chain/arbitrary",
    "alloy-primitives/arbitrary",
    "nybbles/arbitrary",
    "base-common-types-rpc?/arbitrary",
    "alloy-eips/arbitrary",
    "base-execution-state-memory/arbitrary",
]
rayon = ["dep:rayon"]
