[package]
name = "reth-trie"
description = "Merkle trie implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
auto_impl = { workspace = true }
itertools = { workspace = true }
alloy-trie = { workspace = true }
reth-db-api = { workspace = true }
base-common-types-chain = { workspace = true }
metrics = { workspace = true, optional = true }
base-execution-evm-runtime = { workspace = true }
alloy-rlp = { workspace = true, features = ["core-net"] }
tracing = { workspace = true, features = ["attributes"] }
reth-trie-sparse = { workspace = true, features = ["std"] }
reth-primitives-traits = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-execution-state-memory = {workspace = true, features = ["std"]}
base-execution-state-api = { workspace = true, features = ["db-api"] }
triehash = { workspace = true, optional = true, features = ["default"] }
parking_lot = { workspace = true, optional = true, features = ["default"] }
base-execution-state-types = {features = ["rayon", "std"], workspace = true}
base-common-observability-metrics = { workspace = true, optional = true, features = ["metrics"]}

[dev-dependencies]
assert_matches = { workspace = true }
base-common-chain-config = {workspace = true}
base-common-types-chain = { workspace = true }
base-execution-evm-runtime = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
rand = { workspace = true, features = ["default"] }
proptest = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
triehash = { workspace = true, features = ["default"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
reth-db = { workspace = true, features = ["test-utils"] }
parking_lot = { workspace = true, features = ["default"] }
reth-provider = { workspace = true, features = ["test-utils"] }
pretty_assertions = { workspace = true, features = ["default"] }
similar-asserts = { workspace = true, features = ["default", "serde"] }
codspeed-criterion-compat = { workspace = true, features = ["default"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
reth-primitives-traits = { workspace = true, features = ["test-utils", "arbitrary"] }
base-execution-state-types = {features = ["arbitrary", "test-utils"], workspace = true}
base-execution-state-memory = {workspace = true, features = ["arbitrary", "test-utils"]}

[[bench]]
name = "proof_v2"
required-features = ["test-utils"]
harness = false

[features]
metrics = ["base-common-observability-metrics", "dep:metrics"]
serde = [
    "alloy-primitives/serde",
    "base-common-types-chain/serde",
    "alloy-trie/serde",
    "base-execution-state-types/serde",
    "reth-primitives-traits/serde",
    "parking_lot/serde",
    "rand/serde",
    "base-execution-evm-runtime/serde",
    "similar-asserts/serde",
    "base-execution-state-api/serde",
    "base-execution-state-memory/serde",
]
test-utils = [
    "triehash",
    "parking_lot",
    "reth-primitives-traits/test-utils",
    "base-execution-state-types/test-utils",
    "reth-trie-sparse/test-utils",
    "reth-db/test-utils",
    "reth-db-api/test-utils",
    "reth-provider/test-utils",
    "base-execution-state-memory/test-utils",
]
serde-bincode-compat = ["base-common-types-chain/serde-bincode-compat", "base-execution-state-types/serde-bincode-compat"]
