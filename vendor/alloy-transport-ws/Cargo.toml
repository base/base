[package]
name = "alloy-transport-ws"
description = "Websocket transport implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_transport_ws"
path = "src/lib.rs"

[dependencies]
alloy-pubsub = { workspace = true }
alloy-transport = { workspace = true }
url = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["default", "sync", "rt"] }
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustls = { workspace = true, optional = true }
http = { workspace = true, features = ["default"] }
tokio-tungstenite_0_29_0 = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "sync", "rt", "time"] }
[target.'cfg(target_family = "wasm")'.dependencies]
ws_stream_wasm = { workspace = true, features = ["default"] }
[lints]
workspace = true

[features]
aws-lc-rs = ["rustls-tls", "rustls?/aws-lc-rs"]
default = ["aws-lc-rs"]
native-tls = ["tokio-tungstenite_0_29_0/native-tls"]
ring = ["rustls-tls", "rustls?/ring"]
rustls-tls = ["dep:rustls", "tokio-tungstenite_0_29_0/rustls-tls-webpki-roots"]
