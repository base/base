[package]
name = "reth-era"
description = "e2store and era1 files core logic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sha2 = { workspace = true }
snap = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
ethereum_ssz = { workspace = true }
alloy-consensus = { workspace = true }
ethereum_ssz_derive = { workspace = true }
alloy-rpc-types-beacon = { workspace = true, features = ["ssz"] }
alloy-rpc-types-engine = { workspace = true, features = ["ssz"] }
alloy-rlp = { workspace = true, features = ["core-net", "derive"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
[dev-dependencies]
test-case = { workspace = true }
reth-era-downloader = { workspace = true }
reth-ethereum-primitives = { workspace = true }
eyre = { workspace = true, features = ["default"] }
rand = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
tokio = { workspace = true, features = ["sync", "macros", "time", "rt-multi-thread"] }
[lints]
workspace = true
