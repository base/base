[package]
name = "tree_hash"
description = "Efficient Merkle-hashing as used in Ethereum consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
documentation = "https://docs.rs/tree_hash"
readme = "README.md"

[lib]
name = "tree_hash"
path = "src/lib.rs"

[[test]]
name = "tests"
path = "tests/tests.rs"

[dependencies]
typenum = { workspace = true }
smallvec = { workspace = true }
ethereum_ssz = { workspace = true }
alloy-primitives = { workspace = true, features = ["default"] }
ethereum_hashing = { workspace = true, features = ["zero_hash_cache"] }
[dev-dependencies]
tree_hash_derive = { workspace = true }
ethereum_ssz_derive = { workspace = true }
rand = { workspace = true, features = ["default"] }
[lints]
workspace = true

[features]
arbitrary = ["alloy-primitives/arbitrary"]
default = ["ring"]
ring = ["ethereum_hashing/ring"]
