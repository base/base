[package]
name = "reth-discv5"
description = "Ethereum peer discovery V5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
enr = { workspace = true }
tokio = { workspace = true }
metrics = { workspace = true }
itertools = { workspace = true }
thiserror = { workspace = true }
reth-metrics = { workspace = true }
alloy-eip2124 = { workspace = true }
rand = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
discv5-reth = { workspace = true, features = ["libp2p"] }
tracing = { workspace = true, features = ["attributes"] }
reth-network-peers = { workspace = true, features = ["secp256k1"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery"] }

[dev-dependencies]
alloy-hardforks = { workspace = true }
base-common-chain-config = { workspace = true }
rand_08 = { workspace = true, features = ["default"] }
reth-tracing = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "std", "rand"] }
