[package]
name = "reth-network"
description = "Ethereum network support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rayon = { workspace = true }
metrics = { workspace = true }
smallvec = { workspace = true }
auto_impl = { workspace = true }
itertools = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
aquamarine = { workspace = true }
reth-ecies = { workspace = true }
reth-tasks = { workspace = true }
rustc-hash = { workspace = true }
discv5-reth = { workspace = true }
pin-project = { workspace = true }
reth-discv5 = { workspace = true }
reth-fs-util = { workspace = true }
alloy-eip2124 = { workspace = true }
reth-eth-wire = { workspace = true }
reth-tokio-util = { workspace = true }
reth-net-banlist = { workspace = true }
reth-network-api = { workspace = true }
reth-storage-api = { workspace = true }
base-execution-evm = { workspace = true }
reth-dns-discovery = { workspace = true }
base-execution-txpool = { workspace = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, optional = true }
base-common-chain-config = { workspace = true }
base-execution-consensus = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
rand = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
rand_08 = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
schnellru = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["attributes"] }
parking_lot = { workspace = true, features = ["default"] }
reth-discv4 = { workspace = true, features = ["default"] }
reth-metrics = { workspace = true, features = ["common"] }
tokio-stream = { workspace = true, features = ["default"] }
reth-network-peers = { workspace = true, features = ["net"] }
reth-network-p2p = { workspace = true, features = ["default"] }
reth-network-types = { workspace = true, features = ["serde"] }
enr = { workspace = true, features = ["serde", "rust-secp256k1"] }
reth-eth-wire-types = { workspace = true, features = ["default"] }
tokio-util = { workspace = true, features = ["default", "codec"] }
alloy-rlp = { workspace = true, features = ["core-net", "derive"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-common-types-chain = { workspace = true, features = ["reth", "serde"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "std"] }
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt-multi-thread", "time"] }

[dev-dependencies]
url = { workspace = true }
reth-trie = { workspace = true }
test-case = { workspace = true }
alloy-trie = { workspace = true }
alloy-chains = { workspace = true }
alloy-genesis = { workspace = true }
alloy-hardforks = { workspace = true }
reth-stages-types = { workspace = true }
reth-testing-utils = { workspace = true }
base-common-chain-config = { workspace = true }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
reth-tracing = { workspace = true, features = ["default"] }
reth-network = { workspace = true, features = ["test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
base-common-types-chain = { workspace = true, features = ["reth"] }
reth-network-types = { workspace = true, features = ["test-utils"] }
base-execution-txpool = { workspace = true, features = ["test-utils"] }
reth-discv4 = { workspace = true, features = ["default", "test-utils"] }
reth-network-p2p = { workspace = true, features = ["default", "test-utils"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "rand"] }

[features]
serde = [
    "dep:serde",
    "secp256k1/serde",
    "enr/serde",
    "reth-dns-discovery/serde",
    "reth-eth-wire/serde",
    "reth-eth-wire-types/serde",
    "base-common-types-chain/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-trie/serde",
    "discv5-reth/serde",
    "parking_lot/serde",
    "rand/serde",
    "smallvec/serde",
    "url/serde",
    "reth-primitives-traits/serde",
    "reth-network/serde",
    "base-execution-txpool/serde",
    "reth-network-api/serde",
    "rand_08/serde",
    "reth-storage-api/serde",
    "reth-network-types/serde",
    "reth-stages-types/serde",
    "reth-trie/serde",
    "alloy-eip7928/serde",
]
test-utils = [
    "base-execution-txpool/test-utils",
    "reth-network-types/test-utils",
    "base-execution-consensus/test-utils",
    "reth-discv4/test-utils",
    "reth-network/test-utils",
    "reth-network-p2p/test-utils",
    "reth-primitives-traits/test-utils",
    "reth-provider/test-utils",
    "reth-tasks/test-utils",
    "reth-stages-types/test-utils",
    "reth-trie/test-utils",
    "base-execution-evm/test-utils",
]
