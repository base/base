[package]
name = "reth-network"
description = "Ethereum network support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rayon = { workspace = true }
metrics = { workspace = true }
smallvec = { workspace = true }
auto_impl = { workspace = true }
itertools = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
aquamarine = { workspace = true }
rustc-hash = { workspace = true }
pin-project = { workspace = true }
alloy-eip2124 = { workspace = true }
reth-network-api = { workspace = true }
base-common-io-files = { workspace = true }
base-execution-txpool = { workspace = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, optional = true }
base-common-runtime-tasks = {workspace = true}
base-execution-evm-blocks = {workspace = true}
base-common-chain-config = { workspace = true }
base-execution-state-api = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
rand = { workspace = true, features = ["default"] }
base-execution-network-discv5 = { workspace = true }
futures = { workspace = true, features = ["default"] }
rand_08 = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
schnellru = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["attributes"] }
parking_lot = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default"] }
reth-network-p2p = { workspace = true, features = ["default"] }
enr = { workspace = true, features = ["serde", "rust-secp256k1"] }
tokio-util = { workspace = true, features = ["default", "codec"] }
alloy-rlp = { workspace = true, features = ["core-net", "derive"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-common-types-chain = { workspace = true, features = ["reth", "serde"] }
base-execution-network-discovery = {features = ["default"], workspace = true}
secp256k1 = { workspace = true, features = ["global-context", "recovery", "std"] }
base-execution-network-types = {features = ["net", "serde", "std"], workspace = true}
base-common-observability-metrics = { workspace = true, features = ["common", "metrics"] }
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt-multi-thread", "time"] }
base-execution-network-wire = {workspace = true, features = ["default", "transport", "requests"]}

[dev-dependencies]
url = { workspace = true }
test-case = { workspace = true }
alloy-trie = { workspace = true }
alloy-chains = { workspace = true }
alloy-genesis = { workspace = true }
alloy-hardforks = { workspace = true }
reth-testing-utils = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-state-memory = {workspace = true}
base-execution-state-trie = { workspace = true }
base-execution-state-types = { workspace = true }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
reth-network = { workspace = true, features = ["test-utils"] }
base-common-types-chain = { workspace = true, features = ["reth"] }
base-execution-txpool = { workspace = true, features = ["test-utils"] }
reth-network-p2p = { workspace = true, features = ["default", "test-utils"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "rand"] }
base-execution-network-types = { workspace = true, features = ["std", "test-utils"] }
base-execution-network-discovery = { workspace = true, features = ["default", "test-utils"] }

[features]
serde = [
    "dep:serde",
    "secp256k1/serde",
    "enr/serde",
    "base-execution-network-discovery/serde",
    "base-execution-network-wire/serde",
    "base-common-types-chain/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-trie/serde",
    "base-execution-network-discv5/serde",
    "parking_lot/serde",
    "rand/serde",
    "smallvec/serde",
    "url/serde",
    "reth-primitives-traits/serde",
    "reth-network/serde",
    "base-execution-txpool/serde",
    "reth-network-api/serde",
    "rand_08/serde",
    "base-execution-state-api/serde",
    "base-execution-network-types/serde",
    "base-execution-state-types/serde",
    "base-execution-state-trie/serde",
    "alloy-eip7928/serde",
    "base-execution-state-memory/serde",
]
test-utils = [
    "base-execution-txpool/test-utils",
    "base-execution-network-types/test-utils",
    "base-execution-evm-blocks/test-utils",
    "base-execution-network-discovery/test-utils",
    "reth-network/test-utils",
    "reth-network-p2p/test-utils",
    "reth-primitives-traits/test-utils",
    "base-execution-state-provider/test-utils",
    "base-common-runtime-tasks/test-utils",
    "base-execution-state-types/test-utils",
    "base-execution-state-trie/test-utils",
    "base-execution-state-memory/test-utils",
]
