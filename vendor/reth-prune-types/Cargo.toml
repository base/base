[package]
name = "reth-prune-types"
description = "Commonly used types for prune usage in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
strum = { workspace = true, features = ["derive"] }
derive_more = { workspace = true, features = ["full"] }
modular-bitfield = { workspace = true, optional = true }
tracing = { workspace = true, features = ["attributes"] }
base-common-consensus = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
serde = { workspace = true, features = ["derive"], optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
[dev-dependencies]
serde = { workspace = true }
assert_matches = { workspace = true }
base-common-consensus = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
proptest = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
toml_0_9_12_spec_1_1_0 = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "serde"] }

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "derive_more/std",
    "serde?/std",
    "serde_json/std",
    "strum/std",
    "thiserror/std",
    "tracing/std",
    "base-common-consensus?/std",
]
test-utils = ["std", "dep:arbitrary", "base-common-consensus?/test-utils"]
arbitrary = ["alloy-primitives/arbitrary", "base-common-consensus?/arbitrary"]
reth-codec = ["dep:base-common-consensus", "dep:modular-bitfield"]
serde = ["dep:serde", "alloy-primitives/serde", "base-common-consensus?/serde"]
