[package]
name = "reth-execution-cache"
description = "Cross-block execution cache for payload processing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
metrics = { workspace = true }
reth-trie = { workspace = true }
reth-provider = { workspace = true }
base-execution-state-api = { workspace = true }
base-execution-state-types = {workspace = true}
base-execution-evm-runtime = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
parking_lot = { workspace = true, features = ["default"] }
fixed-cache = { workspace = true, features = ["alloc", "stats"] }
reth-primitives-traits = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-execution-state-memory = {features = ["std"], workspace = true}
base-common-observability-metrics = { workspace = true, features = ["common", "metrics"] }

[dev-dependencies]
base-execution-evm-runtime = { workspace = true }
reth-provider = { workspace = true, features = ["test-utils"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }

[features]
test-utils = [
    "reth-primitives-traits/test-utils",
    "reth-provider/test-utils",
    "reth-trie/test-utils",
    "base-execution-state-memory/test-utils",
]
