[package]
name = "alloy-transport"
description = "Low-level Ethereum JSON-RPC transport abstraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_transport"
path = "src/lib.rs"

[dependencies]
auto_impl = { workspace = true }
derive_more = { workspace = true }
alloy-json-rpc = { workspace = true }
tower = { workspace = true, features = ["util"] }
url = { workspace = true, features = ["default"] }
thiserror = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["default"] }
parking_lot = { workspace = true, features = ["default"] }
futures-utils-wasm = { workspace = true, features = ["default"] }
serde = { workspace = true, features = [
    "derive",
    "alloc",
] }
serde_json = { workspace = true, features = [
    "alloc",
    "raw_value",
] }
governor_0_10 = { workspace = true, features = [
    "std",
    "quanta",
], optional = true }
[dev-dependencies]
alloy-primitives = { workspace = true }
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasmtimer = { workspace = true, features = ["default"] }
wasm-bindgen-futures = { workspace = true, optional = true, features = ["default"] }
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { workspace = true, features = ["default", "rt", "time", "sync", "macros"] }
[lints]
workspace = true

[features]
throttle = ["dep:governor_0_10"]
wasm-bindgen = ["dep:wasm-bindgen-futures"]
