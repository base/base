[package]
name = "reth-storage-overlay"
description = "State trie overlay construction and caching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
metrics = { workspace = true }
reth-trie = { workspace = true }
alloy-eips = { workspace = true }
reth-chain-state = { workspace = true }
rayon = { workspace = true, optional = true }
base-execution-state-database = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
parking_lot = { workspace = true, features = ["default"] }
base-execution-state-types = {features = ["std"], workspace = true}
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-execution-state-memory = {workspace = true, features = ["std"]}
base-execution-state-api = { workspace = true, features = ["db-api"] }
reth-primitives-traits = { workspace = true, features = ["dashmap", "std"] }
base-common-observability-metrics = { workspace = true, features = ["metrics"]}
base-common-runtime-tasks = { workspace = true, features = ["rayon"], optional = true }

[dev-dependencies]
base-common-types-chain = { workspace = true }
reth-trie = { workspace = true, features = ["test-utils"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }
reth-chain-state = { workspace = true, features = ["test-utils"] }
reth-primitives-traits = { workspace = true, features = ["test-utils"] }
base-execution-state-types = {workspace = true, features = ["test-utils"]}
base-execution-state-memory = {workspace = true, features = ["test-utils"]}
base-execution-state-database = { workspace = true, features = ["test-utils"] }

[features]
partial-persistence = ["base-execution-state-types/partial-persistence"]
rayon = ["dep:rayon", "dep:base-common-runtime-tasks"]
