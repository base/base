[package]
name = "reth-evm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
revm = { workspace = true }
alloy-evm = { workspace = true }
auto_impl = { workspace = true }
alloy-eips = { workspace = true }
futures-util = { workspace = true }
base-common-evm = { workspace = true }
alloy-consensus = { workspace = true }
reth-storage-api = { workspace = true }
reth-trie-common = { workspace = true }
base-common-chains = { workspace = true }
reth-storage-errors = { workspace = true }
reth-execution-types = { workspace = true }
reth-execution-errors = { workspace = true }
reth-primitives-traits = { workspace = true }
rayon = { workspace = true, optional = true }
reth-payload-primitives = { workspace = true }
base-execution-chainspec = { workspace = true }
base-execution-consensus = { workspace = true }
metrics = { workspace = true, optional = true }
reth-metrics = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["full"] }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
fixed-cache = { workspace = true, features = ["alloc"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-common-consensus = { workspace = true, features = ["reth", "evm"] }
base-common-rpc-types-engine = { workspace = true, features = ["serde"] }

[dev-dependencies]
alloy-genesis = { workspace = true }
base-common-genesis = { workspace = true }
reth-ethereum-primitives = { workspace = true }

[features]
default = ["std"]
std = [
    "base-common-chains/std",
    "base-common-evm/std",
    "base-execution-chainspec/std",
    "base-execution-consensus/std",
    "reth-payload-primitives/std",

    "dep:rayon",
    "reth-primitives-traits/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-consensus/std",
    "revm/std",
    "alloy-evm/std",
    "reth-execution-errors/std",
    "reth-execution-types/std",
    "reth-storage-errors/std",
    "futures-util/std",
    "derive_more/std",
    "reth-storage-api/std",
    "reth-trie-common/std",
    "alloy-eip7928/std",
    "fixed-cache/std",
]
metrics = ["std", "dep:metrics", "dep:reth-metrics"]
test-utils = [
    "std",
    "reth-primitives-traits/test-utils",
    "reth-trie-common/test-utils",
]

rpc = ["alloy-evm/rpc"]
