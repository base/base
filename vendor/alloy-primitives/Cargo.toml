[package]
name = "alloy-primitives"
description = "Ethereum primitive types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_primitives"
path = "src/lib.rs"

[[bench]]
name = "primitives"
path = "benches/primitives.rs"
harness = false
required-features = ["rand"]

[dependencies]
itoa = { workspace = true }
bytes = { workspace = true }
paste = { workspace = true }
cfg-if = { workspace = true }
sha3_0_11_0 = { workspace = true }
rayon = { workspace = true, optional = true }
foldhash = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
rapidhash = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
allocative = { workspace = true, optional = true }
keccak-asm = { workspace = true, optional = true }
ruint = { workspace = true, features = ["alloc"] }
rustc-hash = { workspace = true, optional = true }
fixed-cache = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
k256 = { workspace = true, features = ["ecdsa"], optional = true }
rand = { workspace = true, features = ["os_rng"], optional = true }
borsh = { workspace = true, features = ["derive"], optional = true }
rkyv = { workspace = true, optional = true, features = ["default"] }
diesel = { workspace = true, optional = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
sqlx-core = { workspace = true, optional = true, features = ["default"] }
tiny-keccak = { workspace = true, features = ["keccak"], optional = true }
const-hex = { workspace = true, features = [
    "alloc",
    "core-error",
] }
serde = { workspace = true, features = [
    "alloc",
    "derive",
], optional = true }
alloy-rlp = { workspace = true, features = [
    "core-net",
    "core-error",
], optional = true }
secp256k1_0_31_1 = { workspace = true, features = [
    "recovery",
    "alloc",
], optional = true }
hashbrown = { workspace = true, features = [
    "default-hasher",
    "inline-more",
], optional = true }
derive_more = { workspace = true, features = [
    "as_ref",
    "add",
    "add_assign",
    "not",
    "deref",
    "deref_mut",
    "from",
    "from_str",
    "index",
    "index_mut",
    "into",
    "into_iterator",
    "display",
    "deref",
] }
[dev-dependencies]
bcs = { workspace = true }
bincode_1_3_3 = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
criterion_0_7 = { workspace = true, features = ["default"] }
[lints]
workspace = true

[features]
allocative = ["dep:allocative"]
arbitrary = ["std", "dep:arbitrary", "dep:proptest", "dep:proptest-derive", "ruint/arbitrary", "ruint/proptest", "indexmap?/arbitrary"]
asm-keccak = ["dep:keccak-asm"]
borsh = ["dep:borsh", "ruint/borsh"]
default = ["std", "map", "map-foldhash"]
diesel = ["std", "dep:diesel", "ruint/diesel"]
getrandom = ["dep:getrandom"]
hex-compat = ["const-hex/hex"]
k256 = ["dep:k256"]
keccak-cache = ["std", "dep:rapidhash", "dep:fixed-cache"]
keccak-cache-global = ["keccak-cache"]
keccak-cache-stats = ["keccak-cache", "fixed-cache/stats"]
map = ["dep:hashbrown", "dep:foldhash"]
map-foldhash = ["map", "dep:foldhash"]
map-fxhash = ["map", "dep:rustc-hash"]
map-hashbrown = ["map"]
map-indexmap = ["map", "dep:indexmap"]
map-rapidhash = ["map", "dep:rapidhash"]
native-keccak = []
nightly = ["foldhash?/nightly", "rapidhash?/nightly", "hashbrown?/nightly", "const-hex/nightly", "fixed-cache?/nightly"]
postgres = ["std", "dep:postgres-types", "ruint/postgres"]
rand = ["dep:rand", "getrandom", "ruint/rand-09", "rapidhash?/rand", "rustc-hash?/rand"]
rayon = ["dep:rayon", "hashbrown?/rayon", "indexmap?/rayon"]
rkyv = ["dep:rkyv", "ruint/rkyv"]
rlp = ["dep:alloy-rlp", "ruint/alloy-rlp"]
schemars = ["dep:schemars"]
secp256k1 = ["dep:secp256k1_0_31_1"]
serde = ["dep:serde", "bytes/serde", "const-hex/serde", "ruint/serde", "hashbrown?/serde", "indexmap?/serde", "rand?/serde"]
sha3-keccak = []
sqlx = ["std", "dep:sqlx-core", "ruint/sqlx"]
std = ["bytes/std", "const-hex/std", "ruint/std", "alloy-rlp?/std", "foldhash?/std", "rapidhash?/std", "indexmap?/std", "k256?/std", "secp256k1_0_31_1?/std", "secp256k1_0_31_1?/global-context", "keccak-asm?/std", "proptest?/std", "rand?/std", "rand?/thread_rng", "rustc-hash?/std", "serde?/std", "fixed-cache?/std"]
tiny-keccak = ["dep:tiny-keccak"]
