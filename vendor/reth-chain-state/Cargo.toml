[package]
name = "reth-chain-state"
description = "Reth state related types and functionality."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
revm = { workspace = true }
metrics = { workspace = true }
reth-trie = { workspace = true }
alloy-eips = { workspace = true }
reth-errors = { workspace = true }
pin-project = { workspace = true }
reth-metrics = { workspace = true }
reth-chainspec = { workspace = true }
alloy-consensus = { workspace = true }
reth-storage-api = { workspace = true }
reth-execution-types = { workspace = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, optional = true }
alloy-signer = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["full"] }
tracing = { workspace = true, features = ["attributes"] }
alloy-signer-local = { workspace = true, optional = true }
parking_lot = { workspace = true, features = ["default"] }
reth-trie-sparse = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "macros"] }
base-common-consensus = { workspace = true, features = ["reth"] }
tokio-stream = { workspace = true, features = ["default", "sync"] }
rand = { workspace = true, optional = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "std"] }
[dev-dependencies]
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
reth-testing-utils = { workspace = true }
rand = { workspace = true, features = ["default"] }
reth-primitives-traits = { workspace = true, features = ["test-utils"] }
[features]
serde = [
    "dep:serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "parking_lot/serde",
    "rand?/serde",
    "reth-execution-types/serde",
    "reth-primitives-traits/serde",
    "reth-trie/serde",
    "revm/serde",
    "reth-storage-api/serde",
]
test-utils = [
    "alloy-primitives/getrandom",
    "alloy-signer",
    "alloy-signer-local",
    "rand",
    "reth-chainspec/test-utils",
    "reth-primitives-traits/test-utils",
    "reth-trie/test-utils",
    "reth-trie-sparse/test-utils",
]
