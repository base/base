[package]
name = "reth-chainspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
alloy-evm = { workspace = true }
alloy-genesis = { workspace = true }
alloy-consensus = { workspace = true }
reth-network-peers = { workspace = true }
reth-ethereum-forks = { workspace = true }
reth-primitives-traits = { workspace = true }
alloy-eips = { workspace = true, features = ["serde"] }
serde_json = { workspace = true, features = ["alloc"] }
derive_more = { workspace = true, features = ["full"] }
alloy-trie = { workspace = true, features = ["ethereum"] }
alloy-chains = { workspace = true, features = ["serde", "rlp"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rlp"] }
[dev-dependencies]
alloy-trie = { workspace = true, features = ["arbitrary"] }
alloy-eips = { workspace = true, features = ["arbitrary"] }
alloy-rlp = { workspace = true, features = ["core-net", "arrayvec"] }
[features]
default = ["std"]
std = [
    "alloy-chains/std",
    "alloy-eips/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-trie/std",
    "reth-primitives-traits/std",
    "alloy-consensus/std",
    "alloy-rlp/std",
    "reth-ethereum-forks/std",
    "derive_more/std",
    "reth-network-peers/std",
    "serde_json/std",
    "alloy-evm/std",
]
arbitrary = [
    "alloy-chains/arbitrary",
    "reth-ethereum-forks/arbitrary",
    "reth-primitives-traits/arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-trie/arbitrary",
]
test-utils = [
    "reth-primitives-traits/test-utils",
]
