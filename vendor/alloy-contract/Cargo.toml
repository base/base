[package]
name = "alloy-contract"
description = "Interact with on-chain contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_contract"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
alloy-json-abi = { workspace = true }
alloy-provider = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-transport = { workspace = true }
alloy-network-primitives = { workspace = true }
alloy-pubsub = { workspace = true, optional = true }
futures = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["default"] }
alloy-dyn-abi = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["map"] }
futures-util = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = [
    "alloc",
    "raw_value",
] }
base-common-network = { workspace = true }
base-common-consensus = { workspace = true }
base-common-rpc-types = { workspace = true, features = ["serde"] }
[dev-dependencies]
base-common-network = { workspace = true }
alloy-node-bindings = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
alloy-provider = { workspace = true, features = ["anvil-node"] }
tracing-subscriber = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasmtimer = { workspace = true, features = ["default"] }
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { workspace = true, features = ["default", "time"] }
[lints]
workspace = true

[features]
pubsub = [
    "alloy-provider/pubsub",
    "dep:alloy-pubsub",
]
