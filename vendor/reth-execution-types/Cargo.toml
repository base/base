[package]
name = "reth-execution-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
revm = { workspace = true }
alloy-evm = { workspace = true }
alloy-eips = { workspace = true }
reth-trie-common = { workspace = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["full"] }
alloy-consensus = { workspace = true, features = ["serde"]}
base-common-consensus = { workspace = true, features = ["reth"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
serde_with = { workspace = true, features = ["macros"], optional = true }
alloy-rlp = { workspace = true, features = ["core-net"], optional = true }
[dev-dependencies]
arbitrary = { workspace = true }
bincode_1_3_3 = { workspace = true }
rand = { workspace = true, features = ["default"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
base-common-consensus = { workspace = true, features = ["arbitrary"] }
alloy-consensus = {workspace = true, features = ["arbitrary", "serde"]}
reth-primitives-traits = { workspace = true, features = ["test-utils", "arbitrary"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand", "arbitrary"] }

[features]
default = ["std"]
serde = [
    "dep:serde",
    "rand/serde",
    "revm/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "reth-primitives-traits/serde",
    "alloy-consensus/serde",
    "reth-trie-common/serde",
]
serde-bincode-compat = [
    "serde",
    "alloy-rlp",
    "reth-trie-common/serde-bincode-compat",
    "serde_with",
    "alloy-consensus/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
]
std = [
    "alloy-eips/std",
    "alloy-primitives/std",
    "revm/std",
    "serde?/std",
    "reth-primitives-traits/std",
    "alloy-consensus/std",
    "serde_with?/std",
    "derive_more/std",
    "reth-trie-common/std",
    "alloy-evm/std",
    "alloy-rlp?/std",
]
