[package]
name = "reth-execution-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
alloy-eips = { workspace = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, optional = true }
base-execution-state-types = { workspace = true }
base-execution-state-memory = { workspace = true }
derive_more = { workspace = true, features = ["full"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
serde_with = { workspace = true, features = ["macros"], optional = true }
alloy-rlp = { workspace = true, features = ["core-net"], optional = true }
base-common-types-chain = { workspace = true, features = ["reth", "serde"] }

[dev-dependencies]
arbitrary = { workspace = true }
bincode_1_3_3 = { workspace = true }
rand = { workspace = true, features = ["default"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
base-common-types-chain = { workspace = true, features = ["arbitrary", "serde"] }
reth-primitives-traits = { workspace = true, features = ["test-utils", "arbitrary"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand", "arbitrary"] }

[features]
default = ["std"]
serde = [
    "dep:serde",
    "rand/serde",
    "base-execution-state-memory/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "reth-primitives-traits/serde",
    "base-common-types-chain/serde",
    "base-execution-state-types/serde",
]
serde-bincode-compat = [
    "serde",
    "alloy-rlp",
    "base-execution-state-types/serde-bincode-compat",
    "serde_with",
    "base-common-types-chain/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
]
std = [
    "alloy-eips/std",
    "alloy-primitives/std",
    "base-execution-state-memory/std",
    "serde?/std",
    "reth-primitives-traits/std",
    "base-common-types-chain/std",
    "serde_with?/std",
    "derive_more/std",
    "base-execution-state-types/std",
    "alloy-rlp?/std",
]
