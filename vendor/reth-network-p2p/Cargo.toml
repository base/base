[package]
name = "reth-network-p2p"
description = "traits and commonly used types for p2p and network communication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
auto_impl = { workspace = true }
alloy-eips = { workspace = true }
reth-primitives-traits = { workspace = true }
base-execution-evm-blocks = { workspace = true }
base-execution-state-types = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
futures = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
tracing = { workspace = true, features = ["attributes"] }
reth-eth-wire-types = { workspace = true, features = ["default"] }
base-execution-network-types = {features = ["std"], workspace = true}
parking_lot = { workspace = true, optional = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
base-common-types-chain = { workspace = true, features = ["reth", "serde"] }

[dev-dependencies]
test-case = { workspace = true }
tokio = { workspace = true, features = ["full"] }
parking_lot = { workspace = true, features = ["default"] }
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }

[features]
default = ["std"]
test-utils = [
    "base-execution-evm-blocks/test-utils",
    "parking_lot",
    "base-execution-network-types/test-utils",
    "reth-primitives-traits/test-utils",
    "alloy-eip7928/std",
    "alloy-primitives/rand",
]
std = [
    "base-common-types-chain/std",
    "base-execution-evm-blocks/std",
    "alloy-eip7928/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "reth-primitives-traits/std",
    "derive_more/std",
    "base-execution-network-types/std",
    "base-execution-state-types/std",
    "tracing/std",
]
