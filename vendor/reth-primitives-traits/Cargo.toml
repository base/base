[package]
name = "reth-primitives-traits"
description = "Common types in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = false

[lib]
name = "reth_primitives_traits"
path = "src/lib.rs"

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-trie = { workspace = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
base-execution-state-memory = {workspace = true}
derive_more = { workspace = true, features = ["full"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
base-common-types-rpc = { workspace = true, optional = true }
once_cell = { workspace = true, features = ["critical-section"] }
proptest-arbitrary-interop = { workspace = true, optional = true }
base-common-types-chain = { workspace = true, features = ["k256"] }
dashmap = { workspace = true, features = ["inline"], optional = true }
quanta = { workspace = true, optional = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
proptest = { workspace = true, optional = true, features = ["default"] }
alloy-primitives = { workspace = true, features = [
    "map-foldhash",
    "k256",
] }
secp256k1 = { workspace = true, features = [
    "global-context",
    "recovery",
    "recovery",
], optional = true }

[dev-dependencies]
serde = { workspace = true }
alloy-genesis = { workspace = true }
modular-bitfield = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
rand = { workspace = true, features = ["default"] }
rand_08 = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
proptest = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
byteorder = { workspace = true, features = ["default"] }
base-common-types-chain = { workspace = true, features = ["arbitrary", "serde"] }
alloy-primitives = { workspace = true, features = [
    "map-foldhash",
    "arbitrary",
    "serde",
] }
secp256k1 = { workspace = true, features = [
    "global-context",
    "recovery",
    "recovery",
    "global-context",
    "rand",
] }

[lints]
workspace = true

[features]
arbitrary = [
    "base-common-types-chain/arbitrary",
    "std",
    "alloy-primitives/arbitrary",
    "dep:arbitrary",
    "dep:proptest",
    "dep:proptest-arbitrary-interop",
    "alloy-eips/arbitrary",
    "secp256k1?/global-context",
    "secp256k1?/rand",
    "alloy-trie/arbitrary",
    "base-common-types-rpc?/arbitrary",
    "dashmap?/arbitrary",
    "base-execution-state-memory/arbitrary",
]
dashmap = ["dep:dashmap"]
default = ["std", "quanta"]
quanta = ["std", "dep:quanta"]
rayon = ["dep:rayon"]
reth-codec = ["base-common-types-chain/reth", "base-execution-state-memory/reth-codec"]
rpc-compat = ["base-common-types-rpc"]
secp256k1 = ["base-common-types-chain/secp256k1"]
serde = [
    "base-common-types-chain/serde",
    "dep:serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bytes/serde",
    "rand/serde",
    "secp256k1?/serde",
    "alloy-trie/serde",
    "rand_08/serde",
    "base-common-types-rpc?/serde",
    "dashmap?/serde",
    "base-execution-state-memory/serde",
]
std = [
    "base-common-types-chain/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "serde?/std",
    "alloy-rlp/std",
    "bytes/std",
    "derive_more/std",
    "once_cell/std",
    "secp256k1?/std",
    "thiserror/std",
    "alloy-trie/std",
    "serde_json/std",
    "base-common-types-rpc?/std",
    "base-execution-state-memory/std",
]
test-utils = ["arbitrary", "base-common-types-chain/test-utils", "base-execution-state-memory/test-utils"]
