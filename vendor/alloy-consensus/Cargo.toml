[package]
name = "alloy-consensus"
description = "Ethereum consensus interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_consensus"
path = "src/lib.rs"

[dependencies]
either = { workspace = true }
alloy-rlp = { workspace = true }
thiserror = { workspace = true }
auto_impl = { workspace = true }
alloy-tx-macros = { workspace = true }
alloy-serde = { workspace = true, optional = true }
alloy-trie = { workspace = true, features = ["ethereum"] }
alloy-primitives = { workspace = true, features = ["rlp"] }
alloy-eips = { workspace = true, features = ["kzg-sidecar"] }
c-kzg = { workspace = true, features = ["serde"], optional = true }
borsh = { workspace = true, features = ["derive"], optional = true }
rand_08 = { workspace = true, optional = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"], optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
once_cell = { workspace = true, features = [
    "race",
    "alloc",
] }
serde_with = { workspace = true, features = ["macros"], optional = true }
k256 = { workspace = true, features = [
    "ecdsa",
    "ecdsa",
], optional = true }
serde = { workspace = true, features = [
    "derive",
    "alloc",
    "derive",
], optional = true }
derive_more = { workspace = true, features = [
    "from",
    "deref",
    "deref_mut",
    "into_iterator",
] }
secp256k1 = { workspace = true, features = [
    "recovery",
    "global-context",
    "std",
], optional = true }
[dev-dependencies]
assert_matches_1_5 = { workspace = true }
k256 = { workspace = true, features = ["ecdsa"] }
rand_08 = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
arbitrary = { workspace = true, features = ["derive"] }
bincode = { workspace = true, features = ["default", "serde"] }
alloy-primitives = { workspace = true, features = [
    "arbitrary",
    "rand",
] }
alloy-eips = { workspace = true, features = [
    "arbitrary",
    "kzg",
    "serde",
] }
secp256k1 = { workspace = true, features = [
    "recovery",
    "global-context",
    "std",
    "rand",
] }
[lints]
workspace = true

[features]
arbitrary = ["std", "dep:rand_08", "dep:arbitrary", "alloy-eips/arbitrary", "alloy-primitives/arbitrary", "alloy-serde?/arbitrary", "alloy-trie/arbitrary", "c-kzg?/arbitrary", "alloy-tx-macros/arbitrary"]
borsh = ["dep:borsh", "alloy-primitives/borsh", "alloy-eips/borsh"]
crypto-backend = []
default = ["std"]
k256 = ["dep:k256", "alloy-primitives/k256", "alloy-eips/k256"]
kzg = ["dep:c-kzg", "alloy-eips/kzg", "std"]
secp256k1 = ["dep:secp256k1", "alloy-primitives/secp256k1"]
serde = ["dep:serde", "alloy-primitives/serde", "dep:alloy-serde", "dep:serde_json", "alloy-eips/serde", "alloy-trie/serde", "c-kzg?/serde", "either/serde", "k256?/serde", "rand_08?/serde", "secp256k1?/serde", "alloy-tx-macros/serde"]
serde-bincode-compat = ["alloy-eips/serde-bincode-compat", "serde_with"]
std = ["alloy-eips/std", "c-kzg?/std", "alloy-serde?/std", "alloy-primitives/std", "alloy-rlp/std", "alloy-trie/std", "derive_more/std", "k256?/std", "serde?/std", "serde_json?/std", "serde_with?/std", "thiserror/std", "either/std", "once_cell/std", "secp256k1?/std", "borsh?/std"]
