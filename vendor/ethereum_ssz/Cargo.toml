[package]
name = "ethereum_ssz"
description = "SimpleSerialize (SSZ) as used in Ethereum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
documentation = "https://docs.rs/ethereum_ssz"
readme = "README.md"

[lib]
name = "ssz"
path = "src/lib.rs"

[[test]]
name = "tests"
path = "tests/tests.rs"

[dependencies]
typenum = { workspace = true }
ethereum_serde_utils = { workspace = true }
serde = { workspace = true, features = ["default"] }
itertools = { workspace = true, features = ["default"] }
serde_derive = { workspace = true, features = ["default"] }
smallvec = { workspace = true, features = ["const_generics"] }
alloy-primitives = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
context_deserialize = { workspace = true, optional = true, features = ["default"] }
[dev-dependencies]
ethereum_ssz_derive = { workspace = true }
serde_json = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["default", "getrandom"] }
[lints]
workspace = true

[features]
arbitrary = [
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
]
context_deserialize = ["dep:context_deserialize"]
