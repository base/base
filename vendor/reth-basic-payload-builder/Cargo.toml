[package]
name = "reth-basic-payload-builder"
description = "A basic payload builder for reth that uses the txpool API to build payloads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
metrics = { workspace = true }
alloy-eips = { workspace = true }
reth-tasks = { workspace = true }
futures-util = { workspace = true }
reth-metrics = { workspace = true }
alloy-consensus = { workspace = true }
reth-storage-api = { workspace = true }
reth-chain-state = { workspace = true }
base-execution-evm = { workspace = true }
reth-execution-cache = { workspace = true }
reth-payload-builder = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-payload-builder-primitives = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true, features = ["attributes"] }
futures-core = { workspace = true, features = ["default"] }
reth-trie-parallel = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
reth-payload-primitives = { workspace = true, features = ["default"] }
