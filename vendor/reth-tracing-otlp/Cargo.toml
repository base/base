[package]
name = "reth-tracing-otlp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
url = { workspace = true }
tracing-subscriber = { workspace = true }
eyre = { workspace = true, features = ["default"] }
base64 = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["attributes"] }
clap = { workspace = true, features = ["default", "derive"] }
opentelemetry = { workspace = true, optional = true, features = ["default"] }
opentelemetry_sdk = { workspace = true, optional = true, features = ["default"] }
tracing-opentelemetry_0_33_0 = { workspace = true, optional = true, features = ["default"] }
opentelemetry-appender-tracing = { workspace = true, optional = true, features = ["default"] }
opentelemetry-semantic-conventions = { workspace = true, optional = true, features = ["default"] }
opentelemetry-otlp = { workspace = true, features = ["default", "grpc-tonic", "reqwest-rustls"], optional = true }
[lints]
workspace = true

[features]
default = ["otlp"]

otlp = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "tracing-opentelemetry_0_33_0"]

otlp-logs = ["otlp", "opentelemetry-appender-tracing", "opentelemetry-appender-tracing/experimental_span_attributes", "opentelemetry-otlp/logs", "opentelemetry_sdk/logs"]
