[package]
name = "ethereum_serde_utils"
description = "Serialization and deserialization utilities for JSON representations of Ethereum types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
documentation = "https://docs.rs/ethereum_serde_utils"
readme = "README.md"

[lib]
name = "serde_utils"
path = "src/lib.rs"

[dependencies]
hex = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["default"] }
serde_derive = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["default", "derive"] }
alloy-primitives = { workspace = true, features = ["default", "serde"] }
[lints]
workspace = true
