[package]
name = "alloy-genesis"
description = "Ethereum genesis file definitions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_genesis"
path = "src/lib.rs"

[dependencies]
alloy-serde = { workspace = true }
alloy-primitives = { workspace = true }
alloy-eips = { workspace = true, features = ["serde"] }
alloy-trie = { workspace = true, features = ["ethereum"] }
borsh = { workspace = true, features = ["derive"], optional = true }
serde = { workspace = true, features = [
    "derive",
    "alloc",
] }
serde_with = { workspace = true, features = ["macros"], optional = true }
[dev-dependencies]
serde_json = { workspace = true, features = ["alloc"] }
bincode = { workspace = true, features = ["default", "serde"] }
[lints]
workspace = true

[features]
borsh = [
    "dep:borsh",
    "alloy-primitives/borsh",
    "alloy-eips/borsh",
]
default = ["std"]
serde-bincode-compat = [
    "dep:serde_with",
    "alloy-eips/serde-bincode-compat",
]
std = [
    "alloy-primitives/std",
    "alloy-serde/std",
    "serde/std",
    "alloy-trie/std",
    "alloy-eips/std",
    "serde_json/std",
    "serde_with?/std",
    "borsh?/std",
]
