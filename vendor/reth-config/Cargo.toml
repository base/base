[package]
name = "reth-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, optional = true }
base-execution-sync-pipeline = {workspace = true}
eyre = { workspace = true, features = ["default"] }
base-execution-state-maintenance = {workspace = true}
base-execution-state-types = {workspace = true,features = ["std"]}
base-execution-network-types = {features = ["std"], workspace = true}
toml_0_9_12_spec_1_1_0 = { workspace = true, optional = true, features = ["default"] }

[dev-dependencies]
url = { workspace = true }
tempfile = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "getrandom"] }

[features]
serde = [
    "dep:serde",
    "dep:toml_0_9_12_spec_1_1_0",
    "base-execution-network-types/secp256k1",
    "base-execution-network-types/serde",
    "base-execution-state-types/serde",
    "alloy-primitives/serde",
    "base-execution-sync-pipeline/serde",
]
