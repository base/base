[package]
name = "alloy-rpc-types"
description = "Meta-crate for all Ethereum JSON-RPC types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_rpc_types"
path = "src/lib.rs"

[dependencies]
alloy-serde = { workspace = true }
alloy-primitives = { workspace = true, features = ["map"] }
alloy-rpc-types-mev = { workspace = true, optional = true }
alloy-rpc-types-admin = { workspace = true, optional = true }
alloy-rpc-types-debug = { workspace = true, optional = true }
serde = { workspace = true, features = [
    "derive",
    "alloc",
    "derive",
    "std",
] }
base-common-rpc-types = {workspace = true, features = ["serde"], optional = true}
base-common-rpc-types-engine = { workspace = true, features = ["serde"], optional = true }
[dev-dependencies]
serde_json = { workspace = true, features = ["alloc"] }
similar-asserts = { workspace = true, features = ["default"] }
[lints]
workspace = true

[features]
admin = ["dep:alloy-rpc-types-admin"]
arbitrary = [
    "base-common-rpc-types?/arbitrary",
    "alloy-serde/arbitrary",
    "alloy-primitives/arbitrary",
    "base-common-rpc-types-engine?/arbitrary",
]
debug = ["dep:alloy-rpc-types-debug"]
default = [
    "eth",
    "base-common-rpc-types-engine?/default",
    "base-common-rpc-types?/default",
]
engine = ["dep:base-common-rpc-types-engine"]
eth = ["dep:base-common-rpc-types"]
k256 = [
    "base-common-rpc-types?/k256",
    "alloy-primitives/k256",
]
kzg = ["base-common-rpc-types-engine?/kzg"]
mev = ["dep:alloy-rpc-types-mev"]
ssz = [
    "base-common-rpc-types-engine?/ssz",
]
trace = ["dep:base-common-rpc-types"]
txpool = ["dep:base-common-rpc-types"]
