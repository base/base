[package]
name = "reth-stages"
description = "Staged syncing primitives used in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rayon = { workspace = true }
reth-etl = { workspace = true }
page_size = { workspace = true }
reth-exex = { workspace = true }
thiserror = { workspace = true }
reth-prune = { workspace = true }
reth-config = { workspace = true }
futures-util = { workspace = true }
alloy-hardforks = { workspace = true }
reth-stages-api = { workspace = true }
reth-primitives-traits = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-state-api = { workspace = true }
base-execution-state-types = {workspace = true}
base-common-runtime-tasks = { workspace = true }
base-execution-state-memory = {workspace = true}
base-execution-evm-runtime = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
eyre = { workspace = true, features = ["default"] }
base-execution-state-provider = { workspace = true }
reth-trie = { workspace = true, features = ["metrics"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
num-traits = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["attributes"] }
reth-testing-utils = { workspace = true, optional = true }
reth-network-p2p = { workspace = true, features = ["default"] }
base-common-types-chain = { workspace = true, features = ["reth"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-execution-evm-blocks = {features = ["metrics"], workspace = true}
tempfile = { workspace = true, optional = true, features = ["default"] }
base-execution-state-database = {workspace = true, features = ["default", "mdbx"]}

[dev-dependencies]
paste = { workspace = true }
alloy-eips = { workspace = true }
alloy-genesis = { workspace = true }
assert_matches = { workspace = true }
reth-db-common = { workspace = true }
reth-static-file = { workspace = true }
reth-testing-utils = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-state-api = { workspace = true }
base-execution-network-types = { workspace = true }
rand = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
reth-trie = { workspace = true, features = ["test-utils"] }
reth-stages-api = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
base-execution-evm-blocks = {features = ["test-utils"], workspace = true}
reth-network-p2p = { workspace = true, features = ["default", "test-utils"] }
reth-downloaders = { workspace = true, features = ["default", "file-client"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
base-execution-state-database = { workspace = true, features = ["test-utils", "mdbx"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "getrandom", "rand"] }

[features]
test-utils = [
    "reth-network-p2p/test-utils",
    "base-execution-state-database/test-utils",
    "base-execution-state-provider/test-utils",
    "reth-stages-api/test-utils",
    "dep:reth-testing-utils",
    "dep:tempfile",
    "base-execution-evm-blocks/test-utils",
    "reth-downloaders/test-utils",
    "reth-primitives-traits/test-utils",
    "base-common-types-chain/test-utils",
    "reth-trie/test-utils",
    "base-execution-state-types/test-utils",
    "base-common-runtime-tasks/test-utils",
    "base-execution-state-memory/test-utils",
]
