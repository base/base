[package]
name = "revmc-llvm"
description = "EVM bytecode compiler LLVM backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
revmc-backend = { workspace = true }
tracing = { workspace = true, features = ["default"] }
object = { workspace = true, features = ["read_core", "elf"] }
inkwell = { workspace = true, features = ["default", "llvm22-1"] }
alloy-primitives = { workspace = true, features = ["std", "map-fxhash"] }
[build-dependencies]
cc = { workspace = true }
[features]
prefer-static = ["inkwell/llvm22-1-prefer-static"]
prefer-dynamic = ["inkwell/llvm22-1-prefer-dynamic"]
