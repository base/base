[package]
name = "reth-rpc-eth-api"
description = "Reth RPC 'eth' namespace API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
auto_impl = { workspace = true }
dyn-clone = { workspace = true }
alloy-eips = { workspace = true }
alloy-serde = { workspace = true }
async-trait = { workspace = true }
reth-network = { workspace = true }
alloy-eip2124 = { workspace = true }
alloy-network = { workspace = true }
reth-node-api = { workspace = true }
alloy-json-rpc = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-consensus = { workspace = true }
reth-storage-api = { workspace = true }
reth-prune-types = { workspace = true }
reth-chain-state = { workspace = true }
reth-network-api = { workspace = true }
reth-storage-errors = {workspace = true}
reth-rpc-eth-types = { workspace = true }
base-execution-evm = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-rpc-types-mev = { workspace = true }
reth-execution-errors = {workspace = true}
reth-transaction-pool = { workspace = true }
reth-rpc-server-types = { workspace = true }
base-execution-chainspec = { workspace = true }
futures = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
reth-tasks = { workspace = true, features = ["rayon"] }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
tracing = { workspace = true, features = ["attributes"] }
parking_lot = { workspace = true, features = ["default"] }
revm-inspectors = { workspace = true, features = ["default"] }
reth-trie-common = { workspace = true, features = ["eip1186"] }
reth-rpc-convert = { workspace = true, features = ["default"] }
base-common-rpc-types = { workspace = true, features = ["reth"] }
base-common-consensus = { workspace = true, features = ["reth"] }
jsonrpsee = { workspace = true, features = ["server", "macros"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
alloy-dyn-abi = { workspace = true, features = ["default", "eip712"] }
alloy-evm = { workspace = true, features = ["overrides", "call-util"] }
reth-primitives-traits = { workspace = true, features = ["rpc-compat"] }
revm = { workspace = true, features = ["optional_block_gas_limit", "optional_eip3607", "optional_no_base_fee", "optional_fee_charge", "memory_limit"] }

[features]
js-tracer = ["revm-inspectors/js-tracer", "reth-rpc-eth-types/js-tracer"]
client = ["jsonrpsee/client", "jsonrpsee/async-client"]
