[package]
name = "reth-engine-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
alloy-eips = { workspace = true }
reth-chain-state = { workspace = true }
reth-primitives-traits = { workspace = true }
base-execution-evm-blocks = { workspace = true}
base-execution-evm-runtime = {workspace = true}
base-execution-state-types = {workspace = true}
tokio = { workspace = true, features = ["sync"], optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-common-types-payload = {workspace = true, features = ["serde"]}
futures = { workspace = true, optional = true, features = ["default"] }
base-execution-payload-types = { workspace = true, features = ["default"] }

[dev-dependencies]
alloy-primitives = { workspace = true, features = ["map-foldhash", "getrandom"] }

[features]
test-utils = ["std"]
default = ["std"]
trie-debug = []
std = [
    "base-execution-evm-runtime/std",
    "base-execution-state-types/std",
    "reth-primitives-traits/std",
    "alloy-primitives/std",
    "base-common-types-payload/std",
    "alloy-eips/std",
    "futures/std",
    "tokio",
    "thiserror/std",
    "base-execution-evm-blocks/std",
]
