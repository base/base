[package]
name = "reth-engine-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
base-evm-handler = {workspace = true}
reth-trie-common = { workspace = true }
reth-chain-state = { workspace = true }
reth-storage-errors = {workspace = true}
reth-execution-types = { workspace = true }
reth-primitives-traits = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
base-execution-consensus = {workspace = true}
base-execution-evm = { workspace = true, optional = true }
base-common-consensus = { workspace = true, features = ["reth"] }
tokio = { workspace = true, features = ["sync"], optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
futures = { workspace = true, optional = true, features = ["default"] }
base-common-rpc-types-engine = { workspace = true, features = ["serde"] }
base-execution-payload-types = { workspace = true, features = ["default"], optional = false}
[dev-dependencies]
alloy-primitives = { workspace = true, features = ["map-foldhash", "getrandom"] }

[features]
test-utils = ["std"]
default = ["std"]
trie-debug = []
std = [
    "dep:base-execution-evm",
    "base-evm-handler/std",
    "reth-execution-types/std",
    "reth-primitives-traits/std",
    "reth-trie-common/std",
    "alloy-primitives/std",
    "base-common-consensus/std",
    "alloy-rpc-types-engine/std",
    "alloy-eips/std",
    "futures/std",
    "tokio",
    "serde/std",
    "thiserror/std",
    "base-execution-evm?/std",
]
