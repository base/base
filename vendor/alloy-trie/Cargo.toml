[package]
name = "alloy-trie"
description = """
Fast Merkle-Patricia Trie (MPT) state root calculator
and proof generator for prefix-sorted nibbles
"""
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[lib]
name = "alloy_trie"
path = "src/lib.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false
required-features = ["arbitrary"]

[dependencies]
nybbles = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
arbitrary = { workspace = true, optional = true }
derive_arbitrary = { workspace = true, optional = true }
smallvec = { workspace = true, features = ["const_new"] }
proptest-derive_0_7_0 = { workspace = true, optional = true }
proptest = { workspace = true, optional = true, features = ["default"] }
alloy-primitives = { workspace = true, features = [
    "rlp",
    "map",
] }
serde = { workspace = true, features = [
    "derive",
    "rc",
], optional = true }
alloy-rlp = { workspace = true, features = [
    "derive",
    "arrayvec",
    "core-net",
    "core-error",
] }
derive_more = { workspace = true, features = [
    "add",
    "add_assign",
    "deref",
    "from",
    "not",
] }
[dev-dependencies]
hash-db = { workspace = true, features = ["default"] }
triehash = { workspace = true, features = ["default"] }
plain_hasher = { workspace = true, features = ["default"] }
codspeed-criterion-compat = { workspace = true, features = ["default"] }
[lints]
workspace = true

[features]
arbitrary = ["std", "dep:arbitrary", "dep:derive_arbitrary", "dep:proptest", "dep:proptest-derive_0_7_0", "alloy-primitives/arbitrary", "nybbles/arbitrary"]
default = ["std", "alloy-primitives/default"]
ethereum = []
serde = ["dep:serde", "alloy-primitives/serde", "nybbles/serde"]
std = ["alloy-primitives/std", "alloy-rlp/std", "derive_more/std", "nybbles/std", "thiserror/std", "tracing/std", "serde?/std"]
