[package]
name = "reth-rpc-e2e-tests"
description = "RPC end-to-end tests including execution-apis compatibility testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
jsonrpsee = { workspace = true }
futures-util = { workspace = true }
reth-node-api = { workspace = true }
reth-e2e-test-utils = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
eyre = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
tracing = { workspace = true, features = ["attributes"] }
reth-rpc-api = { workspace = true, features = ["client"] }
[dev-dependencies]
alloy-genesis = { workspace = true }
reth-chainspec = { workspace = true }
reth-tracing = { workspace = true, features = ["default"] }
reth-node-ethereum = { workspace = true, features = ["default"] }
[[test]]
name = "e2e_testsuite"
path = "tests/e2e-testsuite/main.rs"
