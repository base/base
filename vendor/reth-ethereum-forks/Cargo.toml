[package]
name = "reth-ethereum-forks"
description = "Ethereum fork types used in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
auto_impl = { workspace = true }
alloy-eip2124 = { workspace = true }
alloy-hardforks = { workspace = true }
rustc-hash = { workspace = true, optional = true }
once_cell = { workspace = true, features = ["critical-section"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash", "serde", "rlp"] }
[dev-dependencies]
arbitrary = { workspace = true, features = ["derive"] }
[features]
default = ["std", "serde", "rustc-hash"]
arbitrary = [
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-eip2124/arbitrary",
]
serde = [
    "alloy-primitives/serde",
    "alloy-eip2124/serde",
    "alloy-hardforks/serde",
]
std = [
    "alloy-primitives/std",
    "rustc-hash/std",
    "alloy-eip2124/std",
    "once_cell/std",
]
rustc-hash = ["dep:rustc-hash"]
