[package]
name = "alloy-rpc-types-beacon"
description = "Types for the Ethereum Beacon Node API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_rpc_types_beacon"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
derive_more = { workspace = true }
alloy-primitives = { workspace = true }
ethereum_ssz = { workspace = true, optional = true }
alloy-eips = { workspace = true, features = ["serde"] }
serde_json = { workspace = true, features = ["alloc"] }
tree_hash_derive = { workspace = true, optional = true }
ethereum_ssz_derive = { workspace = true, optional = true }
alloy-rpc-types-engine = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = [
    "derive",
    "alloc",
] }
tree_hash = { workspace = true, optional = true, features = ["default"] }
serde_with = { workspace = true, features = [
    "macros",
    "alloc",
] }
[dev-dependencies]
similar-asserts = { workspace = true, features = ["default"] }
[lints]
workspace = true

[features]
sha2 = ["alloy-eips/sha2"]
ssz = [
    "dep:ethereum_ssz",
    "dep:ethereum_ssz_derive",
    "dep:tree_hash",
    "dep:tree_hash_derive",
    "alloy-rpc-types-engine/ssz",
    "alloy-eips/ssz",
]
