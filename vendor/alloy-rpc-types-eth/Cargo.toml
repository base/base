[package]
name = "alloy-rpc-types-eth"
description = "Types for the `eth` Ethereum JSON-RPC namespace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_rpc_types_eth"
path = "src/lib.rs"

[dependencies]
itertools = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-consensus = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-consensus-any = { workspace = true }
alloy-network-primitives = { workspace = true }
alloy-serde = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["alloc"], optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
serde_with = { workspace = true, features = ["macros"], optional = true }
alloy-primitives = { workspace = true, features = [
    "rlp",
    "map",
] }
alloy-rlp = { workspace = true, features = [
    "arrayvec",
    "derive",
] }
serde = { workspace = true, features = [
    "derive",
    "alloc",
    "derive",
], optional = true }
[dev-dependencies]
assert_matches_1_5 = { workspace = true }
rand_08 = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
similar-asserts = { workspace = true, features = ["default"] }
bincode = { workspace = true, features = ["default", "serde"] }
alloy-eips = { workspace = true, features = [
    "arbitrary",
    "k256",
] }
alloy-consensus = { workspace = true, features = [
    "std",
    "arbitrary",
] }
alloy-primitives = { workspace = true, features = [
    "rand",
    "rlp",
    "serde",
    "arbitrary",
] }
[lints]
workspace = true

[features]
arbitrary = ["std", "dep:arbitrary", "alloy-consensus/arbitrary", "alloy-primitives/arbitrary", "alloy-serde?/arbitrary", "alloy-eips/arbitrary", "alloy-consensus-any/arbitrary", "alloy-sol-types/arbitrary"]
default = ["std", "serde"]
k256 = ["alloy-consensus/k256", "alloy-eips/k256", "alloy-primitives/k256"]
serde = ["dep:serde", "dep:serde_json", "dep:alloy-serde", "alloy-primitives/serde", "alloy-consensus/serde", "alloy-eips/serde", "alloy-consensus-any/serde", "rand_08/serde", "alloy-network-primitives/serde"]
serde-bincode-compat = ["serde", "dep:serde_with", "alloy-eips/serde-bincode-compat", "alloy-consensus/serde-bincode-compat"]
std = ["alloy-primitives/std", "alloy-consensus/std", "alloy-eips/std", "alloy-consensus-any/std", "alloy-network-primitives/std", "alloy-serde?/std", "alloy-rlp/std", "alloy-sol-types/std", "serde?/std", "serde_json?/std", "serde_with?/std", "thiserror/std"]
