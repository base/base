[package]
name = "reth-codecs"
description = "Compact codec trait and implementations for Ethereum types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[lib]
name = "reth_codecs"
path = "src/lib.rs"

[dependencies]
bytes = { workspace = true }
serde = { workspace = true }
modular-bitfield = { workspace = true }
reth-codecs-derive = { workspace = true }
alloy-trie = { workspace = true, optional = true }
visibility = { workspace = true, optional = true }
alloy-genesis = { workspace = true, optional = true }
alloy-consensus = { workspace = true, optional = true }
reth-zstd-compressors = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
alloy-eips = { workspace = true, features = ["serde"], optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
parity-scale-codec = { workspace = true, features = ["default", "bytes"], optional = true }
[dev-dependencies]
test-fuzz = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
rstest = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
proptest = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
alloy-consensus = { workspace = true, features = ["arbitrary"] }
alloy-eips = { workspace = true, features = [
    "arbitrary",
    "serde",
] }
alloy-primitives = { workspace = true, features = [
    "map-foldhash",
    "arbitrary",
    "serde",
    "rand",
] }
[lints]
workspace = true

[features]
alloy = [
    "dep:alloy-consensus",
    "dep:alloy-eips",
    "dep:alloy-genesis",
    "dep:alloy-trie",
    "dep:reth-zstd-compressors",
]
arbitrary = [
    "alloy-consensus?/arbitrary",
    "alloy-eips?/arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-trie?/arbitrary",
]
default = [
    "std",
    "alloy",
]
serde = [
    "alloy-consensus?/serde",
    "alloy-eips?/serde",
    "alloy-primitives/serde",
    "alloy-trie?/serde",
    "bytes/serde",
]
std = [
    "alloy-primitives/std",
    "bytes/std",
    "alloy-consensus?/std",
    "alloy-eips?/std",
    "alloy-genesis?/std",
    "alloy-trie?/std",
    "serde/std",
    "reth-zstd-compressors?/std",
    "dep:parity-scale-codec",
]
test-utils = [
    "std",
    "alloy",
    "arbitrary",
    "dep:visibility",
    "dep:arbitrary",
]
