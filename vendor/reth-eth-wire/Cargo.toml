[package]
name = "reth-eth-wire"
description = "Implements the eth/64 and eth/65 P2P protocols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
snap = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
reth-ecies = { workspace = true }
pin-project = { workspace = true }
alloy-chains = { workspace = true }
alloy-eip2124 = { workspace = true }
reth-network-peers = { workspace = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, optional = true }
base-common-types-chain = { workspace = true }
futures = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
tracing = { workspace = true, features = ["attributes"] }
tokio-stream = { workspace = true, features = ["default"] }
reth-eth-wire-types = { workspace = true, features = ["default"] }
alloy-rlp = { workspace = true, features = ["core-net", "derive"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
tokio-util = { workspace = true, features = ["default", "codec", "io"] }
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
base-common-observability-metrics = { workspace = true, features = ["metrics"]}

[dev-dependencies]
serde = { workspace = true }
test-fuzz = { workspace = true }
alloy-eips = { workspace = true }
async-stream = { workspace = true }
base-common-types-chain = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
rand = { workspace = true, features = ["default"] }
rand_08 = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
proptest = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
reth-primitives-traits = { workspace = true, features = ["arbitrary"] }
reth-eth-wire-types = { workspace = true, features = ["default", "arbitrary"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "std"] }

[[test]]
name = "fuzz_roundtrip"
path = "tests/fuzz_roundtrip.rs"
required-features = ["arbitrary", "serde"]

[features]
arbitrary = [
    "reth-eth-wire-types/arbitrary",
    "dep:arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "base-common-types-chain/arbitrary",
    "alloy-chains/arbitrary",
    "reth-primitives-traits/arbitrary",
]
serde = [
    "dep:serde",
    "reth-eth-wire-types/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bytes/serde",
    "rand/serde",
    "secp256k1/serde",
    "base-common-types-chain/serde",
    "alloy-chains/serde",
    "reth-primitives-traits/serde",
    "rand_08/serde",
]
