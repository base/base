[package]
name = "alloy-transport-http"
description = "HTTP transport implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_transport_http"
path = "src/lib.rs"

[dependencies]
itertools = { workspace = true }
alloy-transport = { workspace = true }
url = { workspace = true, features = ["default"] }
alloy-json-rpc = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"], optional = true }
tracing = { workspace = true, optional = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"], optional = true }
[target.'cfg(not(all(target_os = "wasi", target_env = "p1")))'.dependencies]
reqwest = { workspace = true, features = ["json"], optional = true }
[target.'cfg(not(target_family = "wasm"))'.dependencies]
hyper = { workspace = true, optional = true }
hyper-tls = { workspace = true, optional = true }
alloy-rpc-types-engine = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true, features = ["default"] }
http-body-util = { workspace = true, optional = true, features = ["default"] }
hyper-util = { workspace = true, features = ["default", "full"], optional = true }
opentelemetry_0_31_0 = { workspace = true, optional = true, features = ["default"] }
tracing-opentelemetry = { workspace = true, optional = true, features = ["default"] }
opentelemetry-http_0_31_0 = { workspace = true, optional = true, features = ["default"] }
[lints]
workspace = true

[features]
default = ["reqwest", "reqwest-default-tls", "traceparent"]
hyper = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:alloy-json-rpc", "dep:serde_json", "dep:tower", "dep:tracing", "hyper-tls"]
hyper-tls = ["hyper", "dep:hyper-tls"]
jwt-auth = ["hyper", "dep:alloy-rpc-types-engine", "alloy-rpc-types-engine/jwt-aws-lc-rs", "alloy-rpc-types-engine/serde", "dep:jsonwebtoken"]
reqwest = ["dep:reqwest", "dep:alloy-json-rpc", "dep:serde_json", "dep:tower", "dep:tracing"]
reqwest-default-tls = ["reqwest?/default-tls"]
reqwest-native-tls = ["reqwest?/native-tls"]
reqwest-rustls-tls = ["reqwest?/rustls"]
traceparent = ["dep:tower", "dep:tracing", "dep:alloy-json-rpc", "dep:opentelemetry-http_0_31_0", "dep:opentelemetry_0_31_0", "dep:tracing-opentelemetry"]
