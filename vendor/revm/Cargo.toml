[package]
name = "revm"
description = "Revm - Rust Ethereum Virtual Machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[lib]
name = "revm"
path = "src/lib.rs"

[dependencies]
revm-state = { workspace = true }
revm-context = { workspace = true }
revm-handler = { workspace = true }
revm-bytecode = { workspace = true }
revm-database = { workspace = true }
revm-inspector = { workspace = true }
revm-precompile = { workspace = true }
revm-primitives = { workspace = true }
revm-interpreter = { workspace = true }
revm-context-interface = { workspace = true }
revm-database-interface = { workspace = true }
[dev-dependencies]
serde = { workspace = true, features = [
    "derive",
    "rc",
    "derive",
] }
serde_json = { workspace = true, features = [
    "alloc",
    "preserve_order",
] }
[lints]
workspace = true

[features]
alloydb = ["revm-database/alloydb"]
arbitrary = ["revm-primitives/arbitrary"]
asm-keccak = ["revm-primitives/asm-keccak"]
asyncdb = ["revm-database-interface/asyncdb"]
blst = ["revm-precompile/blst"]
bn = ["revm-precompile/bn"]
c-kzg = ["revm-precompile/c-kzg"]
default = ["std", "secp256k1", "portable", "tracer", "c-kzg", "blst"]
dev = ["memory_limit", "optional_balance_check", "optional_block_gas_limit", "optional_eip3541", "optional_eip3607", "optional_eip7623", "optional_no_base_fee"]
gmp = ["revm-precompile/gmp"]
hashbrown = ["revm-interpreter/hashbrown", "revm-precompile/hashbrown"]
map-foldhash = ["revm-primitives/map-foldhash"]
memory_limit = ["revm-context/memory_limit", "revm-interpreter/memory_limit"]
optional_balance_check = ["revm-context/optional_balance_check"]
optional_block_gas_limit = ["revm-context/optional_block_gas_limit"]
optional_eip3541 = ["revm-context/optional_eip3541"]
optional_eip3607 = ["revm-context/optional_eip3607"]
optional_eip7623 = ["revm-context/optional_eip7623"]
optional_fee_charge = ["revm-context/optional_fee_charge"]
optional_no_base_fee = ["revm-context/optional_no_base_fee"]
optional_priority_fee_check = ["revm-context/optional_priority_fee_check"]
p256-aws-lc-rs = ["revm-precompile/p256-aws-lc-rs"]
parse = ["revm-bytecode/parse"]
portable = ["revm-precompile/portable"]
secp256k1 = ["revm-precompile/secp256k1"]
serde = ["revm-interpreter/serde", "revm-database-interface/serde", "revm-primitives/serde", "revm-handler/serde", "revm-context-interface/serde", "revm-bytecode/serde", "revm-context/serde", "revm-database/serde", "revm-inspector/serde", "revm-state/serde"]
serde-json = ["serde", "revm-inspector/tracer"]
sha3-keccak = ["revm-primitives/sha3-keccak"]
std = ["revm-interpreter/std", "revm-precompile/std", "revm-handler/std", "revm-context/std", "revm-context-interface/std", "revm-bytecode/std", "revm-database/std", "revm-database-interface/std", "revm-inspector/std", "revm-primitives/std", "revm-state/std", "serde/std", "serde_json/std"]
tracer = ["revm-inspector/tracer"]
