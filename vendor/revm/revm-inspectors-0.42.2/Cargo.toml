[package]
edition = "2021"
rust-version = "1.94"
name = "revm-inspectors"
version = "0.42.2"
build = false
exclude = [
    ".github",
    "scripts",
    "testdata",
    "tests",
    "cliff.toml",
    "deny.toml",
    "release.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Revm inspector implementations"
homepage = "https://github.com/paradigmxyz/revm-inspectors"
readme = "README.md"
keywords = [
    "ethereum",
    "evm",
    "inspectors",
    "tracing",
    "debugging",
]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/paradigmxyz/revm-inspectors"

[features]
default = ["std"]
js-tracer = [
    "dep:boa_engine",
    "dep:boa_gc",
]
serde = [
    "dep:serde",
    "revm/serde",
]
std = [
    "alloy-primitives/std",
    "anstyle/std",
    "serde/std",
    "serde_json/std",
    "revm/std",
    "thiserror/std",
]

[lib]
name = "revm_inspectors"
path = "src/lib.rs"

[[bench]]
name = "js_tracer"
path = "benches/js_tracer.rs"
harness = false

[dependencies.alloy-primitives]
version = "1.4"
features = ["map"]
default-features = false

[dependencies.alloy-rpc-types-eth]
version = "2.0"
default-features = false

[dependencies.alloy-rpc-types-trace]
version = "2.0"
default-features = false

[dependencies.alloy-sol-types]
version = "1.4"
default-features = false

[dependencies.anstyle]
version = "1.0"
optional = true

[dependencies.boa_engine]
version = "0.21"
optional = true

[dependencies.boa_gc]
version = "0.21"
optional = true

[dependencies.colorchoice]
version = "1.0"

[dependencies.revm]
version = "42.0.1"
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0"
features = ["alloc"]
default-features = false

[dependencies.thiserror]
version = "2.0"
default-features = false

[dev-dependencies.alloy-hardforks]
version = "0.4"

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.snapbox]
version = "1.2"
features = ["term-svg"]

[lints.clippy]
lint_groups_priority = "allow"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.rustdoc]
all = "warn"
