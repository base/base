[package]
name = "reth-rpc-builder"
description = "Helpers for configuring RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
metrics = { workspace = true }
dyn-clone = { workspace = true }
thiserror = { workspace = true }
pin-project = { workspace = true }
reth-network = { workspace = true }
reth-provider = { workspace = true }
reth-node-core = { workspace = true }
reth-rpc-layer = { workspace = true }
base-node-context = { workspace = true }
base-execution-rpc = { workspace = true }
reth-rpc-eth-types = { workspace = true }
base-common-network = { workspace = true }
reth-rpc-server-types = { workspace = true }
reth-engine-primitives = { workspace = true }
reth-primitives-traits = { workspace = true }
base-execution-evm-blocks = {workspace = true}
base-common-chain-config = { workspace = true }
base-common-runtime-tasks = { workspace = true }
tower = { workspace = true, features = ["full"] }
http = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive"] }
jsonrpsee = { workspace = true, features = ["server"] }
reth-tasks = { workspace = true, features = ["rayon"] }
tracing = { workspace = true, features = ["attributes"] }
reth-metrics = { workspace = true, features = ["common"] }
tower-http = { workspace = true, features = ["default", "full"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["default", "codec"] }
alloy-provider = { workspace = true, features = ["reqwest", "debug-api", "ws"] }

[dev-dependencies]
alloy-eips = { workspace = true }
reth-network-peers = { workspace = true }
base-common-types-rpc = {workspace = true}
base-common-types-payload = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
reth-tracing = { workspace = true, features = ["default"] }
reth-tasks = { workspace = true, features = ["test-utils"] }
clap = { workspace = true, features = ["default", "derive"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
reth-provider = { workspace = true, features = ["test-utils"] }
base-common-types-chain = { workspace = true, features = ["serde"]}
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-execution-txpool = { workspace = true, features = ["test-utils"] }
reth-engine-primitives = { workspace = true, features = ["test-utils"] }
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }
base-execution-rpc = { workspace = true, features = ["test-utils", "client"] }
base-execution-payload-builder = { workspace = true, features = ["test-utils"] }
