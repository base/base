[package]
name = "reth-rpc-builder"
description = "Helpers for configuring RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
metrics = { workspace = true }
reth-ipc = { workspace = true }
reth-rpc = { workspace = true }
thiserror = { workspace = true }
dyn-clone = { workspace = true }
pin-project = { workspace = true }
reth-rpc-api = { workspace = true }
alloy-network = { workspace = true }
reth-node-core = { workspace = true }
reth-rpc-layer = { workspace = true }
reth-tokio-util = { workspace = true }
reth-storage-api = { workspace = true }
reth-network-api = { workspace = true }
reth-rpc-eth-api = { workspace = true }
reth-chain-state = { workspace = true }
reth-rpc-eth-types = { workspace = true }
base-execution-evm = { workspace = true }
reth-rpc-engine-api = { workspace = true }
reth-rpc-server-types = { workspace = true }
base-execution-txpool = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-engine-primitives = { workspace = true }
base-execution-chainspec = { workspace = true }
base-execution-consensus = { workspace = true }
tower = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
http = { workspace = true, features = ["default"] }
reth-tasks = { workspace = true, features = ["rayon"] }
jsonrpsee = { workspace = true, features = ["server"] }
tracing = { workspace = true, features = ["attributes"] }
reth-metrics = { workspace = true, features = ["common"] }
base-common-rpc-types = { workspace = true, features = ["reth"] }
base-common-consensus = { workspace = true, features = ["reth"] }
tower-http = { workspace = true, features = ["default", "full"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["default", "codec"] }
alloy-provider = { workspace = true, features = ["reqwest", "debug-api", "ws", "ipc"] }
[dev-dependencies]
alloy-eips = { workspace = true }
reth-network-peers = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-rpc-types-trace = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
reth-rpc = { workspace = true, features = ["test-utils"] }
reth-rpc-api = { workspace = true, features = ["client"] }
alloy-consensus = { workspace = true, features = ["serde"]}
reth-tracing = { workspace = true, features = ["default"] }
reth-tasks = { workspace = true, features = ["test-utils"] }
clap = { workspace = true, features = ["default", "derive"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
reth-provider = { workspace = true, features = ["test-utils"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-execution-evm = { workspace = true, features = ["test-utils"] }
base-execution-txpool = { workspace = true, features = ["test-utils"] }
reth-engine-primitives = { workspace = true, features = ["test-utils"] }
base-execution-payload-builder = { workspace = true, features = ["test-utils"] }
