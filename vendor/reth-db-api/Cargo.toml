[package]
name = "reth-db-api"
description = "Database abstraction used in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
serde = { workspace = true }
metrics = { workspace = true }
arrayvec = { workspace = true }
modular-bitfield = { workspace = true }
reth-storage-errors = { workspace = true }
roaring = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
base-common-types-chain = { workspace = true, features = ["serde"]}
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
proptest = { workspace = true, optional = true, features = ["default"] }
reth-stages-types = { workspace = true, features = ["serde", "reth-codec"] }
reth-primitives-traits = { workspace = true, features = ["serde", "reth-codec"] }
base-execution-state-types = {features = ["reth-codec", "serde"], workspace = true}

[dev-dependencies]
test-fuzz = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
rand = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
proptest = { workspace = true, features = ["default"] }
base-common-types-chain = { workspace = true, features = ["test-utils"] }
base-execution-state-types = { workspace = true, features = ["arbitrary"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }

[features]
test-utils = [
    "arbitrary",
    "reth-primitives-traits/test-utils",
    "base-common-types-chain/test-utils",
    "base-execution-state-types/test-utils",
    "reth-stages-types/test-utils",
]
arbitrary = [
    "base-execution-state-types/arbitrary",
    "dep:arbitrary",
    "dep:proptest",
    "reth-primitives-traits/arbitrary",
    "alloy-primitives/arbitrary",
    "base-common-types-chain/arbitrary",
    "reth-stages-types/arbitrary",
]
