[package]
name = "revmc-builtins"
description = "EVM bytecode compiler builtins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
paste = { workspace = true }
revmc-context = { workspace = true }
revm-primitives = { workspace = true }
revm-interpreter = { workspace = true }
revm-context-interface = { workspace = true }
revmc-backend = { workspace = true, optional = true }
revm-bytecode = { workspace = true, features = ["parse"] }
tracing = { workspace = true, optional = true, features = ["default"] }
[features]
default = ["std", "ir"]
std = ["revmc-context/std", "revm-primitives/std", "revm-interpreter/std"]
ir = ["std", "dep:tracing", "dep:revmc-backend"]
