[package]
name = "revm-precompile"
description = "Revm Precompiles - Ethereum compatible precompiled contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[lib]
name = "revm_precompile"
path = "src/lib.rs"

[dependencies]
ark-ec = { workspace = true }
cfg-if = { workspace = true }
ripemd = { workspace = true }
arrayref = { workspace = true }
sha2_0_11_0 = { workspace = true }
ark-serialize = { workspace = true }
aurora-engine-modexp = { workspace = true }
ark-ff = { workspace = true, features = ["asm"] }
base-execution-evm-machine = { workspace = true }
k256 = { workspace = true, features = ["ecdsa"] }
p256 = { workspace = true, features = ["ecdsa"] }
base-execution-evm-primitives = { workspace = true }
gmp-mpfr-sys = { workspace = true, optional = true }
substrate-bn = { workspace = true, optional = true }
ark-bls12-381 = { workspace = true, features = ["curve"] }
ark-bn254_0_6_0 = { workspace = true, features = ["curve"] }
blst = { workspace = true, optional = true, features = ["default"] }
aws-lc-rs = { workspace = true, features = ["aws-lc-sys"], optional = true }
c-kzg = { workspace = true, features = ["ethereum_kzg_settings"], optional = true }
secp256k1_0_31_1 = { workspace = true, features = [
    "alloc",
    "recovery",
    "rand",
    "global-context",
], optional = true }

[dev-dependencies]
ark-std = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
rstest = { workspace = true, features = ["default"] }
rand_0_10_2 = { workspace = true, features = ["default", "std"] }
codspeed-criterion-compat_5_0 = { workspace = true, features = ["default"] }

[lints]
workspace = true

[features]
asm-keccak = ["base-execution-evm-primitives/asm-keccak"]
blst = ["dep:blst"]
bn = ["dep:substrate-bn"]
c-kzg = ["dep:c-kzg"]
default = [
    "std",
    "secp256k1",
    "blst",
    "c-kzg",
    "portable",
]
gmp = ["dep:gmp-mpfr-sys"]
hashbrown = ["base-execution-evm-primitives/hashbrown"]
p256-aws-lc-rs = ["dep:aws-lc-rs"]
portable = ["c-kzg?/portable", "blst?/portable"]
secp256k1 = ["dep:secp256k1_0_31_1"]
std = [
    "base-execution-evm-primitives/std",
    "base-execution-evm-machine/std",
    "k256/std",
    "c-kzg?/std",
    "secp256k1_0_31_1?/std",
    "ark-bn254_0_6_0/std",
    "ark-bls12-381/std",
    "aurora-engine-modexp/std",
    "ark-ec/std",
    "ark-ff/std",
    "ark-serialize/std",
    "ark-std/std",
    "p256/std",
]
