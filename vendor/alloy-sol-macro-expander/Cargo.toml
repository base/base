[package]
name = "alloy-sol-macro-expander"
description = "Expander used in the Solidity to Rust procedural macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_sol_macro_expander"
path = "src/lib.rs"

[dependencies]
heck = { workspace = true }
sha3_0_11_0 = { workspace = true }
alloy-sol-macro-input = { workspace = true }
quote = { workspace = true, features = ["default"] }
alloy-json-abi = { workspace = true, optional = true }
indexmap = { workspace = true, features = ["default"] }
proc-macro2 = { workspace = true, features = ["default"] }
proc-macro-error3 = { workspace = true, features = ["default"] }
syn = { workspace = true, features = ["default", "extra-traits"] }
const-hex = { workspace = true, features = [
    "alloc",
    "core-error",
] }
syn-solidity = { workspace = true, features = [
    "visit",
    "visit-mut",
] }
[lints]
workspace = true

[features]
json = ["dep:alloy-json-abi", "alloy-sol-macro-input/json"]
