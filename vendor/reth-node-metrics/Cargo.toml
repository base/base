[package]
name = "reth-node-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
metrics = { workspace = true }
metrics-util = { workspace = true }
reth-metrics = { workspace = true }
jsonrpsee-server = { workspace = true }
base-common-runtime-tasks = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
eyre = { workspace = true, features = ["default"] }
http = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["attributes"] }
http-body-util = { workspace = true, features = ["default"] }
metrics-process = { workspace = true, features = ["default"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }

[target.'cfg(unix)'.dependencies]
mappings = { workspace = true, optional = true }
pprof_util = { workspace = true, optional = true }
reth-fs-util = { workspace = true, optional = true }
jemalloc_pprof = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true, features = ["default"] }
tikv-jemalloc-ctl = { workspace = true, features = ["default", "stats"], optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { workspace = true, features = ["default"] }
[dev-dependencies]
socket2 = { workspace = true }

[lints]
workspace = true

[features]
jemalloc = ["dep:tikv-jemalloc-ctl"]
jemalloc-prof = [
    "jemalloc",
    "dep:jemalloc_pprof",
    "dep:mappings",
    "dep:pprof_util",
    "dep:reth-fs-util",
    "dep:tempfile",
]
jemalloc-symbols = ["jemalloc-prof", "jemalloc_pprof?/symbolize"]
