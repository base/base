secp256k1 = { workspace = true, features = ["global-context", "recovery", "std"] }
tokio = { workspace = true, features = ["sync", "macros", "time", "rt-multi-thread"] }
[dev-dependencies]
reth-ethereum-primitives = { workspace = true }
tempfile = { workspace = true, features = ["default"] }
reth-evm = { workspace = true, features = ["test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-payload-builder = { workspace = true, features = ["test-utils"] }
reth-engine-primitives = { workspace = true, features = ["test-utils"] }
[features]
default = []
js-tracer = [
    "reth-rpc/js-tracer",
    "reth-rpc-eth-types/js-tracer",
]
test-utils = [
    "reth-db/test-utils",
    "reth-chain-state/test-utils",
    "reth-consensus/test-utils",
    "reth-engine-tree/test-utils",
    "reth-evm/test-utils",
    "reth-downloaders/test-utils",
    "reth-network/test-utils",
    "reth-network-p2p/test-utils",
    "reth-payload-builder/test-utils",
    "reth-stages/test-utils",
    "reth-db-api/test-utils",
    "reth-provider/test-utils",
    "reth-transaction-pool/test-utils",
    "reth-primitives-traits/test-utils",
    "reth-tasks/test-utils",
]
trie-debug = [
    "reth-engine-tree/trie-debug",
    "reth-engine-primitives/trie-debug",
    "reth-node-core/trie-debug",
]
