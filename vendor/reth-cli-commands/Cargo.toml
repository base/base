[package]
name = "reth-cli-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
lz4 = { workspace = true }
url = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
fdlimit = { workspace = true }
metrics = { workspace = true }
humantime = { workspace = true }
itertools = { workspace = true }
reth-exex = { workspace = true }
alloy-eips = { workspace = true }
reth-stages = { workspace = true }
alloy-chains = { workspace = true }
reth-cli-util = { workspace = true }
base-cli-utils = { workspace = true }
reth-node-core = { workspace = true }
alloy-hardforks = { workspace = true }
reth-node-events = { workspace = true }
reth-node-metrics = { workspace = true }
base-common-io-files = { workspace = true }
reth-primitives-traits = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-state-api = { workspace = true }
base-common-runtime-tasks = { workspace = true }
base-execution-state-memory = {workspace = true}
tokio = { workspace = true, features = ["net"] }
arbitrary = { workspace = true, optional = true }
base-execution-evm-runtime = { workspace = true }
base-execution-network-discv5 = {workspace = true}
socket2 = { workspace = true, features = ["all"] }
tar = { workspace = true, features = ["default"] }
eyre = { workspace = true, features = ["default"] }
zstd = { workspace = true, features = ["default"] }
base-execution-state-provider = { workspace = true }
base-execution-state-maintenance = {workspace = true}
blake3 = { workspace = true, features = ["default"] }
base-common-observability-metrics = {workspace = true}
futures = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
crossterm = { workspace = true, features = ["default"] }
ratatui = { workspace = true, features = ["crossterm"] }
reth-config = { workspace = true, features = ["serde"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
tracing = { workspace = true, features = ["attributes"] }
comfy-table = { workspace = true, features = ["default"] }
human_bytes = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default"] }
base-node-core = { workspace = true, features = ["default"] }
base-execution-evm-blocks = {features = ["std"], workspace = true}
proptest-arbitrary-interop = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
base-execution-state-database = {workspace = true, features = ["mdbx"]}
base-execution-state-trie = { workspace = true, features = ["metrics"] }
proptest = { workspace = true, optional = true, features = ["default"] }
base-execution-state-types = {features = ["clap", "std"], workspace = true}
reqwest = { workspace = true, features = ["rustls", "stream", "blocking"] }
base-common-types-chain = { workspace = true, features = ["reth", "serde"] }
base-execution-network-discovery = {features = ["default"], workspace = true}
base-execution-network-types = { workspace = true, features = ["secp256k1"] }
reth-downloaders = { workspace = true, features = ["default", "file-client"] }
backon = { workspace = true, features = ["std-blocking-sleep", "tokio-sleep"] }
toml_0_9_12_spec_1_1_0 = { workspace = true, features = ["default", "display"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "std"] }
base-execution-network-service = {features = ["default", "serde"], workspace = true}
base-execution-network-wire = {workspace = true, features = ["transport", "requests"]}

[dev-dependencies]
tempfile = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }

[features]
arbitrary = [
    "dep:proptest",
    "dep:arbitrary",
    "dep:proptest-arbitrary-interop",
    "base-execution-state-database/arbitrary",
    "base-execution-network-wire/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "base-common-types-chain/test-utils",
    "base-execution-state-types/test-utils",
    "base-common-types-chain/arbitrary",
    "base-execution-state-types/arbitrary",
    "reth-primitives-traits/arbitrary",
    "base-execution-state-memory/arbitrary",
]
