[package]
name = "alloy-eip7702"
description = "Implementation of EIP-7702 type definitions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_eip7702"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
alloy-rlp = { workspace = true, features = ["derive"] }
alloy-primitives = { workspace = true, features = ["rlp"] }
k256 = { workspace = true, features = ["ecdsa"], optional = true }
borsh = { workspace = true, features = ["derive"], optional = true }
rand_08 = { workspace = true, optional = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
serde_with = { workspace = true, features = ["macros"], optional = true }
serde = { workspace = true, features = [
    "derive",
    "alloc",
], optional = true }
[dev-dependencies]
bincode_1_3_3 = { workspace = true }
rand_08 = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
[lints]
workspace = true

[features]
arbitrary = ["std", "dep:arbitrary", "dep:rand_08", "alloy-primitives/arbitrary"]
borsh = ["dep:borsh", "alloy-primitives/borsh"]
default = ["std"]
k256 = ["alloy-primitives/k256", "dep:k256"]
serde = ["dep:serde", "alloy-primitives/serde"]
serde-bincode-compat = ["serde_with"]
std = ["alloy-primitives/std", "alloy-rlp/std", "serde?/std", "thiserror/std", "borsh?/std"]
