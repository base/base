[package]
name = "enr"
description = "Rust implementation of Ethereum Node Record (ENR) EIP778"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "enr"
path = "src/lib.rs"

[dependencies]
log = { workspace = true }
hex = { workspace = true, features = ["default"] }
sha3 = { workspace = true, features = ["default"] }
bytes = { workspace = true, features = ["default"] }
base64 = { workspace = true, features = ["default"] }
rand_08 = { workspace = true, features = ["default"] }
zeroize = { workspace = true, features = ["default"] }
alloy-rlp = { workspace = true, features = ["default"] }
k256 = { workspace = true, features = ["default", "ecdsa"], optional = true }
serde = { workspace = true, features = ["default", "derive"], optional = true }
secp256k1 = { workspace = true, features = ["global-context"], optional = true }
ed25519-dalek = { workspace = true, features = ["default", "rand_core"], optional = true }
[dev-dependencies]
serde_json = { workspace = true, features = ["default"] }
secp256k1 = { workspace = true, features = ["default", "rand"] }
alloy-rlp = { workspace = true, features = ["default", "derive"] }
[lints]
workspace = true

[features]
default = ["serde", "k256"]
ed25519 = ["dep:ed25519-dalek"]
k256 = ["dep:k256"]
rust-secp256k1 = ["dep:secp256k1"]
secp256k1 = ["rust-secp256k1"]
serde = ["dep:serde"]
