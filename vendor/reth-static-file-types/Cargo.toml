[package]
name = "reth-static-file-types"
description = "Commonly used types for static file usage in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
fixed-map = { workspace = true }
base-execution-state-types = { workspace = true }
strum = { workspace = true, features = ["derive"] }
derive_more = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["alloc", "derive"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
tracing = { workspace = true, features = ["attributes"], optional = true }
clap = { workspace = true, features = ["default", "derive"], optional = true }

[dev-dependencies]
insta = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
tempfile = { workspace = true, features = ["default"] }
reth-nippy-jar = { workspace = true, features = ["default"] }

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "derive_more/std",
    "base-execution-state-types/std",
    "serde/std",
    "strum/std",
    "serde_json/std",
    "fixed-map/std",
    "dep:tracing",
    "tracing?/std",
]
clap = ["dep:clap"]
