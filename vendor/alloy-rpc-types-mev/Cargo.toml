[package]
name = "alloy-rpc-types-mev"
description = "Types for the MEV JSON-RPC namespace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_rpc_types_mev"
path = "src/lib.rs"

[dependencies]
alloy-serde = { workspace = true }
alloy-primitives = { workspace = true }
alloy-eips = { workspace = true, features = ["serde"] }
serde_json = { workspace = true, features = ["alloc"] }
alloy-consensus = { workspace = true, features = ["serde"] }
alloy-rpc-types-eth = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = [
    "derive",
    "alloc",
] }
serde_with = { workspace = true, features = ["macros"], optional = true }
[dev-dependencies]
similar-asserts = { workspace = true, features = ["default"] }
bincode = { workspace = true, features = ["default", "serde"] }
[lints]
workspace = true

[features]
serde-bincode-compat = [
    "serde_with",
    "alloy-eips/serde-bincode-compat",
    "alloy-consensus/serde-bincode-compat",
    "alloy-rpc-types-eth/serde-bincode-compat",
]
serde_with = [
    "dep:serde_with",
    "alloy-consensus/serde_with",
]
