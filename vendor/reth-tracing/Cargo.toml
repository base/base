[package]
name = "reth-tracing"
description = "tracing helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rolling-file = { workspace = true, optional = true }
tracing-chrome = { workspace = true, optional = true }
tracing-logfmt = { workspace = true, optional = true }
tracing-samply = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
tracing-journald = { workspace = true, optional = true }
tracing = { workspace = true, features = ["attributes"] }
eyre = { workspace = true, optional = true, features = ["default"] }
tracing-tracy = { workspace = true, optional = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive"], optional = true }
reth-tracing-otlp = { workspace = true, optional = true, features = ["default"] }
tracy-client = { workspace = true, features = ["default", "demangle"], optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi", "json"], optional = true }
[features]
default = ["std", "otlp"]
std = [
    "tracing-subscriber",
    "tracing-appender",
    "tracing-chrome",
    "tracing-journald",
    "tracing-logfmt",
    "tracing-samply",
    "clap",
    "eyre",
    "rolling-file",
    "tracing/std",
    "tracing-subscriber?/std",
]
otlp = ["reth-tracing-otlp"]
otlp-logs = ["reth-tracing-otlp/otlp-logs"]
tracy = ["tracing-tracy", "tracy-client"]
