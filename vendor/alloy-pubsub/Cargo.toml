[package]
name = "alloy-pubsub"
description = "Ethereum JSON-RPC publish-subscribe tower service and type definitions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_pubsub"
path = "src/lib.rs"

[dependencies]
auto_impl = { workspace = true }
alloy-json-rpc = { workspace = true }
alloy-transport = { workspace = true }
alloy-primitives = { workspace = true }
tower = { workspace = true, features = ["util"] }
bimap = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
parking_lot = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default", "sync"] }
tokio = { workspace = true, features = ["default", "macros", "sync"] }
serde = { workspace = true, features = [
    "derive",
    "alloc",
] }
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasmtimer = { workspace = true, features = ["default"] }
[lints]
workspace = true
