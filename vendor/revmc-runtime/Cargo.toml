[package]
name = "revmc-runtime"
description = "Runtime JIT backend for revmc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rayon = { workspace = true }
dashmap = { workspace = true }
revm-state = { workspace = true }
revm-context = { workspace = true }
revm-handler = { workspace = true }
wait-timeout = { workspace = true }
revmc-backend = { workspace = true }
revmc-codegen = { workspace = true }
revm-database = { workspace = true }
revm-inspector = { workspace = true }
revm-primitives = { workspace = true }
revm-interpreter = { workspace = true }
revm-context-interface = { workspace = true }
revm-database-interface = { workspace = true }
alloy-evm = { workspace = true, optional = true }
revmc-llvm = { workspace = true, optional = true }
eyre = { workspace = true, features = ["default"] }
libc = { workspace = true, features = ["default"] }
quanta = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
revmc-context = { workspace = true, features = ["evm"] }
revmc-builtins = { workspace = true, features = ["ir"] }
derive_more = { workspace = true, features = ["debug"] }
libloading = { workspace = true, features = ["default"] }
revm-bytecode = { workspace = true, features = ["parse"] }
crossbeam-queue = { workspace = true, features = ["default"] }
crossbeam-channel = { workspace = true, features = ["default"] }
wincode = { workspace = true, features = ["default", "derive"] }
alloy-primitives = { workspace = true, features = ["std", "map-fxhash"] }
[dev-dependencies]
paste = { workspace = true }
alloy-evm = { workspace = true }
revmc-statetest = { workspace = true }
similar-asserts_2_0 = { workspace = true, features = ["default"] }
tracing-subscriber = { workspace = true, features = ["default", "fmt"] }
[features]
default = ["llvm"]
llvm = ["revmc-codegen/llvm", "dep:revmc-llvm"]
llvm-prefer-static = ["llvm", "revmc-codegen/llvm-prefer-static", "revmc-llvm?/prefer-static"]
llvm-prefer-dynamic = ["llvm", "revmc-codegen/llvm-prefer-dynamic", "revmc-llvm?/prefer-dynamic"]
alloy-evm = ["dep:alloy-evm"]
asm-keccak = ["revmc-codegen/asm-keccak", "alloy-primitives/asm-keccak"]
