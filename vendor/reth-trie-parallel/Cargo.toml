[package]
name = "reth-trie-parallel"
description = "Parallel implementation of merkle root algorithm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
revm = { workspace = true }
alloy-evm = { workspace = true }
thiserror = { workspace = true }
reth-trie = { workspace = true }
reth-provider = { workspace = true }
reth-storage-errors = { workspace = true }
reth-execution-errors = { workspace = true }
metrics = { workspace = true, optional = true }
reth-metrics = { workspace = true, optional = true }
reth-tasks = { workspace = true, features = ["rayon"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
tracing = { workspace = true, features = ["attributes"] }
crossbeam-utils = { workspace = true, features = ["default"] }
crossbeam-channel = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
rand = { workspace = true, optional = true, features = ["default"] }
reth-primitives-traits = { workspace = true, features = ["dashmap", "std"] }
reth-trie-sparse = { workspace = true, features = ["trie-debug"], optional = true }
[dev-dependencies]
reth-chainspec = { workspace = true }
reth-storage-overlay = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-ethereum-primitives = { workspace = true }
rand = { workspace = true, features = ["default"] }
reth-trie = { workspace = true, features = ["test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
[features]
default = ["metrics"]
metrics = ["reth-metrics", "dep:metrics", "reth-trie/metrics"]
trie-debug = [
    "dep:rand",
    "dep:reth-trie-sparse",
    "reth-trie-sparse?/trie-debug",
]
test-utils = [
    "reth-primitives-traits/test-utils",
    "reth-provider/test-utils",
    "reth-trie/test-utils",
    "reth-tasks/test-utils",
    "reth-chainspec/test-utils",
    "reth-trie-sparse?/test-utils",
    "reth-ethereum-primitives/test-utils",
]
