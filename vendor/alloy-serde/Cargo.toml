[package]
name = "alloy-serde"
description = "Alloy serde helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_serde"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = [
    "derive",
    "alloc",
] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, features = [
    "alloc",
    "alloc",
] }
alloy-primitives = { workspace = true, features = [
    "serde",
    "map",
] }
[dev-dependencies]
rand_08 = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
similar-asserts = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = [
    "rand",
    "rlp",
    "serde",
    "arbitrary",
] }
[lints]
workspace = true

[features]
arbitrary = ["dep:arbitrary", "alloy-primitives/arbitrary", "std"]
default = ["std"]
std = ["alloy-primitives/std", "serde/std", "serde_json/std"]
