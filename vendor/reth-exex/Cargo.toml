[package]
name = "reth-exex"
description = "Execution extensions for Reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
metrics = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
reth-config = { workspace = true }
reth-node-core = { workspace = true }
reth-stages-api = { workspace = true }
base-node-context = { workspace = true }
base-execution-txpool = {workspace = true}
base-common-io-files = { workspace = true }
reth-primitives-traits = { workspace = true }
base-common-runtime-tasks = { workspace = true }
base-execution-evm-blocks = { workspace = true }
base-execution-state-types = { workspace = true }
base-execution-state-provider = {workspace = true}
eyre = { workspace = true, features = ["default"] }
base-execution-network-service = { workspace = true }
base-execution-payload-builder = { workspace = true }
futures = { workspace = true, features = ["default"] }
itertools = { workspace = true, features = ["use_std"] }
tracing = { workspace = true, features = ["attributes"] }
parking_lot = { workspace = true, features = ["default"] }
tokio-util = { workspace = true, features = ["default", "codec"] }
base-common-types-chain = { workspace = true, features = ["reth"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-common-observability-metrics = { workspace = true, features = ["metrics"]}
base-common-observability-tracing = { workspace = true, features = ["default"] }
reth-exex-types = { workspace = true, features = ["default", "serde", "serde-bincode-compat"] }

[dev-dependencies]
alloy-genesis = { workspace = true }
alloy-hardforks = { workspace = true }
reth-testing-utils = { workspace = true }
base-common-chain-config = { workspace = true }
rand = { workspace = true, features = ["default"] }
base-execution-state-maintenance = { workspace = true }
tempfile = { workspace = true, features = ["default"] }
reth-primitives-traits = { workspace = true, features = ["test-utils"] }
base-execution-evm-blocks = { workspace = true, features = ["test-utils"] }
base-execution-state-memory = {workspace = true, features = ["test-utils"]}
secp256k1 = { workspace = true, features = ["global-context", "recovery"] }
base-execution-state-provider = { workspace = true, features = ["test-utils"] }
base-execution-state-types = { workspace = true, features = ["serde-bincode-compat"] }

[features]
serde = [
    "reth-exex-types/serde",
    "base-execution-evm-blocks/serde",
    "base-common-types-chain/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "parking_lot/serde",
    "rand/serde",
    "secp256k1/serde",
    "reth-primitives-traits/serde",
    "base-execution-state-types/serde",
    "reth-config/serde",
    "base-execution-state-provider/serde",
    "base-execution-state-memory/serde",
]
