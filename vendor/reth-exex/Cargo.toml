[package]
name = "reth-exex"
description = "Execution extensions for Reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
metrics = { workspace = true }
reth-evm = { workspace = true }
reth-revm = { workspace = true }
thiserror = { workspace = true }
rmp-serde = { workspace = true }
alloy-eips = { workspace = true }
reth-tasks = { workspace = true }
reth-db-api = { workspace = true }
reth-config = { workspace = true }
reth-fs-util = { workspace = true }
reth-metrics = { workspace = true }
reth-node-api = { workspace = true }
reth-provider = { workspace = true }
reth-chainspec = { workspace = true }
reth-node-core = { workspace = true }
alloy-consensus = { workspace = true }
reth-stages-api = { workspace = true }
reth-prune-types = { workspace = true }
reth-chain-state = { workspace = true }
reth-payload-builder = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-ethereum-primitives = { workspace = true }
eyre = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
itertools = { workspace = true, features = ["use_std"] }
tracing = { workspace = true, features = ["attributes"] }
parking_lot = { workspace = true, features = ["default"] }
reth-tracing = { workspace = true, features = ["default"] }
base-common-consensus = { workspace = true, features = ["reth"] }
tokio-util = { workspace = true, features = ["default", "codec"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
reth-exex-types = { workspace = true, features = ["default", "serde", "serde-bincode-compat"] }
[dev-dependencies]
alloy-genesis = { workspace = true }
reth-db-common = { workspace = true }
reth-testing-utils = { workspace = true }
rand = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
reth-evm = { workspace = true, features = ["test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-primitives-traits = { workspace = true, features = ["test-utils"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery"] }
reth-trie-common = { workspace = true, features = ["serde-bincode-compat"] }
[features]
serde = [
    "reth-exex-types/serde",
    "reth-revm/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "parking_lot/serde",
    "rand/serde",
    "secp256k1/serde",
    "reth-primitives-traits/serde",
    "reth-trie-common/serde",
    "reth-prune-types/serde",
    "reth-config/serde",
    "reth-ethereum-primitives/serde",
    "reth-chain-state/serde",
]
