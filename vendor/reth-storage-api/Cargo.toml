[package]
name = "reth-storage-api"
description = "Reth storage provider traits and types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
revm = { workspace = true }
auto_impl = { workspace = true }
alloy-eips = { workspace = true }
reth-db-models = { workspace = true }
reth-chainspec = { workspace = true }
alloy-consensus = { workspace = true }
reth-prune-types = { workspace = true }
reth-trie-common = { workspace = true }
reth-stages-types = { workspace = true }
reth-storage-errors = { workspace = true }
reth-execution-types = { workspace = true }
reth-primitives-traits = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
base-execution-chainspec = { workspace = true }
reth-ethereum-primitives = { workspace = true }
reth-db-api = { workspace = true, optional = true }
reth-tokio-util = { workspace = true, optional = true }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
base-common-consensus = { workspace = true, features = ["reth"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
serde_json = { workspace = true, features = ["alloc"], optional = true }
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-stream = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "getrandom"] }
[features]
default = ["std"]
std = [
    "reth-chainspec/std",
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rpc-types-engine/std",
    "reth-primitives-traits/std",
    "reth-stages-types/std",
    "revm/std",
    "reth-ethereum-primitives/std",
    "reth-execution-types/std",
    "reth-prune-types/std",
    "reth-storage-errors/std",
    "reth-db-models/std",
    "reth-trie-common/std",
    "serde_json?/std",
    "dep:reth-tokio-util",
    "alloy-eip7928/std",
]

db-api = [
    "dep:reth-db-api",
    "dep:serde_json",
]

serde = [
    "reth-ethereum-primitives/serde",
    "reth-db-models/serde",
    "reth-execution-types/serde",
    "reth-primitives-traits/serde",
    "reth-prune-types/serde",
    "reth-stages-types/serde",
    "reth-trie-common/serde",
    "revm/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-rpc-types-engine/serde",
    "alloy-eip7928/serde",
]

serde-bincode-compat = [
    "reth-execution-types/serde-bincode-compat",
    "reth-trie-common/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
    "alloy-consensus/serde-bincode-compat",
]
