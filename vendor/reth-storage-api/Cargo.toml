[package]
name = "reth-storage-api"
description = "Reth storage provider traits and types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
auto_impl = { workspace = true }
alloy-eips = { workspace = true }
reth-storage-errors = { workspace = true }
reth-execution-types = { workspace = true }
reth-primitives-traits = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-state-types = {workspace = true}
base-common-types-payload = { workspace = true }
base-execution-evm-runtime = { workspace = true }
reth-db-api = { workspace = true, optional = true }
alloy-hardforks = { workspace = true, optional = true }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
base-common-runtime-tasks = { workspace = true, optional = true }
base-common-types-chain = { workspace = true, features = ["reth"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
serde_json = { workspace = true, features = ["alloc"], optional = true }

[dev-dependencies]
mockall = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-stream = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "getrandom"] }

[features]
default = ["std"]
std = [
    "base-common-types-chain/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "base-common-types-payload/std",
    "reth-primitives-traits/std",
    "base-execution-state-types/std",
    "base-execution-evm-runtime/std",
    "reth-execution-types/std",
    "reth-storage-errors/std",
    "serde_json?/std",
    "dep:base-common-runtime-tasks",
    "alloy-eip7928/std",
]

db-api = ["dep:alloy-hardforks", "dep:reth-db-api", "dep:serde_json"]

serde = [
    "base-execution-state-types/serde",
    "reth-execution-types/serde",
    "reth-primitives-traits/serde",
    "base-execution-evm-runtime/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "base-common-types-chain/serde",
    "base-common-types-payload/serde",
    "alloy-eip7928/serde",
]

serde-bincode-compat = [
    "reth-execution-types/serde-bincode-compat",
    "base-execution-state-types/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
    "base-common-types-chain/serde-bincode-compat",
]
