[package]
name = "revm-interpreter"
description = "Revm Interpreter that executes bytecode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[lib]
name = "revm_interpreter"
path = "src/lib.rs"

[[test]]
name = "miri_read_slice_oob"
path = "tests/miri_read_slice_oob.rs"

[dependencies]
revm-state = { workspace = true }
revm-bytecode = { workspace = true }
revm-primitives = { workspace = true }
revm-context-interface = { workspace = true }
serde = { workspace = true, features = [
    "derive",
    "rc",
    "derive",
    "rc",
], optional = true }
[dev-dependencies]
serde_json = { workspace = true, features = ["alloc"] }
[lints]
workspace = true

[features]
arbitrary = ["std", "revm-primitives/arbitrary"]
default = ["std"]
hashbrown = ["revm-primitives/hashbrown"]
memory_limit = []
serde = ["dep:serde", "revm-primitives/serde", "revm-bytecode/serde", "revm-context-interface/serde", "revm-state/serde"]
std = ["serde?/std", "revm-primitives/std", "revm-context-interface/std", "revm-bytecode/std", "revm-state/std", "serde_json/std"]
