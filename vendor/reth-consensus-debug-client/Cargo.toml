[package]
name = "reth-consensus-debug-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
auto_impl = { workspace = true }
alloy-eips = { workspace = true }
alloy-json-rpc = { workspace = true }
alloy-transport = { workspace = true }
base-common-types-chain = { workspace = true }
tokio = { workspace = true, features = ["time"] }
eyre = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive"] }
futures = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
serde_json = { workspace = true, features = ["alloc"] }
ringbuffer = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-common-types-payload = {workspace = true, features = ["serde"]}
reqwest = { workspace = true, features = ["rustls", "stream", "query"] }
base-common-observability-tracing = { workspace = true, features = ["default"] }
base-common-client-ethereum = { workspace = true, features = ["reqwest", "debug-api", "ws"] }

[dependencies.base-execution-engine-types]
workspace = true

[dependencies.base-execution-payload-types]
workspace = true
