[package]
name = "reth-consensus-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
alloy-eips = { workspace = true }
reth-consensus = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-consensus = { workspace = true }
reth-primitives-traits = { workspace = true }
base-execution-chainspec = { workspace = true }
reth-execution-types = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-common-consensus = { optional = true, workspace = true, features = ["reth"] }
[dev-dependencies]
reth-ethereum-primitives = { workspace = true }
rand = { workspace = true, features = ["default"] }
base-common-consensus = { workspace = true, features = ["reth"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
[features]
test-utils = ["dep:base-common-consensus", "std", "dep:reth-execution-types"]
default = ["std"]
std = [
    "alloy-consensus/std",
    "alloy-eips/std",
    "reth-consensus/std",
    "reth-primitives-traits/std",
    "reth-ethereum-primitives/std",
    "alloy-primitives/std",
]
