[package]
name = "revm-statetest-types"
description = "Statetest types for revme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[lib]
name = "revm_statetest_types"
path = "src/lib.rs"

[dependencies]
k256 = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
revm-state = { workspace = true, features = [
    "std",
    "serde",
] }
revm-context = { workspace = true, features = [
    "std",
    "serde",
] }
revm-database = { workspace = true, features = [
    "std",
    "serde",
] }
revm-primitives = { workspace = true, features = [
    "std",
    "serde",
] }
revm-context-interface = { workspace = true, features = [
    "std",
    "serde",
] }
alloy-eip7928 = { workspace = true, features = [
    "std",
    "serde",
    "rlp",
] }
serde = { workspace = true, features = [
    "derive",
    "rc",
    "derive",
    "rc",
] }
[lints]
workspace = true

[features]
map-foldhash = ["revm-primitives/map-foldhash", "revm-state/map-foldhash", "revm-context/map-foldhash", "revm-database/map-foldhash"]
