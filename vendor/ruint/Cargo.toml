[package]
name = "ruint"
description = "Unsigned integer type with const-generic bit length"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
include = [
    ".cargo/",
    "src/",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--html-in-header",
    ".cargo/katex-header.html",
]

[lib]
name = "ruint"
path = "src/lib.rs"
bench = false

[dependencies]
ruint-macro = { workspace = true }
rlp = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
borsh = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
rand_08 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
valuable = { workspace = true, optional = true }
alloy-rlp = { workspace = true, optional = true }
arbitrary = { workspace = true, optional = true }
bigdecimal = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
serde_core = { workspace = true, optional = true }
num-integer = { workspace = true, optional = true }
ark-ff_0_3_0 = { workspace = true, optional = true }
ark-ff_0_4_2 = { workspace = true, optional = true }
ark-ff_0_5_0 = { workspace = true, optional = true }
quickcheck_1 = { workspace = true, optional = true }
primitive-types = { workspace = true, optional = true }
ethereum_ssz_0_5_3 = { workspace = true, optional = true }
postgres-types_0_2 = { workspace = true, optional = true }
der = { workspace = true, features = ["alloc"], optional = true }
rkyv = { workspace = true, optional = true, features = ["default"] }
fastrlp = { workspace = true, features = ["alloc"], optional = true }
bn-rs = { workspace = true, optional = true, features = ["default"] }
bytes = { workspace = true, optional = true, features = ["default"] }
diesel = { workspace = true, optional = true, features = ["default"] }
proptest = { workspace = true, features = ["no_std"], optional = true }
sqlx-core = { workspace = true, optional = true, features = ["default"] }
thiserror = { workspace = true, optional = true, features = ["default"] }
fastrlp_0_4_0 = { workspace = true, features = ["alloc"], optional = true }
parity-scale-codec = { workspace = true, features = [
    "derive",
    "max-encoded-len",
], optional = true }
[dev-dependencies]
postgres = { workspace = true }
hex-literal = { workspace = true }
bincode_1_3_3 = { workspace = true }
hex = { workspace = true, features = ["default"] }
rand = { workspace = true, features = ["default"] }
approx = { workspace = true, features = ["default"] }
arrayvec = { workspace = true, features = ["default"] }
proptest = { workspace = true, features = ["default"] }
ark-bn254 = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["default"] }
ark-bn254_0_4_0 = { workspace = true, features = ["default"] }
ark-bn254_0_5_0 = { workspace = true, features = ["default"] }
ark-bn254_0_6_0 = { workspace = true, features = ["default"] }
borsh = { workspace = true, features = ["default", "derive"] }
codspeed-criterion-compat = { workspace = true, features = ["default"] }
[lints]
workspace = true

[features]
alloc = ["proptest?/alloc", "rand_08?/alloc", "rand?/alloc", "serde_core?/alloc", "valuable?/alloc", "zeroize?/alloc"]
alloy-rlp = ["dep:alloy-rlp", "alloc"]
arbitrary = ["dep:arbitrary", "std"]
ark-ff = ["dep:ark-ff_0_3_0"]
ark-ff-04 = ["dep:ark-ff_0_4_2"]
ark-ff-05 = ["dep:ark-ff_0_5_0"]
ark-ff-06 = ["dep:ark-ff"]
bigdecimal = ["dep:bigdecimal", "num-bigint"]
bincode-2 = ["dep:bincode"]
bn-rs = ["dep:bn-rs", "std"]
borsh = ["dep:borsh"]
bytemuck = ["dep:bytemuck"]
default = ["std"]
der = ["dep:der", "alloc"]
diesel = ["dep:diesel", "std", "dep:thiserror"]
fastrlp = ["dep:fastrlp", "alloc"]
fastrlp-04 = ["dep:fastrlp_0_4_0", "alloc"]
generic_const_exprs = ["nightly"]
nightly = []
num-bigint = ["dep:num-bigint", "alloc"]
num-integer = ["dep:num-integer", "num-traits", "alloc"]
num-traits = ["dep:num-traits", "alloc"]
parity-scale-codec = ["dep:parity-scale-codec", "alloc"]
postgres = ["dep:postgres-types_0_2", "dep:bytes", "dep:thiserror", "std"]
primitive-types = ["dep:primitive-types"]
proptest = ["dep:proptest", "alloc"]
pyo3 = ["dep:pyo3", "std"]
quickcheck = ["dep:quickcheck_1", "std"]
rand = ["dep:rand_08"]
rand-09 = ["dep:rand"]
rkyv = ["dep:rkyv", "alloc"]
rlp = ["dep:rlp", "alloc"]
serde = ["dep:serde_core", "alloc"]
sqlx = ["dep:sqlx-core", "std", "dep:thiserror"]
ssz = ["dep:ethereum_ssz_0_5_3", "std"]
std = ["alloc", "alloy-rlp?/std", "ark-ff_0_3_0?/std", "ark-ff_0_4_2?/std", "ark-ff_0_5_0?/std", "ark-ff?/std", "bytes?/std", "fastrlp?/std", "fastrlp_0_4_0?/std", "num-bigint?/std", "num-integer?/std", "num-traits?/std", "parity-scale-codec?/std", "primitive-types?/std", "proptest?/std", "rand_08?/std", "rand_08?/std_rng", "rand?/std", "rand?/thread_rng", "rlp?/std", "serde_core?/std", "valuable?/std", "zeroize?/std"]
subtle = ["dep:subtle"]
valuable = ["dep:valuable"]
zeroize = ["dep:zeroize"]
