[package]
name = "alloy-sol-macro-input"
description = "Input types for sol!-like macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_sol_macro_input"
path = "src/lib.rs"

[dependencies]
heck = { workspace = true }
dunce = { workspace = true }
syn-solidity = { workspace = true }
macro-string = { workspace = true }
syn = { workspace = true, features = ["default"] }
quote = { workspace = true, features = ["default"] }
alloy-json-abi = { workspace = true, optional = true }
proc-macro2 = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"], optional = true }
const-hex = { workspace = true, features = [
    "alloc",
    "core-error",
] }
[lints]
workspace = true

[features]
json = ["dep:alloy-json-abi", "dep:serde_json", "alloy-json-abi/serde_json"]
