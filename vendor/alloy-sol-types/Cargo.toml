[package]
name = "alloy-sol-types"
description = "Compile-time ABI and EIP-712 implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_sol_types"
path = "src/lib.rs"

[dependencies]
alloy-sol-macro = { workspace = true }
alloy-primitives = { workspace = true }
alloy-json-abi = { workspace = true, optional = true }
serde = { workspace = true, features = [
    "alloc",
    "derive",
], optional = true }
[dev-dependencies]
paste = { workspace = true }
proptest = { workspace = true }
trybuild = { workspace = true }
derive_more = { workspace = true }
rustversion = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
pretty_assertions = { workspace = true, features = ["default"] }
serde = { workspace = true, features = [
    "alloc",
    "derive",
] }
alloy-rlp = { workspace = true, features = [
    "core-net",
    "core-error",
] }
alloy-primitives = { workspace = true, features = [
    "arbitrary",
    "serde",
    "rlp",
] }
[lints]
workspace = true

[features]
arbitrary = ["alloy-primitives/arbitrary"]
default = ["std"]
eip712-serde = [
    "dep:serde",
    "alloy-primitives/serde",
]
json = [
    "dep:alloy-json-abi",
    "alloy-sol-macro/json",
]
more-tuple-impls = []
std = [
    "alloy-primitives/std",
    "alloy-json-abi?/std",
    "serde?/std",
]
