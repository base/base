[package]
name = "reth-transaction-pool"
description = "Transaction pool implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
revm = { workspace = true }
imbl = { workspace = true }
metrics = { workspace = true }
reth-evm = { workspace = true }
bitflags = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
auto_impl = { workspace = true }
rustc-hash = { workspace = true }
reth-tasks = { workspace = true }
aquamarine = { workspace = true }
pin-project = { workspace = true }
futures-util = { workspace = true }
reth-fs-util = { workspace = true }
reth-metrics = { workspace = true }
reth-chainspec = { workspace = true }
reth-storage-api = { workspace = true }
reth-chain-state = { workspace = true }
reth-execution-types = { workspace = true }
reth-primitives-traits = { workspace = true }
paste = { workspace = true, optional = true }
base-execution-chainspec = { workspace = true }
reth-ethereum-primitives = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
alloy-eips = { workspace = true, features = ["kzg"] }
serde_json = { workspace = true, features = ["alloc"] }
schnellru = { workspace = true, features = ["default"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
tracing = { workspace = true, features = ["attributes"] }
serde = { workspace = true, features = ["derive", "rc"] }
alloy-consensus = { workspace = true, features = ["kzg"] }
parking_lot = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default"] }
base-common-consensus = { workspace = true, features = ["reth"] }
reth-eth-wire-types = { workspace = true, features = ["default"] }
proptest-arbitrary-interop = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
rand = { workspace = true, optional = true, features = ["default"] }
proptest = { workspace = true, optional = true, features = ["default"] }
[dev-dependencies]
paste = { workspace = true }
assert_matches = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
rand = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
proptest = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
reth-evm = { workspace = true, features = ["test-utils"] }
reth-tracing = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-transaction-pool = { workspace = true, features = ["test-utils"] }
codspeed-criterion-compat = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
[[bench]]
name = "saturated_pool"
harness = false
required-features = ["test-utils"]

[features]
serde = ["reth-execution-types/serde", "reth-eth-wire-types/serde", "alloy-consensus/serde", "alloy-eips/serde", "alloy-primitives/serde", "bitflags/serde", "imbl/serde", "parking_lot/serde", "rand?/serde", "smallvec/serde", "reth-primitives-traits/serde", "reth-ethereum-primitives/serde", "reth-chain-state/serde", "reth-storage-api/serde", "revm/serde", "reth-transaction-pool/serde"]
test-utils = ["rand", "paste", "serde", "reth-chain-state/test-utils", "reth-chainspec/test-utils", "reth-provider/test-utils", "reth-primitives-traits/test-utils", "reth-ethereum-primitives/test-utils", "alloy-primitives/rand", "reth-evm/test-utils", "reth-tasks/test-utils", "reth-transaction-pool/test-utils"]
arbitrary = ["proptest", "proptest-arbitrary-interop", "imbl/arbitrary", "reth-chainspec/arbitrary", "reth-eth-wire-types/arbitrary", "alloy-consensus/arbitrary", "alloy-eips/arbitrary", "alloy-primitives/arbitrary", "bitflags/arbitrary", "reth-primitives-traits/arbitrary", "smallvec/arbitrary", "reth-ethereum-primitives/arbitrary", "revm/arbitrary", "imbl/arbitrary", "reth-transaction-pool/arbitrary"]
