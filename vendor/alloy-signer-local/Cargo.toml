[package]
name = "alloy-signer-local"
description = "sepc256k1 ECDSA and YubiHSM signer implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_signer_local"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
async-trait = { workspace = true }
alloy-signer = { workspace = true }
alloy-network = { workspace = true }
alloy-primitives = { workspace = true }
k256 = { workspace = true, features = ["ecdsa"] }
coins-bip32 = { workspace = true, optional = true }
eth-keystore = { workspace = true, optional = true }
rand_08 = { workspace = true, features = ["default"] }
alloy-consensus = { workspace = true, features = ["std"] }
coins-bip39 = { workspace = true, features = ["english"], optional = true }
zeroize = { workspace = true, features = [
    "zeroize_derive",
    "alloc",
], optional = true }
yubihsm = { workspace = true, features = ["default", "secp256k1", "http", "usb"], optional = true }
secp256k1 = { workspace = true, features = [
    "recovery",
    "rand",
    "global-context",
], optional = true }
[dev-dependencies]
alloy-dyn-abi = { workspace = true }
alloy-network = { workspace = true }
alloy-sol-types = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
tempfile = { workspace = true, features = ["default"] }
alloy-consensus = { workspace = true, features = ["std"] }
yubihsm = { workspace = true, features = ["default", "mockhsm"] }
serde = { workspace = true, features = [
    "derive",
    "alloc",
] }
tokio = { workspace = true, features = ["default", "macros", "rt-multi-thread"] }
[lints]
workspace = true

[features]
eip712 = ["alloy-signer/eip712"]
keystore = ["dep:eth-keystore"]
keystore-geth-compat = ["keystore", "eth-keystore?/geth-compat"]
mnemonic = ["dep:coins-bip32", "dep:coins-bip39", "zeroize"]
mnemonic-all-languages = ["mnemonic", "coins-bip39?/all-langs"]
secp256k1 = ["dep:secp256k1", "alloy-consensus/secp256k1", "yubihsm?/secp256k1", "alloy-primitives/secp256k1"]
yubihsm = ["dep:yubihsm"]
zeroize = ["dep:zeroize"]
