[package]
name = "reth-rpc-eth-types"
description = "Types supporting implementation of 'eth' namespace RPC server API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
lru = { workspace = true }
tokio = { workspace = true }
metrics = { workspace = true }
itertools = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
alloy-serde = { workspace = true }
alloy-chains = { workspace = true }
alloy-json-rpc = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-transport = { workspace = true }
jsonrpsee-types = { workspace = true }
reth-chain-state = { workspace = true }
base-execution-txpool = { workspace = true }
reth-rpc-server-types = { workspace = true }
base-common-chain-config = {workspace = true}
base-execution-evm-fees = { workspace = true }
base-execution-state-api = { workspace = true }
base-execution-state-types = {workspace = true}
base-common-runtime-tasks = { workspace = true }
base-execution-evm-blocks = { workspace = true }
url = { workspace = true, features = ["serde"] }
base-consensus-batch-types = { workspace = true }
base-execution-evm-machine = { workspace = true }
base-common-client-ethereum = { workspace = true }
rand = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive"] }
futures = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
schnellru = { workspace = true, features = ["default"] }
base-common-types-rpc = {workspace = true, features = []}
tracing = { workspace = true, features = ["attributes"] }
tokio-stream = { workspace = true, features = ["default"] }
reth-primitives-traits = { workspace = true, features = [] }
jsonrpsee-core = { workspace = true, features = ["default"] }
alloy-rpc-client = { workspace = true, features = ["reqwest"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
reth-rpc-convert = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
base-common-types-chain = { workspace = true, features = ["reth", "serde"] }
base-execution-evm-inspectors = { workspace = true, features = ["default"] }
base-common-observability-metrics = { workspace = true, features = ["metrics"]}
base-execution-evm-runtime = {features = ["call-util", "overrides"], workspace = true}

[dev-dependencies]
base-execution-state-types = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
reth-provider = { workspace = true, features = ["test-utils"] }
base-execution-state-api = { workspace = true, features = ["std"] }
base-consensus-batch-types = { workspace = true, features = ["test-utils"] }

[features]
js-tracer = ["base-execution-evm-inspectors/js-tracer"]
