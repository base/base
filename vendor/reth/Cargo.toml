[package]
name = "reth"
description = "Reth node implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "reth"

[package.metadata.deb]
maintainer = "reth team"
depends = "$auto"
section = "network"
priority = "optional"
maintainer-scripts = "../../pkg/reth/debian/"
assets = [
    "$auto",
    ["../../README.md", "usr/share/doc/reth/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/reth/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/reth/", "644"],
    ["../../LICENSES/*", "usr/share/doc/reth/LICENSES/", "644"],
]
systemd-units = { enable = false, start = false, unit-name = "reth", unit-scripts = "../../pkg/reth/debian" }

[lints]
workspace = true

[dependencies]
reth-rpc = { workspace = true }
reth-revm = { workspace = true }
reth-tasks = { workspace = true }
aquamarine = { workspace = true }
reth-provider = { workspace = true }
reth-cli-util = { workspace = true }
reth-node-api = { workspace = true }
reth-chainspec = { workspace = true }
reth-consensus = { workspace = true }
reth-node-core = { workspace = true }
reth-cli-runner = { workspace = true }
reth-rpc-builder = { workspace = true }
reth-network-api = { workspace = true }
reth-ethereum-cli = { workspace = true }
reth-node-metrics = { workspace = true }
reth-rpc-eth-types = { workspace = true }
reth-payload-builder = { workspace = true }
reth-consensus-common = { workspace = true }
reth-transaction-pool = { workspace = true }
reth-rpc-server-types = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-ethereum-primitives = { workspace = true }
reth-db = { workspace = true, features = ["mdbx"] }
reth-ethereum-payload-builder = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
reth-network = { workspace = true, features = ["serde"] }
reth-rpc-api = { workspace = true, features = ["client"] }
reth-rpc-convert = { workspace = true, features = ["default"] }
reth-node-builder = { workspace = true, features = ["default"] }
reth-node-ethereum = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
alloy-rpc-types = { workspace = true, features = ["eth", "engine"] }
clap = { workspace = true, features = ["default", "derive", "env"] }
reth-payload-primitives = { workspace = true, features = ["default"] }
[dev-dependencies]
alloy-rpc-types-eth = { workspace = true }
alloy-node-bindings = { workspace = true }
tar = { workspace = true, features = ["default"] }
zstd = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
tempfile = { workspace = true, features = ["default"] }
toml_0_9_12_spec_1_1_0 = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
alloy-provider = { workspace = true, features = ["reqwest", "debug-api"] }
backon = { workspace = true, features = ["std-blocking-sleep", "tokio-sleep"] }
[[bin]]
name = "reth"
path = "src/main.rs"

[features]
default = ["jemalloc", "otlp", "otlp-logs", "reth-revm/portable", "js-tracer", "jit", "keccak-cache-global", "asm-keccak", "gmp", "min-trace-logs"]

jit = ["reth-ethereum-cli/jit", "reth-node-ethereum/jit"]
gmp = ["reth-ethereum-cli/gmp", "reth-node-ethereum/gmp", "reth-revm/gmp"]

otlp = ["reth-ethereum-cli/otlp", "reth-node-core/otlp"]
otlp-logs = ["reth-ethereum-cli/otlp-logs", "reth-node-core/otlp-logs"]
js-tracer = ["reth-node-builder/js-tracer", "reth-node-ethereum/js-tracer", "reth-rpc/js-tracer", "reth-rpc-eth-types/js-tracer"]

dev = ["reth-ethereum-cli/dev"]

asm-keccak = ["reth-node-core/asm-keccak", "reth-ethereum-cli/asm-keccak", "reth-node-ethereum/asm-keccak", "alloy-primitives/asm-keccak"]
keccak-cache-global = ["reth-node-core/keccak-cache-global", "reth-node-ethereum/keccak-cache-global", "alloy-primitives/keccak-cache-global"]
jemalloc = ["reth-cli-util/jemalloc", "reth-node-core/jemalloc", "reth-node-metrics/jemalloc", "reth-ethereum-cli/jemalloc", "reth-provider/jemalloc"]
jemalloc-prof = ["jemalloc", "reth-cli-util/jemalloc-prof", "reth-ethereum-cli/jemalloc-prof", "reth-node-metrics/jemalloc-prof"]
jemalloc-symbols = ["jemalloc-prof", "reth-ethereum-cli/jemalloc-symbols"]
tracy-allocator = ["reth-cli-util/tracy-allocator", "reth-ethereum-cli/tracy-allocator", "tracy"]
tracy = ["reth-ethereum-cli/tracy", "reth-node-core/tracy"]

# Because jemalloc is default and preferred over snmalloc when both features are
# enabled, `--no-default-features` should be used when enabling snmalloc or
# snmalloc-native.
snmalloc = ["reth-cli-util/snmalloc", "reth-ethereum-cli/snmalloc"]
snmalloc-native = ["reth-cli-util/snmalloc-native", "reth-ethereum-cli/snmalloc-native"]

min-error-logs = ["tracing/release_max_level_error", "reth-ethereum-cli/min-error-logs", "reth-node-core/min-error-logs"]
min-warn-logs = ["tracing/release_max_level_warn", "reth-ethereum-cli/min-warn-logs", "reth-node-core/min-warn-logs"]
min-info-logs = ["tracing/release_max_level_info", "reth-ethereum-cli/min-info-logs", "reth-node-core/min-info-logs"]
min-debug-logs = ["tracing/release_max_level_debug", "reth-ethereum-cli/min-debug-logs", "reth-node-core/min-debug-logs"]
min-trace-logs = ["tracing/release_max_level_trace", "reth-ethereum-cli/min-trace-logs", "reth-node-core/min-trace-logs"]

partial-persistence = ["reth-node-core/partial-persistence"]
trie-debug = ["reth-node-builder/trie-debug", "reth-node-core/trie-debug"]
