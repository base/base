[package]
name = "revm-state"
description = "Revm state types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[lib]
name = "revm_state"
path = "src/lib.rs"

[dependencies]
nonmax = { workspace = true }
bitflags = { workspace = true }
alloy-eip7928 = { workspace = true }
revm-bytecode = { workspace = true }
revm-primitives = { workspace = true }
serde = { workspace = true, features = [
    "derive",
    "rc",
    "derive",
    "rc",
], optional = true }
[dev-dependencies]
serde_json = { workspace = true, features = ["alloc"] }
[lints]
workspace = true

[features]
default = ["std"]
map-foldhash = ["revm-primitives/map-foldhash"]
serde = ["dep:serde", "revm-primitives/serde", "bitflags/serde", "revm-bytecode/serde", "alloy-eip7928/serde", "nonmax/serde"]
std = ["serde?/std", "serde_json/std", "revm-primitives/std", "bitflags/std", "revm-bytecode/std", "alloy-eip7928/std", "nonmax/std"]
