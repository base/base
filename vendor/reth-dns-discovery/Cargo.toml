[package]
name = "reth-dns-discovery"
description = "Support for EIP-1459 Node Discovery via DNS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
enr = { workspace = true }
thiserror = { workspace = true }
linked_hash_set = { workspace = true }
reth-ethereum-forks = { workspace = true }
serde = { workspace = true, optional = true }
dashmap = { workspace = true, features = ["inline"] }
schnellru = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["attributes"] }
tokio-stream = { workspace = true, features = ["default"] }
reth-tokio-util = { workspace = true, features = ["time"] }
data-encoding = { workspace = true, features = ["default"] }
reth-network-peers = { workspace = true, features = ["secp256k1"] }
tokio = { workspace = true, features = ["io-util", "net", "time"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
hickory-resolver = { workspace = true, features = ["default", "tokio"] }
serde_with = { workspace = true, features = ["macros"], optional = true }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "std", "serde"] }
[dev-dependencies]
alloy-chains = { workspace = true }
reth-chainspec = { workspace = true }
rand = { workspace = true, features = ["default"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
reth-tracing = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "rand"] }
[features]
serde = [
    "dep:serde",
    "dep:serde_with",
    "alloy-chains/serde",
    "alloy-primitives/serde",
    "enr/serde",
    "linked_hash_set/serde",
    "rand/serde",
    "secp256k1/serde",
    "hickory-resolver/serde",
    "reth-ethereum-forks/serde",
    "dashmap/serde",
]
