[package]
name = "reth-node-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
url = { workspace = true }
serde = { workspace = true }
dirs-next = { workspace = true }
humantime = { workspace = true }
thiserror = { workspace = true }
alloy-eips = { workspace = true }
reth-tasks = { workspace = true }
reth-discv5 = { workspace = true }
alloy-chains = { workspace = true }
alloy-eip2124 = { workspace = true }
reth-cli-util = { workspace = true }
alloy-hardforks = { workspace = true }
reth-net-banlist = { workspace = true }
reth-prune-types = { workspace = true }
reth-engine-local = { workspace = true }
reth-stages-types = { workspace = true }
reth-rpc-eth-types = { workspace = true }
reth-storage-errors = { workspace = true }
base-execution-txpool = { workspace = true }
reth-rpc-server-types = { workspace = true }
reth-engine-primitives = { workspace = true }
base-common-chain-config = { workspace = true }
base-execution-consensus = { workspace = true }
eyre = { workspace = true, features = ["default"] }
reth-db = { workspace = true, features = ["mdbx"] }
strum = { workspace = true, features = ["derive"] }
ipnet = { workspace = true, features = ["default"] }
futures = { workspace = true, features = ["default"] }
derive_more = { workspace = true, features = ["full"] }
reth-config = { workspace = true, features = ["serde"] }
reth-network = { workspace = true, features = ["serde"] }
tracing = { workspace = true, features = ["attributes"] }
reth-discv4 = { workspace = true, features = ["default"] }
reth-net-nat = { workspace = true, features = ["default"] }
reth-network-p2p = { workspace = true, features = ["default"] }
reth-rpc-convert = { workspace = true, features = ["default"] }
reth-tracing-otlp = { workspace = true, features = ["default"] }
reth-tracing = { workspace = true, features = ["default", "std"] }
base-common-types-chain = { workspace = true, features = ["reth"] }
reth-network-peers = { workspace = true, features = ["secp256k1"] }
reth-primitives-traits = { workspace = true, features = ["rayon"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
reth-storage-api = { workspace = true, features = ["std", "db-api"] }
toml_0_9_12_spec_1_1_0 = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["default", "derive", "env", "string"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "std"] }
base-common-types-payload = { workspace = true, features = ["std", "jwt-aws-lc-rs"] }

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true, features = ["default"] }

[features]
jemalloc = ["reth-cli-util/jemalloc"]
asm-keccak = ["alloy-primitives/asm-keccak"]
keccak-cache-global = ["alloy-primitives/keccak-cache-global"]
otlp = ["reth-tracing/otlp", "reth-tracing-otlp/otlp"]
otlp-logs = ["reth-tracing/otlp-logs", "reth-tracing-otlp/otlp-logs"]
tracy = ["reth-tracing/tracy"]

min-error-logs = ["tracing/release_max_level_error"]
min-warn-logs = ["tracing/release_max_level_warn"]
min-info-logs = ["tracing/release_max_level_info"]
min-debug-logs = ["tracing/release_max_level_debug"]
min-trace-logs = ["tracing/release_max_level_trace"]

partial-persistence = ["reth-stages-types/partial-persistence"]

# Debug recording for sparse trie mutations
trie-debug = ["reth-engine-primitives/trie-debug"]
