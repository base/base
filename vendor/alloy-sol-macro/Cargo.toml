[package]
name = "alloy-sol-macro"
description = "Solidity to Rust procedural macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_sol_macro"
path = "src/lib.rs"
proc-macro = true

[dependencies]
alloy-sol-macro-input = { workspace = true }
alloy-sol-macro-expander = { workspace = true }
quote = { workspace = true, features = ["default"] }
proc-macro2 = { workspace = true, features = ["default"] }
proc-macro-error3 = { workspace = true, features = ["default"] }
syn = { workspace = true, features = ["default", "extra-traits"] }
[lints]
workspace = true

[features]
json = ["alloy-sol-macro-expander/json"]
