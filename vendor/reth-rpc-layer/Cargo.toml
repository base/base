[package]
name = "reth-rpc-layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
tower = { workspace = true }
pin-project = { workspace = true }
http = { workspace = true, features = ["default"] }
tracing = { workspace = true, features = ["attributes"] }
tower-http = { workspace = true, features = ["default", "full"] }
jsonrpsee-http-client = { workspace = true, features = ["default"] }
base-common-types-payload = { workspace = true, features = ["jwt-aws-lc-rs", "serde"] }
[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
jsonrpsee = { workspace = true, features = ["server"] }
http-body-util = { workspace = true, features = ["default"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
