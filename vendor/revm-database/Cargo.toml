[package]
name = "revm-database"
description = "Revm Database implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[lib]
name = "revm_database"
path = "src/lib.rs"

[dependencies]
either = { workspace = true }
revm-state = { workspace = true }
revm-bytecode = { workspace = true }
revm-primitives = { workspace = true }
revm-database-interface = { workspace = true }
alloy-eips = { workspace = true, optional = true }
alloy-provider = { workspace = true, optional = true }
alloy-transport = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["debug"] }
tokio = { workspace = true, features = ["default", "rt-multi-thread", "macros"], optional = true }
serde = { workspace = true, features = [
    "derive",
    "rc",
    "derive",
    "rc",
], optional = true }
[dev-dependencies]
serde_json = { workspace = true, features = ["alloc"] }
[lints]
workspace = true

[features]
alloydb = ["std", "revm-database-interface/asyncdb", "dep:tokio", "dep:alloy-provider", "dep:alloy-eips", "dep:alloy-transport"]
default = ["std"]
map-foldhash = ["revm-primitives/map-foldhash", "revm-state/map-foldhash"]
serde = ["dep:serde", "alloy-eips?/serde", "revm-bytecode/serde", "revm-database-interface/serde", "revm-primitives/serde", "revm-state/serde", "either/serde"]
std = ["serde?/std", "alloy-eips?/std", "revm-bytecode/std", "revm-database-interface/std", "derive_more/std", "either/std", "revm-primitives/std", "revm-state/std", "serde_json/std"]
