[package]
name = "reth-ethereum-payload-builder"
description = "A basic ethereum payload builder for reth that uses the txpool API to build payloads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
revm = { workspace = true }
reth-evm = { workspace = true }
reth-revm = { workspace = true }
alloy-eips = { workspace = true }
reth-errors = { workspace = true }
reth-chainspec = { workspace = true }
alloy-consensus = { workspace = true }
reth-storage-api = { workspace = true }
reth-execution-cache = { workspace = true }
reth-payload-builder = { workspace = true }
reth-consensus-common = { workspace = true }
reth-transaction-pool = { workspace = true }
reth-primitives-traits = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
reth-ethereum-primitives = { workspace = true }
reth-basic-payload-builder = { workspace = true }
reth-payload-builder-primitives = { workspace = true }
alloy-rlp = { workspace = true, features = ["core-net"] }
tracing = { workspace = true, features = ["attributes"] }
reth-evm-ethereum = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
reth-payload-validator = { workspace = true, features = ["default"] }
reth-payload-primitives = { workspace = true, features = ["default"] }
