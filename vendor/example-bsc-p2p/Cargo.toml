[package]
name = "example-bsc-p2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
bytes = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
reth-tasks = { workspace = true }
reth-eth-wire = { workspace = true }
reth-chainspec = { workspace = true }
reth-network-api = { workspace = true }
reth-network-peers = { workspace = true }
reth-engine-primitives = { workspace = true }
reth-primitives-traits = { workspace = true }
futures = { workspace = true, features = ["default"] }
serde_json = { workspace = true, features = ["alloc"] }
alloy-rlp = { workspace = true, features = ["core-net"] }
tracing = { workspace = true, features = ["attributes"] }
reth-tracing = { workspace = true, features = ["default"] }
tokio-stream = { workspace = true, features = ["default"] }
reth-network = { workspace = true, features = ["test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-ethereum-forks = { workspace = true, features = ["serde"] }
reth-eth-wire-types = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
alloy-rpc-types = { workspace = true, features = ["eth", "engine"] }
serde = { workspace = true, features = ["derive"], optional = true }
reth-payload-primitives = { workspace = true, features = ["default"] }
reth-discv4 = { workspace = true, features = ["default", "test-utils"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "std"] }
[dev-dependencies]
reth-ethereum-primitives = { workspace = true }
reth-node-ethereum = { workspace = true, features = ["default"] }
[lints]
workspace = true

[features]
serde = [
    "dep:serde",
    "alloy-primitives/serde",
    "reth-eth-wire/serde",
    "reth-eth-wire-types/serde",
    "reth-ethereum-forks/serde",
    "reth-primitives-traits/serde",
    "secp256k1/serde",
    "bytes/serde",
    "reth-network/serde",
    "reth-network-api/serde",
    "reth-ethereum-primitives/serde",
]
