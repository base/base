[package]
name = "reth-stages-types"
description = "Commonly used types for stages usage in reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
base-execution-state-types = { workspace = true }
modular-bitfield = { workspace = true, optional = true }
base-common-types-chain = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
bytes = { workspace = true }
modular-bitfield = { workspace = true }
base-common-types-chain = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
rand = { workspace = true, features = ["default"] }
arbitrary = { workspace = true, features = ["derive"] }
proptest = { workspace = true, features = ["default"] }
base-execution-state-types = { workspace = true, features = ["reth-codec"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "arbitrary", "rand"] }

[features]
default = ["std"]
partial-persistence = []
std = [
    "alloy-primitives/std",
    "bytes?/std",
    "base-execution-state-types/std",
    "serde?/std",
    "base-common-types-chain?/std",
]
reth-codec = [
    "dep:base-common-types-chain",
    "dep:bytes",
    "dep:modular-bitfield",
    "base-execution-state-types/reth-codec",
]
test-utils = ["arbitrary", "base-common-types-chain?/test-utils", "base-execution-state-types/test-utils"]
arbitrary = [
    "std",
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "base-common-types-chain?/arbitrary",
    "base-execution-state-types/arbitrary",
]
serde = [
    "dep:serde",
    "alloy-primitives/serde",
    "bytes?/serde",
    "rand/serde",
    "base-common-types-chain?/serde",
    "base-execution-state-types/serde",
]
