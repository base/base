[package]
name = "reth-testing-utils"
description = "Testing utils for reth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
alloy-eips = { workspace = true }
alloy-genesis = { workspace = true }
rand = { workspace = true, features = ["default"] }
rand_08 = { workspace = true, features = ["default"] }
alloy-primitives = { workspace = true, features = ["map-foldhash", "rand"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery", "rand"] }
reth-primitives-traits = { workspace = true, features = ["secp256k1", "arbitrary"] }
base-common-types-chain = { workspace = true, features = ["reth", "arbitrary", "serde", "std"] }
[dev-dependencies]
alloy-rlp = { workspace = true, features = ["core-net"] }
