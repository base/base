[package]
name = "reth-provider"
description = "Reth storage provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rayon = { workspace = true }
strum = { workspace = true }
metrics = { workspace = true }
smallvec = { workspace = true }
itertools = { workspace = true }
alloy-eips = { workspace = true }
reth-db-api = { workspace = true }
alloy-chains = { workspace = true }
reth-fs-util = { workspace = true }
reth-metrics = { workspace = true }
alloy-genesis = { workspace = true }
reth-chain-state = { workspace = true }
reth-prune-types = { workspace = true }
reth-stages-types = { workspace = true }
reth-storage-errors = { workspace = true }
reth-execution-types = { workspace = true }
reth-storage-overlay = { workspace = true }
base-common-chain-config = { workspace = true }
base-common-runtime-tasks = { workspace = true }
base-common-types-payload = { workspace = true }
base-execution-evm-runtime = { workspace = true }
eyre = { workspace = true, features = ["default"] }
reth-db = { workspace = true, features = ["mdbx"] }
serde_json = { workspace = true, features = ["std"] }
rocksdb = { workspace = true, features = ["default"] }
reth-tasks = { workspace = true, features = ["rayon"] }
alloy-eip7928 = { workspace = true, features = ["rlp"] }
reth-trie = { workspace = true, features = ["metrics"] }
tracing = { workspace = true, features = ["attributes"] }
parking_lot = { workspace = true, features = ["default"] }
notify = { workspace = true, features = ["macos_fsevent"] }
reth-nippy-jar = { workspace = true, features = ["default"] }
reth-static-file-types = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync"], optional = true }
base-common-types-chain = { workspace = true, features = ["reth"] }
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
reth-storage-api = { workspace = true, features = ["std", "db-api"] }
reth-primitives-traits = { workspace = true, features = ["reth-codec", "secp256k1", "dashmap"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, features = ["default"] }
[dev-dependencies]
assert_matches = { workspace = true }
alloy-hardforks = { workspace = true }
reth-testing-utils = { workspace = true }
base-common-chain-config = { workspace = true }
rand = { workspace = true, features = ["default"] }
tempfile = { workspace = true, features = ["default"] }
reth-db = { workspace = true, features = ["test-utils"] }
reth-trie = { workspace = true, features = ["test-utils"] }
base-common-types-chain = {workspace = true, features = ["serde"]}
reth-chain-state = { workspace = true, features = ["test-utils"] }
tokio-stream = { workspace = true, features = ["default", "sync"] }
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread"] }
reth-primitives-traits = { workspace = true, features = ["arbitrary", "test-utils"] }

[features]
jemalloc = ["rocksdb/jemalloc"]
partial-persistence = ["reth-stages-types/partial-persistence", "reth-storage-overlay/partial-persistence"]
test-utils = [
    "reth-db/test-utils",
    "reth-nippy-jar/test-utils",
    "reth-trie/test-utils",
    "reth-chain-state/test-utils",
    "reth-primitives-traits/test-utils",
    "base-common-types-chain/test-utils",
    "reth-db-api/test-utils",
    "reth-prune-types/test-utils",
    "reth-stages-types/test-utils",
    "reth-tasks/test-utils",
    "dep:tokio",
]
