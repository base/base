[package]
name = "alloy-tx-macros"
description = "Derive macro for transaction envelopes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
name = "alloy_tx_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["default"] }
quote = { workspace = true, features = ["default"] }
darling = { workspace = true, features = ["default"] }
proc-macro2 = { workspace = true, features = ["default"] }
[lints]
workspace = true

[features]
arbitrary = []
serde = ["darling/serde"]
