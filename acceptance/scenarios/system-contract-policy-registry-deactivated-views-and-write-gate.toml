schema_version = 1
id = "system-contract-policy-deactivation"
description = "External RPC contract acceptance for policy_registry_deactivated_views_and_write_gate"
timeout = "5m"

[ci]
suite = "pr"

[devnet.l2.forks]
azul = { at_block = 0 }
beryl = { at_block = 1 }
cobalt = { disabled = true }
denim = { disabled = true }
zenith = { disabled = true }

[[checks]]
id = "policy-registry-deactivated-views-and-write-gate"
kind = "contract"
case = "policy_registry_deactivated_views_and_write_gate"
timeout = "3m"
start = { after_fork = "beryl", chain = "l2" }
