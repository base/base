schema_version = 1
id = "system-transaction-balance-trigger"
description = "Parked validity transaction released by a balance change"
timeout = "6m"
[ci]
suite = "extended"
[devnet.l2.forks]
azul = { at_block = 0 }
beryl = { at_block = 0 }
cobalt = { at_block = 0 }
denim = { at_block = 0 }
zenith = { at_block = 0 }
[[checks]]
id = "balance-trigger"
kind = "transaction"
case = "balance_predicate_trigger"
timeout = "3m"
