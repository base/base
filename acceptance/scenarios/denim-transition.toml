schema_version = 1
id = "denim-transition"
description = "Production, validator and shadow validator agreement across Denim"
timeout = "20m"

[devnet.l2.forks]
azul = { at_block = 20 }
beryl = { at_block = 21 }
cobalt = { at_block = 22 }
denim = { at_block = 150 }
zenith = { disabled = true }

[[checks]]
id = "before-denim"
kind = "head_progress"
endpoint = "builder"
minimum_blocks = 3
timeout = "30s"
start = { before_fork = "denim", chain = "l2" }

[[checks]]
id = "after-denim"
kind = "head_progress"
endpoint = "builder"
minimum_blocks = 5
timeout = "45s"
start = { after_fork = "denim", chain = "l2" }

[[checks]]
id = "post-denim-convergence"
kind = "heads_converge"
endpoints = ["builder", "validator"]
max_lag_blocks = 5
timeout = "90s"
start = { after_fork = "denim", chain = "l2" }

# The shadow validator derives its safe chain only from the base batcher's batches. Advancing
# 300 blocks takes its safe head past Denim block 150, where its block must match the builder's.
# Its safe head stays put for the 15 verifier confirmations, about 5.5 minutes, then catches up
# at the Denim block rate. The builder derives without those confirmations, so its safe head
# leads by about 1500 Denim blocks.
[[checks]]
id = "post-denim-shadow-safe-progress"
kind = "safe_head_progress"
endpoint = "shadow"
minimum_blocks = 300
timeout = "8m"
start = { after_fork = "denim", chain = "l2" }

[[checks]]
id = "post-denim-shadow-convergence"
kind = "heads_converge"
endpoints = ["builder", "shadow"]
head = "safe"
max_lag_blocks = 3000
timeout = "3m"
start = { after_fork = "denim", chain = "l2" }
