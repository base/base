schema_version = 1
id = "system-contract-b20-token-metadata"
description = "External RPC contract acceptance for b20_token_metadata"
timeout = "5m"

[ci]
suite = "pr"

[devnet.l2.forks]
azul = { at_block = 0 }
beryl = { at_block = 1 }
cobalt = { disabled = true }
denim = { disabled = true }
zenith = { disabled = true }

[[checks]]
id = "b20-token-metadata"
kind = "contract"
case = "b20_token_metadata"
timeout = "3m"
start = { after_fork = "beryl", chain = "l2" }
