schema_version = 1
id = "system-runtime-sync"
description = "Real builder and validator canonical and Flashblocks pending synchronization"
timeout = "4m"

[ci]
suite = "pr"

[devnet.l2.forks]
azul = { at_block = 0 }
beryl = { at_block = 0 }
cobalt = { at_block = 0 }
denim = { disabled = true }
zenith = { disabled = true }

[[checks]]
id = "canonical-sync"
kind = "runtime"
case = "builder_client_sync"
timeout = "90s"

[[checks]]
id = "pending-flashblocks"
kind = "runtime"
case = "pending_flashblocks"
timeout = "60s"
