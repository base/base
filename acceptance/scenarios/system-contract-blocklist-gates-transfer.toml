denim = { disabled = true }
zenith = { disabled = true }

[[checks]]
id = "blocklist-gates-transfer"
kind = "contract"
case = "blocklist_gates_transfer"
timeout = "3m"
start = { after_fork = "beryl", chain = "l2" }
