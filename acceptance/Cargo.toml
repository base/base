[package]
name = "base-acceptance"
description = "Configurable real-devnet acceptance scenarios and offline reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
hex.workspace = true
eyre.workspace = true
chrono.workspace = true
humantime.workspace = true
alloy-signer.workspace = true
alloy-network.workspace = true
alloy-signer-local.workspace = true
base-common-network.workspace = true
base-common-rpc-types.workspace = true
base-consensus-derive.workspace = true
base-consensus-providers.workspace = true
clap = { workspace = true, features = ["derive"] }
reqwest = { workspace = true, features = ["json"] }
alloy-eips = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-provider = { workspace = true, features = ["reqwest"] }
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }
base-protocol = { workspace = true, features = ["serde", "std"] }
toml = { workspace = true, features = ["parse", "serde", "display"] }
base-common-genesis = { workspace = true, features = ["serde", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util", "net", "sync"] }

[dev-dependencies]
tempfile.workspace = true
alloy-rlp.workspace = true
base-blobs.workspace = true
miniz_oxide.workspace = true
base-batcher-encoder.workspace = true
tokio = { workspace = true, features = ["test-util"] }
